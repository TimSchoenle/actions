name: Auto Format
description: 'Reusable workflow to auto-format code by running a "bun run" script and commit changes.'

on:
  workflow_call:
    inputs:
      format_command:
        description: 'Script name to run via "bun run"'
        required: false
        type: string
        default: 'format'
      commit_message:
        description: 'Commit message for auto-formatted changes'
        required: false
        type: string
        default: 'style: auto-format code'
      workflow_files_permission:
        description: 'Grant the bot write permission to workflow files (.github/workflows)'
        required: false
        type: boolean
        default: true
      pr_comment:
        description: 'Comment to post on the Pull Request'
        required: false
        type: string
        default: '🎨 Code has been auto-formatted to adhere to the style guide.'
    secrets:
      APP_ID:
        required: true
        description: 'GitHub App ID for bot authentication'
      PRIVATE_KEY:
        required: true
        description: 'GitHub App Private Key (Requires permissions: contents:write, pull-requests:write, workflows:write)'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-auto-bun-prettier
  cancel-in-progress: true

permissions: {}

jobs:
  auto-format:
    name: Auto Format
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: ${{ inputs.workflow_files_permission && 'write' || 'none' }} # To allow updating formatted action files

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ steps.generate_token.outputs.token }}

      - name: Setup Bun
        uses: TimSchoenle/actions/actions/bun/setup-cached@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-bun-setup-cached-v1.1.11

      - name: Format
        env:
          FORMAT_COMMAND: ${{ inputs.format_command }}
        run: bun run "$FORMAT_COMMAND"

      - name: Commit and Push if changed
        id: auto-commit
        uses: TimSchoenle/actions/actions/common/commit-changes@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-commit-changes-v1.5.9
        with:
          commit_message: ${{ inputs.commit_message }}
          token: ${{ steps.generate_token.outputs.token }}

      - name: Comment on PR
        if: steps.auto-commit.outputs.changes_detected == 'true' && github.event_name == 'pull_request' && inputs.pr_comment != ''
        uses: TimSchoenle/actions/actions/common/upsert-pr-comment@eaf935674fec7116856ca5e138e1a2dca3f8146d # tag=actions-common-upsert-pr-comment-v1.2.4
        with:
          token: ${{ steps.generate_token.outputs.token }}
          identifier: 'auto-bun-prettier'
          body: ${{ inputs.pr_comment }}
