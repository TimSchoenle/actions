# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
tone_instructions: "Direct, no filler, no praise."

reviews:
  profile: assertive

  auto_review:
    # CodeRabbit cannot filter by head branch, so automated pull requests are
    # skipped by author: Renovate opens `renovate/*`, the release manager app
    # opens `release-please--*`. Both the bot login and the bare app slug are
    # listed because the match is exact.
    ignore_usernames:
      - "renovate[bot]"
      - "renovate"
      - "automatic-release-manager[bot]"
      - "automatic-release-manager"

  # Generated or tool-owned files. Review their sources instead; CI fails on drift for
  # bundles, generated sources and docs.
  path_filters:
    - "!bun.lock"
    - "!actions/**/dist/**" # bundled from src/ by build-action.ts, checked by check-action-dist
    - "!actions/**/src/generated/**" # from action.yaml, checked by check-action-sources
    - "!**/CHANGELOG.md"
    - "!.release-please-manifest.json"
    - "!README.md" # rendered from scripts/templates/README.md
    - "!SECURITY.md" # rendered from scripts/templates/SECURITY.md
    - "!configs/checkstyle/gradlew"
    - "!configs/checkstyle/gradlew.bat"
    - "!configs/checkstyle/gradle/wrapper/**"
    - "!.github/testdata/**" # copied chart fixture from TimSchoenle/helm-charts
    - "!actions/security/zizmor/e2e/fixture/**" # deliberately insecure workflows

  path_instructions:
    - path: "actions/**/action.yaml"
      instructions: |
        Each action is consumed by many downstream repositories and released as its own
        release-please component (`actions-<category>-<name>-vX.Y.Z`). Inputs, outputs, defaults,
        `required`, and observable behaviour are a public API. Flag:
        - Removed or renamed inputs/outputs, changed defaults or semantics without a breaking-change
          marker (`!` / `BREAKING CHANGE:`) so the component's major is bumped.
        - Any `${{ inputs.* }}`, `${{ github.* }}` or step output interpolated directly into `run:`;
          it must be passed through `env:` and quoted as `"$VAR"`.
        - `run:` steps without explicit `shell:`; bash without `set -euo pipefail`; multiline values
          written to `$GITHUB_OUTPUT`/`$GITHUB_ENV` without a random heredoc delimiter.
        - Third-party `uses:` not pinned to a full commit SHA with a version comment; internal
          `TimSchoenle/actions/...` refs must carry `# tag=<component>-vX.Y.Z`. Container images must be
          pinned by digest.
        - Tokens: prefer an explicit `token` input over ambient credentials, never echo or log them,
          `::add-mask::` anything derived from a secret, and `persist-credentials: false` on checkout
          unless the action pushes.
        - New inputs without `description`, or descriptions that disagree with the implementation.
        Changes here must be mirrored in `src/generated/` and `dist/` (enforced in CI); do not comment
        on those files directly.
    - path: "actions/**/src/**/*.ts"
      instructions: |
        Runtime code of JavaScript actions, bundled into `dist/index.js`. `strict` TypeScript is on.
        Flag `any`, unchecked casts, non-null assertions without justification, floating promises,
        and swallowed errors; failures must surface via `core.setFailed`/typed errors from
        `actions-util` with an actionable message. Validate and normalise every input (paths must stay
        inside the workspace; no shell string concatenation; YAML parsed safely). GitHub API calls must
        paginate, handle 404/422/rate limits explicitly, and be idempotent on re-run. Never log tokens
        or full API responses that may contain secrets. Every behaviour change needs a colocated
        `*.test.ts` (or `*.fuzz.test.ts` for parsers) covering the new branch.
    - path: "actions/**/e2e/**"
      instructions: |
        End-to-end suites run against the scratch repository TimSchoenle/actions-testing with a real
        app token. Check that every created ref lives under `test/`, every fixture registers teardown,
        assertions do not depend on ordering or timing, and adversarial cases cover hostile input
        (injection strings, unicode, oversized values).
    - path: "packages/ts-util/**"
      instructions: |
        Shared library bundled into every JavaScript action. A change here alters the behaviour of all
        actions on their next rebuild: call out behavioural differences explicitly and require tests.
        Treat exported signatures as an internal API used across `actions/**`.
    - path: "packages/e2e/**"
      instructions: |
        E2E harness. Focus on correct teardown, the `test/` ref prefix the janitor relies on, and not
        leaking the app token into logs or fixture content.
    - path: "workflows/**/workflow.yaml"
      instructions: |
        Reusable workflows consumed downstream via `uses:` and released per component. `workflow_call`
        inputs, secrets and outputs are a public API: breaking changes need a breaking-change marker.
        Job `permissions:` must be least-privilege and explicit; never `secrets: inherit` into
        third-party code. Apply the same SHA-pinning and injection rules as for `.github/workflows/**`.
    - path: "configs/renovate/**"
      instructions: |
        Renovate presets extended by every downstream repository as
        `github>TimSchoenle/actions//configs/renovate/<name>` without a version pin, so a merge takes
        effect everywhere on the next Renovate run. For every change, state the concrete downstream
        behaviour change: what will now be automerged, grouped, delayed (`minimumReleaseAge`), or no
        longer updated, and any change to `semanticCommitType`/commit titles, which alters
        release-please version bumps in consumer repos. Flag automerge widening (especially to
        `major` or to runtime dependencies), matchers broadened by regex, and regex managers using
        lookarounds (Renovate uses RE2). Keep `description` fields accurate.
    - path: "configs/checkstyle/**"
      instructions: |
        Checkstyle rulesets published via JitPack and consumed by Java repositories. A new or tightened
        rule, or a removed suppression, breaks downstream builds and must be marked as breaking. Keep
        suppressions narrowly scoped and justified; keep `meta.json` descriptions in sync.
    - path: "configs/github-rulesets/**"
      instructions: |
        Repository rulesets applied across repositories. Security-sensitive: flag any added bypass
        actor, weakened required review/signature/status-check rule, or widened ref include pattern.
    - path: "scripts/**/*.ts"
      instructions: |
        Repository tooling and generators (action sources, docs, e2e workflows, codecov components,
        ci-required). Output must be deterministic and idempotent, and the CI drift checks must keep
        covering every generated file. `scripts/lib/e2e-workflow.ts` is the source of the generated
        `verify-action-*` workflows: apply the workflow hardening rules to the YAML it emits, and keep
        its pin string format matching the regex managers in `renovate.json`.
    - path: "scripts/templates/**"
      instructions: |
        Sources for the root README.md and SECURITY.md and scaffolding for every new action and
        workflow. Defects here propagate into each new component; apply the action and workflow rules.
    - path: ".github/workflows/**"
      instructions: |
        Every third-party action must be pinned to a full commit SHA with a version comment.
        Require least-privilege `permissions:` at workflow or job level, `persist-credentials: false`
        on checkout unless pushing, no untrusted `${{ github.event.* }}` interpolation into `run:`,
        and no `pull_request_target` that checks out or executes PR code. Files whose first line is
        `# GENERATED` are emitted by `scripts/lib/e2e-workflow.ts`; reject hand edits and direct fixes
        to the generator.
    - path: "docs/**"
      instructions: |
        Documentation standards referenced by other repositories. Check precision and consistency with
        the code and scripts in this repository.

  pre_merge_checks:
    title:
      mode: error
      requirements: |
        Must follow Conventional Commits: `type(scope)?!?: subject`. Allowed types: feat, fix, perf,
        revert, docs, refactor, test, style, ci, build, chore, deps. Scope is optional; when used, name
        the component (e.g. `Actions/Upsert-PR-Comment`, `Renovate/Default`). Use `!` for breaking
        changes to an action, workflow or preset. Imperative subject, no trailing period.
        Pull requests are squash-merged and release-please derives versions and changelogs from it.

  tools:
    # Already enforced in CI (`bun run lint`); duplicating it adds noise.
    eslint:
      enabled: false
    # Not used here (ESLint + oxfmt); their rule sets would conflict.
    biome:
      enabled: false
    oxc:
      enabled: false
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    gitleaks:
      enabled: true
    markdownlint:
      enabled: true
    yamllint:
      enabled: true
