# A workflow with findings zizmor reports offline: an action pinned to a tag instead of a commit,
# default permissions, and a checkout that persists its credentials.
name: Finding Fixture

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
