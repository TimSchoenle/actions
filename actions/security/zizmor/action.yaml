name: 'Security Zizmor'
description: 'Runs zizmor over workflows and actions with strict collection, uploads the SARIF to code scanning under the category zizmor, and fails the job on an input zizmor cannot parse or a finding at or above a severity.'

inputs:
  inputs:
    description: 'Paths to audit, one per line, relative to the repository root. Each must exist. A line starting with - is refused; blank lines and lines starting with # are skipped.'
    required: false
    default: '.'
  persona:
    description: 'zizmor persona: regular, pedantic or auditor.'
    required: false
    default: 'pedantic'
  online-audits:
    description: 'Run the audits that query the GitHub API. false adds --no-online-audits and starts the container without a network.'
    required: false
    default: 'true'
  min-severity:
    description: 'Passed to zizmor as --min-severity: informational, low, medium or high. Empty reports every severity.'
    required: false
    default: ''
  min-confidence:
    description: 'Passed to zizmor as --min-confidence: low, medium or high. Empty reports every confidence.'
    required: false
    default: ''
  config:
    description: 'zizmor configuration file, relative to the repository root. Empty lets zizmor discover zizmor.yml itself.'
    required: false
    default: ''
  fail-on-severity:
    description: 'Lowest severity that fails the job: informational, low, medium, high, or none to never fail on findings.'
    required: false
    default: 'informational'
  strict-collection:
    description: 'Fail when zizmor cannot parse an input. false drops --strict-collection; keep it for a file zizmor wrongly rejects, with the upstream issue linked.'
    required: false
    default: 'true'
  upload:
    description: 'Upload the SARIF to code scanning under the category zizmor. Needs security-events: write.'
    required: false
    default: 'true'
  token:
    description: 'Token handed to the container as GH_TOKEN for online audits.'
    required: false
    default: ${{ github.token }}

outputs:
  sarif-file:
    description: 'Absolute path of the SARIF under RUNNER_TEMP. Empty when zizmor did not complete.'
    value: ${{ steps.scan.outputs.sarif_file }}
  sarif-id:
    description: 'ID of the uploaded analysis, when upload is true.'
    value: ${{ steps.upload.outputs.sarif-id }}
  findings:
    description: 'Number of results in the SARIF. Findings ignored by a comment or the configuration are not in it.'
    value: ${{ steps.gate.outputs.findings }}
  failing:
    description: 'Number of results at or above fail-on-severity.'
    value: ${{ steps.gate.outputs.failing }}

runs:
  using: 'composite'
  steps:
    # Validates every input and reads the first bytes of every file zizmor would collect before the
    # image is pulled, then runs zizmor in a read-only, unprivileged container. The image is pinned by
    # digest here, and Renovate's regex manager for this file bumps tag and digest together.
    - name: Run Zizmor
      id: scan
      shell: bash
      env:
        INPUT_MODE: scan
        INPUT_INPUTS: ${{ inputs.inputs }}
        INPUT_PERSONA: ${{ inputs.persona }}
        INPUT_ONLINE_AUDITS: ${{ inputs.online-audits }}
        INPUT_MIN_SEVERITY: ${{ inputs.min-severity }}
        INPUT_MIN_CONFIDENCE: ${{ inputs.min-confidence }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        INPUT_STRICT_COLLECTION: ${{ inputs.strict-collection }}
        INPUT_UPLOAD: ${{ inputs.upload }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_IMAGE: ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9
      run: node "$GITHUB_ACTION_PATH/helper/dist/index.js"

    # Reached only when zizmor loaded every input: a failed run leaves no SARIF, and uploading an
    # empty analysis would close every open alert.
    - name: Upload SARIF
      id: upload
      if: steps.scan.outputs.upload == 'true'
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: ${{ steps.scan.outputs.sarif_file }}
        category: zizmor

    # After the upload, so findings reach code scanning whether or not they fail the job.
    - name: Gate Findings
      id: gate
      shell: bash
      env:
        INPUT_MODE: gate
        INPUT_SARIF_FILE: ${{ steps.scan.outputs.sarif_file }}
        INPUT_FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
      run: node "$GITHUB_ACTION_PATH/helper/dist/index.js"
