# Runs the online checks where a red result is news rather than noise. See Online checks below.
on:
  schedule:
    - cron: '17 6 * * 1'
  push:
    branches: [main]

jobs:
  jactionlint-online:
    name: Action Lint (online)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: TimSchoenle/actions/actions/security/jactionlint@0b3967d3d992d12aa88da1f8facf412b162d5ab2 # tag=actions-security-jactionlint-v1.1.4
        with:
          online: 'strict'
