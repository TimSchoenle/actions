name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  jactionlint:
    name: Action Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: TimSchoenle/actions/actions/security/jactionlint@main
