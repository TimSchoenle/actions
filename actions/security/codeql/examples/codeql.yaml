name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 0 * * 1'

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: TimSchoenle/actions/actions/security/codeql@be7a69175612d9de514acc14bf55dda8e7ad2e57 # tag=actions-security-codeql-v1.1.7
        with:
          language: ${{ matrix.language }}
          paths-ignore: |
            # Seeds the integration database with fixed credentials.
            services/api/test-support/**
