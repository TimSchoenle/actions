name: Build Affected Actions

on:
  pull_request:

permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch code
    outputs:
      build-dirs: ${{ steps.resolve.outputs.build-dirs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          {
            echo 'files<<CHANGED_FILES_EOF'
            git diff --name-only "$BASE_SHA" HEAD
            echo 'CHANGED_FILES_EOF'
          } >> "$GITHUB_OUTPUT"

      - id: resolve
        uses: TimSchoenle/actions/actions/release/resolve-actions@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-release-resolve-actions-v1.1.0
        with:
          mode: affected
          changed-files: ${{ steps.changed.outputs.files }}
          exclude: scripts/templates

  build:
    needs: resolve
    if: needs.resolve.outputs.build-dirs != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # set up the toolchain and install dependencies here
      - uses: TimSchoenle/actions/actions/release/build-actions@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-release-build-actions-v1.1.0
        with:
          build-dirs: ${{ needs.resolve.outputs.build-dirs }}
          build-command: npm run build
          artifact-name: built-actions-${{ github.run_attempt }}
