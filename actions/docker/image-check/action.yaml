name: 'Docker Image Check'
description: 'Measures a locally loaded image, warns past a size threshold, scans it with Trivy, uploads the SARIF to code scanning and reports the result on the pull request.'

inputs:
  image:
    description: 'Local image reference, already in the Docker daemon (docker/build-push-action with load: true).'
    required: true
  platform:
    description: 'Platform label such as linux/arm64. Becomes a slug (linux-arm64) in the SARIF category, the comment identifier and the summary artifact name, which keeps matrix legs apart. Required when comment is summary.'
    required: false
    default: ''
  size-warning-mib:
    description: 'Emit a warning when the uncompressed image is above this many MiB. 0 disables the warning.'
    required: false
    default: '150'
  size-limit-mib:
    description: 'Fail the step when the uncompressed image is above this many MiB. 0 disables the limit.'
    required: false
    default: '0'
  trivy-severity:
    description: 'Comma-separated Trivy severities. Passed with limit-severities-for-sarif, so it governs the SARIF too.'
    required: false
    default: 'CRITICAL,HIGH'
  trivy-ignore-unfixed:
    description: 'Ignore vulnerabilities that have no fixed version.'
    required: false
    default: 'false'
  trivy-fail-on-findings:
    description: 'Fail the step when Trivy reports at least one finding at trivy-severity. Evaluated last, after the SARIF and the comment are published.'
    required: false
    default: 'false'
  trivy-ignore-file:
    description: 'Path of a .trivyignore file, relative to the workspace.'
    required: false
    default: ''
  upload-sarif:
    description: 'Upload the SARIF to code scanning. Needs security-events: write.'
    required: false
    default: 'true'
  sarif-category:
    description: "Code scanning category. Defaults to trivy-<slug> with a platform, and to upload-sarif's own default without one, so an existing single-image repository keeps its alerts."
    required: false
    default: ''
  comment:
    description: "per-image upserts this image's own comment, summary uploads a fragment for docker/image-check-summary instead, none does neither. Only on pull requests."
    required: false
    default: 'per-image'
  comment-identifier:
    description: 'upsert-pr-comment identifier. Defaults to docker-image-size, or docker-image-size-<slug> with a platform.'
    required: false
    default: ''
  token:
    description: 'Token for the pull request comment, with pull-requests: write. Used for nothing else.'
    required: false
    default: ${{ github.token }}

outputs:
  size-bytes:
    description: 'Size of the image from docker image inspect (.Size): bytes of unpacked layers, not the compressed pull size.'
    value: ${{ steps.measure.outputs.size_bytes }}
  size-mib:
    description: 'size-bytes / 1048576, to one decimal place.'
    value: ${{ steps.measure.outputs.size_mib }}
  over-warning:
    description: 'true when the image is above size-warning-mib.'
    value: ${{ steps.measure.outputs.over_warning }}
  findings:
    description: 'Number of results in the SARIF file.'
    value: ${{ steps.report.outputs.findings }}
  sarif-path:
    description: 'Absolute path of the SARIF file, under RUNNER_TEMP.'
    value: ${{ steps.measure.outputs.sarif_path }}
  comment-url:
    description: 'URL of the comment, when comment is per-image and one was written.'
    value: ${{ steps.comment.outputs.comment_url }}

runs:
  using: 'composite'
  steps:
    # Validates every input and reads the image size before anything slow runs, so a typo in a
    # threshold or an image that was never loaded fails in a second rather than after the scan.
    - name: Measure Image
      id: measure
      shell: bash
      env:
        INPUT_PHASE: measure
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_PLATFORM: ${{ inputs.platform }}
        INPUT_SIZE_WARNING_MIB: ${{ inputs.size-warning-mib }}
        INPUT_SIZE_LIMIT_MIB: ${{ inputs.size-limit-mib }}
        INPUT_TRIVY_SEVERITY: ${{ inputs.trivy-severity }}
        INPUT_TRIVY_IGNORE_UNFIXED: ${{ inputs.trivy-ignore-unfixed }}
        INPUT_TRIVY_FAIL_ON_FINDINGS: ${{ inputs.trivy-fail-on-findings }}
        INPUT_TRIVY_IGNORE_FILE: ${{ inputs.trivy-ignore-file }}
        INPUT_UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        INPUT_SARIF_CATEGORY: ${{ inputs.sarif-category }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_COMMENT_IDENTIFIER: ${{ inputs.comment-identifier }}
      run: node "$GITHUB_ACTION_PATH/helper/dist/index.js"

    # Never fails on a finding: exit-code 0 here, and the findings gate is enforced in the last step,
    # after the SARIF and the comment are published. limit-severities-for-sarif is what makes
    # trivy-severity apply to the SARIF at all — without it trivy-action unsets TRIVY_SEVERITY for
    # SARIF output and every LOW and MEDIUM finding reaches code scanning. The database cache sits
    # under RUNNER_TEMP rather than trivy-action's default inside the workspace, for the same reason
    # the SARIF does: a later `git add` must not be able to pick it up.
    - name: Scan Image
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      env:
        TRIVY_SKIP_VERSION_CHECK: 'true'
        TRIVY_DISABLE_TELEMETRY: 'true'
      with:
        scan-type: image
        image-ref: ${{ steps.measure.outputs.image }}
        format: sarif
        output: ${{ steps.measure.outputs.sarif_path }}
        severity: ${{ steps.measure.outputs.severity }}
        limit-severities-for-sarif: 'true'
        ignore-unfixed: ${{ steps.measure.outputs.ignore_unfixed }}
        trivyignores: ${{ steps.measure.outputs.ignore_file }}
        exit-code: '0'
        cache-dir: ${{ runner.temp }}/trivy-cache

    - name: Upload SARIF
      if: steps.measure.outputs.upload_sarif == 'true'
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        sarif_file: ${{ steps.measure.outputs.sarif_path }}
        category: ${{ steps.measure.outputs.sarif_category }}

    - name: Report Result
      id: report
      shell: bash
      env:
        INPUT_PHASE: report
        INPUT_PLAN: ${{ steps.measure.outputs.plan }}
      run: node "$GITHUB_ACTION_PATH/helper/dist/index.js"

    - name: Upsert Pull Request Comment
      id: comment
      if: steps.measure.outputs.write_comment == 'true'
      uses: TimSchoenle/actions/actions/common/upsert-pr-comment@1e89d598e447ab05d36edc9e9d18e8771adf6426 # tag=actions-common-upsert-pr-comment-v1.2.2
      with:
        token: ${{ inputs.token }}
        identifier: ${{ steps.measure.outputs.comment_identifier }}
        body: ${{ steps.report.outputs.comment_body }}

    # overwrite: a re-run attempt of the same leg uploads under the same name, which upload-artifact
    # otherwise refuses.
    - name: Upload Summary Fragment
      if: steps.measure.outputs.upload_fragment == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.measure.outputs.fragment_name }}
        path: ${{ steps.measure.outputs.fragment_path }}
        if-no-files-found: error
        retention-days: 1
        overwrite: true

    - name: Enforce Gates
      shell: bash
      env:
        INPUT_PHASE: enforce
        INPUT_PLAN: ${{ steps.measure.outputs.plan }}
      run: node "$GITHUB_ACTION_PATH/helper/dist/index.js"
