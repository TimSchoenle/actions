name: 'Docker Image Check Helper'
description: 'Internal to actions/docker/image-check, which runs this bundle with node between its own steps. Not a public action: its inputs, outputs and phases change without notice.'

inputs:
  phase:
    description: 'Which part of the check to run: "measure" (validate the inputs, read the image size and decide what may be published), "report" (count the SARIF results and render the step summary, comment and fragment) or "enforce" (warn and fail on the thresholds).'
    required: true
  plan:
    description: 'Path of the plan file the measure phase wrote. Required by "report" and "enforce", ignored by "measure".'
    required: false
    default: ''
  image:
    description: 'Local image reference, already in the Docker daemon.'
    required: false
    default: ''
  platform:
    description: 'Platform label such as linux/arm64.'
    required: false
    default: ''
  size_warning_mib:
    description: 'Warn above this many MiB. 0 disables the warning.'
    required: false
    default: '150'
  size_limit_mib:
    description: 'Fail above this many MiB. 0 disables the limit.'
    required: false
    default: '0'
  trivy_severity:
    description: 'Comma-separated Trivy severities.'
    required: false
    default: 'CRITICAL,HIGH'
  trivy_ignore_unfixed:
    description: 'Whether Trivy ignores unfixed vulnerabilities.'
    required: false
    default: 'false'
  trivy_fail_on_findings:
    description: 'Fail when the SARIF holds at least one result.'
    required: false
    default: 'false'
  trivy_ignore_file:
    description: 'Path of a .trivyignore file, relative to the workspace.'
    required: false
    default: ''
  upload_sarif:
    description: 'Whether the SARIF is uploaded to code scanning.'
    required: false
    default: 'true'
  sarif_category:
    description: 'Code scanning category. Empty derives trivy-<slug> from the platform, or leaves it unset without one.'
    required: false
    default: ''
  comment:
    description: 'per-image, summary or none.'
    required: false
    default: 'per-image'
  comment_identifier:
    description: 'upsert-pr-comment identifier. Empty derives docker-image-size or docker-image-size-<slug>.'
    required: false
    default: ''

outputs:
  image:
    description: 'The image reference, trimmed and validated.'
  size_bytes:
    description: 'Uncompressed size from docker image inspect.'
  size_mib:
    description: 'size_bytes / 1048576, one decimal place.'
  over_warning:
    description: 'true when above size_warning_mib.'
  severity:
    description: 'trivy_severity, normalised.'
  ignore_unfixed:
    description: 'trivy_ignore_unfixed, normalised to true or false.'
  ignore_file:
    description: 'trivy_ignore_file, validated, or empty.'
  sarif_path:
    description: 'Absolute path Trivy writes the SARIF to.'
  sarif_category:
    description: "Resolved code scanning category, or empty to keep upload-sarif's default."
  upload_sarif:
    description: 'true when the SARIF upload step should run.'
  comment_identifier:
    description: 'Resolved upsert-pr-comment identifier.'
  write_comment:
    description: 'true when the per-image comment step should run.'
  upload_fragment:
    description: 'true when the summary fragment should be uploaded.'
  fragment_name:
    description: 'Artifact name of the summary fragment.'
  fragment_path:
    description: 'Absolute path of the summary fragment file.'
  plan:
    description: 'Path of the plan file the later phases read.'
  findings:
    description: 'Number of results in the SARIF file.'
  comment_body:
    description: 'Markdown body of the per-image comment.'

runs:
  using: 'node20'
  main: 'dist/index.js'
