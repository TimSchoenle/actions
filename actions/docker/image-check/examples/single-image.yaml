# One call per image, in the job that loaded it.
permissions:
  contents: read
  security-events: write # upload-sarif
  pull-requests: write # the comment

steps:
  # The image only has to be in the Docker daemon: docker/build-push-action with load: true works
  # the same way.
  - run: docker build --tag app:test .

  - uses: TimSchoenle/actions/actions/docker/image-check@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-docker-image-check-v1.1.14
    with:
      image: app:test
