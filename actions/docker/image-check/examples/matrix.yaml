# In a matrix, pass each leg's platform. The slug (linux/arm64 becomes linux-arm64) keeps the SARIF
# category, the comment identifier and the summary artifact of each leg apart.
strategy:
  matrix:
    platform: [linux/amd64, linux/arm64]
steps:
  - uses: TimSchoenle/actions/actions/docker/image-check@6a49261c7bbd756b4ceca9b1c168dfc7dc095e64 # tag=actions-docker-image-check-v1.1.13
    with:
      image: app:test
      platform: ${{ matrix.platform }}
