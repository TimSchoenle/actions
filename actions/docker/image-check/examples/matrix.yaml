# In a matrix, pass each leg's platform. The slug (linux/arm64 becomes linux-arm64) keeps the SARIF
# category, the comment identifier and the summary artifact of each leg apart.
strategy:
  matrix:
    platform: [linux/amd64, linux/arm64]
steps:
  - uses: TimSchoenle/actions/actions/docker/image-check@0b3967d3d992d12aa88da1f8facf412b162d5ab2 # tag=actions-docker-image-check-v1.1.17
    with:
      image: app:test
      platform: ${{ matrix.platform }}
