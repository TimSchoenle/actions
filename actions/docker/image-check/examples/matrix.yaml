# In a matrix, pass each leg's platform. The slug (linux/arm64 becomes linux-arm64) keeps the SARIF
# category, the comment identifier and the summary artifact of each leg apart.
strategy:
  matrix:
    platform: [linux/amd64, linux/arm64]
steps:
  - uses: TimSchoenle/actions/actions/docker/image-check@b37134ffa35b3ce98437447e3b4c76933eb65c04 # tag=actions-docker-image-check-v1.1.12
    with:
      image: app:test
      platform: ${{ matrix.platform }}
