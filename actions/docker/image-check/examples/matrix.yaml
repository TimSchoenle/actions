# In a matrix, pass each leg's platform. The slug (linux/arm64 becomes linux-arm64) keeps the SARIF
# category, the comment identifier and the summary artifact of each leg apart.
strategy:
  matrix:
    platform: [linux/amd64, linux/arm64]
steps:
  - uses: TimSchoenle/actions/actions/docker/image-check@ded012bb09f11e42381c9b1b7c3ff0dbc09156bf # tag=actions-docker-image-check-v1.1.19
    with:
      image: app:test
      platform: ${{ matrix.platform }}
