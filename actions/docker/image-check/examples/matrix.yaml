# In a matrix, pass each leg's platform. The slug (linux/arm64 becomes linux-arm64) keeps the SARIF
# category, the comment identifier and the summary artifact of each leg apart.
strategy:
  matrix:
    platform: [linux/amd64, linux/arm64]
steps:
  - uses: TimSchoenle/actions/actions/docker/image-check@be7a69175612d9de514acc14bf55dda8e7ad2e57 # tag=actions-docker-image-check-v1.1.11
    with:
      image: app:test
      platform: ${{ matrix.platform }}
