# In a matrix, pass each leg's platform. The slug (linux/arm64 becomes linux-arm64) keeps the SARIF
# category, the comment identifier and the summary artifact of each leg apart.
strategy:
  matrix:
    platform: [linux/amd64, linux/arm64]
steps:
  - uses: TimSchoenle/actions/actions/docker/image-check@0701d3b35ad7e10e3159471c82f4743b67fdc01f # tag=actions-docker-image-check-v1.1.15
    with:
      image: app:test
      platform: ${{ matrix.platform }}
