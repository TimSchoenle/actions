# Jobs appended verbatim to the generated workflow for this action.
#
# The end-to-end cases drive the helper bundle with docker stubbed out. These jobs run what only the
# runner can: the two composites themselves, against an image built here, with the real Trivy,
# upload-sarif, upload-artifact, download-artifact and upsert-pr-comment steps.
#
# The fixture image is FROM scratch rather than from a base image, so no job pulls from a registry
# and the egress allowlists stay free of Docker Hub and its rate limits. A generated 2 MiB payload
# gives it a size the gates can be tested against. Trivy still downloads its
# vulnerability database and writes a real SARIF log; a scratch image simply has no packages in it.
#
# Trivy's install script fetches the binary through get.trivy.dev, which redirects to the GitHub
# release; its database comes from mirror.gcr.io, with ghcr.io as the fallback.
#
# Pull requests from a fork run these too. Their GITHUB_TOKEN is read-only, so there the assertions
# flip to the skip path: no SARIF upload, no fragment, no comment.
#
# `uses: pinned:<key>` names an entry of PINNED in scripts/lib/e2e-workflow.ts and is substituted on
# the way in. Writing a ref out in full here would be a second pin no Renovate manager reads.

verify-composite:
  name: Test Composite Against A Built Image
  runs-on: ubuntu-latest
  permissions:
    contents: read # to fetch code
    security-events: write # to upload the SARIF
  steps:
    - name: Harden Runner
      uses: pinned:hardenRunner
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          get.trivy.dev:443
          *.actions.githubusercontent.com:443
          *.blob.core.windows.net:443
          mirror.gcr.io:443
          ghcr.io:443
          pkg-containers.githubusercontent.com:443
          storage.googleapis.com:443

    - name: Checkout
      uses: pinned:checkout
      with:
        persist-credentials: false

    # Built from a copy under RUNNER_TEMP with 2 MiB of zeros added: .Size counts unpacked bytes, so
    # the image lands at a known size between the 1 MiB limit below and the default warning, and the
    # workspace stays clean for the assertion that the action itself writes nothing there.
    - name: Build Fixture Image
      run: |
        set -euo pipefail
        context="$RUNNER_TEMP/image-check-fixture"
        cp -r actions/docker/image-check/e2e/fixture "$context"
        head -c 2097152 /dev/zero > "$context/payload.bin"
        docker build --tag image-check-e2e:test "$context"

    - name: Run Test (Scan And Upload)
      id: check
      uses: ./actions/docker/image-check
      with:
        image: image-check-e2e:test
        platform: linux/amd64
        sarif-category: image-check-e2e
        comment: none

    - name: Assert Scan And Upload
      env:
        SIZE_BYTES: ${{ steps.check.outputs.size-bytes }}
        SIZE_MIB: ${{ steps.check.outputs.size-mib }}
        OVER_WARNING: ${{ steps.check.outputs.over-warning }}
        FINDINGS: ${{ steps.check.outputs.findings }}
        SARIF_PATH: ${{ steps.check.outputs.sarif-path }}
        COMMENT_URL: ${{ steps.check.outputs.comment-url }}
      run: |
        set -euo pipefail

        EXPECTED_SIZE=$(docker image inspect --format '{{.Size}}' -- image-check-e2e:test)
        [ "$SIZE_BYTES" = "$EXPECTED_SIZE" ] || { echo "::error::size-bytes '$SIZE_BYTES', expected '$EXPECTED_SIZE'"; exit 1; }
        [ "$SIZE_MIB" = "2.0" ] || { echo "::error::size-mib '$SIZE_MIB', expected '2.0'"; exit 1; }
        [ "$OVER_WARNING" = "false" ] || { echo "::error::over-warning '$OVER_WARNING', expected 'false'"; exit 1; }
        [[ "$FINDINGS" =~ ^[0-9]+$ ]] || { echo "::error::findings '$FINDINGS' is not a count"; exit 1; }
        [ -z "$COMMENT_URL" ] || { echo "::error::comment: none wrote a comment: $COMMENT_URL"; exit 1; }

        case "$SARIF_PATH" in
          "$RUNNER_TEMP"/*) ;;
          *) echo "::error::sarif-path '$SARIF_PATH' is not under RUNNER_TEMP"; exit 1 ;;
        esac

        jq -e '.runs | type == "array"' "$SARIF_PATH" > /dev/null || { echo "::error::sarif-path holds no SARIF log"; exit 1; }
        [ -z "$(git status --porcelain)" ] || { echo "::error::the action left files in the workspace"; git status --porcelain; exit 1; }

        echo "✅ Measured $SIZE_BYTES bytes, scanned to $FINDINGS finding(s), SARIF under RUNNER_TEMP"

    # The limit fails the step, but only in the last phase: findings must already be published.
    - name: Run Test (Size Limit)
      id: limited
      continue-on-error: true
      uses: ./actions/docker/image-check
      with:
        image: image-check-e2e:test
        size-limit-mib: '1'
        upload-sarif: 'false'
        comment: none

    - name: Run Test (Image Never Loaded)
      id: missing
      continue-on-error: true
      uses: ./actions/docker/image-check
      with:
        image: image-check-e2e:never-built
        upload-sarif: 'false'
        comment: none

    - name: Assert Gates And Refusals
      env:
        LIMITED_OUTCOME: ${{ steps.limited.outcome }}
        LIMITED_FINDINGS: ${{ steps.limited.outputs.findings }}
        MISSING_OUTCOME: ${{ steps.missing.outcome }}
        MISSING_FINDINGS: ${{ steps.missing.outputs.findings }}
      run: |
        set -euo pipefail

        [ "$LIMITED_OUTCOME" = "failure" ] || { echo "::error::a 1 MiB limit did not fail a 2 MiB image ($LIMITED_OUTCOME)"; exit 1; }
        [[ "$LIMITED_FINDINGS" =~ ^[0-9]+$ ]] || { echo "::error::the limit failed before the report phase published findings"; exit 1; }
        [ "$MISSING_OUTCOME" = "failure" ] || { echo "::error::an image that was never built did not fail ($MISSING_OUTCOME)"; exit 1; }
        [ -z "$MISSING_FINDINGS" ] || { echo "::error::Trivy ran against an image that was never built"; exit 1; }

        echo "✅ The limit failed last, and a missing image failed first"

verify-summary-legs:
  name: Test Summary Leg (${{ matrix.platform }})
  runs-on: ubuntu-latest
  permissions:
    contents: read # to fetch code
  strategy:
    matrix:
      platform: [linux/amd64, linux/arm64]
  steps:
    - name: Harden Runner
      uses: pinned:hardenRunner
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          get.trivy.dev:443
          *.actions.githubusercontent.com:443
          *.blob.core.windows.net:443
          mirror.gcr.io:443
          ghcr.io:443
          pkg-containers.githubusercontent.com:443
          storage.googleapis.com:443

    - name: Checkout
      uses: pinned:checkout
      with:
        persist-credentials: false

    # Built from a copy under RUNNER_TEMP with 2 MiB of zeros added: .Size counts unpacked bytes, so
    # the image lands at a known size between the 1 MiB limit below and the default warning, and the
    # workspace stays clean for the assertion that the action itself writes nothing there.
    - name: Build Fixture Image
      run: |
        set -euo pipefail
        context="$RUNNER_TEMP/image-check-fixture"
        cp -r actions/docker/image-check/e2e/fixture "$context"
        head -c 2097152 /dev/zero > "$context/payload.bin"
        docker build --tag image-check-e2e:test "$context"

    - name: Run Test (Summary Leg)
      uses: ./actions/docker/image-check
      with:
        image: image-check-e2e:test
        platform: ${{ matrix.platform }}
        upload-sarif: 'false'
        comment: summary

verify-summary:
  name: Test Summary Comment
  needs: verify-summary-legs
  runs-on: ubuntu-latest
  permissions:
    contents: read # to fetch code
    pull-requests: write # to upsert the summary comment
  steps:
    - name: Harden Runner
      uses: pinned:hardenRunner
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          *.actions.githubusercontent.com:443
          *.blob.core.windows.net:443

    - name: Checkout
      uses: pinned:checkout
      with:
        persist-credentials: false

    - name: Run Test (Summary)
      id: summary
      uses: ./actions/docker/image-check-summary
      with:
        identifier: image-check-e2e-summary

    # Fragments are uploaded only on a pull request whose token can write, so that is the only
    # event on which there is a table to post.
    - name: Assert Summary
      env:
        SAME_REPOSITORY_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        IMAGES: ${{ steps.summary.outputs.images }}
        COMMENT_URL: ${{ steps.summary.outputs.comment-url }}
      run: |
        set -euo pipefail

        if [ "$SAME_REPOSITORY_PR" = "true" ]; then
          [ "$IMAGES" = "2" ] || { echo "::error::expected 2 fragments, read '$IMAGES'"; exit 1; }
          [ -n "$COMMENT_URL" ] || { echo "::error::no summary comment was written"; exit 1; }
          echo "✅ Two legs, one table: $COMMENT_URL"
        else
          [ "$IMAGES" = "0" ] || { echo "::error::expected no fragments outside a same-repository pull request, read '$IMAGES'"; exit 1; }
          [ -z "$COMMENT_URL" ] || { echo "::error::a comment was written outside a same-repository pull request"; exit 1; }
          echo "✅ Nothing to post on this event, and nothing posted"
        fi
