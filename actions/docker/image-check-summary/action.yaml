name: 'Docker Image Check Summary'
description: 'Collects the fragments docker/image-check legs uploaded with comment: summary and posts one table of every image on the pull request.'

inputs:
  identifier:
    description: 'upsert-pr-comment identifier of the summary comment.'
    required: false
    default: 'docker-image-size'
  token:
    description: 'Token for the pull request comment, with pull-requests: write.'
    required: false
    default: ${{ github.token }}
  artifact-pattern:
    description: 'Glob matching the fragment artifacts docker/image-check uploads, which are named image-check-<slug>.'
    required: false
    default: 'image-check-*'

outputs:
  comment-url:
    description: 'URL of the summary comment, when one was written.'
    value: ${{ steps.comment.outputs.comment_url }}
  images:
    description: 'Number of fragments read.'
    value: ${{ steps.render.outputs.images }}

runs:
  using: 'composite'
  steps:
    # merge-multiple off puts each artifact in a directory of its own, so two fragments never
    # overwrite each other on disk; a lone match is extracted into the path itself, and the helper
    # reads both layouts. A pattern that matches nothing downloads nothing and is not an error; the
    # next step reports it.
    - name: Download Fragments
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: ${{ inputs.artifact-pattern }}
        path: ${{ runner.temp }}/image-check-summary
        merge-multiple: false

    - name: Render Table
      id: render
      shell: bash
      env:
        INPUT_DIRECTORY: ${{ runner.temp }}/image-check-summary
      run: node "$GITHUB_ACTION_PATH/helper/dist/index.js"

    - name: Upsert Pull Request Comment
      id: comment
      if: steps.render.outputs.write_comment == 'true'
      uses: TimSchoenle/actions/actions/common/upsert-pr-comment@1e89d598e447ab05d36edc9e9d18e8771adf6426 # tag=actions-common-upsert-pr-comment-v1.2.2
      with:
        token: ${{ inputs.token }}
        identifier: ${{ inputs.identifier }}
        body: ${{ steps.render.outputs.body }}
