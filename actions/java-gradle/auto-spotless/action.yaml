name: 'Java-gradle Auto-spotless'
description: 'Runs Gradle spotlessApply and uploads the changes as a patch artifact for common/commit-patch to commit from a separate job. Holds no token.'

# The unprivileged half of a two-job pattern. ./gradlew runs the repository's own wrapper, build
# scripts and plugins, so on a pull request it runs what that pull request chose. The job running
# this action must therefore hold no write token and no secret; the commit is made by
# common/commit-patch in a later job that runs no repository code. See README.md for the full
# workflow.

inputs:
  gradle_spotless_command:
    description: 'Gradle task to run, passed to ./gradlew as a single argument.'
    required: false
    default: 'spotlessApply'
  java_version:
    description: 'Java version to use for the build.'
    required: true
  java_distribution:
    description: 'Java distribution to use'
    required: false
    default: 'temurin'
  java_package:
    description: 'The package type (jdk, jre, jdk+fx, jre+fx)'
    required: false
    default: 'jdk'
  gradle_wrapper_validation:
    description: 'Validate Gradle wrapper'
    required: false
    default: 'true'
  gradle_wrapper_allow_snapshots:
    description: 'Allow Gradle wrapper snapshots'
    required: false
    default: 'false'
  paths:
    description: 'Space- or newline-separated paths or globs scoping the patch, as common/create-patch takes them. . is the whole tree.'
    required: false
    default: '.'
  artifact_name:
    description: 'Name of the patch artifact. Pass the same name to common/commit-patch. 1 to 100 characters of letters, digits, ., _ and -.'
    required: false
    default: 'auto-spotless'

outputs:
  changes_detected:
    description: 'true when the Spotless task changed a file within paths.'
    value: ${{ steps.patch.outputs.has_changes }}
  artifact_name:
    description: 'Name of the uploaded patch artifact.'
    value: ${{ steps.patch.outputs.artifact_name }}
  base_sha:
    description: 'The commit the patch was computed against: HEAD of the checkout.'
    value: ${{ steps.patch.outputs.base_sha }}

runs:
  using: 'composite'
  steps:
    # The caller checks out; this action never does. The patch must be computed against the exact
    # commit the commit job expects, and only the caller knows which commit that is.
    - name: Set up JDK
      uses: TimSchoenle/actions/actions/java-gradle/setup-base-environment@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-java-gradle-setup-base-environment-v1.2.14
      with:
        java_version: ${{ inputs.java_version }}
        java_distribution: ${{ inputs.java_distribution }}
        java_package: ${{ inputs.java_package }}
        gradle_wrapper_validation: ${{ inputs.gradle_wrapper_validation }}
        gradle_wrapper_allow_snapshots: ${{ inputs.gradle_wrapper_allow_snapshots }}

    - name: Run spotless
      shell: bash
      env:
        SPOTLESS_COMMAND: ${{ inputs.gradle_spotless_command }}
      run: ./gradlew "$SPOTLESS_COMMAND"

    - name: Create Patch
      id: patch
      uses: TimSchoenle/actions/actions/common/create-patch@bbc2c5e2a0f9345cb2e84946846736f047a6eae3 # tag=actions-common-create-patch-v1.1.0
      with:
        artifact_name: ${{ inputs.artifact_name }}
        paths: ${{ inputs.paths }}
