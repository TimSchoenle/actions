name: 'Java-Gradle Coverage (Codecov)'
description: 'Action that measures Java and Kotlin test coverage with JaCoCo through Gradle, and uploads the coverage reports and the JUnit test results to Codecov.'

inputs:
  source_directory:
    description: 'Directory containing the Gradle build and its wrapper, relative to the workspace.'
    required: false
    default: '.'
  java_version:
    description: 'Java version to run Gradle and the tests on.'
    required: true
  java_distribution:
    description: 'Java distribution to use.'
    required: false
    default: 'temurin'
  gradle_arguments:
    description: 'Extra arguments for the Gradle invocation, split on whitespace, e.g. -x functionalTest to leave a
      suite out of the measurement. Every Test task in a project counts towards its report unless excluded here.'
    required: false
    default: ''
  flags:
    description: 'Comma-separated Codecov flags attached to both uploads. Empty for none.'
    required: false
    default: ''
  name:
    description: 'Upload name shown in the Codecov UI. Empty lets Codecov choose.'
    required: false
    default: ''
  use_oidc:
    description: 'Authenticate the upload with a GitHub OIDC token, which needs the id-token: write permission on the
      calling job. Pull requests from forks get no OIDC token and fall back to a tokenless upload either way.'
    required: false
    default: 'true'
  codecov_token:
    description: 'Codecov upload token. Ignored while use_oidc is true.'
    required: false
    default: ''
  test_results:
    description: 'Also upload the JUnit reports of every Test task to Codecov Test Analytics. The upload runs when tests
      fail too, since that is the run whose results matter.'
    required: false
    default: 'true'
  fail_ci_if_error:
    description: 'Fail the step when Codecov rejects or cannot receive an upload.'
    required: false
    default: 'true'
  dry_run:
    description: "Measure coverage and write all reports, then skip both uploads. The Codecov CLI's own dry run is not
      used, because it still registers the commit with Codecov and so needs a token."
    required: false
    default: 'false'

outputs:
  coverage_files:
    description: 'Comma-separated absolute paths of the JaCoCo XML reports, one per project that ran tests.'
    value: ${{ steps.reports.outputs.coverage_files }}
  test_results_files:
    description: 'Comma-separated absolute paths of the JUnit XML reports. Empty when no test ran.'
    value: ${{ steps.reports.outputs.test_results_files }}

runs:
  using: 'composite'
  steps:
    # Every boolean is compared against the literal 'true' further down, so 'True' or 'yes' would
    # silently mean false. That is how an upload goes missing without a failing step.
    - name: Validate inputs
      shell: bash
      env:
        JAVA_VERSION: ${{ inputs.java_version }}
        USE_OIDC: ${{ inputs.use_oidc }}
        CODECOV_TOKEN_INPUT: ${{ inputs.codecov_token }}
        TEST_RESULTS: ${{ inputs.test_results }}
        FAIL_CI_IF_ERROR: ${{ inputs.fail_ci_if_error }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        set -euo pipefail
        status=0

        # A composite action does not enforce `required`, so an omitted java_version would reach
        # setup-java as an empty string.
        if [[ -z "${JAVA_VERSION}" ]]; then
          echo "::error::java_version is required."
          status=1
        fi

        for pair in "use_oidc=${USE_OIDC}" "test_results=${TEST_RESULTS}" \
          "fail_ci_if_error=${FAIL_CI_IF_ERROR}" "dry_run=${DRY_RUN}"; do
          case "${pair#*=}" in
            true | false) ;;
            *)
              echo "::error::${pair%%=*} must be 'true' or 'false', got '${pair#*=}'."
              status=1
              ;;
          esac
        done

        if [[ "${USE_OIDC}" == 'false' && -z "${CODECOV_TOKEN_INPUT}" && "${DRY_RUN}" == 'false' ]]; then
          echo "::warning::use_oidc is false and codecov_token is empty. Codecov accepts that only from a fork, or from a repository whose Codecov settings disable token authentication."
        fi

        exit "${status}"

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    # setup-java and setup-gradle directly, at the pins `setup-base-environment` uses, rather than
    # that action itself. It makes `./gradlew` executable at the workspace root only, so a build in
    # a subdirectory would fail there, and a composite action can reach a sibling only through a
    # released tag.
    - name: Set up Java
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
      with:
        java-version: ${{ inputs.java_version }}
        distribution: ${{ inputs.java_distribution }}

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      with:
        validate-wrappers: true

    # JaCoCo comes from the init script shipped with this action, so a repository needs no coverage
    # setup of its own. `--continue` keeps the other projects' tests running after one fails, so
    # Test Analytics sees every result rather than those of the projects that ran first.
    - name: Generate code coverage
      id: coverage
      shell: bash
      working-directory: ${{ inputs.source_directory }}
      env:
        GRADLE_ARGUMENTS: ${{ inputs.gradle_arguments }}
        INIT_SCRIPT: ${{ github.action_path }}/coverage.init.gradle
      run: |
        set -euo pipefail
        out_dir="${RUNNER_TEMP}/java-gradle-coverage-codecov"
        rm -rf "${out_dir}"
        mkdir -p "${out_dir}"
        echo "out_dir=${out_dir}" >> "${GITHUB_OUTPUT}"

        if [[ ! -f ./gradlew ]]; then
          echo "::error::No Gradle wrapper at '$(pwd)/gradlew'. Point source_directory at the build's root."
          exit 1
        fi
        # Git on Windows does not record the executable bit, so a wrapper committed from there
        # arrives without it.
        chmod +x ./gradlew

        # shellcheck disable=SC2206
        args=($GRADLE_ARGUMENTS)
        JAVA_GRADLE_COVERAGE_OUTPUT_DIR="${out_dir}" ./gradlew \
          --init-script "${INIT_SCRIPT}" \
          --continue \
          jacocoTestReport \
          "${args[@]}"

    # Runs after a test failure as well, for the JUnit reports. A project whose tests failed writes
    # no coverage report, and the coverage upload is skipped for that run anyway.
    - name: Collect reports
      id: reports
      if: ${{ !cancelled() && steps.coverage.outputs.out_dir != '' }}
      shell: bash
      env:
        OUT_DIR: ${{ steps.coverage.outputs.out_dir }}
        COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}
      run: |
        set -euo pipefail
        join() {
          local IFS=','
          echo "$*"
        }

        coverage=()
        if [[ -d "${OUT_DIR}/jacoco" ]]; then
          mapfile -t coverage < <(find "${OUT_DIR}/jacoco" -type f -name '*.xml' | sort)
        fi
        junit=()
        if [[ -d "${OUT_DIR}/junit" ]]; then
          mapfile -t junit < <(find "${OUT_DIR}/junit" -type f -name '*.xml' | sort)
        fi

        {
          echo "coverage_files=$(join "${coverage[@]}")"
          echo "test_results_files=$(join "${junit[@]}")"
        } >> "${GITHUB_OUTPUT}"

        echo "Coverage reports: ${#coverage[@]}, JUnit reports: ${#junit[@]}"

        # A successful build with no report means no project applies the java plugin or none has
        # a test. Uploading nothing would leave Codecov's status waiting on a report that never comes.
        if [[ "${COVERAGE_OUTCOME}" == 'success' && "${#coverage[@]}" -eq 0 ]]; then
          echo "::error::Gradle succeeded but no project produced a JaCoCo report. Either no project applies the java plugin, or none of them has a test that ran."
          exit 1
        fi

    - name: Skip uploads
      if: ${{ inputs.dry_run == 'true' }}
      shell: bash
      run: echo "::notice::dry_run is true, so no report is uploaded to Codecov."

    # `disable_search` because the report paths are known. The CLI's search would otherwise add any
    # stray coverage file it finds under the checkout to the same upload.
    - name: Upload coverage to Codecov
      if: ${{ inputs.dry_run != 'true' }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: ${{ steps.reports.outputs.coverage_files }}
        disable_search: true
        disable_telem: true
        flags: ${{ inputs.flags }}
        name: ${{ inputs.name }}
        use_oidc: ${{ inputs.use_oidc }}
        token: ${{ inputs.codecov_token }}
        fail_ci_if_error: ${{ inputs.fail_ci_if_error }}

    - name: Upload test results to Codecov
      if: ${{ !cancelled() && inputs.dry_run != 'true' && inputs.test_results == 'true' && steps.reports.outputs.test_results_files != '' }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        report_type: test_results
        files: ${{ steps.reports.outputs.test_results_files }}
        disable_search: true
        disable_telem: true
        flags: ${{ inputs.flags }}
        name: ${{ inputs.name }}
        use_oidc: ${{ inputs.use_oidc }}
        token: ${{ inputs.codecov_token }}
        fail_ci_if_error: ${{ inputs.fail_ci_if_error }}
