// Init script for actions/java-gradle/coverage-codecov, passed to Gradle with --init-script.
//
// It configures JaCoCo for the build it runs against, so a repository needs no coverage setup of
// its own. Every project that applies the `java` plugin, directly or through `java-library`,
// `application`, `java-gradle-plugin` or Kotlin JVM, gets:
//
// - the `jacoco` plugin, which attaches the agent to every `Test` task;
// - a `jacocoTestReport` that depends on every `Test` task and reads all their execution data. The
//   plugin's default reads only `test`, so a project's integration or functional suite would
//   otherwise run and count for nothing;
// - its XML report and every `Test` task's JUnit XML written under JAVA_GRADLE_COVERAGE_OUTPUT_DIR,
//   so the action finds them without knowing any project's build directory.
//
// A project that configures JaCoCo itself keeps its settings; only the report destinations, the
// formats and the execution data are set here.
//
// `gradle.lifecycle.beforeProject` needs Gradle 8.8 or later. It is used over `allprojects`
// because it does not reach across projects, which keeps the script compatible with isolated
// projects.

import org.gradle.api.tasks.testing.Test
import org.gradle.testing.jacoco.tasks.JacocoReport

def outputDirValue = System.getenv('JAVA_GRADLE_COVERAGE_OUTPUT_DIR')
if (!outputDirValue) {
    throw new GradleException('JAVA_GRADLE_COVERAGE_OUTPUT_DIR is not set. This init script is meant to be run by actions/java-gradle/coverage-codecov.')
}
def outputDir = new File(outputDirValue)

gradle.lifecycle.beforeProject { project ->
    project.pluginManager.withPlugin('java') {
        project.pluginManager.apply('jacoco')

        // `:` is the root project; `:a:b` becomes `a-b`. Distinct paths stay distinct, because a
        // project name cannot contain `:`.
        def slug = project.path == ':' ? 'root' : project.path.substring(1).replace(':', '-')
        def testTasks = project.tasks.withType(Test)

        testTasks.configureEach { test ->
            test.reports.junitXml.required.set(true)
            test.reports.junitXml.outputLocation.set(new File(outputDir, "junit/${slug}/${test.name}"))
        }

        // The execution data is read as a file tree because `executionData(testTasks)` iterates the
        // task collection eagerly, which Gradle refuses inside lazy task configuration. The jacoco
        // plugin writes each `Test` task's data to `build/jacoco/<task>.exec`.
        project.tasks.named('jacocoTestReport', JacocoReport).configure { report ->
            report.dependsOn(testTasks)
            report.executionData.setFrom(
                project.fileTree(project.layout.buildDirectory.dir('jacoco')) { include '*.exec' }
            )
            report.reports.xml.required.set(true)
            report.reports.xml.outputLocation.set(new File(outputDir, "jacoco/${slug}.xml"))
            report.reports.html.required.set(false)
            report.reports.csv.required.set(false)
        }
    }
}
