name: 'Verify Commit Authors'
description:
  'Verifies that every commit in a PR is authored by a specific set of users and is either signed by GitHub or
  committed and signed by one of those users.'
inputs:
  pr_url:
    description: 'The URL of the Pull Request to verify.'
    required: true
  github_token:
    description: 'GitHub Token with permission to read PRs.'
    required: true
  user_ids:
    description: 'Comma-separated list of Database IDs of accepted accounts (e.g. "29139614, 123456"). Every author, the
      committer and the owner of the signing key must be one of them; a commit GitHub signed itself names GitHub as its
      committer and is exempt from the committer and signer checks.'
    required: true
outputs:
  verified:
    description: 'True if all commits are verified, false otherwise.'
  invalid_commits:
    description: 'List of SHAs that failed verification.'
runs:
  using: 'node20'
  main: 'dist/index.js'
