# silent_fail turns only a missing branch into an empty output. A token that cannot see the
# repository still fails the step, rather than reading as "branch not found".
- id: base
  uses: TimSchoenle/actions/actions/helper/resolve-base-branch@b37134ffa35b3ce98437447e3b4c76933eb65c04 # tag=actions-helper-resolve-base-branch-v2.0.2
  with:
    token: ${{ steps.token.outputs.token }}
    repository: ${{ github.repository }}
    branch_name: release/next
    silent_fail: 'true'

- if: steps.base.outputs.base_branch == ''
  uses: TimSchoenle/actions/actions/common/create-branch@b37134ffa35b3ce98437447e3b4c76933eb65c04 # tag=actions-common-create-branch-v2.0.2
  with:
    token: ${{ steps.token.outputs.token }}
    repository: ${{ github.repository }}
    branch_name: release/next
