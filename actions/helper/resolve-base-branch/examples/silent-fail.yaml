# silent_fail turns only a missing branch into an empty output. A token that cannot see the
# repository still fails the step, rather than reading as "branch not found".
- id: base
  uses: TimSchoenle/actions/actions/helper/resolve-base-branch@49acdef9979f343817ec2a85ddd25e5f34befc8b # tag=actions-helper-resolve-base-branch-v2.0.5
  with:
    token: ${{ steps.token.outputs.token }}
    repository: ${{ github.repository }}
    branch_name: release/next
    silent_fail: 'true'

- if: steps.base.outputs.base_branch == ''
  uses: TimSchoenle/actions/actions/common/create-branch@49acdef9979f343817ec2a85ddd25e5f34befc8b # tag=actions-common-create-branch-v2.0.5
  with:
    token: ${{ steps.token.outputs.token }}
    repository: ${{ github.repository }}
    branch_name: release/next
