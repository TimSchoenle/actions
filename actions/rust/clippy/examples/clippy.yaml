# The action checks the repository out itself. Findings appear as annotations on the run.
name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch code
    steps:
      - uses: TimSchoenle/actions/actions/rust/clippy@ded012bb09f11e42381c9b1b7c3ff0dbc09156bf # tag=actions-rust-clippy-v2.0.1
        with:
          clippy_arguments: '--all-features --all-targets -- -D warnings'
