name: 'Rust Clippy'
description: 'Action that runs clippy to catch common mistakes and improve your Rust code.'

inputs:
  repository:
    description: 'Target repository in the format owner/repo. Defaults to the current repository.'
    required: false
    default: ${{ github.repository }}
  branch:
    description: 'Target branch to checkout. Defaults to the current branch.'
    required: false
    default: ${{ github.head_ref || github.ref_name }}
  source_directory:
    description: 'Directory containing the Rust project'
    required: false
    default: '.'
  clippy_arguments:
    description: 'Arguments to pass to clippy'
    required: false
    default: '--all-features --all-targets'

runs:
  using: 'composite'
  steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: ${{ inputs.repository }}
        persist-credentials: false
        fetch-depth: 0
        ref: ${{ inputs.branch }}

    - name: Install stable toolchain
      uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      with:
        # A cache saved from a pull request is scoped to its ref, so no default-branch run can restore it,
        # yet it counts against the 10 GB quota and evicts the default branch's entries. A schedule always
        # runs on the default branch, and its payload carries no repository to compare against.
        cache-save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'schedule' }}
        components: clippy

    - name: Run clippy
      uses: clechasseur/rs-clippy-check@ac75e246ebbd78d106ac9460c668ab7c8044ebe3 # v6.1.1
      with:
        args: ${{ inputs.clippy_arguments }}
        working-directory: ${{ inputs.source_directory }}
