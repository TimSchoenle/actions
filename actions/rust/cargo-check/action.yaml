name: 'Rust Cargo-check'
description: 'Action that runs cargo check to verify Rust code compiles without errors.'

inputs:
  repository:
    description: 'Target repository in the format owner/repo. Defaults to the current repository.'
    required: false
    default: ${{ github.repository }}
  branch:
    description: 'Branch, tag or SHA to check out. Empty checks out the commit of the triggering event: the merge commit on pull_request, the pushed commit on push.'
    required: false
    default: ''
  source_directory:
    description: 'Directory containing the Rust project'
    required: false
    default: '.'
  check_arguments:
    description: 'Additional arguments to pass to cargo check'
    required: false
    default: '--all-targets --all-features'

runs:
  using: 'composite'
  steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: ${{ inputs.repository }}
        persist-credentials: false
        ref: ${{ inputs.branch }}

    - name: Install stable toolchain
      uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

    - name: Run cargo check
      shell: bash
      env:
        CHECK_ARGUMENTS: ${{ inputs.check_arguments }}
      working-directory: ${{ inputs.source_directory }}
      run: |
        # shellcheck disable=SC2206
        args=($CHECK_ARGUMENTS)
        cargo check "${args[@]}"
