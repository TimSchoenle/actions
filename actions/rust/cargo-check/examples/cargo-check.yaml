# The action checks the repository out itself.
name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  check:
    name: Cargo Check
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch code
    steps:
      - uses: TimSchoenle/actions/actions/rust/cargo-check@49acdef9979f343817ec2a85ddd25e5f34befc8b # tag=actions-rust-cargo-check-v2.0.0
