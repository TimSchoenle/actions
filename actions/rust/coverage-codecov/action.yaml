name: 'Rust Coverage (Codecov)'
description: 'Action that measures Rust test coverage with cargo llvm-cov and nextest, and uploads the coverage report and the JUnit test results to Codecov.'

inputs:
  source_directory:
    description: 'Directory containing the Rust project, relative to the workspace. Tests run here.'
    required: false
    default: '.'
  test_arguments:
    description: 'Arguments passed to cargo llvm-cov nextest, split on whitespace. Report format, output path, nextest
      profile and tool config belong to the action and are refused here.'
    required: false
    default: '--all-features --workspace'
  flags:
    description: 'Comma-separated Codecov flags attached to both uploads. Empty for none.'
    required: false
    default: ''
  name:
    description: 'Upload name shown in the Codecov UI. Empty lets Codecov choose.'
    required: false
    default: ''
  use_oidc:
    description: 'Authenticate the upload with a GitHub OIDC token, which needs the id-token: write permission on the
      calling job. Pull requests from forks get no OIDC token and fall back to a tokenless upload either way.'
    required: false
    default: 'true'
  codecov_token:
    description: 'Codecov upload token. Ignored while use_oidc is true.'
    required: false
    default: ''
  test_results:
    description: 'Also upload the nextest JUnit report to Codecov Test Analytics. The upload runs when tests fail too,
      since that is the run whose results matter.'
    required: false
    default: 'true'
  fail_ci_if_error:
    description: 'Fail the step when Codecov rejects or cannot receive an upload.'
    required: false
    default: 'true'
  dry_run:
    description: "Measure coverage and write both reports, then skip both uploads. The Codecov CLI's own dry run is
      not used, because it still registers the commit with Codecov and so needs a token."
    required: false
    default: 'false'

outputs:
  coverage_file:
    description: 'Absolute path of the coverage report, in the Codecov JSON format.'
    value: ${{ steps.paths.outputs.coverage_file }}
  test_results_file:
    description: 'Absolute path of the nextest JUnit report. Empty when no report was written.'
    value: ${{ steps.junit.outputs.test_results_file }}

runs:
  using: 'composite'
  steps:
    # Every boolean is compared against the literal 'true' further down, so 'True' or 'yes' would
    # silently mean false. That is how an upload goes missing without a failing step.
    - name: Validate inputs
      shell: bash
      env:
        TEST_ARGUMENTS: ${{ inputs.test_arguments }}
        USE_OIDC: ${{ inputs.use_oidc }}
        CODECOV_TOKEN_INPUT: ${{ inputs.codecov_token }}
        TEST_RESULTS: ${{ inputs.test_results }}
        FAIL_CI_IF_ERROR: ${{ inputs.fail_ci_if_error }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        set -euo pipefail
        status=0

        for pair in "use_oidc=${USE_OIDC}" "test_results=${TEST_RESULTS}" \
          "fail_ci_if_error=${FAIL_CI_IF_ERROR}" "dry_run=${DRY_RUN}"; do
          case "${pair#*=}" in
            true | false) ;;
            *)
              echo "::error::${pair%%=*} must be 'true' or 'false', got '${pair#*=}'."
              status=1
              ;;
          esac
        done

        # shellcheck disable=SC2206
        args=($TEST_ARGUMENTS)
        for arg in "${args[@]}"; do
          # Everything after `--` goes to the test binaries, not to cargo-llvm-cov or nextest.
          [[ "${arg}" == '--' ]] && break
          case "${arg}" in
            --lcov | --json | --cobertura | --codecov | --text | --html | --open | \
              --output-path | --output-path=* | --output-dir | --output-dir=* | \
              --profile | --profile=* | -P | --tool-config-file | --tool-config-file=*)
              echo "::error::test_arguments must not contain '${arg}': the action sets it."
              status=1
              ;;
          esac
        done

        if [[ "${USE_OIDC}" == 'false' && -z "${CODECOV_TOKEN_INPUT}" && "${DRY_RUN}" == 'false' ]]; then
          echo "::warning::use_oidc is false and codecov_token is empty. Codecov accepts that only from a fork, or from a repository whose Codecov settings disable token authentication."
        fi

        exit "${status}"

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    # `rust-toolchain.toml` wins over the default toolchain when the project has one, and the
    # component is added to whichever toolchain that selects.
    #
    # The cache key is shared under its own name because the instrumented build in
    # `target/llvm-cov-target` reuses nothing the uninstrumented test job compiled. Only the
    # default branch saves, so a pull request cannot evict the entry every other pull request
    # restores from.
    - name: Install toolchain
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        components: llvm-tools-preview
        cache-shared-key: coverage
        cache-workspaces: '${{ inputs.source_directory }} -> target'
        cache-save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

    - name: Install cargo-llvm-cov and nextest
      uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
      with:
        tool: cargo-llvm-cov,nextest

    # The JUnit report comes from a nextest profile the action supplies as tool config, so a
    # repository needs no `.config/nextest.toml` for it. A repository that defines
    # `[profile.codecov]` or `[store]` itself overrides these keys, because repository config
    # outranks tool config.
    #
    # The store directory is pinned because nothing else predicts it: cargo-llvm-cov hands nextest
    # a `--target-dir` of its own, and where the store lands then depends on whether
    # `CARGO_TARGET_DIR` is set.
    - name: Prepare paths
      id: paths
      shell: bash
      run: |
        set -euo pipefail
        out_dir="${RUNNER_TEMP}/rust-coverage-codecov"
        mkdir -p "${out_dir}"

        tool_config="${out_dir}/nextest.toml"
        cat > "${tool_config}" <<EOF
        [store]
        dir = "${out_dir}/nextest"

        [profile.codecov]
        fail-fast = false

        [profile.codecov.junit]
        path = "junit.xml"
        store-failure-output = true
        EOF

        {
          echo "coverage_file=${out_dir}/coverage.json"
          echo "tool_config=${tool_config}"
          echo "junit_candidate=${out_dir}/nextest/codecov/junit.xml"
        } >> "${GITHUB_OUTPUT}"

    # `--codecov` rather than `--lcov`: Codecov's own format carries a partially covered line as a
    # hit/total ratio, where lcov records only hit or missed.
    - name: Generate code coverage
      shell: bash
      working-directory: ${{ inputs.source_directory }}
      env:
        TEST_ARGUMENTS: ${{ inputs.test_arguments }}
        COVERAGE_FILE: ${{ steps.paths.outputs.coverage_file }}
        TOOL_CONFIG: ${{ steps.paths.outputs.tool_config }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2206
        args=($TEST_ARGUMENTS)
        cargo llvm-cov nextest \
          --codecov --output-path "${COVERAGE_FILE}" \
          --profile codecov --tool-config-file "codecov:${TOOL_CONFIG}" \
          "${args[@]}"

    # Runs after a test failure as well. A failing run is the one whose results Test Analytics
    # needs, and the file is only absent when the build failed before any test ran.
    - name: Locate test results
      id: junit
      if: ${{ !cancelled() && steps.paths.outcome == 'success' }}
      shell: bash
      env:
        JUNIT_CANDIDATE: ${{ steps.paths.outputs.junit_candidate }}
      run: |
        set -euo pipefail
        if [[ -f "${JUNIT_CANDIDATE}" ]]; then
          echo "test_results_file=${JUNIT_CANDIDATE}" >> "${GITHUB_OUTPUT}"
        else
          echo "::notice::No JUnit report at ${JUNIT_CANDIDATE}. Either the build failed before any test ran, or the repository's nextest config moves the store or the codecov profile's report."
        fi

    - name: Skip uploads
      if: ${{ inputs.dry_run == 'true' }}
      shell: bash
      run: echo "::notice::dry_run is true, so neither report is uploaded to Codecov."

    # `disable_search` because the report path is known. The CLI's search would otherwise add any
    # stray coverage file it finds under the checkout to the same upload.
    - name: Upload coverage to Codecov
      if: ${{ inputs.dry_run != 'true' }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: ${{ steps.paths.outputs.coverage_file }}
        disable_search: true
        disable_telem: true
        flags: ${{ inputs.flags }}
        name: ${{ inputs.name }}
        use_oidc: ${{ inputs.use_oidc }}
        token: ${{ inputs.codecov_token }}
        fail_ci_if_error: ${{ inputs.fail_ci_if_error }}

    - name: Upload test results to Codecov
      if: ${{ !cancelled() && inputs.dry_run != 'true' && inputs.test_results == 'true' && steps.junit.outputs.test_results_file != '' }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        report_type: test_results
        files: ${{ steps.junit.outputs.test_results_file }}
        disable_search: true
        disable_telem: true
        flags: ${{ inputs.flags }}
        name: ${{ inputs.name }}
        use_oidc: ${{ inputs.use_oidc }}
        token: ${{ inputs.codecov_token }}
        fail_ci_if_error: ${{ inputs.fail_ci_if_error }}
