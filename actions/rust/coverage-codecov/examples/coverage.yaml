# The action checks the repository out itself. Pull requests from forks get no OIDC token and
# upload tokenless.
name: Coverage

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch code
      id-token: write # to authenticate the upload with OIDC
    steps:
      - uses: TimSchoenle/actions/actions/rust/coverage-codecov@7594d1c64de290a99195e47fc6d7b5699243b951 # tag=actions-rust-coverage-codecov-v2.1.2
        with:
          flags: unit
