# The action checks the repository out itself. Pull requests from forks get no OIDC token and
# upload tokenless.
name: Coverage

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch code
      id-token: write # to authenticate the upload with OIDC
    steps:
      - uses: TimSchoenle/actions/actions/rust/coverage-codecov@main
        with:
          flags: unit
