# The action checks the repository out itself. Pull requests from forks get no OIDC token and
# upload tokenless.
name: Coverage

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch code
      id-token: write # to authenticate the upload with OIDC
    steps:
      - uses: TimSchoenle/actions/actions/rust/coverage-codecov@54a4dc05fd351a9bf9e9638fa3ebbc572b5f2d7f # tag=actions-rust-coverage-codecov-v2.1.1
        with:
          flags: unit
