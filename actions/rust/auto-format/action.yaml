name: 'Rust Auto-format'
description: 'Runs cargo fmt and uploads the changes as a patch artifact for common/commit-patch to commit from a separate job. Holds no token.'

# The unprivileged half of a two-job pattern. cargo fmt honours the repository's rust-toolchain.toml
# and rustfmt.toml, so on a pull request it runs what that pull request chose. The job running this
# action must therefore hold no write token and no secret; the commit is made by common/commit-patch
# in a later job that runs no repository code. See README.md for the full workflow.

inputs:
  source_directory:
    description: 'Directory of the Rust project, relative to the repository root. cargo fmt runs there, and the patch is scoped to it. Must not contain whitespace.'
    required: false
    default: '.'
  artifact_name:
    description: 'Name of the patch artifact. Pass the same name to common/commit-patch. 1 to 100 characters of letters, digits, ., _ and -.'
    required: false
    default: 'rust-auto-format'

outputs:
  changes_detected:
    description: 'true when cargo fmt changed a file under source_directory.'
    value: ${{ steps.patch.outputs.has_changes }}
  artifact_name:
    description: 'Name of the uploaded patch artifact.'
    value: ${{ steps.patch.outputs.artifact_name }}
  base_sha:
    description: 'The commit the patch was computed against: HEAD of the checkout.'
    value: ${{ steps.patch.outputs.base_sha }}

runs:
  using: 'composite'
  steps:
    # create-patch takes whitespace-separated paths, so a directory with a space in its name would be
    # read as two paths and the patch scoped to neither. Refused before anything runs.
    - name: Validate Inputs
      shell: bash
      env:
        SOURCE_DIRECTORY: ${{ inputs.source_directory }}
      run: |
        set -euo pipefail
        if [[ -z "$SOURCE_DIRECTORY" || "$SOURCE_DIRECTORY" =~ [[:space:]] ]]; then
          echo "::error::source_directory must be a non-empty path without whitespace."
          exit 1
        fi

    # The caller checks out; this action never does. The patch must be computed against the exact
    # commit the commit job expects, and only the caller knows which commit that is.
    - name: Install stable toolchain
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        components: rustfmt

    # setup-rust-toolchain only reads a toolchain file at the repository root, while cargo fmt
    # resolves one from source_directory upwards. Adding rustfmt here, from the same directory,
    # installs it for the toolchain cargo fmt is about to use, whichever file selected it.
    - name: Run cargo fmt
      shell: bash
      working-directory: ${{ inputs.source_directory }}
      run: |
        set -euo pipefail
        rustup component add rustfmt
        cargo fmt

    - name: Create Patch
      id: patch
      uses: TimSchoenle/actions/actions/common/create-patch@bbc2c5e2a0f9345cb2e84946846736f047a6eae3 # tag=actions-common-create-patch-v1.1.0
      with:
        artifact_name: ${{ inputs.artifact_name }}
        paths: ${{ inputs.source_directory }}
