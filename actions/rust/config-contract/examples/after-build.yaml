# Run it after the build and before the push, where a failure costs a retry instead of a release.
- uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

- uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

- name: Build the image
  run: docker build -t myservice:test .

- name: Config contract
  uses: TimSchoenle/actions/actions/rust/config-contract@dc5b395636dc1954383f11af4062a08814e9b15a # tag=actions-rust-config-contract-v2.0.1
  with:
    features: config-schema
    image: myservice:test
