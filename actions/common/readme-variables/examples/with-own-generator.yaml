# Facts this action cannot derive, such as configuration tables, publish targets or a rendered
# example file, arrive through extra and are merged over the derived payload.
- name: Generate the configuration payload
  id: config
  run: |
    set -euo pipefail
    echo "json=$(cargo run -q -p portfolio-config --features config-schema \
      --example config-schema -- --format variables)" >> "$GITHUB_OUTPUT"

- name: Collect the README payload
  id: variables
  uses: TimSchoenle/actions/actions/common/readme-variables@b37134ffa35b3ce98437447e3b4c76933eb65c04 # tag=actions-common-readme-variables-v2.1.2
  with:
    extra: ${{ steps.config.outputs.json }}
