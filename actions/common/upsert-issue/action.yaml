name: 'Upsert Issue'
description: 'Opens or updates a repository issue, updating the previous issue carrying the same identifier.'

inputs:
  token:
    description: 'GitHub token with issues: write on the target repository.'
    required: true
  repository:
    description: 'Repository to open or update the issue on, as "owner/repo". Unlike a pull request reference, the default is populated regardless of the triggering event, so most callers pass nothing.'
    required: false
    default: ${{ github.repository }}
  identifier:
    description: 'Stable key naming this issue, e.g. "repo-state-Name". One to 64 letters, digits, ".", "_" and "-", starting with a letter or digit; anything else fails the step. It is written into the issue body as a hidden marker, which is how a later run finds the issue to update. See identifier below.'
    required: true
  title:
    description: 'Issue title. Rewritten every run that finds the issue by marker -- the marker, not the title, is the identity, so the title may change between runs without losing it.'
    required: true
  body:
    description: 'Markdown body of the issue. Exactly one of body and body_file must be non-empty; setting both fails the step rather than picking one.'
    required: false
    default: ''
  body_file:
    description: 'Path, relative to the workspace, of a file holding the markdown body. Exactly one of body and body_file must be non-empty; setting both fails the step rather than picking one.'
    required: false
    default: ''
  labels:
    description: 'Multiline list of labels the issue must carry. Enforced on every run: a label present here and missing from the issue is added, and one absent here but present on the issue is removed. A label that does not yet exist on the repository is created. See labels below.'
    required: false
    default: ''
  update_existing:
    description: 'Update the previous issue carrying the identifier instead of opening one. When false, every run opens a new issue.'
    required: false
    default: 'true'
  search_state:
    description: '"open" or "all". Scope of the issue listing searched for the marker. "all" also finds a manually closed issue so it can be reopened; "open" is cheaper on a repository with many closed issues. See Why not the Search API below.'
    required: false
    default: 'all'
  reopen_if_closed:
    description: 'Reopen a closed issue carrying the marker. When false, a closed matching issue is updated in place and left closed rather than reopened.'
    required: false
    default: 'true'
  author:
    description: 'Only match an issue opened by this login (e.g. "my-app[bot]"). Empty accepts only an issue a GitHub App opened, which covers GITHUB_TOKEN and App installation tokens. A personal access token posts as its owner, so a workflow using one has to set author to that login, or every run opens a new issue.'
    required: false
    default: ''

outputs:
  issue_number:
    description: 'Number of the issue that was created or updated.'
  issue_url:
    description: 'URL of that issue.'
  operation:
    description: 'What the run did: "created", "updated", "reopened" or "unchanged". See What happens on the second run below.'

runs:
  using: 'node24'
  main: 'dist/index.js'
