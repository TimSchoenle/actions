name: 'Commit Changes'
description: 'Commits changes using the GitHub API to ensure verified bot commits.'

inputs:
  commit_message:
    description: 'The commit message'
    required: true
  token:
    description: 'The GitHub token to use (must be an App installation token for verified commits)'
    required: true
  repository:
    description: 'Repository name to commit to (e.g. owner/repo)'
    required: false
    default: ${{ github.repository }}
  branch:
    description: 'Branch to commit to'
    required: false
    default: ${{ github.head_ref || github.ref_name }}
  expected_head_sha:
    description: 'The commit the branch must still point at; GitHub refuses the commit when it moved on. Empty uses the checked-out commit when branch is the checked-out branch, so a push that landed after the checkout is never overwritten. Otherwise the branch head is read just before the commit, with a warning, and such a push goes undetected.'
    required: false
    default: ''
  file_pattern:
    description: 'File pattern to commit'
    required: false
    default: '.'
  literal_paths:
    description: 'Paths to commit, one per line, each taken literally: spaces, `*` and `?` are part of the name. Use it
      for a path that file_pattern, which splits on whitespace, cannot name. Setting both with a file_pattern other than
      the default fails the step.'
    required: false
    default: ''

outputs:
  commit_hash:
    description: 'The SHA of the created commit'
  commit_url:
    description: 'The URL of the created commit.'
  changes_detected:
    description: 'True if changes were committed'

runs:
  using: 'node24'
  main: 'dist/index.js'
