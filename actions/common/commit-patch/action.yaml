name: 'Common Commit Patch'
description: 'Commits a common/create-patch artifact from this run or from the run run_id names as a verified commit, refusing any path outside allowed_paths, under .github/workflows/ or below a symbolic link.'

inputs:
  token:
    description: 'Token for the commit: an App installation token with contents: write, and workflows: write only when allow_workflow_changes is true.'
    required: true
  artifact_name:
    description: 'Name of the artifact create-patch uploaded, in this run or in the run run_id names.'
    required: true
  run_id:
    description: 'ID of another workflow run of this repository to download the artifact from, such as github.event.workflow_run.id. Empty downloads from this run. Set, the job needs actions: read.'
    required: false
    default: ''
  allowed_paths:
    description: 'Whitespace-separated globs every changed path must match. * and ? stay within a path segment, ** spans segments. A patch touching any other path fails the step and nothing is committed. See allowed_paths below.'
    required: true
  allow_workflow_changes:
    description: 'Accept changes under .github/workflows/. Off, such a change fails the step even when allowed_paths matches it. On, the token also needs workflows: write: GitHub refuses a commit that touches .github/workflows/ without it, whatever the action allows.'
    required: false
    default: 'false'
  allow_binary:
    description: 'Accept binary changes. Off, a binary hunk or new content git would treat as binary fails the step.'
    required: false
    default: 'false'
  commit_message:
    description: 'The commit message. The first line is the headline.'
    required: true
  repository:
    description: 'Repository to commit to, as owner/repo.'
    required: false
    default: ${{ github.repository }}
  branch:
    description: 'Branch to commit to, as a branch name: a value starting with refs/, or one git would refuse, fails the step. Empty uses the branch of the triggering event, github.head_ref || github.ref_name. With run_id set it must be given, since in a workflow_run job the event branch is the default branch.'
    required: false
    default: ''
  expected_head_sha:
    description: 'The commit the branch must still point at, and the one the checkout must be at. A patch made from any other commit is skipped with a notice. Empty uses the head of the triggering event, github.event.pull_request.head.sha || github.sha. With run_id set it must be given, since in a workflow_run job the event head is the tip of the default branch.'
    required: false
    default: ''
  max_patch_bytes:
    description: 'Largest patch accepted, in bytes. Keep it equal to max_patch_bytes on create-patch.'
    required: false
    default: '10485760'

outputs:
  changes_committed:
    description: 'true when a commit was created.'
    value: ${{ steps.commit.outputs.changes_committed }}
  commit_sha:
    description: 'SHA of the created commit, when one was created.'
    value: ${{ steps.commit.outputs.commit_sha }}
  commit_url:
    description: 'URL of the created commit, when one was created.'
    value: ${{ steps.commit.outputs.commit_url }}
  outcome:
    description: 'committed; no_changes when the patch is empty; branch_moved when the patch or the branch no longer matches expected_head_sha, or the branch was deleted.'
    value: ${{ steps.commit.outputs.outcome }}

runs:
  using: 'composite'
  steps:
    # Validates every input before anything is downloaded, and creates a fresh directory under
    # RUNNER_TEMP, outside the checkout, for the artifact to land in.
    - name: Prepare
      id: prepare
      shell: bash
      env:
        INPUT_MODE: prepare
        INPUT_ARTIFACT_NAME: ${{ inputs.artifact_name }}
        INPUT_ALLOWED_PATHS: ${{ inputs.allowed_paths }}
        INPUT_ALLOW_WORKFLOW_CHANGES: ${{ inputs.allow_workflow_changes }}
        INPUT_ALLOW_BINARY: ${{ inputs.allow_binary }}
        INPUT_COMMIT_MESSAGE: ${{ inputs.commit_message }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        INPUT_EVENT_BRANCH: ${{ github.head_ref || github.ref_name }}
        INPUT_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        INPUT_MAX_PATCH_BYTES: ${{ inputs.max_patch_bytes }}
        INPUT_RUN_ID: ${{ inputs.run_id }}
      run: node "$GITHUB_ACTION_PATH/helper/dist/index.js"

    # By name. download-artifact extracts a single named artifact straight into the path. Prepare has
    # already checked that run_id is empty or a run ID, so exactly one of the two steps runs.
    - name: Download Patch
      if: inputs.run_id == ''
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ steps.prepare.outputs.directory }}

    # From another run of this repository, which goes through the REST API with the job token and so
    # needs actions: read. A workflow_run job uses it to commit what the pull_request run produced.
    - name: Download Patch From Run
      if: inputs.run_id != ''
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ steps.prepare.outputs.directory }}
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        run-id: ${{ inputs.run_id }}

    - name: Validate And Commit
      id: commit
      shell: bash
      env:
        INPUT_MODE: commit
        INPUT_ARTIFACT_NAME: ${{ inputs.artifact_name }}
        INPUT_DIRECTORY: ${{ steps.prepare.outputs.directory }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_ALLOWED_PATHS: ${{ inputs.allowed_paths }}
        INPUT_ALLOW_WORKFLOW_CHANGES: ${{ inputs.allow_workflow_changes }}
        INPUT_ALLOW_BINARY: ${{ inputs.allow_binary }}
        INPUT_COMMIT_MESSAGE: ${{ inputs.commit_message }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        INPUT_EVENT_BRANCH: ${{ github.head_ref || github.ref_name }}
        INPUT_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        INPUT_MAX_PATCH_BYTES: ${{ inputs.max_patch_bytes }}
        INPUT_RUN_ID: ${{ inputs.run_id }}
      run: node "$GITHUB_ACTION_PATH/helper/dist/index.js"
