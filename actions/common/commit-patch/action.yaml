name: 'Common Commit Patch'
description: 'Commits a common/create-patch artifact from the same run as a verified commit, refusing any path outside allowed_paths, under .github/workflows/ or below a symbolic link.'

inputs:
  token:
    description: 'Token for the commit: an App installation token with contents: write, and workflows: write only when allow_workflow_changes is true.'
    required: true
  artifact_name:
    description: 'Name of the artifact create-patch uploaded in this run.'
    required: true
  allowed_paths:
    description: 'Whitespace-separated globs every changed path must match. * and ? stay within a path segment, ** spans segments. A patch touching any other path fails the step and nothing is committed.'
    required: true
  allow_workflow_changes:
    description: 'Accept changes under .github/workflows/. Off, such a change fails the step even when allowed_paths matches it.'
    required: false
    default: 'false'
  allow_binary:
    description: 'Accept binary changes. Off, a binary hunk or new content git would treat as binary fails the step.'
    required: false
    default: 'false'
  commit_message:
    description: 'The commit message. The first line is the headline.'
    required: true
  repository:
    description: 'Repository to commit to, as owner/repo.'
    required: false
    default: ${{ github.repository }}
  branch:
    description: 'Branch to commit to.'
    required: false
    default: ${{ github.head_ref || github.ref_name }}
  expected_head_sha:
    description: 'The commit the branch must still point at, and the one the checkout must be at. A patch made from any other commit is skipped with a notice.'
    required: false
    default: ${{ github.event.pull_request.head.sha || github.sha }}
  max_patch_bytes:
    description: 'Largest patch accepted, in bytes. Keep it equal to max_patch_bytes on create-patch.'
    required: false
    default: '10485760'

outputs:
  changes_committed:
    description: 'true when a commit was created.'
    value: ${{ steps.commit.outputs.changes_committed }}
  commit_sha:
    description: 'SHA of the created commit, when one was created.'
    value: ${{ steps.commit.outputs.commit_sha }}
  commit_url:
    description: 'URL of the created commit, when one was created.'
    value: ${{ steps.commit.outputs.commit_url }}
  outcome:
    description: 'committed; no_changes when the patch is empty; branch_moved when the patch or the branch no longer matches expected_head_sha.'
    value: ${{ steps.commit.outputs.outcome }}

runs:
  using: 'composite'
  steps:
    # Validates every input before anything is downloaded, and creates a fresh directory under
    # RUNNER_TEMP, outside the checkout, for the artifact to land in.
    - name: Prepare
      id: prepare
      shell: bash
      env:
        INPUT_MODE: prepare
        INPUT_ARTIFACT_NAME: ${{ inputs.artifact_name }}
        INPUT_ALLOWED_PATHS: ${{ inputs.allowed_paths }}
        INPUT_ALLOW_WORKFLOW_CHANGES: ${{ inputs.allow_workflow_changes }}
        INPUT_ALLOW_BINARY: ${{ inputs.allow_binary }}
        INPUT_COMMIT_MESSAGE: ${{ inputs.commit_message }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        INPUT_MAX_PATCH_BYTES: ${{ inputs.max_patch_bytes }}
      run: node "$GITHUB_ACTION_PATH/helper/dist/index.js"

    # By name, from this run only. download-artifact extracts a single named artifact straight into
    # the path.
    - name: Download Patch
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ steps.prepare.outputs.directory }}

    - name: Validate And Commit
      id: commit
      shell: bash
      env:
        INPUT_MODE: commit
        INPUT_ARTIFACT_NAME: ${{ inputs.artifact_name }}
        INPUT_DIRECTORY: ${{ steps.prepare.outputs.directory }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_ALLOWED_PATHS: ${{ inputs.allowed_paths }}
        INPUT_ALLOW_WORKFLOW_CHANGES: ${{ inputs.allow_workflow_changes }}
        INPUT_ALLOW_BINARY: ${{ inputs.allow_binary }}
        INPUT_COMMIT_MESSAGE: ${{ inputs.commit_message }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        INPUT_MAX_PATCH_BYTES: ${{ inputs.max_patch_bytes }}
      run: node "$GITHUB_ACTION_PATH/helper/dist/index.js"
