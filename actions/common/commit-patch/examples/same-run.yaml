# The checkout is there for git's objects: the patch is applied on top of expected_head_sha and needs
# that commit's tree. Nothing in it is executed, and persist-credentials: false keeps the job token
# out of .git/config.
jobs:
  format:
    # ... runs the formatter, then common/create-patch with artifact_name: format-patch

  commit:
    needs: format
    runs-on: ubuntu-latest
    environment: ci
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          permission-contents: write
      - uses: TimSchoenle/actions/actions/common/commit-patch@54a4dc05fd351a9bf9e9638fa3ebbc572b5f2d7f # tag=actions-common-commit-patch-v3.1.2
        with:
          token: ${{ steps.token.outputs.token }}
          artifact_name: format-patch
          allowed_paths: 'src/** README.md'
          commit_message: 'style: auto-format code'
