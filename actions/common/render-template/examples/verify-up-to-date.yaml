# A CI gate: writes nothing and fails when README.md is missing or stale.
- uses: TimSchoenle/actions/actions/common/render-template@dc5b395636dc1954383f11af4062a08814e9b15a # tag=actions-common-render-template-v3.0.1
  with:
    template: docs/README.hbs
    output: README.md
    variables: ${{ steps.collect.outputs.data }}
    check: true
