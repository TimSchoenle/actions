name: 'Upsert PR Comment'
description: 'Posts a comment on a pull request, updating the previous comment carrying the same identifier.'

inputs:
  token:
    description: 'Token with pull-requests: write, used to list, create and update the comment.'
    required: true
  pr_url:
    description: 'URL of the pull request to comment on (e.g. "https://github.com/owner/repo/pull/123"). The default reads it from the pull_request event, so a pull_request-triggered workflow passes nothing; any other trigger has to supply it.'
    required: false
    default: ${{ github.event.pull_request.html_url }}
  identifier:
    description: 'Stable key naming this comment, e.g. "docker-image-size". One to 64 characters of letters, digits, ".", "_" and "-", starting with a letter or digit. It is written into the comment as a hidden marker, which is how a later run finds the comment to update. See identifier below.'
    required: true
  body:
    description: 'Markdown body of the comment. Exactly one of body, body_file or body_lines must be given.'
    required: false
    default: ''
  body_file:
    description: 'Path, relative to the workspace, of a file holding the markdown body. Prefer it for anything a build step generated. Exactly one of body, body_file or body_lines must be given.'
    required: false
    default: ''
  body_lines:
    description: 'Newline-separated markdown lines. Lines that are empty or whitespace are dropped; the rest are kept verbatim, in order. When no line survives, no comment is posted and operation is "skipped". Exactly one of body, body_file or body_lines must be given. See body_lines below.'
    required: false
    default: ''
  header:
    description: 'Markdown placed above the surviving body_lines, separated by one blank line. Only valid with body_lines.'
    required: false
    default: ''
  footer:
    description: 'Markdown placed below the surviving body_lines, separated by one blank line. Only valid with body_lines.'
    required: false
    default: ''
  update_existing:
    description: 'Update the previous comment carrying the identifier instead of adding one. When false, every run posts a new comment.'
    required: false
    default: 'true'
  create_new:
    description: 'Post a new comment when no comment carries the identifier. When false, the run only updates the existing comment, and when there is none it posts nothing and operation is "skipped". Use it to correct an earlier report without starting a new one where there was none, e.g. a "no longer applies" note. Cannot be false together with update_existing.'
    required: false
    default: 'true'
  author:
    description: 'Only update a comment posted by this login (e.g. "my-app[bot]"). Empty accepts any author: anyone who can comment can then paste the marker, and the run fails when GitHub refuses to edit their comment. Set it on a repository that takes pull requests from untrusted contributors.'
    required: false
    default: ''

outputs:
  comment_id:
    description: 'ID of the comment that was created or updated. Empty when operation is "skipped".'
  comment_url:
    description: 'URL of the comment that was created or updated. Empty when operation is "skipped".'
  operation:
    description: 'What the run did: "created", "updated", "unchanged", or "skipped" when nothing was posted: body_lines was set and no line survived, so no API call was made, or create_new was false and no comment it could update carries the identifier.'

runs:
  using: 'node24'
  main: 'dist/index.js'
