name: 'Common Create Patch Helper'
description: 'Internal to actions/common/create-patch, which runs this bundle with node before uploading the artifact. Not a public action: its inputs and outputs change without notice.'

inputs:
  artifact_name:
    description: 'Name of the artifact, also used as the directory the patch is written to.'
    required: true
  paths:
    description: 'Space- or newline-separated paths or globs scoping the patch. Empty or . takes the whole tree.'
    required: false
    default: '.'
  max_patch_bytes:
    description: 'Largest patch, in bytes, before the step fails.'
    required: false
    default: '10485760'

outputs:
  has_changes:
    description: 'true when the patch is non-empty.'
  base_sha:
    description: 'The commit the patch was computed against.'
  artifact_name:
    description: 'The validated artifact name.'
  directory:
    description: 'Directory holding the patch and its metadata, for upload-artifact.'

runs:
  using: 'node20'
  main: 'dist/index.js'
