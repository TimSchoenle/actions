name: 'Render Template And Commit'
description: 'Renders a Handlebars template to a file and commits the result as a verified bot commit, skipping the commit when the render changed nothing.'

inputs:
  template:
    description: 'Path to the template file'
    required: true
  output:
    description: 'Path of the file to write the rendered result to'
    required: true
  variables:
    description: 'Template variables as a JSON object. Must be strict JSON.'
    required: false
    default: '{}'
  partials-dir:
    description: 'Directory of reusable .hbs partials, registered under their path relative to it (e.g. tables/actions)'
    required: false
    default: ''
  strict:
    description: 'Fail on a reference the variables do not define, instead of rendering it as empty. A flag that is off must be declared as false, not omitted.'
    required: false
    default: 'true'
  escape-html:
    description: 'HTML-escape interpolated values. Off by default: the output is Markdown or config, not HTML.'
    required: false
    default: 'false'
  token:
    description: 'The GitHub token to commit with (must be an App installation token for verified commits)'
    required: true
  commit_message:
    description: 'The commit message'
    required: true
  repository:
    description: 'Repository name to commit to (e.g. owner/repo)'
    required: false
    default: ${{ github.repository }}
  branch:
    description: 'Branch to commit to'
    required: false
    default: ${{ github.head_ref || github.ref_name }}
  file_pattern:
    description: 'File pattern to commit. Defaults to the rendered output path alone, so an unrelated dirty file in the workspace cannot ride along in a documentation commit.'
    required: false
    default: ''

outputs:
  changed:
    description: 'Whether the rendered content differs from what was already at the output path'
    value: ${{ steps.render.outputs.changed }}
  checksum:
    description: 'SHA-256 of the rendered content, as lowercase hex'
    value: ${{ steps.render.outputs.checksum }}
  output-path:
    description: 'Path the rendered content was written to, as given'
    value: ${{ steps.render.outputs.output-path }}
  commit_hash:
    description: 'The SHA of the created commit. Empty when the render changed nothing and no commit was made.'
    value: ${{ steps.commit.outputs.commit_hash }}
  commit_url:
    description: 'The URL of the created commit. Empty when the render changed nothing and no commit was made.'
    value: ${{ steps.commit.outputs.commit_url }}
  changes_detected:
    description: 'True if changes were committed'
    # The commit step is skipped on an unchanged render, which leaves its outputs empty rather than
    # false; the fallback keeps this a boolean string for every caller.
    value: ${{ steps.commit.outputs.changes_detected || 'false' }}

runs:
  using: 'composite'
  steps:
    - name: Render Template
      id: render
      uses: TimSchoenle/actions/actions/common/render-template@20acce573f9c877343b3b422ef682c92af0a154f # tag=actions-common-render-template-v1.0.0
      with:
        template: ${{ inputs.template }}
        output: ${{ inputs.output }}
        variables: ${{ inputs.variables }}
        partials-dir: ${{ inputs.partials-dir }}
        strict: ${{ inputs.strict }}
        escape-html: ${{ inputs.escape-html }}

    - name: Commit Rendered File
      id: commit
      if: steps.render.outputs.changed == 'true'
      uses: TimSchoenle/actions/actions/common/commit-changes@990f592db0d2b0ebc3842d6bbf636a9a4638b070 # tag=actions-common-commit-changes-v1.2.1
      with:
        token: ${{ inputs.token }}
        commit_message: ${{ inputs.commit_message }}
        repository: ${{ inputs.repository }}
        branch: ${{ inputs.branch }}
        file_pattern: ${{ inputs.file_pattern || steps.render.outputs.output-path }}
