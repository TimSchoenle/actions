name: 'Render Template And Commit'
description: 'Renders a Handlebars template to a file and commits the result as a verified bot commit, skipping the commit when the render changed nothing.'

inputs:
  template:
    description: 'Path to the template file.'
    required: true
  output:
    description: 'Path of the file to write the rendered result to. Missing parent directories are created.'
    required: true
  variables:
    description: 'Template variables as a JSON object. Must be strict JSON, not YAML.'
    required: false
    default: '{}'
  partials-dir:
    description: 'Directory of reusable .hbs partials, registered under their path relative to it (e.g. tables/actions)'
    required: false
    default: ''
  strict:
    description: 'Fail on a reference the variables do not define, instead of rendering it as empty. A flag that is off must be declared as false, not omitted.'
    required: false
    default: 'true'
  escape-html:
    description: 'HTML-escape interpolated values. Off by default: the output is Markdown or config, not HTML.'
    required: false
    default: 'false'
  token:
    description: 'GitHub App installation token to commit with, with contents: write on the target repository. The default GITHUB_TOKEN produces an unverified commit and does not trigger downstream workflows.'
    required: true
  commit_message:
    description: 'The commit message.'
    required: true
  repository:
    description: 'Repository to commit to, as owner/repo.'
    required: false
    default: ${{ github.repository }}
  branch:
    description: 'Branch to commit to.'
    required: false
    default: ${{ github.head_ref || github.ref_name }}
  file_pattern:
    description: 'What to commit, in the pathspec syntax common/commit-changes accepts. Defaults to the rendered output path alone, so an unrelated dirty file in the workspace cannot ride along in a documentation commit. See file_pattern below.'
    required: false
    default: ''

outputs:
  changed:
    description: 'true when the rendered content differed from what was already at the output path. It describes the file on disk, not the branch.'
    value: ${{ steps.render.outputs.changed }}
  checksum:
    description: 'SHA-256 of the rendered content, as lowercase hex.'
    value: ${{ steps.render.outputs.checksum }}
  output-path:
    description: 'Path the rendered content was written to, as given.'
    value: ${{ steps.render.outputs.output-path }}
  commit_hash:
    description: 'The SHA of the created commit. Empty when the render changed nothing and no commit was made.'
    value: ${{ steps.commit.outputs.commit_hash }}
  commit_url:
    description: 'The URL of the created commit. Empty when the render changed nothing and no commit was made.'
    value: ${{ steps.commit.outputs.commit_url }}
  changes_detected:
    description: 'true when a commit was made, false otherwise. Never empty, even when the commit was skipped. It describes the branch, not the file on disk: a render that changed the workspace file but matched what was already committed on the branch reports changed true and changes_detected false.'
    # The commit step is skipped on an unchanged render, which leaves its outputs empty rather than
    # false; the fallback keeps this a boolean string for every caller.
    value: ${{ steps.commit.outputs.changes_detected || 'false' }}

runs:
  using: 'composite'
  steps:
    - name: Render Template
      id: render
      uses: TimSchoenle/actions/actions/common/render-template@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-render-template-v3.0.4
      with:
        template: ${{ inputs.template }}
        output: ${{ inputs.output }}
        variables: ${{ inputs.variables }}
        partials-dir: ${{ inputs.partials-dir }}
        strict: ${{ inputs.strict }}
        escape-html: ${{ inputs.escape-html }}

    - name: Commit Rendered File
      id: commit
      if: steps.render.outputs.changed == 'true'
      uses: TimSchoenle/actions/actions/common/commit-changes@49acdef9979f343817ec2a85ddd25e5f34befc8b # tag=actions-common-commit-changes-v3.1.0
      with:
        token: ${{ inputs.token }}
        commit_message: ${{ inputs.commit_message }}
        repository: ${{ inputs.repository }}
        branch: ${{ inputs.branch }}
        # The rendered path goes in as one literal pathspec: as a file_pattern it would be split on
        # whitespace, so an output path with a space committed nothing and raised no error.
        file_pattern: ${{ inputs.file_pattern }}
        literal_paths: ${{ inputs.file_pattern == '' && steps.render.outputs.output-path || '' }}
