name: 'Bun Setup-cached'
description: 'Sets up a pinned Bun and installs dependencies from the lockfile, with a node_modules cache that by
  default only trusted events write to.'

inputs:
  bun-version:
    description: 'The version of Bun to install (e.g. "1.3.0"). Takes precedence over bun-version-file. Empty reads the
      version from bun-version-file instead.'
    required: false
    default: ''
  bun-version-file:
    description: 'File to read the Bun version from, relative to the repository root: a file holding only the version
      (".bun-version"), ".tool-versions", or a package.json naming "bun@<version>" as its packageManager or setting
      engines.bun. Empty looks for .bun-version in working-directory, then a package.json there that names Bun, then
      .bun-version in the repository root. The step fails when no version can be read.'
    required: false
    default: ''
  working-directory:
    description: 'The working directory to run commands in.'
    required: false
    default: '.'
  cache-mode:
    description: 'What the step does with the node_modules cache. "read-write" restores it and saves it on a miss,
      "read-only" restores it and never saves, "none" neither restores nor saves. "auto" is "read-write" on push,
      schedule, workflow_dispatch and merge_group, and "read-only" on every other event, pull_request and
      pull_request_target among them. A restored cache is code the job runs: use "none" in any job that holds secrets,
      an App token or write permissions.'
    required: false
    default: 'auto'
  cache-key-prefix:
    description: 'Optional prefix for the cache key.'
    required: false
    default: ''

outputs:
  cache-hit:
    description: 'Whether node_modules was restored from an exact key match. Always "false" when the cache mode is
      "none".'
    value: ${{ steps.restore.outputs.cache-hit == 'true' }}
  cache-key:
    description: 'The cache key for this lockfile, also when the cache mode is "none".'
    value: ${{ steps.keys.outputs.key }}
  cache-mode:
    description: 'The cache mode the step ran with: "read-write", "read-only" or "none", with "auto" resolved.'
    value: ${{ steps.mode.outputs.value }}

runs:
  using: 'composite'
  steps:
    # A cache entry is shared by every later run that can read its scope, and any job that runs code
    # can save one, so a job running untrusted code must not decide what a later job restores. The
    # allowlist holds the events whose code is already on a ref a maintainer pushed or dispatched;
    # anything else (pull_request_target, workflow_run, issue_comment, ...) only reads.
    - name: Resolve Cache Mode
      id: mode
      shell: bash
      env:
        CACHE_MODE: ${{ inputs.cache-mode }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        set -euo pipefail

        case "$CACHE_MODE" in
          read-write | read-only | none)
            mode=$CACHE_MODE
            ;;
          auto)
            case "$EVENT_NAME" in
              push | schedule | workflow_dispatch | merge_group) mode=read-write ;;
              *) mode=read-only ;;
            esac
            ;;
          *)
            echo "::error title=Invalid input::cache-mode must be one of auto, read-write, read-only or none."
            exit 1
            ;;
        esac

        if [[ "$mode" == read-write && "$EVENT_NAME" == pull_request_target ]]; then
          echo "::warning title=Cache poisoning::cache-mode is read-write on pull_request_target, whose cache entries every run on the base branch restores."
        fi

        echo "Cache mode: ${mode} (requested ${CACHE_MODE}, event ${EVENT_NAME})."
        echo "value=${mode}" >> "$GITHUB_OUTPUT"

    # setup-bun installs the latest release when bun-version is empty and the version file is
    # missing or yields nothing, so a job would silently float to an unreviewed Bun. The version is
    # resolved here instead, and the step fails when there is none.
    - name: Resolve Bun Version
      id: version
      shell: bash
      env:
        BUN_VERSION: ${{ inputs.bun-version }}
        BUN_VERSION_FILE: ${{ inputs.bun-version-file }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail

        fail() {
          echo "::error title=Bun version not resolved::$1"
          exit 1
        }

        # Prints the version a file names, or nothing when it names none. Fails only when the file
        # cannot be read, so callers report that with `|| fail`.
        read_version() {
          local file=$1
          case "$(basename -- "$file")" in
            package.json)
              command -v jq >/dev/null || return 1
              jq -r '
                if ((.packageManager // "") | startswith("bun@"))
                then .packageManager | ltrimstr("bun@") | split("+")[0]
                else (.engines.bun // "") end' -- "$file"
              ;;
            .tool-versions)
              awk '$1 == "bun" { print $2; exit }' "$file"
              ;;
            *)
              head -n 1 -- "$file" | tr -d '[:space:]'
              ;;
          esac
        }

        version=''
        if [[ -n "$BUN_VERSION" ]]; then
          version=$BUN_VERSION
          source='the bun-version input'
        elif [[ -n "$BUN_VERSION_FILE" ]]; then
          [[ -f "$BUN_VERSION_FILE" ]] || fail "bun-version-file '${BUN_VERSION_FILE}' does not exist."
          source=$BUN_VERSION_FILE
          version=$(read_version "$BUN_VERSION_FILE") || fail "Could not read ${source} (a package.json also needs jq)."
          [[ -n "$version" ]] || fail "${source} does not name a Bun version."
        else
          for candidate in "${WORKING_DIRECTORY}/.bun-version" "${WORKING_DIRECTORY}/package.json" ./.bun-version; do
            [[ -f "$candidate" ]] || continue
            version=$(read_version "$candidate") || fail "Could not read ${candidate} (a package.json also needs jq)."
            if [[ -n "$version" ]]; then
              source=$candidate
              break
            fi
          done
          [[ -n "$version" ]] || fail "Neither bun-version nor bun-version-file is set, and no .bun-version or package.json naming Bun was found in ${WORKING_DIRECTORY} or the repository root."
        fi

        # A version, range or tag on one line. The rejected value is not echoed: it may come from a
        # file the pull request changed, and text in it could be read as a workflow command.
        pattern='^[A-Za-z0-9.+^~<>=*| _-]+$'
        [[ "$version" =~ $pattern ]] || fail "${source} does not hold a valid Bun version."

        echo "Bun ${version}, from ${source}."
        echo "value=${version}" >> "$GITHUB_OUTPUT"

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ steps.version.outputs.value }}

    # The `v2` segment keeps this release from restoring entries that earlier releases saved from
    # any event, pull_request_target among them. The architecture is part of the key because
    # node_modules holds native binaries.
    - name: Compute Cache Key
      id: keys
      shell: bash
      env:
        CACHE_KEY: ${{ inputs.cache-key-prefix }}bun-modules-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/bun.lock', inputs.working-directory)) }}
      run: echo "key=$CACHE_KEY" >> "$GITHUB_OUTPUT"

    - name: Restore node_modules Cache
      id: restore
      if: steps.mode.outputs.value != 'none'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ inputs.working-directory }}/node_modules
        key: ${{ steps.keys.outputs.key }}

    # Always run, also on a hit: the install fails when node_modules or the lockfile disagree with
    # package.json, which is the check that a restored cache still matches this checkout.
    - name: Install Dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bun install --frozen-lockfile

    - name: Save node_modules Cache
      if: steps.mode.outputs.value == 'read-write' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ inputs.working-directory }}/node_modules
        key: ${{ steps.keys.outputs.key }}
