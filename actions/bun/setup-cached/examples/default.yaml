# With no inputs the Bun version comes from .bun-version, and the cache is written only on trusted
# events (see Cache modes below).
- name: Check out the repository
  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  with:
    persist-credentials: false

- name: Setup Bun
  uses: TimSchoenle/actions/actions/bun/setup-cached@6a49261c7bbd756b4ceca9b1c168dfc7dc095e64 # tag=actions-bun-setup-cached-v3.0.0
