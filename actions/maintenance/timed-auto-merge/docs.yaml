permissions:
  - scope: contents
    access: write
    when: always
    token: token
  - scope: pull-requests
    access: write
    when: always
    token: token

egress:
  - endpoint: api.github.com:443
    for: the REST and GraphQL calls that list, review, auto-merge and merge pull requests

examples:
  - title: Merge release pull requests a day after their newest commit
    file: examples/scheduled-release-merge.yaml
