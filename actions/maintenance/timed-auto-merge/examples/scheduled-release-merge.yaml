name: Timed Auto-merge

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      time_elapsed:
        description: 'Soak time since the pull request was opened and since its newest commit (e.g. "24h", "2d").'
        required: false
        default: '1d'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  timed-auto-merge:
    name: Timed Auto-merge
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # A second App: the one release-please or Renovate runs as cannot approve its own pull requests.
      - name: Generate Bot Token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTO_MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_MERGE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Approve and Auto-merge
        uses: TimSchoenle/actions/actions/maintenance/timed-auto-merge@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-maintenance-timed-auto-merge-v2.0.5
        with:
          token: ${{ steps.token.outputs.token }}
          # Database ID of the bot account that opens the release pull requests.
          trusted_authors: '123456789'
          base_branch: main
          branch_pattern: 'release-please--branches--%'
          time_elapsed: ${{ inputs.time_elapsed || '1d' }}
          minimum_age: '1h'
          merge_method: squash
