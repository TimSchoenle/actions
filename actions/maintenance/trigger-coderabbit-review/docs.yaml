permissions:
  - scope: pull-requests
    access: write
    when: always
    token: token

egress:
  - endpoint: api.github.com:443
    for: the REST calls that check the token, read the pull request and post the comment

examples:
  - title: Review after the Generate workflow (.github/workflows/coderabbit-review.yaml)
    file: examples/coderabbit-review.yaml
  - title: Or review after a request workflow (.github/workflows/coderabbit-review.yaml)
    file: examples/coderabbit-review-request.yaml
