permissions:
  - scope: pull-requests
    access: write
    when: always
    token: token

egress:
  - endpoint: api.github.com:443
    for: the REST calls that check the token, read the pull request and post the comment

examples:
  - title: Post the review command from the default branch (.github/workflows/coderabbit-review.yaml)
    file: examples/coderabbit-review.yaml
