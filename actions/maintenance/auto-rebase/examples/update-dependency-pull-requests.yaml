name: Auto Rebase Dependencies

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  auto-rebase:
    name: Auto Rebase
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # An app token, so the pushed merge commits start workflows. github.token's would not.
      - name: Generate Token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.MAINTENANCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: TimSchoenle/actions/actions/maintenance/auto-rebase@e75e9ab1e1e9fa573051a901347e39ba23a45710 # tag=actions-maintenance-auto-rebase-v4.0.0
        with:
          token: ${{ steps.token.outputs.token }}
          label: dependencies
