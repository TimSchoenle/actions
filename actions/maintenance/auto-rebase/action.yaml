name: 'Maintenance Auto-rebase'
description: 'Updates open pull requests carrying a label with the latest commits of their base branch, oldest first, through the update-branch API, which merges the base into the head.'

inputs:
  token:
    description: 'GitHub token with contents: write and pull-requests: write on the repository. A pushed update only triggers workflows when the token is not github.token.'
    required: true
  label:
    description: 'Label that marks a pull request for updating. Compared case-insensitively, as GitHub compares label names: a repository cannot hold both `Dependencies` and `dependencies`.'
    required: true
  repository:
    description: 'Repository whose pull requests are updated, in owner/repo format.'
    required: false
    default: ${{ github.repository }}
  skip_drafts:
    description: 'Leave draft pull requests alone even when they carry the label.'
    required: false
    default: 'false'
  only_auto_merge:
    description: 'Leave pull requests alone unless auto-merge is on for them. With `limit`, this keeps the slots for pull requests that merge on their own once they are current.'
    required: false
    default: 'false'
  limit:
    description: 'How many of the oldest qualifying pull requests to bring up to date, as a positive whole number. A pull request takes a slot when it is updated or already up to date; skipped and rejected ones do not. Empty means no limit. Under a ruleset that requires up-to-date branches only one pull request can merge next, so `1` updates that one instead of re-running CI on every other.'
    required: false
    default: ''
  fail_on_error:
    description: 'Fail the step when a pull request could not be updated for a reason other than GitHub rejecting the update (a merge conflict, a moved head). `false` logs a warning instead. Those rejections are always warnings. See Failures below.'
    required: false
    default: 'true'

outputs:
  updated:
    description: 'JSON array of the pull request numbers an update was requested for, for `fromJSON()` in a later step.'
  skipped:
    description: 'JSON array of the pull request numbers left alone: closed, unlabelled, draft, auto-merge off under `only_auto_merge`, reported as conflicting, beyond `limit`, already up to date, or on a fork the token cannot write to. The job log and summary give the reason for each.'
  failed:
    description: 'JSON array of the pull request numbers whose update GitHub rejected or that failed with an unexpected error.'

runs:
  using: 'node24'
  main: 'dist/index.js'
