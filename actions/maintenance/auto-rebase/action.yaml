name: 'Maintenance Auto-rebase'
description: 'Updates every open pull request carrying a label with the latest commits of its base branch, through the update-branch API, which merges the base into the head.'

inputs:
  token:
    description: 'GitHub token with contents: write and pull-requests: write on the repository. A pushed update only triggers workflows when the token is not github.token.'
    required: true
  label:
    description: 'Label that marks a pull request for updating, compared case-insensitively.'
    required: true
  repository:
    description: 'Repository whose pull requests are updated, in owner/repo format.'
    required: false
    default: ${{ github.repository }}
  skip_drafts:
    description: 'Leave draft pull requests alone even when they carry the label.'
    required: false
    default: 'false'
  fail_on_error:
    description: 'Fail the step when a pull request could not be updated for a reason other than GitHub rejecting the update (a merge conflict, a moved head). Those rejections are always warnings.'
    required: false
    default: 'true'

outputs:
  updated:
    description: 'JSON array of the pull request numbers an update was requested for.'
  skipped:
    description: 'JSON array of the pull request numbers left alone: closed, unlabelled, draft, already up to date, or on a fork the token cannot write to.'
  failed:
    description: 'JSON array of the pull request numbers whose update failed or was rejected.'

runs:
  using: 'node20'
  main: 'dist/index.js'
