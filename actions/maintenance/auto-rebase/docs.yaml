permissions:
  - scope: contents
    access: write
    when: always
    token: token
  - scope: pull-requests
    access: write
    when: always
    token: token

egress:
  - endpoint: api.github.com:443
    for: the GraphQL query that lists pull requests and the REST calls that read, compare and update them

examples:
  - title: Update dependency pull requests on every push to main
    file: examples/update-dependency-pull-requests.yaml
