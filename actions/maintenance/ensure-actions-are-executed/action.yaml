name: 'Maintenance Ensure-actions-are-executed'
description: 'Ensures selected checks completed successfully when they were started.'

inputs:
  token:
    description: 'GitHub token with checks:read permission.'
    required: true
  checks:
    description: 'List of checks to verify. One pattern per line.'
    required: true
  required:
    description: 'Checks that must have a run, one pattern per line, read like checks. A pattern that matches no check run fails verification instead of counting as not started, which keeps the gate from passing before a check was created. The runs it matches are verified like those of checks. Empty requires none.'
    required: false
    default: ''
  match_mode:
    description: 'How to interpret each check matcher: exact, regex, or auto (/regex/ => regex, otherwise exact).'
    required: false
    default: 'auto'
  repository:
    description: 'Repository to inspect in owner/repo format.'
    required: false
    default: ${{ github.repository }}
  ref:
    description: 'Git reference (usually SHA) to inspect.'
    required: false
    default: ${{ github.event.pull_request.head.sha || github.sha }}
  error_on_failure:
    description: 'Whether to fail this action if matched checks failed verification.'
    required: false
    default: 'true'

outputs:
  matched_checks_count:
    description: 'How many check runs matched at least one matcher. Runs that share a name but come from different check suites or apps count separately; re-runs within one suite count once.'
  failed_checks_count:
    description: 'How many matched check runs failed verification, plus how many required patterns matched no check run.'

runs:
  using: 'node24'
  main: 'dist/index.js'
