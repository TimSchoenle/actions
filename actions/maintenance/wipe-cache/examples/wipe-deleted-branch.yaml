name: Cleanup Branch Caches

on:
  delete:

permissions: {}

jobs:
  wipe-cache:
    name: Wipe Cache
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      actions: write # to list and delete caches
    steps:
      - uses: TimSchoenle/actions/actions/maintenance/wipe-cache@main
        with:
          token: ${{ github.token }}
