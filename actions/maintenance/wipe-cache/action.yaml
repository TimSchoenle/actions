name: 'Maintenance Wipe-cache'
description: 'Deletes every GitHub Actions cache entry recorded for one branch. Refuses the default branch unless allow_default_branch is true.'

inputs:
  token:
    description: 'GitHub token with actions: write. In a workflow that runs on the repository itself, github.token is enough.'
    required: true
  repository:
    description: 'Repository whose caches are deleted, in owner/repo format.'
    required: false
    default: ${{ github.repository }}
  branch:
    description: 'Branch whose caches are deleted, as a name (feature/x) or a full ref (refs/heads/feature/x). Empty takes the deleted branch of a delete event; any other trigger must set it.'
    required: false
    default: ''
  allow_default_branch:
    description: 'Allow wiping the caches of the repository default branch. Off by default, because every other branch restores from those entries.'
    required: false
    default: 'false'
  dry_run:
    description: 'List the cache entries that would be deleted without deleting any.'
    required: false
    default: 'false'
  fail_on_error:
    description: 'Fail the step when any cache entry could not be deleted. When false, the failures are reported as warnings and in failed_count.'
    required: false
    default: 'true'

outputs:
  matched_count:
    description: 'How many distinct cache entries were found for the branch, across every listing round.'
  deleted_count:
    description: 'How many cache entries this run deleted. Always 0 on a dry run.'
  failed_count:
    description: 'How many cache entries could not be deleted.'

runs:
  using: 'node20'
  main: 'dist/index.js'
