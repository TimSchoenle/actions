name: 'Terrace Helm Diff'
description:
  'Reports how the vendored configuration contracts changed against a base revision and what each change costs the
  charts, with terrace-contract diff. The report goes to the job summary and, given a token, into one pull request
  comment that later runs update. Never fails on differences.'

inputs:
  version:
    description: 'terrace-contract release to install, as for terrace/setup: MAJOR.MINOR.PATCH or MAJOR.MINOR. Empty
      reads the cli pin from terrace.yaml in working_directory.'
    required: false
    default: ''
  working_directory:
    description: 'Directory to run in, relative to the workspace: the root of the chart repository, where terrace.yaml
      is.'
    required: false
    default: '.'
  since:
    description: 'Revision to compare against. Read with git show, so check out with fetch-depth 0.'
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  chart:
    description: 'Only this chart, by directory name. Empty compares every chart.'
    required: false
    default: ''
  token:
    description: 'Token with pull-requests write access, for the pull request comment. Empty posts no comment. The
      comment is posted when a contract changed, and an existing one is corrected when none does any more; a pull
      request that never changed a contract gets no comment.'
    required: false
    default: ''
  comment_author:
    description: 'Only update a comment posted by this login, as for the author input of common/upsert-pr-comment,
      e.g. "github-actions[bot]" when token is the job token. Empty accepts any author, so anyone who can comment can
      paste the marker and make a later run fail when GitHub refuses to edit their comment. Set it on a repository
      that takes pull requests from untrusted contributors.'
    required: false
    default: ''
  comment_identifier:
    description: 'Identifier of the pull request comment, as for common/upsert-pr-comment. Change it only to run
      this action twice on one pull request.'
    required: false
    default: 'terrace-contract-diff'
  github_token:
    description: 'Token terrace/setup lists terrace-contract releases with, needed only when the version is a
      MAJOR.MINOR line. Defaults to the job token on github.com and to empty elsewhere.'
    required: false
    default: ${{ github.server_url == 'https://github.com' && github.token || '' }}

outputs:
  changed:
    description: '"true" when a vendored contract differs from the base revision, else "false".'
    value: ${{ steps.diff.outputs.changed }}
  report:
    description: 'Path of the plain-text report, for a later step to read.'
    value: ${{ steps.diff.outputs.report }}

runs:
  using: 'composite'
  steps:
    - name: Install terrace-contract
      id: setup
      uses: TimSchoenle/actions/actions/terrace/setup@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-terrace-setup-v1.1.0
      with:
        version: ${{ inputs.version }}
        working_directory: ${{ inputs.working_directory }}
        github_token: ${{ inputs.github_token }}

    # `--exit-code` turns "differences" into exit 2, so the step can tell a changed contract from an
    # identical one without parsing the report, and from 1, a contract that could not be read, which
    # fails the step.
    - name: Compare contracts against the base
      id: diff
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        SINCE: ${{ inputs.since }}
        CHART: ${{ inputs.chart }}
      run: |
        set -euo pipefail

        if [[ -z "$SINCE" ]]; then
          echo "::error::since is empty: name the revision to compare against"
          exit 1
        fi

        # A file of its own per run, so a second call in the same job cannot overwrite the report the
        # first one's `report` output still points at.
        report="$(mktemp "${RUNNER_TEMP}/terrace-contract-diff.XXXXXX")"

        args=(diff --since "$SINCE" --exit-code)
        if [[ -n "$CHART" ]]; then
          args+=(-- "$CHART")
        fi

        status=0
        terrace-contract "${args[@]}" > "$report" || status=$?
        cat "$report"
        case "$status" in
          0) changed=false ;;
          2) changed=true ;;
          *) exit "$status" ;;
        esac

        # HTML-escaped inside <pre> rather than fenced: a fence can be closed by the text it holds,
        # and contract messages quote whatever a producer wrote.
        escaped="$(sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' "$report")"
        head_sha="$(git rev-parse --short HEAD)"
        base_sha="$(git rev-parse --short "$SINCE")"

        if [[ "$changed" == true ]]; then
          summary="$(printf '### Configuration contract changes\n\nAgainst `%s`, at `%s`.\n\n<pre>\n%s\n</pre>\n' \
            "$base_sha" "$head_sha" "$escaped")"
          # GitHub refuses a comment over 65536 characters, so a report that would not fit is cut at
          # the last whole line under the limit, which no escape sequence spans. The job summary
          # keeps all of it.
          if (( ${#summary} > 60000 )); then
            cut="$(awk -v max=58000 '{ n += length($0) + 1; if (n > max) exit; print }' <<< "$escaped")"
            body="$(printf '### Configuration contract changes\n\nAgainst `%s`, at `%s`.\n\n<pre>\n%s\n</pre>\n\nThe report is cut short here; the job summary of this run holds all of it.\n' \
              "$base_sha" "$head_sha" "$cut")"
          else
            body="$summary"
          fi
        else
          # The comment only ever corrects an earlier one, so it says what changed since then.
          body="$(printf '### Configuration contract changes\n\nNo vendored configuration contract differs from `%s` any more, at `%s`.\n' \
            "$base_sha" "$head_sha")"
          summary="$(printf '### Configuration contract changes\n\nNo vendored configuration contract differs from `%s`.\n' \
            "$base_sha")"
        fi
        printf '%s\n' "$summary" >> "$GITHUB_STEP_SUMMARY"

        # A random delimiter, so no line of the report can end the value early and write an output
        # of its own.
        delimiter="terrace_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
        {
          echo "changed=${changed}"
          echo "report=${report}"
          echo "comment<<${delimiter}"
          printf '%s\n' "$body"
          echo "${delimiter}"
        } >> "$GITHUB_OUTPUT"

    - name: Comment on the pull request
      if: inputs.token != '' && github.event.pull_request.html_url != ''
      uses: TimSchoenle/actions/actions/common/upsert-pr-comment@9414b1c665d3676efe832978d4e1728cf53119fd # tag=actions-common-upsert-pr-comment-v1.3.0
      with:
        token: ${{ inputs.token }}
        identifier: ${{ inputs.comment_identifier }}
        body: ${{ steps.diff.outputs.comment }}
        create_new: ${{ steps.diff.outputs.changed }}
        author: ${{ inputs.comment_author }}
