name: 'Terrace Setup'
description:
  'Installs a signature-verified terrace-contract release on PATH, together with cosign and, when asked, oras.
  The version comes from the version input or from the cli pin in terrace.yaml.'

inputs:
  version:
    description: 'terrace-contract release to install: an exact MAJOR.MINOR.PATCH, or MAJOR.MINOR for the newest
      patch release of that line. Empty reads the cli pin from terrace.yaml in working_directory, with the same meaning.
      An exact version is what makes a run reproducible.'
    required: false
    default: ''
  working_directory:
    description: 'Directory holding terrace.yaml, relative to the workspace. Read only when version is empty.'
    required: false
    default: '.'
  oras:
    description: 'Also install oras, which terrace-contract pull needs to fetch contracts from a registry.'
    required: false
    default: 'false'
  cosign_version:
    description: 'cosign release to install, as vMAJOR.MINOR.PATCH. It is installed even when another cosign is
      on PATH, so the verification this action runs does not depend on the runner image. cosign verifies the
      terrace-contract release here and image signatures in terrace-contract pull.'
    required: false
    # renovate: datasource=github-releases depName=sigstore/cosign
    default: 'v3.1.3'
  oras_version:
    description: 'oras release to install when oras is true, as MAJOR.MINOR.PATCH without a leading v.'
    required: false
    # renovate: datasource=github-releases depName=oras-project/oras extractVersion=^v(?<version>.*)$
    default: '1.3.5'
  github_token:
    description: 'Token for listing terrace-contract releases on api.github.com, needed only when the version is a
      MAJOR.MINOR line. Defaults to the job token on github.com and to empty elsewhere, because a GitHub Enterprise
      Server token is not a github.com credential and must not be sent there. Unauthenticated listing works but
      shares a low per-IP rate limit.'
    required: false
    default: ${{ github.server_url == 'https://github.com' && github.token || '' }}

outputs:
  version:
    description: 'The terrace-contract release installed, as MAJOR.MINOR.PATCH.'
  path:
    description: 'Absolute path of the installed terrace-contract binary.'
  cosign_path:
    description: 'Absolute path of the cosign binary on PATH.'
  oras_path:
    description: 'Absolute path of the oras binary on PATH. Empty unless oras was requested.'

runs:
  using: 'node20'
  main: 'dist/index.js'
