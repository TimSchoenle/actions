# Jobs appended verbatim to the generated workflow for this action.
#
# These cannot become end-to-end cases: they install real releases, on every operating system and
# architecture terrace-contract publishes for, and the generated job runs on one Linux runner with
# an allowlist that reaches neither the release downloads nor the Sigstore trust root cosign
# verifies against. Every refusal the action makes before downloading is covered by
# e2e/setup.e2e.test.ts.
#
# Egress is blocked to the hosts an install needs: the GitHub API for the release listing, github.com
# and the two hosts its release downloads redirect to, and Sigstore's TUF CDN, where cosign fetches
# the trust root it verifies the checksum list against. The bundle carries its transparency log
# entry, so Rekor itself is never contacted. harden-runner enforces this on the Linux runners only.
#
# `uses: pinned:<key>` names an entry of PINNED in scripts/lib/e2e-workflow.ts and is substituted on
# the way in.

install-exact:
  name: 'Install an exact release (${{ matrix.os }})'
  runs-on: ${{ matrix.os }}
  permissions:
    contents: read # to fetch code
  strategy:
    fail-fast: false
    matrix:
      os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
  env:
    # Any published release works; 0.8.0 is the first that reads terrace.yaml.
    TERRACE_VERSION: '0.8.0'
  steps:
    - name: Harden Runner
      uses: pinned:hardenRunner
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          tuf-repo-cdn.sigstore.dev:443

    - name: Checkout
      uses: pinned:checkout
      with:
        persist-credentials: false

    - name: Install
      id: setup
      uses: ./actions/terrace/setup # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
      with:
        version: ${{ env.TERRACE_VERSION }}
        oras: 'true'

    - name: Verify the tools are on PATH and match the outputs
      shell: bash
      env:
        VERSION: ${{ steps.setup.outputs.version }}
        TERRACE_PATH: ${{ steps.setup.outputs.path }}
        COSIGN_PATH: ${{ steps.setup.outputs.cosign_path }}
        ORAS_PATH: ${{ steps.setup.outputs.oras_path }}
      run: |
        set -euo pipefail
        test "$VERSION" = "$TERRACE_VERSION"
        for file in "$TERRACE_PATH" "$COSIGN_PATH" "$ORAS_PATH"; do
          test -f "$file" || { echo "::error::$file is missing"; exit 1; }
        done
        terrace-contract --version | grep -F "$TERRACE_VERSION"
        cosign version
        oras version

install-from-terrace-yaml:
  name: Install the cli pin from terrace.yaml
  runs-on: ubuntu-latest
  permissions:
    contents: read # to fetch code, and to list terrace-contract releases
  steps:
    - name: Harden Runner
      uses: pinned:hardenRunner
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          tuf-repo-cdn.sigstore.dev:443

    - name: Checkout
      uses: pinned:checkout
      with:
        persist-credentials: false

    - name: Write terrace.yaml
      run: |
        set -euo pipefail
        mkdir -p fixture
        printf 'version: 1\ncli: "0.8"\n' > fixture/terrace.yaml

    - name: Install
      id: setup
      uses: ./actions/terrace/setup # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
      with:
        working_directory: fixture

    - name: Verify the release is on the pinned line and reads the file
      working-directory: fixture
      env:
        VERSION: ${{ steps.setup.outputs.version }}
        ORAS_PATH: ${{ steps.setup.outputs.oras_path }}
      run: |
        set -euo pipefail
        case "$VERSION" in 0.8.*) ;; *) echo "::error::$VERSION is not a 0.8 release"; exit 1;; esac
        test -z "$ORAS_PATH"
        terrace-contract --config terrace.yaml config show

install-unpublished:
  name: An unpublished release fails the step
  runs-on: ubuntu-latest
  permissions:
    contents: read # to fetch code
  steps:
    - name: Harden Runner
      uses: pinned:hardenRunner
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          tuf-repo-cdn.sigstore.dev:443

    - name: Checkout
      uses: pinned:checkout
      with:
        persist-credentials: false

    - name: Install
      id: setup
      continue-on-error: true
      uses: ./actions/terrace/setup # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
      with:
        version: '0.0.999'

    - name: Verify the step failed and put nothing on PATH
      env:
        OUTCOME: ${{ steps.setup.outcome }}
        TERRACE_PATH: ${{ steps.setup.outputs.path }}
      run: |
        set -euo pipefail
        test "$OUTCOME" = failure
        test -z "$TERRACE_PATH"
