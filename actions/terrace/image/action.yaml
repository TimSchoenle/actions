name: 'Terrace Image'
description:
  'Holds a service image to the configuration contract its build produced, in any language: the document against
  the specification, the committed document against its generator, the Dockerfile label block against the document,
  and the built image itself, read through oras. Optionally attaches the document to the image digest and signs it.'

inputs:
  version:
    description: 'terrace-contract release to install, as for terrace/setup: MAJOR.MINOR.PATCH or MAJOR.MINOR. Empty
      reads the cli pin from terrace.yaml in working_directory. Needs 0.12 or newer.'
    required: false
    default: ''
  working_directory:
    description: 'Directory to run in, relative to the workspace. Every other path is relative to it.'
    required: false
    default: '.'
  contract:
    description: 'The contract document the build produced, or the committed one that generate is held to.'
    required: true
  generate:
    description: 'A command, run with bash in working_directory, that prints the contract document to stdout from the
      configuration types: `cargo run -q --example contract -- --format contract`, `java -cp ... ContractMain`, or
      any other language. When set, the step fails unless its output is the committed contract byte for byte. Empty
      skips that check and takes contract as given, for a build that writes the document itself.'
    required: false
    default: ''
  tier:
    description: 'Conformance tier the document is held to: 1 (document), 2 (dialect) or 3 (byte). Claim the one the
      producer meets.'
    required: false
    default: '1'
  dockerfile:
    description: 'Dockerfiles whose committed label region must match the document, separated by newlines. Empty
      skips the check.'
    required: false
    default: ''
  image:
    description: 'The built image, fully qualified: REGISTRY/REPOSITORY[:TAG][@DIGEST], or PATH[:TAG][@DIGEST] with
      oci_layout. Its labels, the file at path inside it and any attached referrer must all carry this document. Empty
      checks only the document and the Dockerfiles.'
    required: false
    default: ''
  oci_layout:
    description: 'Read image as an OCI image layout, a directory or a tarball, rather than from a registry: the image
      is checked after it is built and before it is pushed. A layout carries no signature, so it cannot be combined
      with signer or sign, and attach needs a directory.'
    required: false
    default: 'false'
  path:
    description: 'Where the document lives inside the image, which is also what its path label must say.'
    required: false
    default: '/config/contract.json'
  attach:
    description: 'Attach the document to the image digest as an OCI referrer before the image is verified, so the
      verification covers what was attached. Safe to repeat: a referrer holding this document is kept, one holding
      another is refused. Needs write access to the registry.'
    required: false
    default: 'false'
  sign:
    description: "Sign the attached referrer keyless with cosign, under the job's GitHub Actions OIDC identity. Needs
      attach, a registry image and the id-token: write permission."
    required: false
    default: 'false'
  signer:
    description: 'Also verify the image signature, keyless, against this identity regular expression, before anything
      else is read. Empty skips signature verification.'
    required: false
    default: ''
  github_token:
    description: 'Token terrace/setup lists terrace-contract releases with, needed only when the version is a
      MAJOR.MINOR line. Defaults to the job token on github.com and to empty elsewhere.'
    required: false
    default: ${{ github.server_url == 'https://github.com' && github.token || '' }}

outputs:
  version:
    description: 'The terrace-contract version that ran.'
    value: ${{ steps.setup.outputs.version }}
  referrer:
    description: 'Digest of the referrer that carries the document, when attach is true. Empty otherwise.'
    value: ${{ steps.attach.outputs.referrer }}

runs:
  using: 'composite'
  steps:
    # Refuse a combination that cannot work before anything is installed, so a misconfigured job
    # fails in seconds and says why.
    - name: Check inputs
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        OCI_LAYOUT: ${{ inputs.oci_layout }}
        ATTACH: ${{ inputs.attach }}
        SIGN: ${{ inputs.sign }}
        SIGNER: ${{ inputs.signer }}
        TIER: ${{ inputs.tier }}
      run: |
        set -euo pipefail

        fail() { echo "::error::$1"; exit 1; }
        for flag in OCI_LAYOUT ATTACH SIGN; do
          case "${!flag}" in true | false) ;; *) fail "${flag,,} must be true or false, not '${!flag}'";; esac
        done
        case "$TIER" in 1 | 2 | 3) ;; *) fail "tier must be 1, 2 or 3, not '$TIER'";; esac

        if [[ -z "$IMAGE" ]]; then
          [[ "$OCI_LAYOUT" == false && "$ATTACH" == false && "$SIGN" == false && -z "$SIGNER" ]] \
            || fail "oci_layout, attach, sign and signer all need an image"
        fi
        if [[ "$OCI_LAYOUT" == true ]]; then
          [[ "$SIGN" == false && -z "$SIGNER" ]] || fail "an OCI layout carries no signature: drop sign and signer"
        fi
        if [[ "$SIGN" == true && "$ATTACH" == false ]]; then
          fail "sign signs the referrer attach writes: set attach too"
        fi

    - name: Install terrace-contract
      id: setup
      uses: TimSchoenle/actions/actions/terrace/setup@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-terrace-setup-v1.1.0
      with:
        version: ${{ inputs.version }}
        working_directory: ${{ inputs.working_directory }}
        oras: ${{ inputs.image != '' }}
        github_token: ${{ inputs.github_token }}

    # Every input reaches the shell through the environment and an array, so no path is ever
    # expanded or word-split as code. `generate` is the one input run as a command, by design: it
    # is the job's own build step, written by the same author as the rest of the workflow.
    - name: Check the document
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        CONTRACT: ${{ inputs.contract }}
        GENERATE: ${{ inputs.generate }}
        TIER: ${{ inputs.tier }}
        DOCKERFILES: ${{ inputs.dockerfile }}
        CONTRACT_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail

        if ! terrace-contract image attach --help >/dev/null 2>&1; then
          echo "::error::terrace-contract $(terrace-contract --version) cannot read an image; pin 0.12 or newer"
          exit 1
        fi

        failed=0
        if [[ -n "$GENERATE" ]]; then
          generated="$(mktemp)"
          trap 'rm -f "$generated"' EXIT
          bash -euo pipefail -c "$GENERATE" > "$generated"
          [[ -s "$generated" ]] || { echo "::error::generate printed nothing"; exit 1; }
          if [[ ! -f "$CONTRACT" ]]; then
            echo "::error file=${CONTRACT}::the committed contract does not exist; write what generate prints to it"
            exit 1
          fi
          if ! cmp -s "$generated" "$CONTRACT"; then
            echo "::error file=${CONTRACT}::the committed contract is not what generate prints from the configuration types; regenerate it"
            diff -u --label "$CONTRACT (committed)" --label "$CONTRACT (generated)" "$CONTRACT" "$generated" || true
            failed=1
          fi
        fi

        terrace-contract conform --tier "$TIER" "$CONTRACT" || failed=1

        while IFS= read -r dockerfile; do
          [[ -n "${dockerfile//[[:space:]]/}" ]] || continue
          terrace-contract image verify --path "$CONTRACT_PATH" --dockerfile "$dockerfile" "$CONTRACT" || failed=1
        done <<< "$DOCKERFILES"

        exit "$failed"

    - name: Attach the document
      id: attach
      if: ${{ inputs.attach == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        CONTRACT: ${{ inputs.contract }}
        IMAGE: ${{ inputs.image }}
        OCI_LAYOUT: ${{ inputs.oci_layout }}
      run: |
        set -euo pipefail

        args=(image attach --image "$IMAGE")
        if [[ "$OCI_LAYOUT" == true ]]; then
          args+=(--oci-layout)
        fi
        referrer="$(terrace-contract "${args[@]}" "$CONTRACT")"
        [[ "$referrer" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::attach printed '${referrer}', not a digest"; exit 1; }
        echo "referrer=${referrer}" >> "$GITHUB_OUTPUT"

    # The referrer lives in the image's repository, so its reference is that repository at the
    # referrer's digest: the reference with any tag or digest cut off.
    - name: Sign the referrer
      if: ${{ inputs.sign == 'true' }}
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        REFERRER: ${{ steps.attach.outputs.referrer }}
      run: |
        set -euo pipefail

        repository="${IMAGE%@*}"
        last="${repository##*/}"
        if [[ "$last" == *:* ]]; then
          repository="${repository%:*}"
        fi
        cosign sign --yes "${repository}@${REFERRER}"

    - name: Verify the image
      if: ${{ inputs.image != '' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        CONTRACT: ${{ inputs.contract }}
        IMAGE: ${{ inputs.image }}
        OCI_LAYOUT: ${{ inputs.oci_layout }}
        SIGNER: ${{ inputs.signer }}
        CONTRACT_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail

        args=(image verify --image "$IMAGE" --path "$CONTRACT_PATH")
        if [[ "$OCI_LAYOUT" == true ]]; then
          args+=(--oci-layout)
        fi
        if [[ -n "$SIGNER" ]]; then
          args+=(--signer "$SIGNER")
        fi
        terrace-contract "${args[@]}" "$CONTRACT"
