name: 'Apply Helm Chart Updates'
description: "Applies a set of templated image updates to a Helm chart's values.yaml and bumps Chart.yaml,
  preserving comments and structure. Every image carries its own version and digest."
inputs:
  chart-path:
    description: 'Path of the chart inside the workspace (e.g. charts/my-app). Chart.yaml and values.yaml are resolved beneath it.'
    required: true
  images:
    description: 'JSON object mapping a dot-notation key in values.yaml to that image''s own variables,
      e.g. {"services.api.image.tag": {"tag": "v1.2.3", "digest": "sha256:..."}}.
      Every key must already exist in values.yaml and must match key-pattern.'
    required: true
  value-template:
    description: "Template for the value written at each key. Supports ${name} placeholders only, resolved
      against the entry's own variables layered over `variables`. An undefined placeholder is an error."
    required: false
    default: '${tag}@${digest}'
  variables:
    description: "JSON object of default template variables, shared by every entry. An entry's own
      variables always win. Optional: images that move independently carry their versions per entry."
    required: false
    default: '{}'
  app-version:
    description: 'Value to write to Chart.yaml appVersion. Explicit only, never derived from an image:
      a chart whose services release independently has no single app version. Left untouched when empty.'
    required: false
    default: ''
  version-bump:
    description: 'How to bump the Chart.yaml version: patch, minor, major or none. Ignored when chart-version is set.'
    required: false
    default: 'patch'
  chart-version:
    description: 'Explicit Chart.yaml version, taking precedence over version-bump. Must be valid SemVer.'
    required: false
    default: ''
  changelog:
    description: 'Markdown changelog for this release, carried through to the pull request body.
      Sanitized before use: mentions and issue-closing keywords are neutralized and the text is truncated.'
    required: false
    default: ''
  changelog-max-bytes:
    description: 'Byte cap for the sanitized changelog. A pull request body is limited to 65536 characters.'
    required: false
    default: '30000'
  key-pattern:
    description: 'Regular expression every key in `images` must match. The default confines writes to image tags;
      widening it is an explicit decision. Structural key validation applies regardless of this pattern.'
    required: false
    default: '^([A-Za-z0-9_-]+\.)*image\.tag$'
  value-pattern:
    description: 'Regular expression every rendered value must match before it is written.'
    required: false
    default: '^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}(@sha256:[0-9a-f]{64})?$'

outputs:
  chart-version:
    description: 'The chart version written to Chart.yaml'
  previous-chart-version:
    description: 'The chart version that was in Chart.yaml before the update'
  updated-count:
    description: 'Number of image keys updated in values.yaml'
  changes:
    description: 'JSON array of {key, old, new} for every image key updated, in input order'
  summary-markdown:
    description: 'Markdown table of the applied image updates, safe to embed in a pull request body'
  changelog-markdown:
    description: 'The sanitized changelog wrapped in a collapsed <details> section, safe to embed in a pull
      request body. Empty when no changelog was given, so embedding it unconditionally leaves no empty heading.'
  files:
    description: 'Space-separated paths of the files written, for use as a commit file pattern'

runs:
  using: 'node20'
  main: 'dist/index.js'
