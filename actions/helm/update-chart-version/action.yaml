name: 'Update Helm Chart Version'
description: "Updates a Helm chart's image tags, version and appVersion, then opens a Pull Request.
  Every image carries its own version and digest, so one call can move a chart with many services.
  This action requires a bot account with access to the charts repo."
inputs:
  app-id:
    description: 'GitHub App ID'
    required: true
  private-key:
    description: 'GitHub App Private Key'
    required: true
  helm-repo:
    description: 'Repository name of the helm charts (e.g. owner/repo)'
    required: true
  base_branch:
    description: 'The branch to merge into (defaults to repository default branch)'
    required: false
    default: ''
  chart-path:
    description: 'Path of the chart inside the repo (e.g. charts/my-app)'
    required: true
  images:
    description: 'JSON object mapping a dot-notation key in values.yaml to that image''s own variables,
      e.g. {"services.api.image.tag": {"tag": "v1.2.3", "digest": "sha256:..."}}.
      Every key must already exist in values.yaml and must match key-pattern.'
    required: true
  value-template:
    description: "Template for the value written at each key. Supports ${name} placeholders only, resolved
      against the entry's own variables layered over `variables`. An undefined placeholder is an error."
    required: false
    default: '${tag}@${digest}'
  variables:
    description: "JSON object of default template variables, shared by every entry. An entry's own
      variables always win. Optional: images that move independently carry their versions per entry."
    required: false
    default: '{}'
  app-version:
    description: 'Value to write to Chart.yaml appVersion. Explicit only, never derived from an image:
      a chart whose services release independently has no single app version. Left untouched when empty.'
    required: false
    default: ''
  version-bump:
    description: 'How to bump the Chart.yaml version: patch, minor, major or none. Ignored when chart-version is set.'
    required: false
    default: 'patch'
  chart-version:
    description: 'Explicit Chart.yaml version, taking precedence over version-bump. Must be valid SemVer.'
    required: false
    default: ''
  changelog:
    description: 'Markdown changelog for this release, carried into the pull request body as a collapsed
      section. Sanitized first: mentions and issue-closing keywords are neutralized and the text is truncated.'
    required: false
    default: ''
  changelog-max-bytes:
    description: 'Byte cap for the sanitized changelog. A pull request body is limited to 65536 characters.'
    required: false
    default: '30000'
  key-pattern:
    description: 'Regular expression every key in `images` must match. The default confines writes to image tags;
      widening it is an explicit decision. Structural key validation applies regardless of this pattern.'
    required: false
    default: '^([A-Za-z0-9_-]+\.)*image\.tag$'
  value-pattern:
    description: 'Regular expression every rendered value must match before it is written.'
    required: false
    default: '^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}(@sha256:[0-9a-f]{64})?$'
  pr-branch-prefix:
    description: 'Prefix for the PR branch. The branch is <prefix>/<chart-name>/<new-chart-version>.'
    default: 'chore/helm/auto-update'
    required: false

outputs:
  pr-url:
    description: 'The URL of the created Pull Request'
    value: ${{ steps.create-pr.outputs.pr_url }}
  pr_number:
    description: 'The id of the created Pull Request'
    value: ${{ steps.create-pr.outputs.pr_number }}
  chart-version:
    description: 'The chart version written to Chart.yaml'
    value: ${{ steps.apply.outputs.chart-version }}
  previous-chart-version:
    description: 'The chart version that was in Chart.yaml before the update'
    value: ${{ steps.apply.outputs.previous-chart-version }}
  updated-count:
    description: 'Number of image keys updated in values.yaml'
    value: ${{ steps.apply.outputs.updated-count }}
  changes:
    description: 'JSON array of {key, old, new} for every image key updated, in input order'
    value: ${{ steps.apply.outputs.changes }}

runs:
  using: 'composite'
  steps:
    # The only shell in this action. Everything that touches caller-controlled content — keys, tags,
    # digests, the changelog — happens inside apply-chart-updates, where it is validated rather than
    # interpolated.
    - name: Parse Inputs
      id: parse
      shell: bash
      env:
        CHART_PATH: ${{ inputs.chart-path }}
        HELM_REPO: ${{ inputs.helm-repo }}
      run: |
        set -euo pipefail

        if ! [[ "$HELM_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
          echo "::error::helm-repo must be owner/repo, got '$HELM_REPO'"
          exit 1
        fi

        # Extract chart name from path (basename)
        CHART_NAME=$(basename "$CHART_PATH")
        echo "chart-name=$CHART_NAME" >> "$GITHUB_OUTPUT"

        echo "owner=${HELM_REPO%%/*}" >> "$GITHUB_OUTPUT"
        echo "repo=${HELM_REPO#*/}" >> "$GITHUB_OUTPUT"

    - name: Generate Bot Token
      id: generate_token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ steps.parse.outputs.owner }}
        repositories: ${{ steps.parse.outputs.repo }}

    - name: Resolve Base Branch
      id: resolve-base-branch
      uses: TimSchoenle/actions/actions/helper/resolve-base-branch@45e613e1449fb05c672e2817d48e161d35f15704 # tag=actions-helper-resolve-base-branch-v1.3.2
      with:
        repository: ${{ inputs.helm-repo }}
        token: ${{ steps.generate_token.outputs.token }}
        branch_name: ${{ inputs.base_branch }}

    - name: Checkout Helm Charts
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: ${{ inputs.helm-repo }}
        token: ${{ steps.generate_token.outputs.token }}
        ref: ${{ steps.resolve-base-branch.outputs.base_branch }}
        fetch-depth: 0
        persist-credentials: false

    # One step for the whole file update: a composite cannot loop, so N images cannot be N steps.
    - name: Apply Chart Updates
      id: apply
      uses: TimSchoenle/actions/actions/helm/apply-chart-updates@64ea1ec370145ec92148b80717c12033b82375cd # tag=actions-helm-apply-chart-updates-v1.2.1
      with:
        chart-path: ${{ inputs.chart-path }}
        images: ${{ inputs.images }}
        value-template: ${{ inputs.value-template }}
        variables: ${{ inputs.variables }}
        app-version: ${{ inputs.app-version }}
        version-bump: ${{ inputs.version-bump }}
        chart-version: ${{ inputs.chart-version }}
        changelog: ${{ inputs.changelog }}
        changelog-max-bytes: ${{ inputs.changelog-max-bytes }}
        key-pattern: ${{ inputs.key-pattern }}
        value-pattern: ${{ inputs.value-pattern }}

    - name: Create Pull Request
      id: create-pr
      uses: TimSchoenle/actions/actions/common/create-pull-request@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-common-create-pull-request-v1.0.13
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        repository: ${{ inputs.helm-repo }}
        base_branch: ${{ steps.resolve-base-branch.outputs.base_branch }}
        # Named after the chart version, not an image tag: with per-image versions there is no single
        # tag to name a branch after, and the chart version is what this pull request delivers.
        branch_name: '${{ inputs.pr-branch-prefix }}/${{ steps.parse.outputs.chart-name }}/${{ steps.apply.outputs.chart-version }}'
        title: 'chore(${{ steps.parse.outputs.chart-name }}): update chart to ${{ steps.apply.outputs.chart-version }}'
        # Both Markdown fragments leave apply-chart-updates already sanitized, so nothing
        # caller-controlled is assembled into this body here.
        body: |
          Automated update for the **${{ steps.parse.outputs.chart-name }}** chart.

          - **Chart version**: `${{ steps.apply.outputs.previous-chart-version }}` → `${{ steps.apply.outputs.chart-version }}`
          - **Images updated**: ${{ steps.apply.outputs.updated-count }}

          ${{ steps.apply.outputs.summary-markdown }}

          ${{ steps.apply.outputs.changelog-markdown }}
        reset_branch: 'true'
        commit_changes: 'true'
        commit_message: 'chore(${{ steps.parse.outputs.chart-name }}): update chart to ${{ steps.apply.outputs.chart-version }}'
        file_pattern: ${{ steps.apply.outputs.files }}
