[package]
name = "fixture"
version = "0.1.0"
edition = "2024"

[dependencies]
# Monorepo release tag: `<component>-v<version>`. The repository also tags `csp-policy-v*`.
csp-shell = { git = "https://github.com/TimSchoenle/csp-shell", tag = "csp-shell-v0.2.0" }
# Plain release tag, grouped with terrace-legal by the default preset.
terrace-config = { git = "https://github.com/TimSchoenle/terrace-config", tag = "v0.15.1", default-features = false }
