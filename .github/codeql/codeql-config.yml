name: 'CodeQL Config'

paths-ignore:
  - scripts/generate-maven-central-signing-key.ts
  # A catalogue of hostile inputs, so its contents are the very things a scanner is built to report.
  # The `js/redos` patterns in it are catastrophic by construction — that is what they are for — and
  # the only code that compiles one is the assertion that it is a valid regular expression; nothing
  # ever runs one against its subject. Inline `codeql[...]` comments do not suppress alerts in code
  # scanning, so excluding the file is the mechanism that exists. It holds payload data rather than
  # logic, which is what makes the lost coverage cheap.
  - packages/e2e/src/adversarial.ts
