name: Verify Terrace Image

on:
  push:
    branches:
      - main
    paths:
      - 'actions/terrace/image/**'
      - '.github/testdata/terrace-image/**'
      - '.github/workflows/verify-action-terrace-image.yaml'
  pull_request:
    paths:
      - 'actions/terrace/image/**'
      - '.github/testdata/terrace-image/**'
      - '.github/workflows/verify-action-terrace-image.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

# The fixture is a producer repository of its own inside this one: a contract, the Dockerfile that
# embeds it and labels the image, and the terrace.yaml whose cli pin the action installs. The image
# is built FROM scratch and saved as an OCI layout, so no job pulls a base image or needs a registry.
env:
  FIXTURE: .github/testdata/terrace-image
  TERRACE_CONFIG: ${{ github.workspace }}/.github/testdata/terrace-image/terrace.yaml

jobs:
  check-clean:
    name: 'Test: a built image that carries its document passes every check'
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch code, and to list terrace-contract releases
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # `docker save` writes an OCI layout tarball on Docker 25 and newer, the shape a build
      # produces before it pushes; `attach` needs the same layout unpacked into a directory.
      - name: Build the image
        working-directory: ${{ env.FIXTURE }}
        run: |
          set -euo pipefail
          docker build --tag terrace-image-fixture:v1 .
          docker save terrace-image-fixture:v1 --output image.tar
          mkdir layout
          tar -xf image.tar -C layout

      - name: Check the built image
        id: check
        uses: ./actions/terrace/image # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          working_directory: ${{ env.FIXTURE }}
          contract: contract.json
          generate: cat contract.json
          tier: '3'
          dockerfile: Dockerfile
          image: image.tar:v1
          oci_layout: 'true'

      - name: Attach the document
        id: attach
        uses: ./actions/terrace/image # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          working_directory: ${{ env.FIXTURE }}
          contract: contract.json
          image: layout:v1
          oci_layout: 'true'
          attach: 'true'

      - name: Attach it again
        id: again
        uses: ./actions/terrace/image # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          working_directory: ${{ env.FIXTURE }}
          contract: contract.json
          image: layout:v1
          oci_layout: 'true'
          attach: 'true'

      - name: Verify the outputs
        env:
          VERSION: ${{ steps.check.outputs.version }}
          REFERRER: ${{ steps.attach.outputs.referrer }}
          AGAIN: ${{ steps.again.outputs.referrer }}
        run: |
          set -euo pipefail
          case "$VERSION" in 0.12.*) ;; *) echo "::error::$VERSION is not on the fixture's 0.12 line"; exit 1;; esac
          [[ "$REFERRER" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::'$REFERRER' is not a referrer digest"; exit 1; }
          test "$AGAIN" = "$REFERRER" || { echo "::error::a second attach wrote $AGAIN beside $REFERRER"; exit 1; }

  check-drift:
    name: 'Test: a stale contract, label block or image fails the step'
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch code, and to list terrace-contract releases
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The image is built from the committed document, then the document is changed by one byte:
      # what a build that copies one file and checks another produces. The same change makes the
      # committed document disagree with a generator that prints the original.
      - name: Build the image, then change the document
        working-directory: ${{ env.FIXTURE }}
        run: |
          set -euo pipefail
          docker build --tag terrace-image-fixture:v1 .
          docker save terrace-image-fixture:v1 --output image.tar
          cp contract.json original.json
          printf '\n' >> contract.json

      - name: Check an image built from another document
        id: image
        continue-on-error: true
        uses: ./actions/terrace/image # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          working_directory: ${{ env.FIXTURE }}
          contract: contract.json
          image: image.tar:v1
          oci_layout: 'true'

      - name: Check a committed document its generator no longer prints
        id: generate
        continue-on-error: true
        uses: ./actions/terrace/image # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          working_directory: ${{ env.FIXTURE }}
          contract: contract.json
          generate: cat original.json

      - name: Make the label block stale
        working-directory: ${{ env.FIXTURE }}
        run: |
          set -euo pipefail
          cp original.json contract.json
          grep -q 'dev.terrace.config.prefix="ORDERS_"' Dockerfile || { echo "::error::no prefix label to break"; exit 1; }
          sed -i 's/dev.terrace.config.prefix="ORDERS_"/dev.terrace.config.prefix="OTHER_"/' Dockerfile

      - name: Check a stale label block
        id: dockerfile
        continue-on-error: true
        uses: ./actions/terrace/image # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          working_directory: ${{ env.FIXTURE }}
          contract: contract.json
          dockerfile: Dockerfile

      - name: Check a signature on an OCI layout
        id: layout
        continue-on-error: true
        uses: ./actions/terrace/image # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          working_directory: ${{ env.FIXTURE }}
          contract: contract.json
          image: image.tar:v1
          oci_layout: 'true'
          signer: https://github.com/TimSchoenle/.*

      - name: Verify every run failed
        env:
          IMAGE: ${{ steps.image.outcome }}
          GENERATE: ${{ steps.generate.outcome }}
          DOCKERFILE: ${{ steps.dockerfile.outcome }}
          LAYOUT: ${{ steps.layout.outcome }}
        run: |
          set -euo pipefail
          test "$IMAGE" = failure || { echo "::error::an image carrying another document passed"; exit 1; }
          test "$GENERATE" = failure || { echo "::error::a stale committed document passed"; exit 1; }
          test "$DOCKERFILE" = failure || { echo "::error::a stale label block passed"; exit 1; }
          test "$LAYOUT" = failure || { echo "::error::a signature was accepted on an OCI layout"; exit 1; }

  # <<< generated: summary (run 'bun run generate-ci-required' to update)
  summary:
    name: 'CI Summary: Terrace Image'
    if: ${{ always() }}
    needs:
      - check-clean
      - check-drift
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if any verify job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
  # >>> generated: summary
