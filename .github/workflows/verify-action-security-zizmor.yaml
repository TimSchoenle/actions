# GENERATED — do not edit by hand. Run `bun run generate-e2e-workflows` to rebuild this file
# from the actions that have an `e2e/` directory. The drift test in CI fails if it is out of date.
#
# The cases live in `actions/security/zizmor/e2e/` and are ordinary vitest files. This
# workflow supplies only what they cannot get on a laptop: a token scoped to the scratch repository.
name: Verify Security Zizmor

on:
  push:
    branches:
      - main
      - 'feature/security/zizmor'
    paths:
      - 'actions/security/zizmor/**'
      - '!actions/security/zizmor/CHANGELOG.md'
      - 'packages/e2e/**'
      - '.github/workflows/verify-action-security-zizmor.yaml'
  pull_request:
    paths:
      - 'actions/security/zizmor/**'
      - '!actions/security/zizmor/CHANGELOG.md'
      - 'packages/e2e/**'
      - '.github/workflows/verify-action-security-zizmor.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch code
    outputs:
      cache-key: ${{ steps.key.outputs.value }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            registry.npmjs.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute Cache Key
        id: key
        env:
          CACHE_KEY: e2e-workspace-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        run: echo "value=$CACHE_KEY" >> "$GITHUB_OUTPUT"

      - name: Cache Workspace Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            actions/*/*/node_modules
          key: ${{ steps.key.outputs.value }}

      # An empty bun-version makes setup-bun fall through to bun-version-file; setup-cached defaults
      # it to 'latest', which would win otherwise. It reinstalls on every run whatever the cache did,
      # which is what validates the restored tree against the lockfile before the next job trusts it.
      - name: Setup Bun And Install
        uses: TimSchoenle/actions/actions/bun/setup-cached@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-bun-setup-cached-v1.1.11
        with:
          bun-version: ''
          bun-version-file: '.bun-version'

  e2e:
    needs: install
    environment:
      name: ci-e2e
      deployment: false
    name: End-to-end
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-bun rather than setup-cached: the cached wrapper runs `bun install` on every job, cache
      # hit or not, and this job is the one that must have no route to a package registry at all.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.bun-version'

      # Restored, never installed, and never saved. `fail-on-cache-miss` is what keeps that honest:
      # without it a miss would leave the suite to fail later on a missing import, several confusing
      # minutes further on.
      - name: Restore Dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            actions/*/*/node_modules
          key: ${{ needs.install.outputs.cache-key }}
          fail-on-cache-miss: true

      # The cases run `dist/index.js`, the bundle GitHub itself would run, so nothing is built here.
      - name: Generate Token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ACTIONS_TEST_BOT_APP_ID }}
          private-key: ${{ secrets.ACTIONS_TEST_BOT_PRIVATE_KEY }}
          owner: TimSchoenle
          repositories: actions-testing
          permission-metadata: read

      - name: Run End-to-end Cases
        env:
          E2E_GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          # An installation token cannot call `GET /user`, so the suite resolves its own account by
          # app slug instead. Without this a case matching commit authors fails only in CI.
          E2E_APP_SLUG: ${{ steps.token.outputs.app-slug }}
          E2E_TEST_REPOSITORY: TimSchoenle/actions-testing
        run: bun run e2e actions/security/zizmor

  verify-composite:
    name: Test Composite Against The Real Image
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch code, and for zizmor's online audits
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Test (Clean, Online)
        id: clean
        uses: ./actions/security/zizmor # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          inputs: actions/security/zizmor/e2e/fixture/clean.yml
          upload: 'false'

      - name: Assert Clean
        env:
          FINDINGS: ${{ steps.clean.outputs.findings }}
          FAILING: ${{ steps.clean.outputs.failing }}
          SARIF_FILE: ${{ steps.clean.outputs.sarif-file }}
          SARIF_ID: ${{ steps.clean.outputs.sarif-id }}
        run: |
          set -euo pipefail

          [ "$FINDINGS" = "0" ] || { echo "::error::findings '$FINDINGS' on the clean fixture, expected 0"; exit 1; }
          [ "$FAILING" = "0" ] || { echo "::error::failing '$FAILING' on the clean fixture, expected 0"; exit 1; }
          [ -z "$SARIF_ID" ] || { echo "::error::upload: false uploaded a SARIF ($SARIF_ID)"; exit 1; }
          case "$SARIF_FILE" in
            "$RUNNER_TEMP"/*) ;;
            *) echo "::error::sarif-file '$SARIF_FILE' is not under RUNNER_TEMP"; exit 1 ;;
          esac
          jq -e '.version == "2.1.0" and (.runs[0].results | length) == 0' "$SARIF_FILE" > /dev/null \
            || { echo "::error::sarif-file is not an empty SARIF 2.1.0 log"; exit 1; }

          echo "✅ The clean fixture passed with an empty SARIF and nothing uploaded"

      - name: Run Test (Finding, Default Threshold)
        id: finding
        continue-on-error: true
        uses: ./actions/security/zizmor # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          inputs: actions/security/zizmor/e2e/fixture/finding.yml
          online-audits: 'false'
          upload: 'false'

      - name: Run Test (Finding, Threshold None)
        id: finding-none
        uses: ./actions/security/zizmor # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          inputs: actions/security/zizmor/e2e/fixture/finding.yml
          online-audits: 'false'
          upload: 'false'
          fail-on-severity: none

      - name: Assert Finding
        env:
          OUTCOME: ${{ steps.finding.outcome }}
          FINDINGS: ${{ steps.finding-none.outputs.findings }}
          FAILING: ${{ steps.finding-none.outputs.failing }}
        run: |
          set -euo pipefail

          [ "$OUTCOME" = "failure" ] || { echo "::error::the finding fixture did not fail the default threshold ($OUTCOME)"; exit 1; }
          [ "$FINDINGS" -gt 0 ] || { echo "::error::findings '$FINDINGS' with fail-on-severity: none, expected more than 0"; exit 1; }
          [ "$FAILING" = "0" ] || { echo "::error::failing '$FAILING' with fail-on-severity: none, expected 0"; exit 1; }

          echo "✅ $FINDINGS finding(s) failed the default threshold and passed with none"

      # Valid YAML that is not a workflow passes the byte order mark scan, so this is zizmor's own strict
      # collection failing inside the container, and the exit code mapped on the way out.
      - name: Run Test (Unparseable, Strict)
        id: invalid
        continue-on-error: true
        uses: ./actions/security/zizmor # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          inputs: actions/security/zizmor/e2e/fixture/invalid.yml
          online-audits: 'false'
          upload: 'false'

      - name: Assert Unparseable
        env:
          OUTCOME: ${{ steps.invalid.outcome }}
          SARIF_FILE: ${{ steps.invalid.outputs.sarif-file }}
        run: |
          set -euo pipefail

          [ "$OUTCOME" = "failure" ] || { echo "::error::an unparseable workflow did not fail strict collection ($OUTCOME)"; exit 1; }
          [ -z "$SARIF_FILE" ] || { echo "::error::a failed collection still published a SARIF ($SARIF_FILE)"; exit 1; }

          echo "✅ zizmor's strict collection failed the run and nothing reached the upload"

      - name: Write Byte Order Mark Fixture
        env:
          CLEAN: actions/security/zizmor/e2e/fixture/clean.yml
        run: |
          set -euo pipefail

          mkdir -p .zizmor-e2e-bom/.github/workflows
          cp "$CLEAN" .zizmor-e2e-bom/.github/workflows/clean.yml
          { printf '\xef\xbb\xbf'; cat "$CLEAN"; } > .zizmor-e2e-bom/.github/workflows/bom.yml
          head -c 3 .zizmor-e2e-bom/.github/workflows/bom.yml | od -An -tx1

      - name: Run Test (Byte Order Mark, Strict)
        id: bom
        continue-on-error: true
        uses: ./actions/security/zizmor # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          inputs: .zizmor-e2e-bom
          online-audits: 'false'
          upload: 'false'

      - name: Run Test (Byte Order Mark, Strict Off)
        id: bom-lenient
        uses: ./actions/security/zizmor # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          inputs: .zizmor-e2e-bom
          online-audits: 'false'
          upload: 'false'
          strict-collection: 'false'

      - name: Assert Byte Order Mark
        env:
          OUTCOME: ${{ steps.bom.outcome }}
          SARIF_FILE: ${{ steps.bom.outputs.sarif-file }}
          LENIENT_FINDINGS: ${{ steps.bom-lenient.outputs.findings }}
        run: |
          set -euo pipefail

          [ "$OUTCOME" = "failure" ] || { echo "::error::a workflow with a byte order mark did not fail ($OUTCOME)"; exit 1; }
          [ -z "$SARIF_FILE" ] || { echo "::error::zizmor ran although the byte order mark scan failed ($SARIF_FILE)"; exit 1; }
          [ "$LENIENT_FINDINGS" = "0" ] || { echo "::error::strict-collection: false reported '$LENIENT_FINDINGS' finding(s), expected 0"; exit 1; }

          echo "✅ The BOM failed the strict run before zizmor started, and strict-collection: false skipped it"

  # <<< generated: summary (run 'bun run generate-ci-required' to update)
  summary:
    name: 'CI Summary: Security Zizmor'
    if: ${{ always() }}
    needs:
      - install
      - e2e
      - verify-composite
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if any verify job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
  # >>> generated: summary
