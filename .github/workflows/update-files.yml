name: Update Files

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

# Every generated file is rebuilt by running this repository's own scripts, which on a pull request
# are the pull request's scripts. Code running in a job can read every credential that job holds,
# including by rewriting an action's dist/index.js under _actions/ before that action's step starts,
# so each stage is split in two:
#
# - an unprivileged job (contents: read, no secrets, no environment) runs the generator and uploads
#   the result with common/create-patch;
# - update-files-commit.yml, a workflow_run workflow, mints the App token and commits that patch with
#   common/commit-patch. It runs the default branch's copy of itself, so a pull request cannot edit
#   it, never installs dependencies or runs a repository script, and commit-patch refuses any path
#   outside its allowed_paths.
#
# The required checks keep the names of the jobs that used to commit here, "Build Actions and
# Commit" and "Update README" (scripts/lib/required-checks.ts). Each runs with !cancelled() and fails
# when its stage did not succeed, since a required job that is merely skipped reports skipped and
# branch protection accepts skipped. Each also fails while its stage left a patch to commit: the head
# this run checked is not the one to merge, and the run on the commit decides.
#
# The stages run in order, each only when the one before changed nothing: a commit starts a new run
# on the new head, which redoes the later stages against it.
jobs:
  build:
    name: Build Actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
    permissions:
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            registry.npmjs.org:443

      # The pull request head, not the default merge commit: the patch is committed to the branch, so
      # it has to be computed against the commit the branch points at.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # This job writes the bundles `check-action-dist` rebuilds and compares byte-for-byte, so the
      # Bun here must be the pinned one. Bun's minifier renames identifiers between releases, and an
      # empty bun-version is what makes setup-bun fall through to bun-version-file; setup-cached
      # defaults it to 'latest', which would win otherwise — as it did when Bun 1.4.0 shipped and
      # this job started committing bundles the pinned-Bun check rejected on every pull request.
      - name: Setup Bun
        uses: TimSchoenle/actions/actions/bun/setup-cached@9d5cb31939ace7a3d3d7f452052724337c65f153 # tag=actions-bun-setup-cached-v2.0.0
        with:
          bun-version: ''
          bun-version-file: '.bun-version'
          cache-mode: none

      - name: Build All Workspaces
        run: bun run build:workspaces

      - name: Create Patch
        id: patch
        uses: TimSchoenle/actions/actions/common/create-patch@dc5b395636dc1954383f11af4062a08814e9b15a # tag=actions-common-create-patch-v1.1.1
        with:
          artifact_name: update-files-builds
          paths: 'actions/**/dist/**/* actions/**/src/generated/**/*'

  # The verify-action-* workflows for actions with e2e cases are generated from
  # scripts/lib/e2e-workflow.ts, which holds their pinned action refs. Renovate updates that file and
  # the generated copies in one branch (see the customManagers in renovate.json), so this stage is the
  # safety net rather than the mechanism: it makes the generator authoritative whenever the two have
  # drifted for any reason, instead of leaving a pull request stuck on a failing drift check.
  generate-workflows:
    name: Generate Workflows
    needs: build
    if: needs.build.outputs.has_changes == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
    permissions:
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Bun
        uses: TimSchoenle/actions/actions/bun/setup-cached@9d5cb31939ace7a3d3d7f452052724337c65f153 # tag=actions-bun-setup-cached-v2.0.0
        with:
          bun-version: ''
          bun-version-file: '.bun-version'
          cache-mode: none

      # ci-required watches the generated workflows by name, so a regenerated workflow that added or
      # renamed a job leaves the required-check list stale unless both run together. The Codecov
      # component list is generated from the same actions/ tree, so it is rebuilt in the same pass.
      - name: Regenerate
        run: |
          set -euo pipefail
          bun run generate-e2e-workflows
          bun run generate-ci-required
          bun run generate-codecov-components

      - name: Create Patch
        id: patch
        uses: TimSchoenle/actions/actions/common/create-patch@dc5b395636dc1954383f11af4062a08814e9b15a # tag=actions-common-create-patch-v1.1.1
        with:
          artifact_name: update-files-workflows
          paths: '.github/workflows/verify-action-*.yaml .github/workflows/ci-required.yaml .github/codecov.yml'

  generate-docs:
    name: Generate Docs
    needs: [build, generate-workflows]
    if: needs.build.outputs.has_changes == 'false' && needs.generate-workflows.outputs.has_changes == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
    permissions:
      contents: read # to fetch code and tags
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Bun
        uses: TimSchoenle/actions/actions/bun/setup-cached@9d5cb31939ace7a3d3d7f452052724337c65f153 # tag=actions-bun-setup-cached-v2.0.0
        with:
          cache-mode: none

      - name: Refresh Tags
        run: git fetch --force --tags origin

      - name: Generate Docs
        run: bun run generate-docs

      - name: Create Patch
        id: patch
        uses: TimSchoenle/actions/actions/common/create-patch@dc5b395636dc1954383f11af4062a08814e9b15a # tag=actions-common-create-patch-v1.1.1
        with:
          artifact_name: update-files-docs
          paths: 'README.md SECURITY.md actions/*/*/README.md'

  update-builds:
    name: Build Actions and Commit
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail Unless The Build Left Nothing To Commit
        env:
          RESULT: ${{ needs.build.result }}
          HAS_CHANGES: ${{ needs.build.outputs.has_changes }}
        run: |
          set -euo pipefail
          if [ "$RESULT" != "success" ]; then
            echo "::error::Build Actions finished as '$RESULT'; nothing to commit."
            exit 1
          fi
          if [ "$HAS_CHANGES" = "true" ]; then
            echo "::error::The build changed dist/ or src/generated/; update-files-commit.yml commits it, and the run on that commit decides."
            exit 1
          fi

  # Generate Workflows is not a required check of its own, so its failure and its pending patch are
  # reported here. While the build has something to commit the later stages do not run, and this
  # job leaves the verdict to Build Actions and Commit and to the run on that commit.
  update-readme:
    name: Update README
    needs: [build, generate-workflows, generate-docs]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail Unless The Later Stages Left Nothing To Commit
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          BUILD_CHANGES: ${{ needs.build.outputs.has_changes }}
          WORKFLOWS_RESULT: ${{ needs.generate-workflows.result }}
          WORKFLOWS_CHANGES: ${{ needs.generate-workflows.outputs.has_changes }}
          DOCS_RESULT: ${{ needs.generate-docs.result }}
          DOCS_CHANGES: ${{ needs.generate-docs.outputs.has_changes }}
        run: |
          set -euo pipefail
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "::error::Build Actions finished as '$BUILD_RESULT'; the later stages did not run."
            exit 1
          fi
          if [ "$BUILD_CHANGES" = "true" ]; then
            echo "The build left a patch to commit; the run on that commit regenerates the rest."
            exit 0
          fi
          if [ "$WORKFLOWS_RESULT" != "success" ]; then
            echo "::error::Generate Workflows finished as '$WORKFLOWS_RESULT'."
            exit 1
          fi
          if [ "$WORKFLOWS_CHANGES" = "true" ]; then
            echo "::error::The generated workflows are stale; update-files-commit.yml commits them, and the run on that commit decides."
            exit 1
          fi
          if [ "$DOCS_RESULT" != "success" ]; then
            echo "::error::Generate Docs finished as '$DOCS_RESULT'."
            exit 1
          fi
          if [ "$DOCS_CHANGES" = "true" ]; then
            echo "::error::README.md, SECURITY.md or an action README is stale; update-files-commit.yml commits it, and the run on that commit decides."
            exit 1
          fi
