name: Update Files

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

# Every generated file is rebuilt by running this repository's own scripts, which on a pull request
# are the pull request's scripts. Code running in a job can read every credential that job holds,
# including by rewriting an action's dist/index.js under _actions/ before that action's step starts,
# so each stage is split in two:
#
# - an unprivileged job (contents: read, no secrets, no environment) runs the generator and uploads
#   the result with common/create-patch;
# - update-files-commit.yml, a workflow_run workflow, mints the App token and commits that patch with
#   common/commit-patch. It runs the default branch's copy of itself, so a pull request cannot edit
#   it, never installs dependencies or runs a repository script, and commit-patch refuses any path
#   outside its allowed_paths.
#
# The required check keeps the name of the job that used to commit here, "Update README"
# (scripts/lib/required-checks.ts). It runs with !cancelled() and fails when a stage did not succeed,
# since a required job that is merely skipped reports skipped and branch protection accepts skipped.
# It also fails while a stage left a patch to commit: the head this run checked is not the one to
# merge, and the run on the commit decides.
#
# The stages run in order, each only when the one before changed nothing: a commit starts a new run
# on the new head, which redoes the later stages against it.
#
# Action bundles and generated sources are not rebuilt here. Bundles are not committed at all: the
# release builds them (docs/release-pipeline.md). Generated sources are regenerated by the pre-commit
# hook, and Lint & Test fails a pull request whose committed ones have drifted.
jobs:
  # The Verify workflows (verify.yaml, its verify-<category>.yaml shards and .github/verify/plan.json)
  # are generated from the sources in .github/verify/ and scripts/lib/verify/pins.ts, which holds their
  # pinned action refs. Renovate updates that file and the generated copies in one branch (see the customManagers in renovate.json), so this stage is the
  # safety net rather than the mechanism: it makes the generator authoritative whenever the two have
  # drifted for any reason, instead of leaving a pull request stuck on a failing drift check.
  # One job runs both stages, in order: a second job cost a runner start, a clone and an uncached
  # bun install on every pull request push for a stage that only runs when the first changed nothing.
  # Each stage keeps its own artifact and output, which update-files-commit.yml and Update README read.
  generate:
    name: Generate Files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      workflows_has_changes: ${{ steps.workflows-patch.outputs.has_changes }}
      docs_has_changes: ${{ steps.docs-patch.outputs.has_changes }}
    permissions:
      contents: read # to fetch code and tags
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # The docs generator resolves every consumer tag to the commit it points at, so the clone carries
      # all commits and tags. It reads no file from history, so blob:none leaves out the blobs of every
      # earlier commit, the bundles of each build commit among them. The Verify and Codecov generators
      # read the working tree alone.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Restores the dependency cache but never saves one: this job holds no secret and only
      # `contents: read`, so a restored entry cannot reach a credential, and a pull request run cannot
      # decide what a later job restores. Saves the uncached install on every pull request push.
      - name: Setup Bun
        uses: TimSchoenle/actions/actions/bun/setup-cached@49acdef9979f343817ec2a85ddd25e5f34befc8b # tag=actions-bun-setup-cached-v4.0.0
        with:
          bun-version: ''
          bun-version-file: '.bun-version'
          cache-mode: read-only

      # The Codecov component list is generated from the same actions/ tree as the Verify plan, so it
      # is rebuilt in the same pass.
      - name: Regenerate Workflows
        run: |
          set -euo pipefail
          bun run generate-verify
          bun run generate-codecov-components

      - name: Create Workflows Patch
        id: workflows-patch
        uses: TimSchoenle/actions/actions/common/create-patch@e75e9ab1e1e9fa573051a901347e39ba23a45710 # tag=actions-common-create-patch-v2.1.0
        with:
          artifact_name: update-files-workflows
          paths: '.github/workflows/verify*.yaml .github/verify/plan.json .github/codecov.yml'

      # Only when the first stage changed nothing: its commit starts a new run on the new head, which
      # redoes this stage against it.
      - name: Generate Docs
        if: steps.workflows-patch.outputs.has_changes == 'false'
        run: bun run generate-docs

      - name: Create Docs Patch
        id: docs-patch
        if: steps.workflows-patch.outputs.has_changes == 'false'
        uses: TimSchoenle/actions/actions/common/create-patch@e75e9ab1e1e9fa573051a901347e39ba23a45710 # tag=actions-common-create-patch-v2.1.0
        with:
          artifact_name: update-files-docs
          paths: 'README.md SECURITY.md actions/*/*/README.md actions/*/*/examples/*.yaml actions/*/*/examples/*.yml'

  # Generate Files is not a required check of its own, so its failure and its pending patches are
  # reported here.
  update-readme:
    name: Update README
    needs: [generate]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail Unless The Stages Left Nothing To Commit
        env:
          GENERATE_RESULT: ${{ needs.generate.result }}
          WORKFLOWS_CHANGES: ${{ needs.generate.outputs.workflows_has_changes }}
          DOCS_CHANGES: ${{ needs.generate.outputs.docs_has_changes }}
        run: |
          set -euo pipefail
          if [ "$GENERATE_RESULT" != "success" ]; then
            echo "::error::Generate Files finished as '$GENERATE_RESULT'."
            exit 1
          fi
          if [ "$WORKFLOWS_CHANGES" = "true" ]; then
            echo "::error::The generated workflows are stale; update-files-commit.yml commits them, and the run on that commit decides."
            exit 1
          fi
          if [ "$DOCS_CHANGES" != "false" ]; then
            echo "::error::README.md, SECURITY.md, an action README or an example pin is stale; update-files-commit.yml commits it, and the run on that commit decides."
            exit 1
          fi
