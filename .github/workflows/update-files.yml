name: Update Files

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  update-builds:
    name: Build Actions and Commit
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    outputs:
      changes_detected: ${{ steps.auto-commit.outputs.changes_detected }}
    permissions:
      contents: write # to push build artifacts
      pull-requests: write # to comment on PRs
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.head_ref }}
          token: ${{ steps.generate_token.outputs.token }}

      # This job writes the bundles `check-action-dist` rebuilds and compares byte-for-byte, so the
      # Bun here must be the pinned one. Bun's minifier renames identifiers between releases, and an
      # empty bun-version is what makes setup-bun fall through to bun-version-file; setup-cached
      # defaults it to 'latest', which would win otherwise — as it did when Bun 1.4.0 shipped and
      # this job started committing bundles the pinned-Bun check rejected on every pull request.
      - name: Setup Bun
        uses: TimSchoenle/actions/actions/bun/setup-cached@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-bun-setup-cached-v1.1.11
        with:
          bun-version: ''
          bun-version-file: '.bun-version'

      - name: Build All Workspaces
        run: bun run build:workspaces

      - name: Commit and Push if changed
        id: auto-commit
        uses: TimSchoenle/actions/actions/common/commit-changes@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-commit-changes-v1.5.9
        with:
          commit_message: 'build: auto-update compiled artifacts'
          file_pattern: 'actions/**/dist/**/* actions/**/src/generated/**/* workflows/**/dist/**/* workflows/**/src/generated/**/*'
          token: ${{ steps.generate_token.outputs.token }}

      - name: Comment on PR
        if: steps.auto-commit.outputs.changes_detected == 'true' && github.event_name == 'pull_request'
        uses: TimSchoenle/actions/actions/common/upsert-pr-comment@9414b1c665d3676efe832978d4e1728cf53119fd # tag=actions-common-upsert-pr-comment-v1.3.0
        with:
          token: ${{ steps.generate_token.outputs.token }}
          identifier: 'update-builds'
          body: 'Build artifacts (`dist/` and `src/generated/`) have been auto-updated.'

  # The verify-action-* workflows for actions with e2e cases are generated from
  # scripts/lib/e2e-workflow.ts, which holds their pinned action refs. Renovate updates that file and
  # the generated copies in one branch (see the customManagers in renovate.json), so this job is the
  # safety net rather than the mechanism: it makes the generator authoritative whenever the two have
  # drifted for any reason, instead of leaving a pull request stuck on a failing drift check.
  #
  # It is the one job here that pushes to .github/workflows/, which is why its token asks for
  # workflows: write. That is a real privilege — a bot that can rewrite workflow files can rewrite
  # what CI runs — so it is granted to this job alone and to no other in this repository.
  update-generated-workflows:
    name: Regenerate Workflows
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    needs: update-builds
    if: needs.update-builds.outputs.changes_detected == 'false'
    outputs:
      changes_detected: ${{ steps.auto-commit.outputs.changes_detected }}
    permissions:
      contents: write # to push regenerated workflows
      pull-requests: write # to comment on PRs
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          # GitHub rejects a push that touches .github/workflows/ without this, with a message about
          # the `workflow` scope rather than about permissions.
          permission-workflows: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ steps.generate_token.outputs.token }}

      - name: Setup Bun
        uses: TimSchoenle/actions/actions/bun/setup-cached@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-bun-setup-cached-v1.1.11
        with:
          bun-version: ''
          bun-version-file: '.bun-version'

      # ci-required watches the generated workflows by name, so a regenerated workflow that added or
      # renamed a job leaves the required-check list stale unless both run together. The Codecov
      # component list is generated from the same actions/ tree, so it is rebuilt in the same pass.
      - name: Regenerate
        run: |
          set -euo pipefail
          bun run generate-e2e-workflows
          bun run generate-ci-required
          bun run generate-codecov-components

      - name: Commit and Push if changed
        id: auto-commit
        uses: TimSchoenle/actions/actions/common/commit-changes@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-commit-changes-v1.5.9
        with:
          commit_message: 'ci: auto-update generated workflows'
          file_pattern: '.github/workflows/verify-action-*.yaml .github/workflows/ci-required.yaml .github/codecov.yml'
          token: ${{ steps.generate_token.outputs.token }}

      - name: Comment on PR
        if: steps.auto-commit.outputs.changes_detected == 'true' && github.event_name == 'pull_request'
        uses: TimSchoenle/actions/actions/common/upsert-pr-comment@9414b1c665d3676efe832978d4e1728cf53119fd # tag=actions-common-upsert-pr-comment-v1.3.0
        with:
          token: ${{ steps.generate_token.outputs.token }}
          identifier: 'update-generated-workflows'
          body: 'Generated `verify-action-*` workflows, `ci-required.yaml` and the Codecov components in `.github/codecov.yml` have been rebuilt.'

  update-readme:
    name: Update README
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    needs: [update-builds, update-generated-workflows]
    if: needs.update-builds.outputs.changes_detected == 'false' && needs.update-generated-workflows.outputs.changes_detected == 'false'
    permissions:
      contents: write # to push readme changes
      pull-requests: write # to comment on PRs
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.head_ref }}
          token: ${{ steps.generate_token.outputs.token }}

      - name: Setup Bun
        uses: TimSchoenle/actions/actions/bun/setup-cached@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-bun-setup-cached-v1.1.11

      - name: Refresh Tags
        run: git fetch --force --tags origin

      - name: Generate Docs
        run: bun run generate-docs

      - name: Commit and Push if changed
        id: auto-commit
        uses: TimSchoenle/actions/actions/common/commit-changes@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-commit-changes-v1.5.9
        with:
          commit_message: 'docs: auto-update documentation'
          file_pattern: 'README.md SECURITY.md'
          token: ${{ steps.generate_token.outputs.token }}

      - name: Comment on PR
        if: steps.auto-commit.outputs.changes_detected == 'true' && github.event_name == 'pull_request'
        uses: TimSchoenle/actions/actions/common/upsert-pr-comment@9414b1c665d3676efe832978d4e1728cf53119fd # tag=actions-common-upsert-pr-comment-v1.3.0
        with:
          token: ${{ steps.generate_token.outputs.token }}
          identifier: 'update-readme'
          body: '`README.md` and `SECURITY.md` have been auto-updated with the latest details.'
