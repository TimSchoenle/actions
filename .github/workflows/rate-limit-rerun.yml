name: Rate Limit Re-Run

# The retry loop inside the shared Octokit rides out a *secondary* rate limit, which clears in
# seconds. It cannot ride out an exhausted hourly budget on the `ACTIONS_MAINTENANCE` installation,
# whose reset can be most of an hour away: waiting that out would hold a runner for the whole window,
# and during a release-please batch dozens of jobs would each be holding one. Those jobs therefore
# fail fast and annotate why, and this sweep picks the work back up once the window has reopened.
#
# It never re-runs on suspicion. A run is restarted only when the budget has measurably recovered and
# every one of its failed jobs carries a rate-limit annotation; anything else stays red, because a
# real failure hidden behind an automatic re-run is worse than the outage it disguises.

on:
  schedule:
    # Off the hour and off the half hour, where GitHub's scheduling backlog is deepest.
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Report what would be re-run without re-running it.'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  # Never cancel a sweep in flight: two sweeps re-running the same run is the outcome the attempt cap
  # already guards against, whereas a cancelled sweep leaves the work stranded for another 20 minutes.
  cancel-in-progress: false

permissions: {}

env:
  # `inputs` is empty on `schedule`, so the dispatch default has to be restated as a fallback here.
  DRY_RUN: ${{ inputs.dry-run || false }}

jobs:
  rerun:
    name: Re-Run Rate-Limited Jobs
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    permissions:
      contents: read # to check out the sweep script
      actions: write # to re-run the failed jobs of a rate-limited run
      checks: read # to read the annotation that says why a job failed
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # Read solely to ask `GET /rate_limit` whether the maintenance installation's budget has
      # recovered — that endpoint costs nothing against the very budget it reports, and it is the only
      # honest answer to "is it worth spending a runner yet?". Metadata is the smallest permission the
      # token can be scoped to; without any `permission-*` input it would inherit the whole
      # installation, which a probe has no business holding.
      - name: Generate Probe Token
        id: probe_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-metadata: read

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: TimSchoenle/actions/actions/bun/setup-cached@cbdcf6fd08b46059064bc9c91efa6b610a9ee7db # tag=actions-bun-setup-cached-v1.1.10

      # Every read and the re-run itself go through the ambient GITHUB_TOKEN, whose budget is
      # per-repository and so is not the one under pressure.
      - name: Re-Run Rate-Limited Jobs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RATE_LIMIT_PROBE_TOKEN: ${{ steps.probe_token.outputs.token }}
        run: bun run rerun-rate-limited
