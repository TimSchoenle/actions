# GENERATED by scripts/generate-verify.ts. Do not edit by hand.
# Run 'bun run generate-verify' to rebuild it from the sources in .github/verify/; the drift check in
# Scripts CI fails while it is out of date. See docs/verify-pipeline.md.
#
# Called by .github/workflows/verify.yaml. Every job runs only when its target is in inputs.targets.
# Targets:
#   security/codeql (.github/verify/security-codeql.yaml)
#   security/jactionlint (.github/verify/security-jactionlint.yaml)
#   security/zizmor (.github/verify/security-zizmor.yaml)
name: Verify Security

on:
  workflow_call:
    inputs:
      targets:
        description: JSON array of the targets this run verifies.
        type: string
        required: true
      cache-key:
        description: Key of the dependency cache the install job saved.
        type: string
        required: false
        default: ''
      artifact-id:
        description: ID of the artifact the build job uploaded; empty when nothing was built.
        type: string
        required: false
        default: ''
      manifest-sha256:
        description: SHA-256 of the build manifest inside that artifact.
        type: string
        required: false
        default: ''

permissions: {}

jobs:
  codeql-composite:
    name: 'Security Codeql: Test Composite Against A Fixture Crate'
    if: ${{ contains(fromJSON(inputs.targets), 'security/codeql') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            static.rust-lang.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the bundles the build job built from this commit; dist/ is not committed.
      - name: Install Built Actions
        uses: TimSchoenle/actions/actions/release/install-built-actions@49acdef9979f343817ec2a85ddd25e5f34befc8b # tag=actions-release-install-built-actions-v1.1.1
        with:
          artifact-id: ${{ inputs.artifact-id }}
          expected-manifest-sha256: ${{ inputs.manifest-sha256 }}

      - name: Run Test (Fixture Crate)
        id: analysis
        uses: ./actions/security/codeql # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        env:
          # On pull_request events CodeQL restricts results to the lines the PR changed, so any PR
          # that does not touch the fixture yields no result in src/lib.rs and the assertion below
          # fails. The fixture must be analysed in full regardless of the diff.
          CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'
        with:
          language: rust
          upload: 'false'
          paths-ignore: |
            # Excluded by the caller, beside the shared test paths.
            actions/security/codeql/e2e/fixture/src/vendored.rs

      - name: Assert Fixture Crate
        env:
          CONFIG: ${{ steps.analysis.outputs.config }}
          CATEGORY: ${{ steps.analysis.outputs.category }}
          SARIF_OUTPUT: ${{ steps.analysis.outputs.sarif-output }}
          SARIF_ID: ${{ steps.analysis.outputs.sarif-id }}
        run: |
          set -euo pipefail

          [ "$CATEGORY" = "/language:rust" ] || { echo "::error::category '$CATEGORY', expected '/language:rust'"; exit 1; }
          [ -z "$SARIF_ID" ] || { echo "::error::upload: false uploaded a SARIF ($SARIF_ID)"; exit 1; }
          jq -e '."paths-ignore" | index("**/tests/**") != null' <<<"$CONFIG" > /dev/null \
            || { echo "::error::the configuration does not exclude the shared test paths: $CONFIG"; exit 1; }

          shopt -s nullglob
          sarifs=("$SARIF_OUTPUT"/*.sarif)
          [ "${#sarifs[@]}" -eq 1 ] || { echo "::error::expected one SARIF under '$SARIF_OUTPUT', found ${#sarifs[@]}"; exit 1; }

          uris=$(jq -r '[.runs[] | (.results // [])[] | .locations[].physicalLocation.artifactLocation.uri] | unique | .[]' "${sarifs[0]}")
          echo "Files with results:"
          echo "$uris"

          grep -qx 'actions/security/codeql/e2e/fixture/src/lib.rs' <<<"$uris" \
            || { echo "::error::CodeQL reported nothing in src/lib.rs, so the analysis proves nothing"; exit 1; }
          ! grep -q 'fixture/tests/' <<<"$uris" || { echo "::error::a result in tests/ survived the shared test paths"; exit 1; }
          ! grep -q 'fixture/src/vendored.rs' <<<"$uris" || { echo "::error::a result in vendored.rs survived paths-ignore"; exit 1; }

          echo "✅ src/lib.rs reported; tests/leak.rs and src/vendored.rs excluded"

      # A negated pattern must fail in the prepare step, before init downloads anything.
      - name: Run Test (Refused Pattern)
        id: refused
        continue-on-error: true
        uses: ./actions/security/codeql # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          language: rust
          upload: 'false'
          paths-ignore: '!actions/security/codeql/e2e/fixture/src/lib.rs'

      - name: Assert Refused Pattern
        env:
          OUTCOME: ${{ steps.refused.outcome }}
          CONFIG: ${{ steps.refused.outputs.config }}
          SARIF_OUTPUT: ${{ steps.refused.outputs.sarif-output }}
        run: |
          set -euo pipefail

          [ "$OUTCOME" = "failure" ] || { echo "::error::a negated pattern did not fail the step ($OUTCOME)"; exit 1; }
          [ -z "$CONFIG" ] || { echo "::error::a refused input still produced a configuration"; exit 1; }
          [ -z "$SARIF_OUTPUT" ] || { echo "::error::CodeQL ran after the inputs were refused"; exit 1; }

          echo "✅ The negated pattern failed before CodeQL started"

  jactionlint-install:
    name: 'Security Jactionlint: Install and check a clean file (${{ matrix.os }})'
    if: ${{ contains(fromJSON(inputs.targets), 'security/jactionlint') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read # to fetch code
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Test (Clean)
        id: clean
        uses: ./actions/security/jactionlint # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          config-file: actions/security/jactionlint/test/empty.yaml
          files: actions/security/jactionlint/test/clean.yml
          upload: 'false'

      - name: Assert Clean
        shell: bash
        env:
          VERSION: ${{ steps.clean.outputs.version }}
          EXECUTABLE: ${{ steps.clean.outputs.executable }}
          EXIT_CODE: ${{ steps.clean.outputs.exit-code }}
          FINDINGS: ${{ steps.clean.outputs.findings }}
          SARIF_FILE: ${{ steps.clean.outputs.sarif-file }}
          SARIF_ID: ${{ steps.clean.outputs.sarif-id }}
        run: |
          set -euo pipefail

          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version '$VERSION' is not vMAJOR.MINOR.PATCH"; exit 1; }
          "$EXECUTABLE" --version | grep -qF "${VERSION#v}" || { echo "::error::$EXECUTABLE is not jactionlint $VERSION"; exit 1; }
          [ "$EXIT_CODE" = "0" ] || { echo "::error::exit-code '$EXIT_CODE' on the clean fixture, expected 0"; exit 1; }
          [ "$FINDINGS" = "0" ] || { echo "::error::findings '$FINDINGS' on the clean fixture, expected 0"; exit 1; }
          [ -z "$SARIF_ID" ] || { echo "::error::upload: false uploaded a SARIF ($SARIF_ID)"; exit 1; }
          case "$SARIF_FILE" in
            "$RUNNER_TEMP"/*) ;;
            *) echo "::error::sarif-file '$SARIF_FILE' is not under RUNNER_TEMP"; exit 1 ;;
          esac
          jq -e '.version == "2.1.0" and ([.runs[].results[]] | length) == 0' "$SARIF_FILE" > /dev/null \
            || { echo "::error::sarif-file is not an empty SARIF 2.1.0 log"; exit 1; }

          echo "✅ $VERSION installed and checked the clean fixture with an empty SARIF"

  # github.com is pointed at a closed port after checkout, so both release downloads fail and the
  # install has to go through the REST API asset endpoint.
  fallback:
    name: 'Security Jactionlint: Install through the REST API when the release download fails (${{ matrix.os }})'
    if: ${{ contains(fromJSON(inputs.targets), 'security/jactionlint') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read # to fetch code
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Block github.com
        shell: bash
        run: |
          set -euo pipefail
          echo '127.0.0.1 github.com' | sudo tee -a /etc/hosts > /dev/null
          if [[ "$RUNNER_OS" == macOS ]]; then
            sudo dscacheutil -flushcache
            sudo killall -HUP mDNSResponder
          fi
          if curl -fsS --max-time 10 -o /dev/null https://github.com/; then
            echo "::error::github.com is still reachable"
            exit 1
          fi

      - name: Run Test (Fallback)
        id: fallback
        uses: ./actions/security/jactionlint # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          config-file: actions/security/jactionlint/test/empty.yaml
          files: actions/security/jactionlint/test/clean.yml
          upload: 'false'

      - name: Assert Fallback
        shell: bash
        env:
          VERSION: ${{ steps.fallback.outputs.version }}
          EXECUTABLE: ${{ steps.fallback.outputs.executable }}
          EXIT_CODE: ${{ steps.fallback.outputs.exit-code }}
        run: |
          set -euo pipefail

          "$EXECUTABLE" --version | grep -qF "${VERSION#v}" || { echo "::error::$EXECUTABLE is not jactionlint $VERSION"; exit 1; }
          [ "$EXIT_CODE" = "0" ] || { echo "::error::exit-code '$EXIT_CODE' on the clean fixture, expected 0"; exit 1; }

          echo "✅ $VERSION installed through the REST API with github.com unreachable"

  cases:
    name: 'Security Jactionlint: Findings, configuration and input validation'
    if: ${{ contains(fromJSON(inputs.targets), 'security/jactionlint') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Test (Finding, Fails)
        id: finding
        continue-on-error: true
        uses: ./actions/security/jactionlint # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          config-file: actions/security/jactionlint/test/empty.yaml
          files: actions/security/jactionlint/test/finding.yml
          upload: 'false'

      - name: Run Test (Finding, Report Only)
        id: report
        uses: ./actions/security/jactionlint # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          config-file: actions/security/jactionlint/test/empty.yaml
          files: |
            # Comments and blank lines are skipped.

            actions/security/jactionlint/test/finding.yml
          fail-on-findings: 'false'
          upload: 'false'

      - name: Assert Finding
        shell: bash
        env:
          OUTCOME: ${{ steps.finding.outcome }}
          EXIT_CODE: ${{ steps.report.outputs.exit-code }}
          FINDINGS: ${{ steps.report.outputs.findings }}
          SARIF_FILE: ${{ steps.report.outputs.sarif-file }}
        run: |
          set -euo pipefail

          [ "$OUTCOME" = "failure" ] || { echo "::error::the finding fixture ended '$OUTCOME', expected failure"; exit 1; }
          [ "$EXIT_CODE" = "1" ] || { echo "::error::exit-code '$EXIT_CODE', expected 1"; exit 1; }
          [ "$FINDINGS" = "1" ] || { echo "::error::findings '$FINDINGS', expected 1"; exit 1; }
          jq -e '[.runs[].results[].ruleId] == ["missing-timeout"]' "$SARIF_FILE" > /dev/null \
            || { echo "::error::the SARIF does not hold exactly the missing-timeout finding"; exit 1; }

          echo "✅ The finding failed the job by default and was reported without failing when asked"

      - name: Run Test (Configuration File)
        id: config
        uses: ./actions/security/jactionlint # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          files: actions/security/jactionlint/test/finding.yml
          config-file: actions/security/jactionlint/test/jactionlint.yaml
          upload: 'false'

      - name: Assert Configuration File
        shell: bash
        env:
          EXIT_CODE: ${{ steps.config.outputs.exit-code }}
          FINDINGS: ${{ steps.config.outputs.findings }}
        run: |
          set -euo pipefail

          [ "$EXIT_CODE" = "0" ] && [ "$FINDINGS" = "0" ] \
            || { echo "::error::config-file did not turn the finding off (exit-code '$EXIT_CODE', findings '$FINDINGS')"; exit 1; }

          echo "✅ config-file was read"

      - name: Run Test (Default Profile Is Pedantic)
        id: pedantic
        uses: ./actions/security/jactionlint # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          config-file: actions/security/jactionlint/test/empty.yaml
          files: actions/security/jactionlint/test/pedantic.yml
          fail-on-findings: 'false'
          upload: 'false'

      - name: Run Test (Profile Default)
        id: profile-default
        uses: ./actions/security/jactionlint # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          config-file: actions/security/jactionlint/test/empty.yaml
          files: actions/security/jactionlint/test/pedantic.yml
          profile: default
          upload: 'false'

      - name: Assert Profiles
        shell: bash
        env:
          PEDANTIC_EXIT_CODE: ${{ steps.pedantic.outputs.exit-code }}
          PEDANTIC_SARIF: ${{ steps.pedantic.outputs.sarif-file }}
          DEFAULT_EXIT_CODE: ${{ steps.profile-default.outputs.exit-code }}
        run: |
          set -euo pipefail

          [ "$PEDANTIC_EXIT_CODE" = "1" ] || { echo "::error::without a profile input, exit-code '$PEDANTIC_EXIT_CODE', expected 1 from the pedantic profile"; exit 1; }
          jq -e '[.runs[].results[].ruleId] == ["require-shell"]' "$PEDANTIC_SARIF" > /dev/null \
            || { echo "::error::the pedantic run does not hold exactly the require-shell finding"; exit 1; }
          [ "$DEFAULT_EXIT_CODE" = "0" ] || { echo "::error::profile: default reported findings (exit-code '$DEFAULT_EXIT_CODE')"; exit 1; }

          echo "✅ The default profile is pedantic, and the profile input overrides it"

      - name: Run Test (Invalid Profile)
        id: invalid
        continue-on-error: true
        uses: ./actions/security/jactionlint # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          files: actions/security/jactionlint/test/clean.yml
          profile: strict
          upload: 'false'

      - name: Run Test (Leading Dash)
        id: dash
        continue-on-error: true
        uses: ./actions/security/jactionlint # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          files: --help
          upload: 'false'

      - name: Assert Refusals
        shell: bash
        env:
          INVALID_OUTCOME: ${{ steps.invalid.outcome }}
          INVALID_EXIT_CODE: ${{ steps.invalid.outputs.exit-code }}
          DASH_OUTCOME: ${{ steps.dash.outcome }}
          DASH_EXIT_CODE: ${{ steps.dash.outputs.exit-code }}
        run: |
          set -euo pipefail

          [ "$INVALID_OUTCOME" = "failure" ] && [ -z "$INVALID_EXIT_CODE" ] \
            || { echo "::error::profile 'strict' was not refused before jactionlint ran"; exit 1; }
          [ "$DASH_OUTCOME" = "failure" ] && [ -z "$DASH_EXIT_CODE" ] \
            || { echo "::error::a files line starting with - was not refused"; exit 1; }

          echo "✅ Invalid inputs were refused before jactionlint ran"

  zizmor-composite:
    name: 'Security Zizmor: Test Composite Against The Real Image'
    if: ${{ contains(fromJSON(inputs.targets), 'security/zizmor') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to fetch code, and for zizmor's online audits
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the bundles the build job built from this commit; dist/ is not committed.
      - name: Install Built Actions
        uses: TimSchoenle/actions/actions/release/install-built-actions@49acdef9979f343817ec2a85ddd25e5f34befc8b # tag=actions-release-install-built-actions-v1.1.1
        with:
          artifact-id: ${{ inputs.artifact-id }}
          expected-manifest-sha256: ${{ inputs.manifest-sha256 }}

      - name: Run Test (Clean, Online)
        id: clean
        uses: ./actions/security/zizmor # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          inputs: actions/security/zizmor/e2e/fixture/clean.yml
          upload: 'false'

      - name: Assert Clean
        env:
          FINDINGS: ${{ steps.clean.outputs.findings }}
          FAILING: ${{ steps.clean.outputs.failing }}
          SARIF_FILE: ${{ steps.clean.outputs.sarif-file }}
          SARIF_ID: ${{ steps.clean.outputs.sarif-id }}
        run: |
          set -euo pipefail

          [ "$FINDINGS" = "0" ] || { echo "::error::findings '$FINDINGS' on the clean fixture, expected 0"; exit 1; }
          [ "$FAILING" = "0" ] || { echo "::error::failing '$FAILING' on the clean fixture, expected 0"; exit 1; }
          [ -z "$SARIF_ID" ] || { echo "::error::upload: false uploaded a SARIF ($SARIF_ID)"; exit 1; }
          case "$SARIF_FILE" in
            "$RUNNER_TEMP"/*) ;;
            *) echo "::error::sarif-file '$SARIF_FILE' is not under RUNNER_TEMP"; exit 1 ;;
          esac
          jq -e '.version == "2.1.0" and (.runs[0].results | length) == 0' "$SARIF_FILE" > /dev/null \
            || { echo "::error::sarif-file is not an empty SARIF 2.1.0 log"; exit 1; }

          echo "✅ The clean fixture passed with an empty SARIF and nothing uploaded"

      - name: Run Test (Finding, Default Threshold)
        id: finding
        continue-on-error: true
        uses: ./actions/security/zizmor # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          inputs: actions/security/zizmor/e2e/fixture/finding.yml
          online-audits: 'false'
          upload: 'false'

      - name: Run Test (Finding, Threshold None)
        id: finding-none
        uses: ./actions/security/zizmor # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          inputs: actions/security/zizmor/e2e/fixture/finding.yml
          online-audits: 'false'
          upload: 'false'
          fail-on-severity: none

      - name: Assert Finding
        env:
          OUTCOME: ${{ steps.finding.outcome }}
          FINDINGS: ${{ steps.finding-none.outputs.findings }}
          FAILING: ${{ steps.finding-none.outputs.failing }}
        run: |
          set -euo pipefail

          [ "$OUTCOME" = "failure" ] || { echo "::error::the finding fixture did not fail the default threshold ($OUTCOME)"; exit 1; }
          [ "$FINDINGS" -gt 0 ] || { echo "::error::findings '$FINDINGS' with fail-on-severity: none, expected more than 0"; exit 1; }
          [ "$FAILING" = "0" ] || { echo "::error::failing '$FAILING' with fail-on-severity: none, expected 0"; exit 1; }

          echo "✅ $FINDINGS finding(s) failed the default threshold and passed with none"

      # Valid YAML that is not a workflow passes the byte order mark scan, so this is zizmor's own strict
      # collection failing inside the container, and the exit code mapped on the way out.
      - name: Run Test (Unparseable, Strict)
        id: invalid
        continue-on-error: true
        uses: ./actions/security/zizmor # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          inputs: actions/security/zizmor/e2e/fixture/invalid.yml
          online-audits: 'false'
          upload: 'false'

      - name: Assert Unparseable
        env:
          OUTCOME: ${{ steps.invalid.outcome }}
          SARIF_FILE: ${{ steps.invalid.outputs.sarif-file }}
        run: |
          set -euo pipefail

          [ "$OUTCOME" = "failure" ] || { echo "::error::an unparseable workflow did not fail strict collection ($OUTCOME)"; exit 1; }
          [ -z "$SARIF_FILE" ] || { echo "::error::a failed collection still published a SARIF ($SARIF_FILE)"; exit 1; }

          echo "✅ zizmor's strict collection failed the run and nothing reached the upload"

      - name: Write Byte Order Mark Fixture
        env:
          CLEAN: actions/security/zizmor/e2e/fixture/clean.yml
        run: |
          set -euo pipefail

          mkdir -p .zizmor-e2e-bom/.github/workflows
          cp "$CLEAN" .zizmor-e2e-bom/.github/workflows/clean.yml
          { printf '\xef\xbb\xbf'; cat "$CLEAN"; } > .zizmor-e2e-bom/.github/workflows/bom.yml
          head -c 3 .zizmor-e2e-bom/.github/workflows/bom.yml | od -An -tx1

      - name: Run Test (Byte Order Mark, Strict)
        id: bom
        continue-on-error: true
        uses: ./actions/security/zizmor # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          inputs: .zizmor-e2e-bom
          online-audits: 'false'
          upload: 'false'

      - name: Run Test (Byte Order Mark, Strict Off)
        id: bom-lenient
        uses: ./actions/security/zizmor # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          inputs: .zizmor-e2e-bom
          online-audits: 'false'
          upload: 'false'
          strict-collection: 'false'

      - name: Assert Byte Order Mark
        env:
          OUTCOME: ${{ steps.bom.outcome }}
          SARIF_FILE: ${{ steps.bom.outputs.sarif-file }}
          LENIENT_FINDINGS: ${{ steps.bom-lenient.outputs.findings }}
        run: |
          set -euo pipefail

          [ "$OUTCOME" = "failure" ] || { echo "::error::a workflow with a byte order mark did not fail ($OUTCOME)"; exit 1; }
          [ -z "$SARIF_FILE" ] || { echo "::error::zizmor ran although the byte order mark scan failed ($SARIF_FILE)"; exit 1; }
          [ "$LENIENT_FINDINGS" = "0" ] || { echo "::error::strict-collection: false reported '$LENIENT_FINDINGS' finding(s), expected 0"; exit 1; }

          echo "✅ The BOM failed the strict run before zizmor started, and strict-collection: false skipped it"
