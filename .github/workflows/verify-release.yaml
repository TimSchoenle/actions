          [[ "$WRONG_MANIFEST" == 'failure' ]] || { echo "::error::a wrong manifest hash was accepted"; exit 1; }
          [[ "$WRONG_DIGEST" == 'failure' ]] || { echo "::error::a wrong artifact digest was accepted"; exit 1; }
