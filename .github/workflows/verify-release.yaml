          expected-manifest-sha256: ${{ inputs.manifest-sha256 }}

      - name: Write Demo Actions
        run: |
          set -euo pipefail
          mkdir -p round-trip/actions/demo round-trip/.github/actions/second
          printf "runs:\n  using: 'node24'\n  main: 'dist/index.js'\n" > round-trip/actions/demo/action.yml
          printf "runs:\n  using: 'node24'\n  main: 'dist/index.js'\n" > round-trip/.github/actions/second/action.yml

