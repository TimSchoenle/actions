        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/publish-dry-run-notes.md"
          printf '* dry run\n' > "$notes"
          releases="$(jq -cn --arg notes "$notes" '[{consumerTag: "publish-build-commit-e2e-dry-run-v0.0.0", releaseName: "dry run", notesFile: $notes, path: "actions/publish-dry-run-demo"}]')"
