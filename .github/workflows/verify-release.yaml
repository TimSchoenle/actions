          token: ${{ github.token }}
          source-sha: ${{ github.sha }}
          artifact-id: ${{ needs.dry-run-build.outputs.artifact-id }}
          expected-artifact-digest: ${{ needs.dry-run-build.outputs.artifact-digest }}
          expected-manifest-sha256: ${{ needs.dry-run-build.outputs.manifest-sha256 }}
          releases-branch: ''
          releases: ${{ steps.notes.outputs.releases }}
          dry-run: 'true'

