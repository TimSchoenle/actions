          CROSS_CHECK: ${{ steps.cross-check.outcome }}
        run: |
          set -euo pipefail
          [[ -z "$BUILD_SHA" ]] || { echo "::error::a dry run reported build commit $BUILD_SHA"; exit 1; }
          [[ "$TREE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::tree-sha is '$TREE_SHA'"; exit 1; }
          [[ "$CREATED" == '[]' ]] || { echo "::error::a dry run created $CREATED"; exit 1; }
          [[ "$CROSS_CHECK" == 'failure' ]] || { echo "::error::disagreeing builds were accepted"; exit 1; }

