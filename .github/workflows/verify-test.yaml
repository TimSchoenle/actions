# GENERATED by scripts/generate-verify.ts. Do not edit by hand.
# Run 'bun run generate-verify' to rebuild it from the sources in .github/verify/; the drift check in
# Scripts CI fails while it is out of date. See docs/verify-pipeline.md.
#
# Called by .github/workflows/verify.yaml. Every job runs only when its target is in inputs.targets.
# Targets:
#   test/setup-e2e (.github/verify/test-setup-e2e.yaml)
name: Verify Test

on:
  workflow_call:
    inputs:
      targets:
        description: JSON array of the targets this run verifies.
        type: string
        required: true
      cache-key:
        description: Key of the dependency cache the install job saved.
        type: string
        required: false
        default: ''
      artifact-id:
        description: ID of the artifact the build job uploaded; empty when nothing was built.
        type: string
        required: false
        default: ''
      manifest-sha256:
        description: SHA-256 of the build manifest inside that artifact.
        type: string
        required: false
        default: ''
    secrets:
      ACTIONS_TEST_BOT_APP_ID:
        required: false
      ACTIONS_TEST_BOT_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  setup-e2e-verify:
    environment:
      name: ci-e2e
      deployment: false
    name: 'Test Setup-e2e: Verify Setup-e2e'
    if: ${{ contains(fromJSON(inputs.targets), 'test/setup-e2e') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to fetch code
    env:
      TEST_OWNER: TimSchoenle
      TEST_REPO_NAME: actions-testing
      TEST_REPO: TimSchoenle/actions-testing
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run setup-e2e
        id: setup
        uses: ./actions/test/setup-e2e # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          app_id: ${{ secrets.ACTIONS_TEST_BOT_APP_ID }}
          private_key: ${{ secrets.ACTIONS_TEST_BOT_PRIVATE_KEY }}
          test_repo: ${{ env.TEST_REPO }}
          test_owner: ${{ env.TEST_OWNER }}
          test_repo_name: ${{ env.TEST_REPO_NAME }}
          test_repo_checkout_path: 'test'
          current_repo_checkout_path: 'tmp/actions-code'

      - name: Verify Token Generation
        shell: bash
        env:
          TOKEN: ${{ steps.setup.outputs.token }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Token was not generated"
            exit 1
          fi
          echo "✅ Token generated successfully"

      - name: Verify Test Repo Checkout
        shell: bash
        env:
          TEST_REPO_CHECKOUT_PATH: ${{ steps.setup.outputs.test_repo_checkout_path }}
          TEST_REPO: ${{ env.TEST_REPO }}
        run: |
          # Check if we are in the test repo (based on origin remote or file existence)
          cd "$TEST_REPO_CHECKOUT_PATH"
          REMOTE=$(git remote get-url origin)
          if [[ "$REMOTE" != *"$TEST_REPO"* ]]; then
             echo "::error::Current directory is not the test repository. Remote: $REMOTE"
             exit 1
          fi
          echo "✅ Test repo checked out successfully"

      - name: Verify Actions Code Checkout
        shell: bash
        env:
          CURRENT_REPO_CHECKOUT_PATH: ${{ steps.setup.outputs.current_repo_checkout_path }}
        run: |
          if [ ! -d  "$CURRENT_REPO_CHECKOUT_PATH" ]; then
            echo "::error::tmp/actions-code directory does not exist"
            exit 1
          fi

          # Check if it contains the action we just ran (circular check)
          if [ ! -f "$CURRENT_REPO_CHECKOUT_PATH/actions/test/setup-e2e/action.yaml" ]; then
             echo "::error::tmp/actions-code does not appear to contain the actions code"
             exit 1
          fi
          echo "✅ Actions code checked out successfully"

      - name: Verify Git Ignore
        shell: bash
        env:
          CURRENT_REPO_CHECKOUT_PATH: ${{ steps.setup.outputs.current_repo_checkout_path }}
          TEST_REPO_CHECKOUT_PATH: ${{ steps.setup.outputs.test_repo_checkout_path }}
        run: |
          if ! grep -q "$CURRENT_REPO_CHECKOUT_PATH" "$TEST_REPO_CHECKOUT_PATH/.git/info/exclude"; then
             echo "::error::tmp/actions-code not found in $TEST_REPO_CHECKOUT_PATH/.git/info/exclude"
             exit 1
          fi
          echo "✅ .git/info/exclude updated successfully"
