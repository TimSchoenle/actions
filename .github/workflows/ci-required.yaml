name: CI Required

# Single aggregate gate for the path-filtered verify-action-* and verify-config-*
# workflows.
#
# Each of those workflows is filtered with `on.pull_request.paths`, so it only
# runs when its own action or config changes. That makes the individual verify jobs
# unusable as *required* status checks: a PR that does not touch a given action
# never produces that check, and a required-but-missing check blocks the PR
# forever ("Expected — waiting for status to be reported").
#
# This workflow publishes one `ci-required` commit status that summarizes every
# verify check that actually ran on the PR head. Only `ci-required` needs to be
# marked required in branch protection.
#
# Trust model
# -----------
# * `workflow_run` is the only trigger. GitHub runs the copy of this file on the
#   default branch for it, never the pull request's copy, and gives it a
#   read/write token even for a pull request from a fork. The `gate` job is the
#   only publisher of `ci-required`. It evaluates each time a watched workflow
#   completes, and the last evaluation for a head commit is the one that stands.
# * There is deliberately no `pull_request` trigger. That event runs the pull
#   request's own copy of this file, so nothing it posted could be trusted, and a
#   second publisher racing the gate could land after the verdict and leave the
#   context stuck. Until the first evaluation reports, the pull request shows the
#   context as expected, which blocks merging just as `pending` would.
# * Every pull request reaches a `workflow_run` evaluation, including one that
#   triggers no verify workflow: the watch list also holds the anchor workflows
#   named in ANCHOR_WORKFLOW_FILES (scripts/lib/ci-required.ts), which run on every
#   pull request without a path filter.
# * The evaluation reports `pending` while any verify workflow run for the head
#   commit has not completed, so an early-finishing workflow can never report
#   success for a commit whose verify workflows are still running. The run that
#   finishes last triggers the evaluation that reports the verdict.
# * Registration barrier: a verify workflow run GitHub has not created yet is
#   neither unfinished nor failed, so counting runs alone would let an anchor that
#   completes first report success too early. The evaluation therefore works out
#   which verify workflows apply to each open pull request whose head is the
#   commit, from its changed files and the `on.pull_request` filters of the
#   default-branch copy of each enabled verify workflow, and reports `pending`
#   until every one of them has a run on the commit. That run's completion
#   triggers the next evaluation. When none applies, the status says so instead
#   of reporting a count of passed checks. See scripts/lib/ci-required-registration.ts.
#
# Known limits
# ------------
# * Any workflow the pull request adds or edits can post a `ci-required` status
#   with the job token, and that status is attributed to the same GitHub Actions
#   app the ruleset binds the context to. This file cannot prevent that. The
#   ruleset's required approval, which a new push dismisses, is the control that
#   covers it, as it is for every other required check a same-repository pull
#   request could rewrite. A fork pull request gets a read-only token and
#   cannot post statuses at all.
# * The evaluation trusts the verify workflows that ran on the head commit. A pull
#   request that empties a verify workflow's jobs changes what runs, the same way
#   it could rewrite `Lint & Test`; review covers it. One that narrows a verify
#   workflow's `paths:` so it no longer runs leaves ci-required pending, since the
#   barrier reads the default-branch filters; merging it needs a bypass.
# * GitHub evaluates path filters against the first 300 changed files only, in an
#   order the REST API does not reveal. For a pull request with more changed files
#   the barrier cannot predict which verify workflows run and stands down; the
#   evaluation then gates on the verify workflow runs that exist.
#
# The underlying ensure-actions-are-executed action treats a check that never
# started as "not a failure", so path-filtered-out workflows do not wedge the
# gate, while a check that started but did not succeed fails it.

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- Runs the default-branch copy, checks out nothing and executes no code from the triggering run; it only reads check and workflow-run states and publishes an aggregate commit status for the same head SHA.
    # GENERATED — do not edit by hand. Run `bun run generate-ci-required` to
    # rebuild this list from the verify-action-*.yaml and verify-config-*.yaml
    # workflows on disk plus the anchor workflows. The ci-required drift test
    # fails CI if it is out of sync.
    # <<< generated: verify-workflows
    workflows:
      - Scripts CI
      - Verify Action Common Render Template And Commit
      - Verify Bun Setup Cached
      - Verify Common Close-pull-request
      - Verify Common Commit-changes
      - Verify Common Commit-patch
      - Verify Common Create Pull Request
      - Verify Common Create-branch
      - Verify Common Create-patch
      - Verify Common Delete-branch
      - Verify Common Get-app-git-identity
      - Verify Common Modify-yaml
      - Verify Common Read-yaml
      - Verify Common Readme-variables
      - Verify Common Render-template
      - Verify Common Setup-app-git-identity
      - Verify Common Upsert-issue
      - Verify Common Upsert-pr-comment
      - Verify Config Renovate
      - Verify Docker Image-check
      - Verify Docker Image-check-summary
      - Verify Helm Apply-chart-updates
      - Verify Helm Update Chart Version
      - Verify Helper Resolve-base-branch
      - Verify Helper Verify-branch-name
      - Verify Helper Verify-commit-authors
      - Verify Java-gradle Auto-spotless
      - Verify Java-gradle Coverage-codecov
      - Verify Java-gradle Setup-base-environment
      - Verify Maintenance Auto-approve-pr
      - Verify Maintenance Auto-rebase
      - Verify Maintenance Ensure-actions-are-executed
      - Verify Maintenance Timed-auto-merge
      - Verify Maintenance Wipe-cache
      - Verify Rust Auto-format
      - Verify Rust Config-contract
      - Verify Rust Coverage-codecov
      - Verify Security Codeql
      - Verify Security Zizmor
      - Verify Terrace Helm Check
      - Verify Terrace Helm Diff
      - Verify Terrace Helm Sync
      - Verify Terrace Image
      - Verify Terrace Setup
      - Verify Test Setup-e2e
    # >>> generated: verify-workflows
    types:
      - completed

concurrency:
  # Collapse every evaluation for the same head commit so only the most recent one
  # posts the final status.
  group: ci-required-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  gate:
    name: Aggregate verify checks
    if: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read # list the workflows and the workflow runs for the head commit, and the ensure-actions-are-executed fallback
      checks: read # read the verify check run states
      contents: read # check out the default branch, whose verify workflow filters the barrier reads
      pull-requests: read # find the pull requests whose head is the commit, and their changed files
      statuses: write # publish the ci-required commit status
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - name: Resolve target commit
        id: target
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve the head commit of the triggering workflow run."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # The default branch, never the triggering run's head: the registration script
      # and the verify workflow filters it reads are trusted only from there.
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Bun
        uses: TimSchoenle/actions/actions/bun/setup-cached@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-bun-setup-cached-v1.1.11

      # A verify workflow whose summary job has not started yet has no `CI Summary:`
      # check run, which the aggregation below cannot tell apart from a workflow the
      # path filters skipped. Its workflow run can, and a workflow that applies but
      # has no run at all has not been registered yet.
      - name: Check verify workflow registration
        id: registration
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.target.outputs.sha }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: bun run ci-required-registration

      - name: Aggregate verify checks
        id: verify
        uses: TimSchoenle/actions/actions/maintenance/ensure-actions-are-executed@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-maintenance-ensure-actions-are-executed-v1.5.9
        with:
          token: ${{ github.token }}
          ref: ${{ steps.target.outputs.sha }}
          # Each verify-action-* workflow exposes exactly one `CI Summary: <name>`
          # check via its summary job, so this single stable pattern covers every
          # current and future verify workflow without edits here.
          checks: |
            /^CI Summary:/
          error_on_failure: 'false'

      - name: Publish ci-required status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.target.outputs.sha }}
          SCOPE: ${{ steps.registration.outputs.scope }}
          APPLICABLE: ${{ steps.registration.outputs.applicable }}
          MISSING: ${{ steps.registration.outputs.missing }}
          MISSING_WORKFLOWS: ${{ steps.registration.outputs.missing_workflows }}
          UNFINISHED: ${{ steps.registration.outputs.unfinished }}
          EXPECTED: ${{ steps.registration.outputs.expected }}
          MATCHED: ${{ steps.verify.outputs.matched_checks_count }}
          FAILED: ${{ steps.verify.outputs.failed_checks_count }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          # The registration step always writes these; an empty one is a broken
          # step, not a zero, so it must not read as "nothing to wait for".
          for value in "$SCOPE" "$APPLICABLE" "$MISSING" "$UNFINISHED" "$EXPECTED"; do
            if [[ -z "$value" ]]; then
              echo "::error::The registration step did not report its outputs."
              exit 1
            fi
          done
          matched="${MATCHED:-0}"
          failed="${FAILED:-0}"

          if [[ "$SCOPE" == "unresolved" ]]; then
            # A pull_request run whose pull request is not open at this head:
            # the barrier cannot be evaluated, so fail closed. Re-run to retry.
            state="failure"
            description="No open pull request has head ${SHA:0:7}; re-run to retry."
          elif [[ "$MISSING" -gt 0 ]]; then
            # Not a verdict: the missing run's completion triggers the next evaluation.
            echo "::notice::Applicable verify workflows without a run yet: ${MISSING_WORKFLOWS}"
            state="pending"
            description="Waiting for ${MISSING} applicable verify workflow(s) to start."
          elif [[ "$UNFINISHED" -gt 0 ]]; then
            # Not a verdict: the run that finishes last triggers the evaluation that gives one.
            state="pending"
            description="Waiting for ${UNFINISHED} verify workflow run(s) to finish."
          elif [[ "$EXPECTED" -gt 0 && "$matched" -eq 0 ]]; then
            # A verify workflow ran, so at least one matching check must exist at
            # $SHA. Zero matches means the ref or the check patterns are
            # misconfigured: fail loudly instead of silently green.
            state="failure"
            description="No verify checks found at ${SHA:0:7}; check ref/patterns."
          elif [[ "$failed" -gt 0 ]]; then
            state="failure"
            description="${failed} verify check(s) not in the expected state."
          elif [[ "$SCOPE" == "pull-request" && "$APPLICABLE" -eq 0 && "$matched" -eq 0 ]]; then
            state="success"
            description="No verify workflow applies to this change."
          else
            state="success"
            description="All ${matched} verify check(s) passed."
          fi

          echo "::notice::ci-required=${state} for ${SHA} (${description})"

          gh api -X POST "repos/${REPO}/statuses/${SHA}" \
            -f state="${state}" \
            -f context="ci-required" \
            -f description="${description}" \
            -f target_url="${RUN_URL}" >/dev/null

          if [[ "$state" == "failure" ]]; then
            exit 1
          fi
