        run: |
          set -euo pipefail
          ACTUAL_BRANCH=$(gh pr view "$PR_NUMBER" --repo "$TEST_REPO" --json headRefName --jq '.headRefName')
          [ "$ACTUAL_BRANCH" = "$EXPECTED_BRANCH" ] || { echo "::error::Branch mismatch: expected '$EXPECTED_BRANCH', got '$ACTUAL_BRANCH'"; exit 1; }
          echo "✅ Custom branch prefix verified: $ACTUAL_BRANCH"

      - name: Cleanup Base Branch
        if: always()
        uses: TimSchoenle/actions/actions/common/delete-branch@f7fee33b242c9a529c5246415d29d9d23e511fd3 # tag=actions-common-delete-branch-v1.3.0
        with:
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          branch_name: ${{ steps.base-branch.outputs.branch }}

      # Guarded, not just `always()`: a run that failed before opening a PR has no number to close, and
      # closing "nothing" would report a second, misleading failure on top of the real one.
      - name: Cleanup PR
        if: always() && steps.update.outputs.pr_number != ''
        uses: TimSchoenle/actions/actions/common/close-pull-request@9fbc10ef6fd97b85a5164a1a19de78a24f130879 # tag=actions-common-close-pull-request-v1.3.0
        with:
