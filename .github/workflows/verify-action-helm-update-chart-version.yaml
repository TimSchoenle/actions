name: Verify Helm Update Chart Version

on:
  push:
    branches:
      - main
    paths:
      - 'actions/helm/update-chart-version/**'
      - '.github/workflows/verify-action-helm-update-chart-version.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'actions/helm/update-chart-version/**'
      - '.github/workflows/verify-action-helm-update-chart-version.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # to read content

env:
  TEST_OWNER: TimSchoenle
  TEST_REPO_NAME: actions-testing
  TEST_REPO: TimSchoenle/actions-testing
  TEST_ID: helm-update-test-${{ github.run_number }}-${{ github.run_attempt }}
  # A chart with one image still goes through the templated surface: it is a one-entry map.
  SINGLE_IMAGE: '{"image.tag": {"tag": "v2.0.0", "digest": "sha256:abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890"}}'

jobs:
  test-full-update:
    environment:
      name: ci-e2e
      deployment: false
    name: 'Test: full chart version update and PR creation'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Setup E2E Test Environment
        id: setup
        uses: TimSchoenle/actions/actions/test/setup-e2e@9aabf0be4b0008aa5bdc479b556851c3a5c54d93 # tag=actions-test-setup-e2e-v1.2.2
        with:
          app_id: ${{ secrets.ACTIONS_TEST_BOT_APP_ID }}
          private_key: ${{ secrets.ACTIONS_TEST_BOT_PRIVATE_KEY }}
          test_owner: ${{ env.TEST_OWNER }}
          test_repo: ${{ env.TEST_REPO }}
          test_repo_name: ${{ env.TEST_REPO_NAME }}
          current_repo_checkout_path: 'tmp/actions-code'

      - name: Create Test base Branch
        id: base-branch
        uses: TimSchoenle/actions/actions/common/create-branch@b2d91d475a1436da4c9b2a2835897413913ef6d7 # tag=actions-common-create-branch-v1.3.1
        with:
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          branch_name: test/test-full-update/base/${{ env.TEST_ID }}
          reset_branch: 'true'

      - name: Create Test Chart Files
        env:
          TEST_ID: ${{ env.TEST_ID }}
        run: |
          set -euo pipefail
          mkdir -p charts/test-app

          cat <<EOF > charts/test-app/Chart.yaml
          apiVersion: v2
          name: test-app
          description: A test chart
          version: 1.2.3
          appVersion: "v0.0.1"
          EOF

          cat <<EOF > charts/test-app/values.yaml
          replicaCount: 1
          image:
            repository: ghcr.io/example/test-app
            tag: "v0.0.1@sha256:olddigest"
            pullPolicy: IfNotPresent
          EOF

      - name: Commit Initial Chart Files
        uses: TimSchoenle/actions/actions/common/commit-changes@e8af15f00459da30900d926bf8fbb9dea5a56495 # tag=actions-common-commit-changes-v1.3.0
        with:
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          branch: ${{ steps.base-branch.outputs.branch }}
          commit_message: 'test: seed chart files for ${{ env.TEST_ID }}'
          file_pattern: 'charts/test-app/Chart.yaml charts/test-app/values.yaml'

      - name: Run update-chart-version
        id: update
        uses: ./tmp/actions-code/actions/helm/update-chart-version
        with:
          app-id: ${{ secrets.ACTIONS_TEST_BOT_APP_ID }}
          private-key: ${{ secrets.ACTIONS_TEST_BOT_PRIVATE_KEY }}
          helm-repo: ${{ env.TEST_REPO }}
          base_branch: ${{ steps.base-branch.outputs.branch }}
          chart-path: charts/test-app
          images: ${{ env.SINGLE_IMAGE }}
          app-version: v2.0.0
          pr-branch-prefix: test/helm-update/${{ env.TEST_ID }}

      # update-chart-version checks out the charts repo over the workspace, so the local action's own
      # directory is gone by the time its post step runs. Restoring it is `always()` on purpose: when
      # the action fails, the post step still runs and would otherwise add a second, unrelated failure.
      - name: Restore Workspace For The Post Action
        if: always()
        uses: TimSchoenle/actions/actions/test/setup-e2e@9aabf0be4b0008aa5bdc479b556851c3a5c54d93 # tag=actions-test-setup-e2e-v1.2.2
        with:
          app_id: ${{ secrets.ACTIONS_TEST_BOT_APP_ID }}
          private_key: ${{ secrets.ACTIONS_TEST_BOT_PRIVATE_KEY }}
          test_owner: ${{ env.TEST_OWNER }}
          test_repo: ${{ env.TEST_REPO }}
          test_repo_name: ${{ env.TEST_REPO_NAME }}
          current_repo_checkout_path: 'tmp/actions-code'

      - name: Verify PR Output
        shell: bash
        env:
          PR_URL: ${{ steps.update.outputs.pr-url }}
        run: |
          set -euo pipefail
          [ -z "$PR_URL" ] && { echo "::error::pr-url output is empty"; exit 1; }
          echo "✅ PR created: $PR_URL"

      - name: Verify Chart.yaml Version Bumped
        shell: bash
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          TEST_REPO: ${{ env.TEST_REPO }}
          # The branch is named after the chart version now: with per-image versions there is no
          # single image tag to name it after.
          BRANCH: test/helm-update/${{ env.TEST_ID }}/test-app/1.2.4
        run: |
          set -euo pipefail
          CHART_CONTENT=$(gh api "/repos/$TEST_REPO/contents/charts/test-app/Chart.yaml?ref=$BRANCH" --jq '.content' | base64 -d)
          echo "Chart.yaml content:"
          echo "$CHART_CONTENT"

          # version should have been bumped from 1.2.3 → 1.2.4
          echo "$CHART_CONTENT" | grep -q "version: 1.2.4" || { echo "::error::Expected version 1.2.4"; exit 1; }
          echo "✅ Chart version bumped to 1.2.4"

      - name: Verify Chart.yaml appVersion Updated
        shell: bash
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          TEST_REPO: ${{ env.TEST_REPO }}
          BRANCH: test/helm-update/${{ env.TEST_ID }}/test-app/1.2.4
        run: |
          set -euo pipefail
          CHART_CONTENT=$(gh api "/repos/$TEST_REPO/contents/charts/test-app/Chart.yaml?ref=$BRANCH" --jq '.content' | base64 -d)
          echo "$CHART_CONTENT" | grep -q "appVersion: v2.0.0" || { echo "::error::Expected appVersion v2.0.0"; exit 1; }
          echo "✅ appVersion set to v2.0.0"

      - name: Verify values.yaml Image Tag Updated
        shell: bash
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          TEST_REPO: ${{ env.TEST_REPO }}
          BRANCH: test/helm-update/${{ env.TEST_ID }}/test-app/1.2.4
        run: |
          set -euo pipefail
          VALUES_CONTENT=$(gh api "/repos/$TEST_REPO/contents/charts/test-app/values.yaml?ref=$BRANCH" --jq '.content' | base64 -d)
          echo "values.yaml content:"
          echo "$VALUES_CONTENT"

          EXPECTED_TAG="v2.0.0@sha256:abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890"
          echo "$VALUES_CONTENT" | grep -qF "$EXPECTED_TAG" || { echo "::error::Expected image tag '$EXPECTED_TAG'"; exit 1; }
          echo "✅ Image tag set to $EXPECTED_TAG"

      - name: Verify PR Metadata
        shell: bash
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          TEST_REPO: ${{ env.TEST_REPO }}
          PR_NUMBER: ${{ steps.update.outputs.pr_number }}
        run: |
          set -euo pipefail
          PR_DATA=$(gh pr view "$PR_NUMBER" --repo "$TEST_REPO" --json title,body,headRefName,files)

          # Verify title contains chart name and new version
          TITLE=$(echo "$PR_DATA" | jq -r '.title')
          echo "$TITLE" | grep -q "test-app" || { echo "::error::PR title missing chart name"; exit 1; }
          echo "$TITLE" | grep -q "1.2.4" || { echo "::error::PR title missing new version"; exit 1; }
          echo "✅ PR title verified: $TITLE"

          # The body carries the per-image table, so a reviewer sees each image's own before and after
          BODY=$(echo "$PR_DATA" | jq -r '.body')
          echo "$BODY" | grep -q "1.2.4" || { echo "::error::PR body missing new chart version"; exit 1; }
          echo "$BODY" | grep -q "image.tag" || { echo "::error::PR body missing the image table"; exit 1; }
          echo "$BODY" | grep -q "v2.0.0" || { echo "::error::PR body missing the new image version"; exit 1; }
          echo "✅ PR body verified"

          # Verify correct files were changed
          FILES=$(echo "$PR_DATA" | jq -r '.files[].path' | sort)
          echo "Changed files: $FILES"
          echo "$FILES" | grep -q "charts/test-app/Chart.yaml" || { echo "::error::Chart.yaml not in PR"; exit 1; }
          echo "$FILES" | grep -q "charts/test-app/values.yaml" || { echo "::error::values.yaml not in PR"; exit 1; }
          echo "✅ PR files verified"

      - name: Cleanup Base Branch
        if: always()
        uses: TimSchoenle/actions/actions/common/delete-branch@f7fee33b242c9a529c5246415d29d9d23e511fd3 # tag=actions-common-delete-branch-v1.3.0
        with:
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          branch_name: ${{ steps.base-branch.outputs.branch }}

      # Guarded, not just `always()`: a run that failed before opening a PR has no number to close, and
      # closing "nothing" would report a second, misleading failure on top of the real one.
      - name: Cleanup PR
        if: always() && steps.update.outputs.pr_number != ''
        uses: TimSchoenle/actions/actions/common/close-pull-request@9fbc10ef6fd97b85a5164a1a19de78a24f130879 # tag=actions-common-close-pull-request-v1.3.0
        with:
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          pull_request_id: ${{ steps.update.outputs.pr_number }}

      - name: Cleanup Branch
        if: always()
        uses: TimSchoenle/actions/actions/common/delete-branch@f7fee33b242c9a529c5246415d29d9d23e511fd3 # tag=actions-common-delete-branch-v1.3.0
        with:
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          branch_name: test/helm-update/${{ env.TEST_ID }}/test-app/1.2.4

  # The reason this action was rewritten: one call, many images, each at its own version.
  test-multi-image:
    environment:
      name: ci-e2e
      deployment: false
    name: 'Test: many images at differing versions, with a changelog'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Setup E2E Test Environment
        id: setup
        uses: TimSchoenle/actions/actions/test/setup-e2e@9aabf0be4b0008aa5bdc479b556851c3a5c54d93 # tag=actions-test-setup-e2e-v1.2.2
        with:
          app_id: ${{ secrets.ACTIONS_TEST_BOT_APP_ID }}
          private_key: ${{ secrets.ACTIONS_TEST_BOT_PRIVATE_KEY }}
          test_owner: ${{ env.TEST_OWNER }}
          test_repo: ${{ env.TEST_REPO }}
          test_repo_name: ${{ env.TEST_REPO_NAME }}
          current_repo_checkout_path: 'tmp/actions-code'

      - name: Create Test base Branch
        id: base-branch
        uses: TimSchoenle/actions/actions/common/create-branch@b2d91d475a1436da4c9b2a2835897413913ef6d7 # tag=actions-common-create-branch-v1.3.1
        with:
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          branch_name: test/test-multi-image/base/${{ env.TEST_ID }}
          reset_branch: 'true'

      - name: Create Multi-Service Chart Files
        run: |
          set -euo pipefail
          mkdir -p charts/multi-app

          cat <<'EOF' > charts/multi-app/Chart.yaml
          apiVersion: v2
          name: multi-app
          version: 2.0.0
          appVersion: "v0.4.1"
          EOF

          cat <<'EOF' > charts/multi-app/values.yaml
          services:
            api:
              # -- Image tag, pinned by digest.
              image:
                tag: v0.4.1@sha256:aaa
            worker:
              image:
                tag: v0.4.1@sha256:bbb
          bootstrap:
            image:
              tag: v0.4.1@sha256:ccc
          # A third-party image this chart does not release.
          postgresql:
            image:
              tag: 18-alpine@sha256:ddd
          EOF

      - name: Commit Initial Chart Files
        uses: TimSchoenle/actions/actions/common/commit-changes@e8af15f00459da30900d926bf8fbb9dea5a56495 # tag=actions-common-commit-changes-v1.3.0
        with:
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          branch: ${{ steps.base-branch.outputs.branch }}
          commit_message: 'test: seed multi-app chart for ${{ env.TEST_ID }}'
          file_pattern: 'charts/multi-app/Chart.yaml charts/multi-app/values.yaml'

      - name: Run update-chart-version with three images at three versions
        id: update
        uses: ./tmp/actions-code/actions/helm/update-chart-version
        with:
          app-id: ${{ secrets.ACTIONS_TEST_BOT_APP_ID }}
          private-key: ${{ secrets.ACTIONS_TEST_BOT_PRIVATE_KEY }}
          helm-repo: ${{ env.TEST_REPO }}
          base_branch: ${{ steps.base-branch.outputs.branch }}
          chart-path: charts/multi-app
          images: |
            {
              "services.api.image.tag":    {"tag": "v1.0.0", "digest": "sha256:1111111111111111111111111111111111111111111111111111111111111111"},
              "services.worker.image.tag": {"tag": "v0.9.4", "digest": "sha256:2222222222222222222222222222222222222222222222222222222222222222"},
              "bootstrap.image.tag":       {"tag": "v2.1.0", "digest": "sha256:3333333333333333333333333333333333333333333333333333333333333333"}
            }
          changelog: |
            ## What's changed

            - Rework the worker, thanks @octocat
            - Fixes #12
          pr-branch-prefix: test/multi/${{ env.TEST_ID }}

      # update-chart-version checks out the charts repo over the workspace, so the local action's own
      # directory is gone by the time its post step runs. Restoring it is `always()` on purpose: when
      # the action fails, the post step still runs and would otherwise add a second, unrelated failure.
      - name: Restore Workspace For The Post Action
        if: always()
        uses: TimSchoenle/actions/actions/test/setup-e2e@9aabf0be4b0008aa5bdc479b556851c3a5c54d93 # tag=actions-test-setup-e2e-v1.2.2
        with:
          app_id: ${{ secrets.ACTIONS_TEST_BOT_APP_ID }}
          private_key: ${{ secrets.ACTIONS_TEST_BOT_PRIVATE_KEY }}
          test_owner: ${{ env.TEST_OWNER }}
          test_repo: ${{ env.TEST_REPO }}
          test_repo_name: ${{ env.TEST_REPO_NAME }}
          current_repo_checkout_path: 'tmp/actions-code'

      - name: Verify Each Image Got Its Own Version
        shell: bash
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          TEST_REPO: ${{ env.TEST_REPO }}
          BRANCH: test/multi/${{ env.TEST_ID }}/multi-app/2.0.1
          COUNT: ${{ steps.update.outputs.updated-count }}
        run: |
          set -euo pipefail
          VALUES=$(gh api "/repos/$TEST_REPO/contents/charts/multi-app/values.yaml?ref=$BRANCH" --jq '.content' | base64 -d)
          echo "$VALUES"

          echo "$VALUES" | grep -qF "tag: v1.0.0@sha256:1111111111111111111111111111111111111111111111111111111111111111" || { echo "::error::api tag wrong"; exit 1; }
          echo "$VALUES" | grep -qF "tag: v0.9.4@sha256:2222222222222222222222222222222222222222222222222222222222222222" || { echo "::error::worker tag wrong"; exit 1; }
          echo "$VALUES" | grep -qF "tag: v2.1.0@sha256:3333333333333333333333333333333333333333333333333333333333333333" || { echo "::error::bootstrap tag wrong"; exit 1; }

          # Untouched: not in the images map, and its comment is still there.
          echo "$VALUES" | grep -qF "tag: 18-alpine@sha256:ddd" || { echo "::error::the third-party image was rewritten"; exit 1; }
          echo "$VALUES" | grep -qF "# -- Image tag, pinned by digest." || { echo "::error::a comment was lost"; exit 1; }

          [ "$COUNT" = "3" ] || { echo "::error::updated-count was '$COUNT'"; exit 1; }
          echo "✅ Three images, three versions, nothing else moved"

      - name: Verify appVersion Was Left Alone
        shell: bash
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          TEST_REPO: ${{ env.TEST_REPO }}
          BRANCH: test/multi/${{ env.TEST_ID }}/multi-app/2.0.1
        run: |
          set -euo pipefail
          CHART=$(gh api "/repos/$TEST_REPO/contents/charts/multi-app/Chart.yaml?ref=$BRANCH" --jq '.content' | base64 -d)

          echo "$CHART" | grep -q "version: 2.0.1" || { echo "::error::Expected version 2.0.1"; exit 1; }
          # No app-version was given: these services do not share one.
          echo "$CHART" | grep -qF 'appVersion: "v0.4.1"' || { echo "::error::appVersion should not have changed"; exit 1; }
          echo "✅ Chart version bumped, appVersion untouched"

      - name: Verify The Changelog Reached The PR, Defused
        shell: bash
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          TEST_REPO: ${{ env.TEST_REPO }}
          PR_NUMBER: ${{ steps.update.outputs.pr_number }}
        run: |
          set -euo pipefail
          BODY=$(gh pr view "$PR_NUMBER" --repo "$TEST_REPO" --json body --jq '.body')
          echo "$BODY"

          echo "$BODY" | grep -q "<summary>Changelog</summary>" || { echo "::error::the changelog section is missing"; exit 1; }
          echo "$BODY" | grep -q "Rework the worker" || { echo "::error::the changelog text is missing"; exit 1; }
          echo "$BODY" | grep -q "services.worker.image.tag" || { echo "::error::the image table is missing"; exit 1; }

          if echo "$BODY" | grep -qE '(^|[^A-Za-z0-9_`])@[A-Za-z0-9]'; then
            echo "::error::an active mention reached the PR body"
            exit 1
          fi

          if echo "$BODY" | grep -qiE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]+#[0-9]'; then
            echo "::error::an issue-closing reference reached the PR body"
            exit 1
          fi
          echo "✅ Changelog carried through without acting on anything"

      - name: Cleanup Base Branch
        if: always()
        uses: TimSchoenle/actions/actions/common/delete-branch@f7fee33b242c9a529c5246415d29d9d23e511fd3 # tag=actions-common-delete-branch-v1.3.0
        with:
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          branch_name: ${{ steps.base-branch.outputs.branch }}

      # Guarded, not just `always()`: a run that failed before opening a PR has no number to close, and
      # closing "nothing" would report a second, misleading failure on top of the real one.
      - name: Cleanup PR
        if: always() && steps.update.outputs.pr_number != ''
        uses: TimSchoenle/actions/actions/common/close-pull-request@9fbc10ef6fd97b85a5164a1a19de78a24f130879 # tag=actions-common-close-pull-request-v1.3.0
        with:
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          pull_request_id: ${{ steps.update.outputs.pr_number }}

      - name: Cleanup Branch
        if: always()
        uses: TimSchoenle/actions/actions/common/delete-branch@f7fee33b242c9a529c5246415d29d9d23e511fd3 # tag=actions-common-delete-branch-v1.3.0
        with:
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          branch_name: test/multi/${{ env.TEST_ID }}/multi-app/2.0.1

  test-custom-branch-prefix:
    environment:
      name: ci-e2e
      deployment: false
    name: 'Test: custom PR branch prefix'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Setup E2E Test Environment
        id: setup
        uses: TimSchoenle/actions/actions/test/setup-e2e@9aabf0be4b0008aa5bdc479b556851c3a5c54d93 # tag=actions-test-setup-e2e-v1.2.2
        with:
          app_id: ${{ secrets.ACTIONS_TEST_BOT_APP_ID }}
          private_key: ${{ secrets.ACTIONS_TEST_BOT_PRIVATE_KEY }}
          test_owner: ${{ env.TEST_OWNER }}
          test_repo: ${{ env.TEST_REPO }}
          test_repo_name: ${{ env.TEST_REPO_NAME }}
          current_repo_checkout_path: 'tmp/actions-code'

      - name: Create Test base Branch
        id: base-branch
        uses: TimSchoenle/actions/actions/common/create-branch@b2d91d475a1436da4c9b2a2835897413913ef6d7 # tag=actions-common-create-branch-v1.3.1
        with:
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          branch_name: test/test-custom-branch-prefix/base/${{ env.TEST_ID }}
          reset_branch: 'true'

      - name: Create Test Chart Files
        run: |
          set -euo pipefail
          mkdir -p charts/prefix-app

          cat <<EOF > charts/prefix-app/Chart.yaml
          apiVersion: v2
          name: prefix-app
          version: 0.1.0
          appVersion: "v0.0.1"
          EOF

          cat <<EOF > charts/prefix-app/values.yaml
          image:
            repository: ghcr.io/example/prefix-app
            tag: "v0.0.1@sha256:olddigest"
          EOF

      - name: Commit Initial Chart Files
        uses: TimSchoenle/actions/actions/common/commit-changes@e8af15f00459da30900d926bf8fbb9dea5a56495 # tag=actions-common-commit-changes-v1.3.0
        with:
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          branch: ${{ steps.base-branch.outputs.branch }}
          commit_message: 'test: seed prefix-app chart for ${{ env.TEST_ID }}'
          file_pattern: 'charts/prefix-app/Chart.yaml charts/prefix-app/values.yaml'

      - name: Run update-chart-version with custom prefix
        id: update
        uses: ./tmp/actions-code/actions/helm/update-chart-version
        with:
          app-id: ${{ secrets.ACTIONS_TEST_BOT_APP_ID }}
          private-key: ${{ secrets.ACTIONS_TEST_BOT_PRIVATE_KEY }}
          helm-repo: ${{ env.TEST_REPO }}
          base_branch: ${{ steps.base-branch.outputs.branch }}
          chart-path: charts/prefix-app
          images: '{"image.tag": {"tag": "v3.5.0", "digest": "sha256:deadbeef1234567890deadbeef1234567890deadbeef1234567890deadbeef12"}}'
          app-version: v3.5.0
          pr-branch-prefix: test/custom-prefix/${{ env.TEST_ID }}

      # update-chart-version checks out the charts repo over the workspace, so the local action's own
      # directory is gone by the time its post step runs. Restoring it is `always()` on purpose: when
      # the action fails, the post step still runs and would otherwise add a second, unrelated failure.
      - name: Restore Workspace For The Post Action
        if: always()
        uses: TimSchoenle/actions/actions/test/setup-e2e@9aabf0be4b0008aa5bdc479b556851c3a5c54d93 # tag=actions-test-setup-e2e-v1.2.2
        with:
          app_id: ${{ secrets.ACTIONS_TEST_BOT_APP_ID }}
          private_key: ${{ secrets.ACTIONS_TEST_BOT_PRIVATE_KEY }}
          test_owner: ${{ env.TEST_OWNER }}
          test_repo: ${{ env.TEST_REPO }}
          test_repo_name: ${{ env.TEST_REPO_NAME }}
          current_repo_checkout_path: 'tmp/actions-code'

      - name: Verify Branch Name Uses Custom Prefix And The Chart Version
        shell: bash
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          TEST_REPO: ${{ env.TEST_REPO }}
          PR_NUMBER: ${{ steps.update.outputs.pr_number }}
