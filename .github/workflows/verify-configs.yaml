# GENERATED by scripts/generate-verify.ts. Do not edit by hand.
# Run 'bun run generate-verify' to rebuild it from the sources in .github/verify/; the drift check in
# Scripts CI fails while it is out of date. See docs/verify-pipeline.md.
#
# Called by .github/workflows/verify.yaml. Every job runs only when its target is in inputs.targets.
# Targets:
#   configs/checkstyle (.github/verify/configs-checkstyle.yaml)
#   configs/renovate (.github/verify/configs-renovate.yaml)
name: Verify Configs

on:
  workflow_call:
    inputs:
      targets:
        description: JSON array of the targets this run verifies.
        type: string
        required: true
      cache-key:
        description: Key of the dependency cache the install job saved.
        type: string
        required: false
        default: ''
      artifact-id:
        description: ID of the artifact the build job uploaded; empty when nothing was built.
        type: string
        required: false
        default: ''
      manifest-sha256:
        description: SHA-256 of the build manifest inside that artifact.
        type: string
        required: false
        default: ''

permissions: {}

jobs:
  checkstyle-verify:
    name: 'Checkstyle Configs: Verify Checkstyle Configs'
    if: ${{ contains(fromJSON(inputs.targets), 'configs/checkstyle') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      # JitPack builds the published artifacts with this wrapper, so the distribution it downloads must
      # be pinned by checksum: the wrapper refuses a download that does not match. Renovate's
      # gradle-wrapper manager updates the checksum together with distributionUrl.
      - name: Check the wrapper distribution is pinned
        working-directory: configs/checkstyle
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^distributionSha256Sum=[0-9a-f]{64}$' gradle/wrapper/gradle-wrapper.properties || {
            echo "::error::gradle-wrapper.properties has no distributionSha256Sum"
            exit 1
          }

      - name: Make gradlew executable
        working-directory: configs/checkstyle
        shell: bash
        run: chmod +x ./gradlew

      # Builds the two publishable modules (proves the classpath: resource rewrite still produces
      # a valid jar) and runs every Checkstyle compatibility + Lombok-suppression check registered
      # in compat-check/build.gradle.kts, against the Checkstyle version pinned in
      # gradle/libs.versions.toml (which Renovate's built-in Gradle version-catalog support keeps
      # current, so this job re-validates on every bump).
      - name: Build and verify
        working-directory: configs/checkstyle
        shell: bash
        run: ./gradlew :checkstyle-application:build :checkstyle-library:build :compat-check:verifyCheckstyleCompat --no-daemon

      - name: Upload Checkstyle reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checkstyle-compat-reports
          path: configs/checkstyle/compat-check/build/reports/checkstyle/
          retention-days: 14

  renovate:
    name: 'Config Renovate: Validate and dry-run Renovate presets'
    if: ${{ contains(fromJSON(inputs.targets), 'configs/renovate') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Renovate's `engines` field requires Node 24. The runner image's default Node is not pinned.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Installs only the pinned Renovate in .github/tools/renovate, not the root workspace: the
      # scripts below import nothing outside the Node and Bun standard libraries.
      - name: Setup Bun and Renovate
        uses: TimSchoenle/actions/actions/bun/setup-cached@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-bun-setup-cached-v3.1.0
        with:
          bun-version: ''
          bun-version-file: '.bun-version'
          working-directory: .github/tools/renovate
          cache-key-prefix: renovate-

      - name: Validate
        run: bun scripts/check-renovate-configs.ts

      # Lookups read public GitHub releases and tags; the job token only lifts the anonymous rate limit.
      - name: Lookups
        env:
          GITHUB_COM_TOKEN: ${{ github.token }}
        run: bun scripts/check-renovate-lookups.ts
