# GENERATED — do not edit by hand. Run `bun run generate-e2e-workflows` to rebuild this file
# from the actions that have an `e2e/` directory. The drift test in CI fails if it is out of date.
#
# The cases live in `actions/security/codeql/e2e/` and are ordinary vitest files. This
# workflow supplies only what they cannot get on a laptop: a token scoped to the scratch repository.
name: Verify Security Codeql

on:
  push:
    branches:
      - main
      - 'feature/security/codeql'
    paths:
      - 'actions/security/codeql/**'
      - '!actions/security/codeql/CHANGELOG.md'
      - 'packages/e2e/**'
      - '.github/workflows/verify-action-security-codeql.yaml'
  pull_request:
    paths:
      - 'actions/security/codeql/**'
      - '!actions/security/codeql/CHANGELOG.md'
      - 'packages/e2e/**'
      - '.github/workflows/verify-action-security-codeql.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch code
    outputs:
      cache-key: ${{ steps.key.outputs.value }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            registry.npmjs.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute Cache Key
        id: key
        env:
          CACHE_KEY: e2e-workspace-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        run: echo "value=$CACHE_KEY" >> "$GITHUB_OUTPUT"

      - name: Cache Workspace Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            actions/*/*/node_modules
          key: ${{ steps.key.outputs.value }}

      # An empty bun-version makes setup-bun fall through to bun-version-file; setup-cached defaults
      # it to 'latest', which would win otherwise. It reinstalls on every run whatever the cache did,
      # which is what validates the restored tree against the lockfile before the next job trusts it.
      - name: Setup Bun And Install
        uses: TimSchoenle/actions/actions/bun/setup-cached@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-bun-setup-cached-v1.1.11
        with:
          bun-version: ''
          bun-version-file: '.bun-version'

  e2e:
    needs: install
    environment:
      name: ci-e2e
      deployment: false
    name: End-to-end
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-bun rather than setup-cached: the cached wrapper runs `bun install` on every job, cache
      # hit or not, and this job is the one that must have no route to a package registry at all.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.bun-version'

      # Restored, never installed, and never saved. `fail-on-cache-miss` is what keeps that honest:
      # without it a miss would leave the suite to fail later on a missing import, several confusing
      # minutes further on.
      - name: Restore Dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            actions/*/*/node_modules
          key: ${{ needs.install.outputs.cache-key }}
          fail-on-cache-miss: true

      # The cases run `dist/index.js`, the bundle GitHub itself would run, so nothing is built here.
      - name: Generate Token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ACTIONS_TEST_BOT_APP_ID }}
          private-key: ${{ secrets.ACTIONS_TEST_BOT_PRIVATE_KEY }}
          owner: TimSchoenle
          repositories: actions-testing
          permission-metadata: read

      - name: Run End-to-end Cases
        env:
          E2E_GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          # An installation token cannot call `GET /user`, so the suite resolves its own account by
          # app slug instead. Without this a case matching commit authors fails only in CI.
          E2E_APP_SLUG: ${{ steps.token.outputs.app-slug }}
          E2E_TEST_REPOSITORY: TimSchoenle/actions-testing
        run: bun run e2e actions/security/codeql

  verify-composite:
    name: Test Composite Against A Fixture Crate
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            static.rust-lang.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Test (Fixture Crate)
        id: analysis
        uses: ./actions/security/codeql
        with:
          language: rust
          upload: 'false'
          paths-ignore: |
            # Excluded by the caller, beside the shared test paths.
            actions/security/codeql/e2e/fixture/src/vendored.rs

      - name: Assert Fixture Crate
        env:
          CONFIG: ${{ steps.analysis.outputs.config }}
          CATEGORY: ${{ steps.analysis.outputs.category }}
          SARIF_OUTPUT: ${{ steps.analysis.outputs.sarif-output }}
          SARIF_ID: ${{ steps.analysis.outputs.sarif-id }}
        run: |
          set -euo pipefail

          [ "$CATEGORY" = "/language:rust" ] || { echo "::error::category '$CATEGORY', expected '/language:rust'"; exit 1; }
          [ -z "$SARIF_ID" ] || { echo "::error::upload: false uploaded a SARIF ($SARIF_ID)"; exit 1; }
          jq -e '."paths-ignore" | index("**/tests/**") != null' <<<"$CONFIG" > /dev/null \
            || { echo "::error::the configuration does not exclude the shared test paths: $CONFIG"; exit 1; }

          shopt -s nullglob
          sarifs=("$SARIF_OUTPUT"/*.sarif)
          [ "${#sarifs[@]}" -eq 1 ] || { echo "::error::expected one SARIF under '$SARIF_OUTPUT', found ${#sarifs[@]}"; exit 1; }

          uris=$(jq -r '[.runs[] | (.results // [])[] | .locations[].physicalLocation.artifactLocation.uri] | unique | .[]' "${sarifs[0]}")
          echo "Files with results:"
          echo "$uris"

          grep -qx 'actions/security/codeql/e2e/fixture/src/lib.rs' <<<"$uris" \
            || { echo "::error::CodeQL reported nothing in src/lib.rs, so the analysis proves nothing"; exit 1; }
          ! grep -q 'fixture/tests/' <<<"$uris" || { echo "::error::a result in tests/ survived the shared test paths"; exit 1; }
          ! grep -q 'fixture/src/vendored.rs' <<<"$uris" || { echo "::error::a result in vendored.rs survived paths-ignore"; exit 1; }

          echo "✅ src/lib.rs reported; tests/leak.rs and src/vendored.rs excluded"

      # A negated pattern must fail in the prepare step, before init downloads anything.
      - name: Run Test (Refused Pattern)
        id: refused
        continue-on-error: true
        uses: ./actions/security/codeql
        with:
          language: rust
          upload: 'false'
          paths-ignore: '!actions/security/codeql/e2e/fixture/src/lib.rs'

      - name: Assert Refused Pattern
        env:
          OUTCOME: ${{ steps.refused.outcome }}
          CONFIG: ${{ steps.refused.outputs.config }}
          SARIF_OUTPUT: ${{ steps.refused.outputs.sarif-output }}
        run: |
          set -euo pipefail

          [ "$OUTCOME" = "failure" ] || { echo "::error::a negated pattern did not fail the step ($OUTCOME)"; exit 1; }
          [ -z "$CONFIG" ] || { echo "::error::a refused input still produced a configuration"; exit 1; }
          [ -z "$SARIF_OUTPUT" ] || { echo "::error::CodeQL ran after the inputs were refused"; exit 1; }

          echo "✅ The negated pattern failed before CodeQL started"

  # <<< generated: summary (run 'bun run generate-ci-required' to update)
  summary:
    name: 'CI Summary: Security Codeql'
    if: ${{ always() }}
    needs:
      - install
      - e2e
      - verify-composite
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if any verify job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
  # >>> generated: summary
