# GENERATED by scripts/generate-verify.ts. Do not edit by hand.
# Run 'bun run generate-verify' to rebuild it from the sources in .github/verify/; the drift check in
# Scripts CI fails while it is out of date. See docs/verify-pipeline.md.
#
# Called by .github/workflows/verify.yaml. Every job runs only when its target is in inputs.targets.
# Targets:
#   java-gradle/auto-spotless (.github/verify/java-gradle-auto-spotless.yaml)
#   java-gradle/coverage-codecov (.github/verify/java-gradle-coverage-codecov.yaml)
#   java-gradle/setup-base-environment (.github/verify/java-gradle-setup-base-environment.yaml)
name: Verify Java-gradle

on:
  workflow_call:
    inputs:
      targets:
        description: JSON array of the targets this run verifies.
        type: string
        required: true
      cache-key:
        description: Key of the dependency cache the install job saved.
        type: string
        required: false
        default: ''
      artifact-id:
        description: ID of the artifact the build job uploaded; empty when nothing was built.
        type: string
        required: false
        default: ''
      manifest-sha256:
        description: SHA-256 of the build manifest inside that artifact.
        type: string
        required: false
        default: ''
    secrets:
      ACTIONS_TEST_BOT_APP_ID:
        required: false
      ACTIONS_TEST_BOT_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  test-spotless-formats-and-commits:
    environment:
      name: ci-e2e
      deployment: false
    name: 'Java-gradle Auto-spotless: Test Spotless: ${{ matrix.name }}'
    if: ${{ contains(fromJSON(inputs.targets), 'java-gradle/auto-spotless') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: java-11-temurin
            java_version: '11'
            java_distribution: 'temurin'
            gradle_version: '8.14.3'

          - name: java-17-temurin
            java_version: '17'
            java_distribution: 'temurin'
            gradle_version: '8.14.3'

          - name: java-21-zulu
            java_version: '21'
            java_distribution: 'zulu'
            gradle_version: '9.3.1'

    permissions:
      contents: read
    env:
      TEST_OWNER: TimSchoenle
      TEST_REPO_NAME: actions-testing
      TEST_REPO: TimSchoenle/actions-testing
      TEST_ID: auto-spotless-test-${{ github.run_number }}-${{ github.run_attempt }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.adoptium.net:443
            api.azul.com:443
            cdn.azul.com:443
            services.gradle.org:443
            downloads.gradle.org:443
            plugins.gradle.org:443
            plugins-artifacts.gradle.org:443
            repo.maven.apache.org:443

      - name: Setup E2E Test Environment
        id: setup
        uses: TimSchoenle/actions/actions/test/setup-e2e@daf766fd1ab9d48129210afc63b1a7353f6064fd # tag=actions-test-setup-e2e-v1.2.7
        with:
          app_id: ${{ secrets.ACTIONS_TEST_BOT_APP_ID }}
          private_key: ${{ secrets.ACTIONS_TEST_BOT_PRIVATE_KEY }}
          test_owner: ${{ env.TEST_OWNER }}
          test_repo: ${{ env.TEST_REPO }}
          test_repo_name: ${{ env.TEST_REPO_NAME }}
          current_repo_checkout_path: 'tmp/actions-code'

      # Replaces the committed bundles in tmp/actions-code with the ones the build job built.
      - name: Install Built Actions
        uses: TimSchoenle/actions/actions/release/install-built-actions@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-release-install-built-actions-v1.1.0
        with:
          artifact-id: ${{ inputs.artifact-id }}
          expected-manifest-sha256: ${{ inputs.manifest-sha256 }}
          path: tmp/actions-code

      - name: Create Test Branch
        id: branch
        uses: TimSchoenle/actions/actions/common/create-branch@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-create-branch-v2.0.4
        with:
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          branch_name: test/spotless/${{ matrix.name }}/${{ env.TEST_ID }}
          reset_branch: 'true'

      - name: Create Gradle Project with Spotless
        shell: bash
        env:
          GRADLE_VERSION: ${{ matrix.gradle_version }}
          TEST_ID: ${{ env.TEST_ID }}
        run: |
          set -euo pipefail

          # Create Gradle project structure
          mkdir -p src/main/java/com/example

          # Create build.gradle with spotless plugin
          cat > build.gradle << 'EOF'
          plugins {
              id 'java'
              id 'com.diffplug.spotless' version '6.25.0'
          }

          repositories {
              mavenCentral()
          }

          spotless {
              java {
                  googleJavaFormat()
                  removeUnusedImports()
                  trimTrailingWhitespace()
                  endWithNewline()
              }
          }
          EOF

          # Create settings.gradle
          echo 'rootProject.name = "spotless-test"' > settings.gradle

          # Gradle's own output must stay out of the patch: create-patch includes untracked files
          # that are not ignored, and commit-patch would refuse them.
          printf '.gradle/\nbuild/\n' > .gitignore

          # Create badly formatted Java file
          cat > src/main/java/com/example/TestClass.java << 'EOF'
          package com.example;

          import java.util.List;
          import java.util.ArrayList;
          import java.util.HashMap;

          public class TestClass{
          private String name;
          private int value;

          public TestClass(String name,int value){
          this.name=name;
          this.value=value;
          }

          public String getName(){return name;}
          public void setName(String name){this.name=name;}

          public int getValue(){return value;}
          public void setValue(int value){this.value=value;}
          }
          EOF

      # Gradle runs on the JDK it finds, and the runner image's default moves with the image
      # (ubuntu-26.04 ships 25, which Gradle 8.14.3 cannot run on). JDK 21 runs every Gradle version
      # in the matrix, whatever Java version the leg then tests; the action sets up its own.
      - name: Set Up JDK For The Gradle Wrapper
        id: wrapper-jdk
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate Gradle Wrapper
        shell: bash
        env:
          GRADLE_VERSION: ${{ matrix.gradle_version }}
          JAVA_HOME: ${{ steps.wrapper-jdk.outputs.path }}
        run: |
          set -euo pipefail
          sdk_install_dir="${RUNNER_TEMP}/gradle-install"
          gradle_zip="${RUNNER_TEMP}/gradle-${GRADLE_VERSION}-bin.zip"

          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o "${gradle_zip}"
          unzip -q "${gradle_zip}" -d "${sdk_install_dir}"

          "${sdk_install_dir}/gradle-${GRADLE_VERSION}/bin/gradle" wrapper --gradle-version "${GRADLE_VERSION}"

      - name: Commit Initial Unformatted Files
        uses: ./tmp/actions-code/actions/common/commit-changes # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          branch: ${{ steps.branch.outputs.branch }}
          commit_message: 'test: add unformatted Java files (${{ env.TEST_ID }})'
          file_pattern: '.'

      - name: Sync Local With Remote
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch --prune origin "+refs/heads/$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME"
          git reset --hard "origin/$BRANCH_NAME"

      # The action is the unprivileged half: it formats this checkout and uploads a patch. In a real
      # workflow commit-patch runs in a second job that holds the token and runs no repository code;
      # here the Gradle project is the fixture this job wrote, so both halves share one job.
      - name: Run Auto-Spotless Action
        id: auto_spotless
        uses: ./tmp/actions-code/actions/java-gradle/auto-spotless # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          java_version: ${{ matrix.java_version }}
          java_distribution: ${{ matrix.java_distribution }}
          artifact_name: auto-spotless-${{ matrix.name }}-${{ github.run_attempt }}

      - name: Commit Patch
        id: commit_patch
        uses: ./tmp/actions-code/actions/common/commit-patch # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          token: ${{ steps.setup.outputs.token }}
          artifact_name: ${{ steps.auto_spotless.outputs.artifact_name }}
          allowed_paths: '**/*.java **/*.kt **/*.kts **/*.gradle'
          commit_message: 'style: apply spotless formatting'
          repository: ${{ env.TEST_REPO }}
          branch: ${{ steps.branch.outputs.branch }}
          expected_head_sha: ${{ steps.auto_spotless.outputs.base_sha }}

      - name: Verify Action Outputs
        env:
          CHANGES_DETECTED: ${{ steps.auto_spotless.outputs.changes_detected }}
          OUTCOME: ${{ steps.commit_patch.outputs.outcome }}
        run: |
          set -euo pipefail
          [ "$CHANGES_DETECTED" = "true" ] || { echo "::error::changes_detected is '$CHANGES_DETECTED' for an unformatted file"; exit 1; }
          [ "$OUTCOME" = "committed" ] || { echo "::error::commit-patch outcome is '$OUTCOME', expected committed"; exit 1; }
          echo "The patch was detected and committed"

      - name: Verify Formatting Changes Were Committed
        shell: bash
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          TEST_REPO: ${{ env.TEST_REPO }}
          BRANCH_NAME: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail

          # Get the latest commit on the branch
          LATEST_COMMIT=$(gh api "/repos/$TEST_REPO/commits/$BRANCH_NAME" --jq '.sha')
          COMMIT_MSG=$(gh api "/repos/$TEST_REPO/git/commits/$LATEST_COMMIT" --jq '.message')

          # Verify commit message contains spotless reference
          if ! echo "$COMMIT_MSG" | grep -qi "spotless"; then
            echo "::error::Commit message should reference spotless: $COMMIT_MSG"
            exit 1
          fi
          echo "✅ Spotless commit created with message: $COMMIT_MSG"

          # Verify that TestClass.java was modified
          FILES=$(gh api "/repos/$TEST_REPO/commits/$LATEST_COMMIT" --jq '.files[].filename')
          if ! echo "$FILES" | grep -q "TestClass.java"; then
            echo "::error::TestClass.java should have been modified"
            echo "Modified files: $FILES"
            exit 1
          fi
          if [ "$FILES" != "src/main/java/com/example/TestClass.java" ]; then
            echo "::error::The commit should change TestClass.java and nothing else"
            echo "Modified files: $FILES"
            exit 1
          fi
          echo "✅ Java file was formatted and committed"

          # Verify the file is now properly formatted
          FILE_CONTENT=$(gh api "/repos/$TEST_REPO/contents/src/main/java/com/example/TestClass.java?ref=$BRANCH_NAME" --jq '.content' | base64 -d)

          # Check for proper formatting indicators (proper spacing after class name)
          if echo "$FILE_CONTENT" | grep -q "public class TestClass{"; then
            echo "::error::File still has formatting issues (no space before brace)"
            exit 1
          fi

          echo "✅ File is properly formatted"

      - name: We do another post setup after update-chart-version fully reset the current state. This is needed for the post action to run ...
        uses: TimSchoenle/actions/actions/test/setup-e2e@daf766fd1ab9d48129210afc63b1a7353f6064fd # tag=actions-test-setup-e2e-v1.2.7
        with:
          app_id: ${{ secrets.ACTIONS_TEST_BOT_APP_ID }}
          private_key: ${{ secrets.ACTIONS_TEST_BOT_PRIVATE_KEY }}
          test_owner: ${{ env.TEST_OWNER }}
          test_repo: ${{ env.TEST_REPO }}
          test_repo_name: ${{ env.TEST_REPO_NAME }}
          current_repo_checkout_path: 'tmp/actions-code'

      - name: Cleanup Branch
        if: always()
        uses: TimSchoenle/actions/actions/common/delete-branch@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-delete-branch-v2.0.4
        with:
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          branch_name: ${{ steps.branch.outputs.branch }}

  java-coverage-verify:
    name: 'Java-gradle Coverage-codecov: Verify Coverage-codecov (Java ${{ matrix.java-version }})'
    if: ${{ contains(fromJSON(inputs.targets), 'java-gradle/coverage-codecov') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java-version: ['21', '25']
    permissions:
      contents: read # to fetch code
    env:
      FIXTURE: actions/java-gradle/coverage-codecov/fixture
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test coverage-codecov
        id: coverage
        uses: ./actions/java-gradle/coverage-codecov # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          source_directory: ${{ env.FIXTURE }}
          java_version: ${{ matrix.java-version }}
          flags: verify
          use_oidc: 'false'
          dry_run: 'true'

      # Line numbers refer to the fixture sources. `Arith` line 8 is reached by `test` and line 12
      # by nothing. `Strings` line 12 is reached only by the `extraTest` task, so it is covered
      # only if the report merged the execution data of every Test task.
      - name: Verify the coverage reports
        shell: bash
        env:
          COVERAGE_FILES: ${{ steps.coverage.outputs.coverage_files }}
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import os
          import sys
          import xml.etree.ElementTree as ET

          files = sorted(os.environ["COVERAGE_FILES"].split(","))
          names = [os.path.basename(f) for f in files]
          if names != ["arith.xml", "strings.xml"]:
              sys.exit(f"::error::Expected arith.xml and strings.xml, got {names}")

          def lines(path, source):
              root = ET.parse(path).getroot()
              for sourcefile in root.iter("sourcefile"):
                  if sourcefile.get("name") == source:
                      return {int(l.get("nr")): (int(l.get("ci")), int(l.get("mi"))) for l in sourcefile.iter("line")}
              sys.exit(f"::error::{path} has no sourcefile {source}")

          expectations = {
              ("arith.xml", "Arith.java"): {8: True, 12: False},
              ("strings.xml", "Strings.java"): {8: True, 12: True},
          }
          failed = False
          for (report, source), wanted in expectations.items():
              found = lines(files[names.index(report)], source)
              for line, covered in wanted.items():
                  ci, mi = found.get(line, (0, 0))
                  if (ci > 0 and mi == 0) != covered:
                      print(f"::error::{source}:{line} should be {'covered' if covered else 'missed'}, got ci={ci} mi={mi}")
                      failed = True
          sys.exit(1 if failed else 0)
          EOF

      - name: Verify the test results
        shell: bash
        env:
          TEST_RESULTS_FILES: ${{ steps.coverage.outputs.test_results_files }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a files <<< "${TEST_RESULTS_FILES}"
          if [[ "${#files[@]}" -ne 3 ]]; then
            echo "::error::Expected three JUnit reports (arith test, strings test, strings extraTest), got ${#files[@]}: ${TEST_RESULTS_FILES}"
            exit 1
          fi

          for suffix in junit/arith/test/ junit/strings/test/ junit/strings/extraTest/; do
            if [[ "${TEST_RESULTS_FILES}" != *"${suffix}"* ]]; then
              echo "::error::No JUnit report under ${suffix}"
              exit 1
            fi
          done

          if grep -L 'failures="0"' "${files[@]}" | grep -q .; then
            echo "::error::A JUnit report records a failure"
            exit 1
          fi

  # A failing test must fail the action and still leave its JUnit report, because the test-results
  # upload exists for exactly that run. The other project's tests keep running under --continue.
  java-coverage-verify-failing-tests:
    name: 'Java-gradle Coverage-codecov: Verify Coverage-codecov (failing tests)'
    if: ${{ contains(fromJSON(inputs.targets), 'java-gradle/coverage-codecov') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # to fetch code
    env:
      FIXTURE: actions/java-gradle/coverage-codecov/fixture
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test coverage-codecov
        id: coverage
        continue-on-error: true
        uses: ./actions/java-gradle/coverage-codecov # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        env:
          FIXTURE_FAIL: '1'
        with:
          source_directory: ${{ env.FIXTURE }}
          java_version: '21'
          use_oidc: 'false'
          dry_run: 'true'

      - name: Verify the action failed and kept the test results
        shell: bash
        env:
          OUTCOME: ${{ steps.coverage.outcome }}
          OUT_DIR: ${{ runner.temp }}/java-gradle-coverage-codecov
        run: |
          set -euo pipefail
          if [[ "${OUTCOME}" != 'failure' ]]; then
            echo "::error::Expected the action to fail on a failing test, got '${OUTCOME}'"
            exit 1
          fi

          if ! grep -q 'failures="1"' "${OUT_DIR}"/junit/arith/test/*.xml; then
            echo "::error::Expected one failure in the arith JUnit report"
            exit 1
          fi

          if [[ ! -f "${OUT_DIR}/junit/strings/extraTest/TEST-fixture.strings.ExtraTest.xml" ]]; then
            echo "::error::The strings project's tests did not run after arith failed, so --continue is not in effect"
            exit 1
          fi

  # Excluding every Test task leaves Gradle with nothing to measure. The build succeeds, and the
  # action has to fail rather than upload nothing.
  verify-no-report:
    name: 'Java-gradle Coverage-codecov: Verify Coverage-codecov (no report)'
    if: ${{ contains(fromJSON(inputs.targets), 'java-gradle/coverage-codecov') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # to fetch code
    env:
      FIXTURE: actions/java-gradle/coverage-codecov/fixture
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test coverage-codecov
        id: coverage
        continue-on-error: true
        uses: ./actions/java-gradle/coverage-codecov # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          source_directory: ${{ env.FIXTURE }}
          java_version: '21'
          gradle_arguments: '-x test -x extraTest'
          use_oidc: 'false'
          dry_run: 'true'

      - name: Verify the action refused to upload nothing
        shell: bash
        env:
          OUTCOME: ${{ steps.coverage.outcome }}
          COVERAGE_FILES: ${{ steps.coverage.outputs.coverage_files }}
        run: |
          set -euo pipefail
          if [[ "${OUTCOME}" != 'failure' ]]; then
            echo "::error::Expected the action to fail without a report, got '${OUTCOME}'"
            exit 1
          fi

          if [[ -n "${COVERAGE_FILES}" ]]; then
            echo "::error::Expected no coverage report, got '${COVERAGE_FILES}'"
            exit 1
          fi

  java-coverage-verify-rejects-inputs:
    name: 'Java-gradle Coverage-codecov: Verify Coverage-codecov (rejects ${{ matrix.case }})'
    if: ${{ contains(fromJSON(inputs.targets), 'java-gradle/coverage-codecov') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: missing java_version
            java_version: ''
            use_oidc: 'false'
          - case: non-boolean
            java_version: '21'
            use_oidc: 'yes'
    permissions:
      contents: read # to fetch code
    env:
      FIXTURE: actions/java-gradle/coverage-codecov/fixture
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test coverage-codecov
        id: coverage
        continue-on-error: true
        uses: ./actions/java-gradle/coverage-codecov # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          source_directory: ${{ env.FIXTURE }}
          java_version: ${{ matrix.java_version }}
          use_oidc: ${{ matrix.use_oidc }}
          dry_run: 'true'

      # The output directory is checked as well as the outcome: a failure from a later step would
      # also be 'failure', and only a missing directory shows the input check stopped the run first.
      - name: Verify the action refused the input before running Gradle
        shell: bash
        env:
          OUTCOME: ${{ steps.coverage.outcome }}
          OUT_DIR: ${{ runner.temp }}/java-gradle-coverage-codecov
        run: |
          set -euo pipefail
          if [[ "${OUTCOME}" != 'failure' ]]; then
            echo "::error::Expected the action to refuse the input, got '${OUTCOME}'"
            exit 1
          fi

          if [[ -e "${OUT_DIR}" ]]; then
            echo "::error::${OUT_DIR} exists, so the action ran Gradle before refusing"
            exit 1
          fi

  setup-base-environment-verify:
    name: 'Java-gradle Setup-base-environment: Verify Setup-base-environment'
    if: ${{ contains(fromJSON(inputs.targets), 'java-gradle/setup-base-environment') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Every pair of values across the five inputs, in 8 legs instead of the 64 of the full product
      # (4 x 2 x 2 x 2 x 2), which was about a third of all Verify legs. Each Java version appears
      # twice with complementary values of the four binary inputs, so it meets both values of each;
      # the four base rows (0000, 0011, 0101, 0110) give every two binary inputs all four
      # combinations. The inputs do not interact beyond pairs: each is passed straight to
      # actions/setup-java or to the wrapper permission step.
      matrix:
        include:
          - java-version: '11'
            java-package: 'jre'
            java-distribution: 'temurin'
            gradle-setup-version: '9.3.1'
            gradle-wrapper-permission-set: 'read-only'
          - java-version: '11'
            java-package: 'jdk'
            java-distribution: 'zulu'
            gradle-setup-version: '8.14.3'
            gradle-wrapper-permission-set: 'read-write'
          - java-version: '17'
            java-package: 'jre'
            java-distribution: 'temurin'
            gradle-setup-version: '8.14.3'
            gradle-wrapper-permission-set: 'read-write'
          - java-version: '17'
            java-package: 'jdk'
            java-distribution: 'zulu'
            gradle-setup-version: '9.3.1'
            gradle-wrapper-permission-set: 'read-only'
          - java-version: '21'
            java-package: 'jre'
            java-distribution: 'zulu'
            gradle-setup-version: '9.3.1'
            gradle-wrapper-permission-set: 'read-write'
          - java-version: '21'
            java-package: 'jdk'
            java-distribution: 'temurin'
            gradle-setup-version: '8.14.3'
            gradle-wrapper-permission-set: 'read-only'
          - java-version: '25'
            java-package: 'jre'
            java-distribution: 'zulu'
            gradle-setup-version: '8.14.3'
            gradle-wrapper-permission-set: 'read-only'
          - java-version: '25'
            java-package: 'jdk'
            java-distribution: 'temurin'
            gradle-setup-version: '9.3.1'
            gradle-wrapper-permission-set: 'read-write'
    permissions:
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Gradle runs on the JDK it finds, and the runner image's default moves with the image
      # (ubuntu-26.04 ships 25, which Gradle 8.14.3 cannot run on). JDK 21 runs every Gradle version
      # in the matrix, whatever Java version the leg then tests; the action sets up its own.
      - name: Set Up JDK For The Gradle Wrapper
        id: wrapper-jdk
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate Gradle wrapper
        shell: bash
        env:
          GRADLE_VERSION: ${{ matrix.gradle-setup-version }}
          JAVA_HOME: ${{ steps.wrapper-jdk.outputs.path }}
        run: |
          # Install Gradle temporarily to generate the wrapper files
          sdk_install_dir="${RUNNER_TEMP}/gradle-install"
          gradle_zip="${RUNNER_TEMP}/gradle-${GRADLE_VERSION}-bin.zip"

          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o "${gradle_zip}"
          unzip -q "${gradle_zip}" -d "${sdk_install_dir}"

          # Create a minimal Gradle project structure
          echo 'rootProject.name = "verify-test"' > settings.gradle

          # Generate wrapper files (gradlew, gradlew.bat, gradle/wrapper/*)
          "${sdk_install_dir}/gradle-${GRADLE_VERSION}/bin/gradle" wrapper --gradle-version "${GRADLE_VERSION}"

          # Verify the wrapper was created
          ls -la gradlew gradle/wrapper/

      - name: Set Gradle wrapper permissions
        shell: bash
        if: matrix.gradle-wrapper-permission-set == 'read-only'
        run: chmod a-w gradlew gradle/wrapper/gradle-wrapper.jar

      - name: Test setup-base-environment
        id: setup-base-environment
        uses: ./actions/java-gradle/setup-base-environment # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          java_version: ${{ matrix.java-version }}
          java_package: ${{ matrix.java-package }}
          java_distribution: ${{ matrix.java-distribution }}

      - name: Verify Java Version
        shell: bash
        env:
          INSTALLED_JAVA_VERSION: ${{ steps.setup-base-environment.outputs.java_version }}
          EXPECTED_JAVA_VERSION: ${{ matrix.java-version }}
        run: |
          # Verify that the installed Java version starts with the expected version
          if [[ "${INSTALLED_JAVA_VERSION}" != ${EXPECTED_JAVA_VERSION}* ]]; then
            echo "::error::Expected Java version ${EXPECTED_JAVA_VERSION}, got ${INSTALLED_JAVA_VERSION}"
            exit 1
          fi

      - name: Verify Java distribution
        shell: bash
        env:
          INSTALLED_JAVA_DISTRIBUTION: ${{ steps.setup-base-environment.outputs.java_distribution }}
          EXPECTED_JAVA_DISTRIBUTION: ${{ matrix.java-distribution }}
        run: |
          if [[ "${INSTALLED_JAVA_DISTRIBUTION,,}" != *"${EXPECTED_JAVA_DISTRIBUTION,,}"* ]]; then
            echo "::error::Expected Java distribution ${EXPECTED_JAVA_DISTRIBUTION}, got ${INSTALLED_JAVA_DISTRIBUTION}"
            exit 1
          fi

      - name: Verify Java Path
        shell: bash
        env:
          INSTALLED_JAVA_PATH: ${{ steps.setup-base-environment.outputs.java_path }}
        run: |
          if [ ! -d "${INSTALLED_JAVA_PATH}" ]; then
            echo "::error::Java directory not found at: ${INSTALLED_JAVA_PATH}"
            exit 1
          fi

      - name: Verify gradlew is executable
        run: |
          if [ ! -x "./gradlew" ]; then
            echo "::error::gradlew is not executable"
            exit 1
          fi

          echo "gradlew is executable"
        shell: bash
