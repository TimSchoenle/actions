  # Reports as the required check 'Verify' only on pull_request. A push run attaches its own
  # check to the commit, the pull request head included when it is a feature/** branch; under the
  # same name, a push that selects no target would report a vacuous success on that head, and
  # re-running it after a failed pull_request run would put a newer success there.
  verify:
    name: ${{ github.event_name == 'pull_request' && 'Verify' || format('Verify ({0})', github.event_name) }}
    if: ${{ always() }}
    needs:
      - plan
      - install
      - build
      - e2e-checks-write-contents-write
      - e2e-contents-write
      - e2e-contents-write-issues-write-pull-requests-write
      - e2e-contents-write-pull-requests-read
      - e2e-contents-write-pull-requests-write
      - e2e-contents-write-pull-requests-write-as-pull-requests-write
      - e2e-issues-write
      - e2e-metadata-read
      - e2e-tokenless
      - verify-bun
      - verify-common
      - verify-configs
      - verify-docker
      - verify-helm
      - verify-helper
      - verify-java-gradle
      - verify-release
      - verify-rust
      - verify-security
      - verify-terrace
      - verify-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if any verify job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
