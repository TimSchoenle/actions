# GENERATED by scripts/generate-verify.ts. Do not edit by hand.
# Run 'bun run generate-verify' to rebuild it from the sources in .github/verify/; the drift check in
# Scripts CI fails while it is out of date. See docs/verify-pipeline.md.
#
# One run verifies every target the change affects: plan selects them from the changed files and the
# dependency graph, install and build run once for all of them, one job per token scope set runs the
# selected end-to-end suites, and each shard runs the hand-written jobs of its selected targets. The
# final job is the one required check.
name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

# Only a pull request run is cancelled by a newer one. A push to main that is cancelled mid-run strands
# scratch refs, and can kill the install job that seeds the dependency cache pull requests restore.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # to fetch code and history
      checks: read # to confirm a merged pull request head passed Verify
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      shards: ${{ steps.plan.outputs.shards }}
      install: ${{ steps.plan.outputs.install }}
      seed-cache: ${{ steps.plan.outputs.seed-cache }}
      build: ${{ steps.plan.outputs.build }}
      build-dirs: ${{ steps.plan.outputs.build-dirs }}
      e2e-groups: ${{ steps.plan.outputs.e2e-groups }}
      e2e: ${{ steps.plan.outputs.e2e }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.bun-version'

      # Imports nothing but Node.js built-ins, so it runs without an install.
      - name: Select Affected Targets
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
