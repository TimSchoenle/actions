          E2E_DIRECTORIES: ${{ toJSON(fromJSON(needs.plan.outputs.e2e)['e2e-tokenless']) }}
          E2E_TOKENLESS: '1'
        run: |
          set -euo pipefail
          mapfile -t directories < <(jq -r '.[] + "/"' <<< "$E2E_DIRECTORIES")
          bun run e2e "${directories[@]}"

  verify-bun:
    name: Bun
