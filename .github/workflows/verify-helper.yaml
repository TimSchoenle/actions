  verify-payload-fallback:
    name: 'Helper Verify-branch-name: Test Pull Request Payload Fallback'
    if: ${{ contains(fromJSON(inputs.targets), 'helper/verify-branch-name') && (github.event_name == 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # A shorter allowlist than the generated job's: this one only checks out and runs a local
      # action — no dependency install, no cache, no API call — so github.com is the whole of it.
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the bundles the build job built from this commit; dist/ is not committed.
      - name: Install Built Actions
        uses: TimSchoenle/actions/actions/release/install-built-actions@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-release-install-built-actions-v1.1.0
        with:
          artifact-id: ${{ inputs.artifact-id }}
          expected-manifest-sha256: ${{ inputs.manifest-sha256 }}

      # No head_ref / head_repo_full_name / base_repo_full_name: all three must fall back to the
      # pull_request payload of the triggering event via the default expressions in action.yaml.
      # reject_forks is off so the assertions hold for pull requests opened from a fork as well.
      - name: Run Test (Resolve From Payload)
        id: resolved
        uses: ./actions/helper/verify-branch-name # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          branch_pattern: '.*'
          reject_forks: 'false'
          error_on_failure: 'false'

      # A pattern that cannot match any branch name. Reporting a mismatch (rather than failing with
      # "head_ref not provided") proves a real branch name was resolved from the payload.
      - name: Run Test (Payload Branch Is Matched)
        id: mismatch
        uses: ./actions/helper/verify-branch-name # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          branch_pattern: '^branch-that-cannot-exist--[0-9]{40}$'
          reject_forks: 'false'
          error_on_failure: 'false'

      - name: Assert Payload Fallback
        env:
          RESOLVED_VERIFIED: ${{ steps.resolved.outputs.verified }}
          RESOLVED_FORK: ${{ steps.resolved.outputs.fork_verified }}
          MISMATCH_VERIFIED: ${{ steps.mismatch.outputs.verified }}
          MISMATCH_BRANCH: ${{ steps.mismatch.outputs.branch_pattern_verified }}
        run: |
          set -euo pipefail
          FAILED=0

          if [ "$RESOLVED_VERIFIED" != "true" ]; then
            echo "::error::Expected the payload fallback to verify this PR, got verified='$RESOLVED_VERIFIED'"
            FAILED=1
          fi

          if [ "$RESOLVED_FORK" != "true" ]; then
            echo "::error::Expected fork_verified=true for a same-repository PR, got '$RESOLVED_FORK'"
            FAILED=1
          fi

          if [ "$MISMATCH_BRANCH" != "false" ] || [ "$MISMATCH_VERIFIED" != "false" ]; then
            echo "::error::Expected the impossible pattern to report a mismatch, got branch_pattern_verified='$MISMATCH_BRANCH'"
            FAILED=1
          fi

          if [ $FAILED -eq 1 ]; then
            exit 1
          fi

          echo "✅ Head ref and repositories resolved from the pull_request payload"

