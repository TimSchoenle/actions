# Run 'bun run generate-verify' to rebuild it from the sources in .github/verify/; the drift check in
# Scripts CI fails while it is out of date. See docs/verify-pipeline.md.
#
# Called by .github/workflows/verify.yaml. Every job runs only when its target is in inputs.targets.
# Targets:
#   docker/image-check (.github/verify/docker-image-check.yaml)
#   docker/image-check-summary (.github/verify/docker-image-check-summary.yaml)
name: Verify Docker

on:
  workflow_call:
    inputs:
      targets:
        description: JSON array of the targets this run verifies.
        type: string
        required: true
      cache-key:
        description: Key of the dependency cache the install job saved.
        type: string
        required: false
        default: ''
      artifact-id:
        description: ID of the artifact the build job uploaded; empty when nothing was built.
        type: string
        required: false
        default: ''
      manifest-sha256:
        description: SHA-256 of the build manifest inside that artifact.
        type: string
        required: false
        default: ''
    secrets:
      ACTIONS_TEST_BOT_APP_ID:
        required: false
      ACTIONS_TEST_BOT_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  e2e-docker-image-check:
    name: 'Docker Image-check: End-to-end'
    if: ${{ contains(fromJSON(inputs.targets), 'docker/image-check') }}
    environment:
      name: ci-e2e
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the bundles the build job built from this commit; dist/ is not committed.
      - name: Install Built Actions
        uses: TimSchoenle/actions/actions/release/install-built-actions@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-release-install-built-actions-v1.1.0
        with:
          artifact-id: ${{ inputs.artifact-id }}
          expected-manifest-sha256: ${{ inputs.manifest-sha256 }}

      # setup-bun rather than setup-cached: the cached wrapper runs `bun install` on every job, cache
      # hit or not, and this job is the one that must have no route to a package registry at all.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.bun-version'

      # The harness runs a node24 bundle with the first node on PATH and refuses any other major,
      # and the image's default node is not 24. A major alone resolves from the runner's tool
      # cache, so this reaches no endpoint the allowlist above does not already carry.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Restored, never installed, and never saved. `fail-on-cache-miss` is what keeps that honest:
      # without it a miss would leave the suite to fail later on a missing import.
      - name: Restore Dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            actions/*/*/*/node_modules
            actions/*/*/node_modules
            packages/*/node_modules
          key: ${{ inputs.cache-key }}
          fail-on-cache-miss: true

      # The cases run `dist/index.js`, the bundle GitHub itself would run: the one the install step
      # above put there, which the harness checks against BUILT_ACTIONS_MANIFEST before it runs it.
      - name: Generate Token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ACTIONS_TEST_BOT_APP_ID }}
          private-key: ${{ secrets.ACTIONS_TEST_BOT_PRIVATE_KEY }}
          owner: TimSchoenle
          repositories: actions-testing
          permission-metadata: read

      - name: Run End-to-end Cases
        env:
          E2E_GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          # An installation token cannot call `GET /user`, so the suite resolves its own account by
          # app slug instead. Without this a case matching commit authors fails only in CI.
          E2E_APP_SLUG: ${{ steps.token.outputs.app-slug }}
          E2E_TEST_REPOSITORY: TimSchoenle/actions-testing
        run: bun run e2e actions/docker/image-check

  image-check-composite:
    name: 'Docker Image-check: Test Composite Against A Built Image'
    if: ${{ contains(fromJSON(inputs.targets), 'docker/image-check') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to fetch code
      security-events: write # to upload the SARIF
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            get.trivy.dev:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            mirror.gcr.io:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            storage.googleapis.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the bundles the build job built from this commit; dist/ is not committed.
      - name: Install Built Actions
        uses: TimSchoenle/actions/actions/release/install-built-actions@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-release-install-built-actions-v1.1.0
        with:
          artifact-id: ${{ inputs.artifact-id }}
          expected-manifest-sha256: ${{ inputs.manifest-sha256 }}

      # Built from a copy under RUNNER_TEMP with 2 MiB of zeros added: the action counts unpacked bytes, so
      # the image lands at a known size between the 1 MiB limit below and the default warning, and the
      # workspace stays clean for the assertion that the action itself writes nothing there.
      - name: Build Fixture Image
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/image-check-fixture"
          cp -r actions/docker/image-check/e2e/fixture "$context"
          head -c 2097152 /dev/zero > "$context/payload.bin"
          docker build --tag image-check-e2e:test "$context"

      - name: Run Test (Scan And Upload)
        id: check
        uses: ./actions/docker/image-check # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          image: image-check-e2e:test
          platform: linux/amd64
          sarif-category: image-check-e2e
          comment: none

      - name: Assert Scan And Upload
        env:
          SIZE_BYTES: ${{ steps.check.outputs.size-bytes }}
          SIZE_MIB: ${{ steps.check.outputs.size-mib }}
          OVER_WARNING: ${{ steps.check.outputs.over-warning }}
          FINDINGS: ${{ steps.check.outputs.findings }}
          SARIF_PATH: ${{ steps.check.outputs.sarif-path }}
          COMMENT_URL: ${{ steps.check.outputs.comment-url }}
        run: |
          set -euo pipefail

          # The payload alone is 2 MiB unpacked and compresses to a few KiB, so this lower bound is what
          # tells the unpacked size from the stored content size the containerd image store reports as .Size.
          PAYLOAD_BYTES=2097152
          [[ "$SIZE_BYTES" =~ ^[0-9]+$ ]] || { echo "::error::size-bytes '$SIZE_BYTES' is not a byte count"; exit 1; }
          [ "$SIZE_BYTES" -ge "$PAYLOAD_BYTES" ] || { echo "::error::size-bytes '$SIZE_BYTES' is below the ${PAYLOAD_BYTES}-byte payload: not the unpacked size"; exit 1; }
          [ "$SIZE_MIB" = "2.0" ] || { echo "::error::size-mib '$SIZE_MIB', expected '2.0'"; exit 1; }
          [ "$OVER_WARNING" = "false" ] || { echo "::error::over-warning '$OVER_WARNING', expected 'false'"; exit 1; }
          [[ "$FINDINGS" =~ ^[0-9]+$ ]] || { echo "::error::findings '$FINDINGS' is not a count"; exit 1; }
          [ -z "$COMMENT_URL" ] || { echo "::error::comment: none wrote a comment: $COMMENT_URL"; exit 1; }

          case "$SARIF_PATH" in
            "$RUNNER_TEMP"/*) ;;
            *) echo "::error::sarif-path '$SARIF_PATH' is not under RUNNER_TEMP"; exit 1 ;;
          esac

          jq -e '.runs | type == "array"' "$SARIF_PATH" > /dev/null || { echo "::error::sarif-path holds no SARIF log"; exit 1; }
          [ -z "$(git status --porcelain)" ] || { echo "::error::the action left files in the workspace"; git status --porcelain; exit 1; }

          echo "✅ Measured $SIZE_BYTES bytes, scanned to $FINDINGS finding(s), SARIF under RUNNER_TEMP"

      # The limit fails the step, but only in the last phase: findings must already be published.
      - name: Run Test (Size Limit)
        id: limited
        continue-on-error: true
        uses: ./actions/docker/image-check # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          image: image-check-e2e:test
          size-limit-mib: '1'
          upload-sarif: 'false'
          comment: none

      - name: Run Test (Image Never Loaded)
        id: missing
        continue-on-error: true
        uses: ./actions/docker/image-check # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          image: image-check-e2e:never-built
          upload-sarif: 'false'
          comment: none

      - name: Assert Gates And Refusals
        env:
          LIMITED_OUTCOME: ${{ steps.limited.outcome }}
          LIMITED_FINDINGS: ${{ steps.limited.outputs.findings }}
          MISSING_OUTCOME: ${{ steps.missing.outcome }}
          MISSING_FINDINGS: ${{ steps.missing.outputs.findings }}
        run: |
          set -euo pipefail

          [ "$LIMITED_OUTCOME" = "failure" ] || { echo "::error::a 1 MiB limit did not fail a 2 MiB image ($LIMITED_OUTCOME)"; exit 1; }
          [[ "$LIMITED_FINDINGS" =~ ^[0-9]+$ ]] || { echo "::error::the limit failed before the report phase published findings"; exit 1; }
          [ "$MISSING_OUTCOME" = "failure" ] || { echo "::error::an image that was never built did not fail ($MISSING_OUTCOME)"; exit 1; }
          [ -z "$MISSING_FINDINGS" ] || { echo "::error::Trivy ran against an image that was never built"; exit 1; }

          echo "✅ The limit failed last, and a missing image failed first"

