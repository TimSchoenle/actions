  verify-summary:
    name: 'Docker Image-check: Test Summary Comment'
    if: ${{ contains(fromJSON(inputs.targets), 'docker/image-check') }}
    needs: verify-summary-legs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to fetch code
      pull-requests: write # to upsert the summary comment
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the bundles the build job built from this commit; dist/ is not committed.
      - name: Install Built Actions
        uses: TimSchoenle/actions/actions/release/install-built-actions@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-release-install-built-actions-v1.1.0
        with:
          artifact-id: ${{ inputs.artifact-id }}
          expected-manifest-sha256: ${{ inputs.manifest-sha256 }}

      - name: Run Test (Summary)
        id: summary
        uses: ./actions/docker/image-check-summary # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          identifier: image-check-e2e-summary

      # Fragments are uploaded only on a pull request whose token can write, so that is the only
      # event on which there is a table to post.
      - name: Assert Summary
        env:
          SAME_REPOSITORY_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          IMAGES: ${{ steps.summary.outputs.images }}
          COMMENT_URL: ${{ steps.summary.outputs.comment-url }}
        run: |
          set -euo pipefail

          if [ "$SAME_REPOSITORY_PR" = "true" ]; then
            [ "$IMAGES" = "2" ] || { echo "::error::expected 2 fragments, read '$IMAGES'"; exit 1; }
            [ -n "$COMMENT_URL" ] || { echo "::error::no summary comment was written"; exit 1; }
            echo "✅ Two legs, one table: $COMMENT_URL"
          else
            [ "$IMAGES" = "0" ] || { echo "::error::expected no fragments outside a same-repository pull request, read '$IMAGES'"; exit 1; }
            [ -z "$COMMENT_URL" ] || { echo "::error::a comment was written outside a same-repository pull request"; exit 1; }
            echo "✅ Nothing to post on this event, and nothing posted"
          fi

