name: Auto Format

on:
  pull_request:

# A newer push to the pull request supersedes the run formatting the older head.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

# `bun run format` is the pull request's own script, so it runs in a job that holds nothing, and the
# result is committed by auto-format-commit.yml, a workflow_run workflow that runs no repository code
# and, unlike this one, cannot be edited by the pull request it commits to. The formatter never runs
# beside the App token, and the token never runs in a workflow the pull request controls.
jobs:
  # Release-please branches carry only generated CHANGELOG.md and manifest edits, both of which
  # release-please already emits formatted.
  format:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Bun
        uses: TimSchoenle/actions/actions/bun/setup-cached@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-bun-setup-cached-v3.1.0

      - name: Format
        run: bun run format

      - name: Create Patch
        id: patch
        uses: TimSchoenle/actions/actions/common/create-patch@0701d3b35ad7e10e3159471c82f4743b67fdc01f # tag=actions-common-create-patch-v2.0.2
        with:
          artifact_name: auto-format

      # The patch is committed by auto-format-commit.yml after this run has finished. While it is
      # non-empty this head is not the one to merge: the run on the bot commit decides.
      # Nothing commits to a fork's branch; `bun run format:check` in Scripts CI reports it there.
      - name: Fail while the patch is uncommitted
        if: >-
          steps.patch.outputs.has_changes == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          echo "::error::bun run format changed files; auto-format-commit.yml commits them and the run on that commit decides. If no bot commit appears, run bun run format locally and push."
          exit 1

  # The one context branch protection requires from this workflow. `format` is skipped on a
  # release-please branch, and a skipped job reports success to branch protection, so it cannot be
  # required on its own. This job always runs, and fails when `format` failed or was cancelled.
  # `format` itself fails while its patch is uncommitted: the commit happens in
  # auto-format-commit.yml once this run has finished. See scripts/lib/required-checks.ts.
  gate:
    name: Auto Format Gate
    needs: [format]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if auto-format did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
