name: Auto Format

on:
  pull_request:

# A newer push to the pull request supersedes the run formatting the older head.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

# `bun run format` is the pull request's own script, so it runs in a job that holds nothing, and the
# result is committed by auto-format-commit.yml, a workflow_run workflow that runs no repository code
# and, unlike this one, cannot be edited by the pull request it commits to. The formatter never runs
# beside the App token, and the token never runs in a workflow the pull request controls.
jobs:
  # Release-please branches carry only generated CHANGELOG.md and manifest edits, both of which
  # release-please already emits formatted.
  format:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Bun
        uses: TimSchoenle/actions/actions/bun/setup-cached@9d5cb31939ace7a3d3d7f452052724337c65f153 # tag=actions-bun-setup-cached-v2.0.0

      - name: Format
        run: bun run format

      - name: Create Patch
        uses: TimSchoenle/actions/actions/common/create-patch@dc5b395636dc1954383f11af4062a08814e9b15a # tag=actions-common-create-patch-v1.1.1
        with:
          artifact_name: auto-format

  # The one context branch protection requires from this workflow. `format` is skipped on a
  # release-please branch, and a skipped job reports success to branch protection, so it cannot be
  # required on its own. This job always runs, and fails when `format` failed or was cancelled. The
  # commit happens in auto-format-commit.yml once this run has finished, so it is not part of this
  # gate. See scripts/lib/required-checks.ts.
  gate:
    name: Auto Format Gate
    needs: [format]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if auto-format did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
