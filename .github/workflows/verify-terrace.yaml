      TERRACE_CONFIG: ${{ github.workspace }}/.github/testdata/terrace-image/terrace.yaml
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
