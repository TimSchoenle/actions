  sync-offline:
    name: 'Terrace Helm Sync: Test: a stale value schema is rewritten from the vendored contract'
    if: ${{ contains(fromJSON(inputs.targets), 'terrace/helm-sync') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to fetch code, and to list terrace-contract releases
