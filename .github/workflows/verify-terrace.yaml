  image-check-clean:
    name: 'Terrace Image: Test: a built image that carries its document passes every check'
    if: ${{ contains(fromJSON(inputs.targets), 'terrace/image') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
