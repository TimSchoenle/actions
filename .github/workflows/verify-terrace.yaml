# GENERATED by scripts/generate-verify.ts. Do not edit by hand.
# Run 'bun run generate-verify' to rebuild it from the sources in .github/verify/; the drift check in
# Scripts CI fails while it is out of date. See docs/verify-pipeline.md.
#
# Called by .github/workflows/verify.yaml. Every job runs only when its target is in inputs.targets.
# Targets:
#   terrace/setup (.github/verify/terrace-setup.yaml)
name: Verify Terrace

on:
  workflow_call:
    inputs:
      targets:
        description: JSON array of the targets this run verifies.
        type: string
        required: true
      cache-key:
        description: Key of the dependency cache the install job saved.
        type: string
        required: false
        default: ''
      artifact-id:
        description: ID of the artifact the build job uploaded; empty when nothing was built.
        type: string
        required: false
        default: ''
      manifest-sha256:
        description: SHA-256 of the build manifest inside that artifact.
        type: string
        required: false
        default: ''
    secrets:
      ACTIONS_TEST_BOT_APP_ID:
        required: false
      ACTIONS_TEST_BOT_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  e2e-terrace-setup:
    name: 'Terrace Setup: End-to-end'
    if: ${{ contains(fromJSON(inputs.targets), 'terrace/setup') }}
    environment:
      name: ci-e2e
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the bundles the build job built from this commit; dist/ is not committed.
      - name: Install Built Actions
        uses: TimSchoenle/actions/actions/release/install-built-actions@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-release-install-built-actions-v1.1.0
        with:
          artifact-id: ${{ inputs.artifact-id }}
          expected-manifest-sha256: ${{ inputs.manifest-sha256 }}

      # setup-bun rather than setup-cached: the cached wrapper runs `bun install` on every job, cache
      # hit or not, and this job is the one that must have no route to a package registry at all.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.bun-version'

      # The harness runs a node24 bundle with the first node on PATH and refuses any other major,
      # and the image's default node is not 24. A major alone resolves from the runner's tool
      # cache, so this reaches no endpoint the allowlist above does not already carry.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Restored, never installed, and never saved. `fail-on-cache-miss` is what keeps that honest:
      # without it a miss would leave the suite to fail later on a missing import.
      - name: Restore Dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            actions/*/*/*/node_modules
            actions/*/*/node_modules
            packages/*/node_modules
          key: ${{ inputs.cache-key }}
          fail-on-cache-miss: true

      # The cases run `dist/index.js`, the bundle GitHub itself would run: the one the install step
      # above put there, which the harness checks against BUILT_ACTIONS_MANIFEST before it runs it.
      - name: Generate Token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ACTIONS_TEST_BOT_APP_ID }}
          private-key: ${{ secrets.ACTIONS_TEST_BOT_PRIVATE_KEY }}
          owner: TimSchoenle
          repositories: actions-testing
          permission-metadata: read

      - name: Run End-to-end Cases
        env:
          E2E_GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          # An installation token cannot call `GET /user`, so the suite resolves its own account by
          # app slug instead. Without this a case matching commit authors fails only in CI.
          E2E_APP_SLUG: ${{ steps.token.outputs.app-slug }}
          E2E_TEST_REPOSITORY: TimSchoenle/actions-testing
        run: bun run e2e actions/terrace/setup

  install-exact:
    name: 'Terrace Setup: Install an exact release (${{ matrix.os }})'
    if: ${{ contains(fromJSON(inputs.targets), 'terrace/setup') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read # to fetch code
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    env:
      # Any published release works; 0.8.0 is the first that reads terrace.yaml.
      TERRACE_VERSION: '0.8.0'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the bundles the build job built from this commit; dist/ is not committed.
      - name: Install Built Actions
        uses: TimSchoenle/actions/actions/release/install-built-actions@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-release-install-built-actions-v1.1.0
        with:
          artifact-id: ${{ inputs.artifact-id }}
          expected-manifest-sha256: ${{ inputs.manifest-sha256 }}

      - name: Install
        id: setup
        uses: ./actions/terrace/setup # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          version: ${{ env.TERRACE_VERSION }}
          oras: 'true'

      - name: Verify the tools are on PATH and match the outputs
        shell: bash
        env:
          VERSION: ${{ steps.setup.outputs.version }}
          TERRACE_PATH: ${{ steps.setup.outputs.path }}
          COSIGN_PATH: ${{ steps.setup.outputs.cosign_path }}
          ORAS_PATH: ${{ steps.setup.outputs.oras_path }}
        run: |
          set -euo pipefail
          test "$VERSION" = "$TERRACE_VERSION"
          for file in "$TERRACE_PATH" "$COSIGN_PATH" "$ORAS_PATH"; do
            test -f "$file" || { echo "::error::$file is missing"; exit 1; }
          done
          terrace-contract --version | grep -F "$TERRACE_VERSION"
          cosign version
          oras version

  install-from-terrace-yaml:
    name: 'Terrace Setup: Install the cli pin from terrace.yaml'
    if: ${{ contains(fromJSON(inputs.targets), 'terrace/setup') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to fetch code, and to list terrace-contract releases
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the bundles the build job built from this commit; dist/ is not committed.
      - name: Install Built Actions
        uses: TimSchoenle/actions/actions/release/install-built-actions@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-release-install-built-actions-v1.1.0
        with:
          artifact-id: ${{ inputs.artifact-id }}
          expected-manifest-sha256: ${{ inputs.manifest-sha256 }}

      - name: Write terrace.yaml
        run: |
          set -euo pipefail
          mkdir -p fixture
          printf 'version: 1\ncli: "0.8"\n' > fixture/terrace.yaml

      - name: Install
        id: setup
        uses: ./actions/terrace/setup # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          working_directory: fixture

      - name: Verify the release is on the pinned line and reads the file
        working-directory: fixture
        env:
          VERSION: ${{ steps.setup.outputs.version }}
          ORAS_PATH: ${{ steps.setup.outputs.oras_path }}
        run: |
          set -euo pipefail
          case "$VERSION" in 0.8.*) ;; *) echo "::error::$VERSION is not a 0.8 release"; exit 1;; esac
          test -z "$ORAS_PATH"
          terrace-contract --config terrace.yaml config show

  install-unpublished:
    name: 'Terrace Setup: An unpublished release fails the step'
    if: ${{ contains(fromJSON(inputs.targets), 'terrace/setup') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the bundles the build job built from this commit; dist/ is not committed.
      - name: Install Built Actions
        uses: TimSchoenle/actions/actions/release/install-built-actions@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-release-install-built-actions-v1.1.0
        with:
          artifact-id: ${{ inputs.artifact-id }}
          expected-manifest-sha256: ${{ inputs.manifest-sha256 }}

      - name: Install
        id: setup
        continue-on-error: true
        uses: ./actions/terrace/setup # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          version: '0.0.999'

      - name: Verify the step failed and put nothing on PATH
        env:
          OUTCOME: ${{ steps.setup.outcome }}
          TERRACE_PATH: ${{ steps.setup.outputs.path }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = failure
          test -z "$TERRACE_PATH"
