  # committed: its job decides nothing until it passes. With one pending patch, this is also the case
  # where download-artifact extracts straight into the path it is given.
  verdict-failed:
    name: 'Common Generated-files-verdict: Round Trip: Verdict With A Failed Generator'
    needs: [verdict-generate-docs, verdict-generate-failing]
    if: ${{ contains(fromJSON(inputs.targets), 'common/generated-files-verdict') && (always()) }}
