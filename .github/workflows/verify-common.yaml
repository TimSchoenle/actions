  # the commit job cannot pick up anything an earlier attempt left.
  verdict-conflict:
    name: 'Common Generated-files-verdict: Round Trip: Verdict With Conflicting Patches'
    needs: [verdict-generate-docs, verdict-generate-conflicting]
    if: ${{ contains(fromJSON(inputs.targets), 'common/generated-files-verdict') && (always()) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # for find-patch to list and download this run's artifacts
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
