  find-patch-composite:
    name: 'Common Find-patch: Round Trip Through The Runner'
    if: ${{ contains(fromJSON(inputs.targets), 'common/find-patch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read # to list and download this run's artifacts through the REST API
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the bundles the build job built from this commit; dist/ is not committed.
      - name: Install Built Actions
        uses: TimSchoenle/actions/actions/release/install-built-actions@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-release-install-built-actions-v1.1.0
        with:
          artifact-id: ${{ inputs.artifact-id }}
          expected-manifest-sha256: ${{ inputs.manifest-sha256 }}

      - name: Create Empty Patch
        id: empty
        uses: ./actions/common/create-patch # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          artifact_name: find-patch-e2e-empty-${{ github.run_attempt }}
          paths: README.md

      - name: Change The Tree
        run: printf '\nappended by the round trip\n' >> README.md

      - name: Create Patch
        id: changed
        uses: ./actions/common/create-patch # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          artifact_name: find-patch-e2e-changed-${{ github.run_attempt }}
          paths: README.md

      - name: Find Changed Patch
        id: find-changed
        uses: ./actions/common/find-patch # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          run_id: ${{ github.run_id }}
          artifact_name: ${{ steps.changed.outputs.artifact_name }}
          expected_head_sha: ${{ steps.changed.outputs.base_sha }}

      # run_id left empty: this run is looked in.
      - name: Find Empty Patch In This Run
        id: find-empty
        uses: ./actions/common/find-patch # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          artifact_name: ${{ steps.empty.outputs.artifact_name }}

      - name: Find Patch Made From Another Commit
        id: find-moved
        uses: ./actions/common/find-patch # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          run_id: ${{ github.run_id }}
          artifact_name: ${{ steps.changed.outputs.artifact_name }}
          expected_head_sha: '0000000000000000000000000000000000000000'

      - name: Find Missing Patch
        id: find-missing
        uses: ./actions/common/find-patch # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          run_id: ${{ github.run_id }}
          artifact_name: find-patch-e2e-never-uploaded

      # Run 1 of this repository does not exist. Were the run not found read as "missing", a mistyped
      # run_id would silently skip every commit.
      - name: Find Patch In A Run That Does Not Exist
        id: find-no-run
        continue-on-error: true
        uses: ./actions/common/find-patch # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          run_id: '1'
          artifact_name: ${{ steps.empty.outputs.artifact_name }}

      - name: Assert Find Patch Outputs
        env:
          CHANGED_FOUND: ${{ steps.find-changed.outputs.found }}
          CHANGED_HAS_CHANGES: ${{ steps.find-changed.outputs.has_changes }}
          CHANGED_OUTCOME: ${{ steps.find-changed.outputs.outcome }}
          CHANGED_BASE: ${{ steps.find-changed.outputs.base_sha }}
          CHANGED_DIRECTORY: ${{ steps.find-changed.outputs.directory }}
          EMPTY_HAS_CHANGES: ${{ steps.find-empty.outputs.has_changes }}
          EMPTY_DIRECTORY: ${{ steps.find-empty.outputs.directory }}
          MISSING_DIRECTORY: ${{ steps.find-missing.outputs.directory }}
          EMPTY_OUTCOME: ${{ steps.find-empty.outputs.outcome }}
          MOVED_HAS_CHANGES: ${{ steps.find-moved.outputs.has_changes }}
          MOVED_OUTCOME: ${{ steps.find-moved.outputs.outcome }}
          MISSING_FOUND: ${{ steps.find-missing.outputs.found }}
          MISSING_HAS_CHANGES: ${{ steps.find-missing.outputs.has_changes }}
          MISSING_OUTCOME: ${{ steps.find-missing.outputs.outcome }}
          NO_RUN_OUTCOME: ${{ steps.find-no-run.outcome }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"

          fail() { echo "::error::$1"; exit 1; }
          [ "$CHANGED_FOUND" = "true" ] || fail "found '$CHANGED_FOUND' for an uploaded patch"
          [ "$CHANGED_HAS_CHANGES" = "true" ] || fail "has_changes '$CHANGED_HAS_CHANGES' for a changed patch"
          [ "$CHANGED_OUTCOME" = "changes" ] || fail "outcome '$CHANGED_OUTCOME' for a changed patch"
          [ "$CHANGED_BASE" = "$head" ] || fail "base_sha '$CHANGED_BASE' is not HEAD '$head'"
          [ -s "$CHANGED_DIRECTORY/changes.patch" ] || fail "directory '$CHANGED_DIRECTORY' holds no non-empty changes.patch"
          [ "$EMPTY_HAS_CHANGES" = "false" ] || fail "has_changes '$EMPTY_HAS_CHANGES' for an empty patch"
          [ "$EMPTY_OUTCOME" = "no_changes" ] || fail "outcome '$EMPTY_OUTCOME' for an empty patch"
          [ "$MOVED_HAS_CHANGES" = "false" ] || fail "has_changes '$MOVED_HAS_CHANGES' for a patch made from another commit"
          [ "$MOVED_OUTCOME" = "branch_moved" ] || fail "outcome '$MOVED_OUTCOME' for a patch made from another commit"
          [ "$MISSING_FOUND" = "false" ] || fail "found '$MISSING_FOUND' for an artifact never uploaded"
          [ "$MISSING_HAS_CHANGES" = "false" ] || fail "has_changes '$MISSING_HAS_CHANGES' for an artifact never uploaded"
          [ "$MISSING_OUTCOME" = "missing" ] || fail "outcome '$MISSING_OUTCOME' for an artifact never uploaded"
          [ -z "$MISSING_DIRECTORY" ] || fail "directory '$MISSING_DIRECTORY' set for an artifact never uploaded"
          [ -f "$EMPTY_DIRECTORY/metadata.json" ] || fail "directory '$EMPTY_DIRECTORY' holds no metadata.json"
          [ "$NO_RUN_OUTCOME" = "failure" ] || fail "a run that does not exist did not fail the step ($NO_RUN_OUTCOME)"

          echo "Found, empty, moved and missing patches each reported as expected, and an unknown run failed"

