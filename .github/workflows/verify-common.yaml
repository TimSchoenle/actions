  verify-github-fetch:
    name: 'Common Fetch-head: Fetch From GitHub'
    if: ${{ contains(fromJSON(inputs.targets), 'common/fetch-head') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: source

      # Installs the bundles the build job built from this commit; dist/ is not committed.
      - name: Install Built Actions
        uses: TimSchoenle/actions/actions/release/install-built-actions@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-release-install-built-actions-v1.1.0
        with:
          artifact-id: ${{ inputs.artifact-id }}
          expected-manifest-sha256: ${{ inputs.manifest-sha256 }}
          path: source

      # Every input but sha and path left to its default: this repository, this server, the job token.
      - name: Fetch The Triggering Commit
        id: triggering
        uses: ./source/actions/common/fetch-head # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          sha: ${{ github.sha }}
          path: fetched/triggering

      - name: Fetch The Head Commit
        id: head
        uses: ./source/actions/common/fetch-head # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
          path: fetched/head

      - name: Fetch The Head Commit Anonymously
        id: anonymous
        uses: ./source/actions/common/fetch-head # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
          path: fetched/anonymous
          token: ''

      - name: Fetch A Malformed SHA
        id: malformed
        continue-on-error: true
        uses: ./source/actions/common/fetch-head # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          sha: ${{ github.sha }}abc
          path: fetched/malformed

      - name: Assert Fetched Repositories
        env:
          TRIGGERING_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TRIGGERING_OUTPUT: ${{ steps.triggering.outputs.sha }}
          HEAD_OUTPUT: ${{ steps.head.outputs.sha }}
          ANONYMOUS_OUTPUT: ${{ steps.anonymous.outputs.sha }}
          MALFORMED_OUTCOME: ${{ steps.malformed.outcome }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          check() {
            local directory="$1" expected="$2" output="$3"
            [ "$output" = "$expected" ] || fail "$directory: output sha '$output' is not '$expected'"
            [ "$(git -C "$directory" rev-parse HEAD)" = "$expected" ] || fail "$directory: HEAD is not '$expected'"
            git -C "$directory" cat-file -e "$expected:actions/common/fetch-head/action.yaml" ||
              fail "$directory: the commit's tree is not readable"
            files="$(find "$directory" -mindepth 1 -maxdepth 1 ! -name .git)"
            [ -z "$files" ] || fail "$directory: files were checked out: $files"
            if git -C "$directory" config --get-regexp 'extraheader' >/dev/null; then
              fail "$directory: an authorization header was written to the repository config"
            fi
          }

          check fetched/triggering "$TRIGGERING_SHA" "$TRIGGERING_OUTPUT"
          check fetched/head "$HEAD_SHA" "$HEAD_OUTPUT"
          check fetched/anonymous "$HEAD_SHA" "$ANONYMOUS_OUTPUT"
          [ "$MALFORMED_OUTCOME" = "failure" ] || fail "an invalid sha did not fail the step ($MALFORMED_OUTCOME)"
          [ ! -e fetched/malformed/.git ] || fail "an invalid sha created a repository"

          echo "Triggering, head and anonymous fetches each left HEAD on the commit with nothing checked out"

