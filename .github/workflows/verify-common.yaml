    name: 'Common Generated-files-verdict: Round Trip: Generator Standing In For A Failed One'
    if: ${{ contains(fromJSON(inputs.targets), 'common/generated-files-verdict') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to fetch code
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
      artifact_name: ${{ steps.patch.outputs.artifact_name }}
    steps:
      - name: Harden Runner
