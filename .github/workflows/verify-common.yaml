  test-renders-and-commits:
    environment:
      name: ci-e2e
      deployment: false
    name: 'Common Render Template And Commit: Test Render And Commit: happy path'
    if: ${{ contains(fromJSON(inputs.targets), 'common/render-template-and-commit') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TEST_OWNER: TimSchoenle
      TEST_REPO_NAME: actions-testing
      TEST_REPO: TimSchoenle/actions-testing
      TEST_ID: render-template-and-commit-test-${{ github.run_number }}-${{ github.run_attempt }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
