      CHECKSUMS_DIGEST: 5cbf573f7d3828a6e679c35520f1bd00c512ec7bde31a281e40808ba68c8225c
      ARCHIVE: jactionlint_2.5.0_linux_amd64.tar.gz
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the bundles the build job built from this commit; dist/ is not committed.
      - name: Install Built Actions
        uses: TimSchoenle/actions/actions/release/install-built-actions@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-release-install-built-actions-v1.1.0
        with:
          artifact-id: ${{ inputs.artifact-id }}
          expected-manifest-sha256: ${{ inputs.manifest-sha256 }}

      - name: Block github.com
        shell: bash
        run: |
          set -euo pipefail
          echo '127.0.0.1 github.com' | sudo tee -a /etc/hosts > /dev/null
          if [[ "$RUNNER_OS" == macOS ]]; then
            sudo dscacheutil -flushcache
            sudo killall -HUP mDNSResponder
          fi
          if curl -fsS --max-time 10 -o /dev/null https://github.com/; then
            echo "::error::github.com is still reachable"
            exit 1
          fi

      - name: Run Test (Fallback)
        id: fallback
        uses: ./actions/common/download-release-asset # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          repository: ${{ env.REPOSITORY }}
          tag: ${{ env.TAG }}
          asset: ${{ env.ARCHIVE }}
          checksums-asset: ${{ env.CHECKSUMS }}
          checksums-sha256: ${{ env.CHECKSUMS_DIGEST }}

      - name: Assert Fallback
        shell: bash
        env:
          ARCHIVE_PATH: ${{ steps.fallback.outputs.path }}
        run: |
          set -euo pipefail

          [ -f "$ARCHIVE_PATH" ] || { echo "::error::'$ARCHIVE_PATH' is missing"; exit 1; }
          tar -tzf "$ARCHIVE_PATH" jactionlint > /dev/null || { echo "::error::$ARCHIVE_PATH holds no jactionlint"; exit 1; }

          echo "✅ $ARCHIVE downloaded and verified through the REST API with github.com unreachable"

  download-refusals:
    name: 'Common Download-release-asset: Mismatches, missing assets and invalid inputs'
    if: ${{ contains(fromJSON(inputs.targets), 'common/download-release-asset') }}
    runs-on: ubuntu-latest
