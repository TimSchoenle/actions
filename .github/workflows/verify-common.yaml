        uses: ./actions/common/download-release-asset # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          repository: ${{ env.REPOSITORY }}
          tag: ${{ env.TAG }}
          asset: ${{ env.CHECKSUMS }}
          sha256: ${{ env.CHECKSUMS_DIGEST }}

