  commit-patch-composite:
    name: 'Common Commit-patch: Round Trip Through The Runner'
    if: ${{ contains(fromJSON(inputs.targets), 'common/commit-patch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read # to download the patch by run ID through the REST API
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
