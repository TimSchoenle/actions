            echo "::error::a failed download left a directory under RUNNER_TEMP"
            exit 1
          fi
          [ "$MISSING_OUTCOME" = "failure" ] || { echo "::error::a missing asset ended '$MISSING_OUTCOME'"; exit 1; }
          [ "$BOTH_OUTCOME" = "failure" ] || { echo "::error::sha256 together with checksums-asset ended '$BOTH_OUTCOME'"; exit 1; }

          echo "✅ The mismatch, the missing asset and the conflicting inputs were refused"

