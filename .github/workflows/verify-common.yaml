  test-with-changes:
    environment:
      name: ci-e2e
      deployment: false
    name: 'Common Create Pull Request: Test PR Creation with Changes'
    if: ${{ contains(fromJSON(inputs.targets), 'common/create-pull-request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TEST_OWNER: TimSchoenle
      TEST_REPO_NAME: actions-testing
      TEST_REPO: TimSchoenle/actions-testing
      TEST_ID: create-pr-test-${{ github.run_number }}-${{ github.run_attempt }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Setup E2E Test Environment
        id: setup
        uses: TimSchoenle/actions/actions/test/setup-e2e@daf766fd1ab9d48129210afc63b1a7353f6064fd # tag=actions-test-setup-e2e-v1.2.7
        with:
          app_id: ${{ secrets.ACTIONS_TEST_BOT_APP_ID }}
          private_key: ${{ secrets.ACTIONS_TEST_BOT_PRIVATE_KEY }}
          test_owner: ${{ env.TEST_OWNER }}
          test_repo: ${{ env.TEST_REPO }}
          test_repo_name: ${{ env.TEST_REPO_NAME }}
          current_repo_checkout_path: 'tmp/actions-code'

      - name: Create Test File
        env:
          TEST_ID: ${{ env.TEST_ID }}
        run: |
          mkdir -p test-pr-output
          echo "Test content for $TEST_ID" > test-pr-output/test-file.txt
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> test-pr-output/test-file.txt

      - name: Run create-pull-request (with changes)
        id: create-pr
        uses: ./tmp/actions-code/actions/common/create-pull-request # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          app-id: ${{ secrets.ACTIONS_TEST_BOT_APP_ID }}
          private-key: ${{ secrets.ACTIONS_TEST_BOT_PRIVATE_KEY }}
          repository: ${{ env.TEST_REPO }}
          branch_name: test/create-pr-with-changes/${{ env.TEST_ID }}
          title: '[TEST-CREATE-PR] With Changes - ${{ env.TEST_ID }}'
          body: |
            **Test PR: Create with Changes**

            This is a test PR created by the create-pull-request action verification workflow.

            - **Test ID**: `${{ env.TEST_ID }}`
            - **Run Number**: `${{ github.run_number }}`
            - **Commit**: `${{ github.sha }}`
            - **Scenario**: Testing PR creation with file changes
          commit_message: 'test: verify create-pull-request action with changes (${{ env.TEST_ID }})'
          file_pattern: 'test-pr-output/test-file.txt'

      - name: Verify PR Created and Content
        shell: bash
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          PR_URL: ${{ steps.create-pr.outputs.pr_url }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pr_number }}
          EXPECTED_TITLE: '[TEST-CREATE-PR] With Changes - ${{ env.TEST_ID }}'
          TEST_ID: ${{ env.TEST_ID }}
          TEST_REPO: ${{ env.TEST_REPO }}
        run: |
          if [ -z "$PR_URL" ]; then
            echo "::error::PR URL was not set"
            exit 1
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "::error::PR number was not set"
            exit 1
          fi

          echo "✅ PR created successfully: $PR_URL"
          echo "PR Number: $PR_NUMBER"

          # Fetch PR details
          PR_DATA=$(gh pr view "$PR_NUMBER" --repo "$TEST_REPO" --json title,body,headRefName,baseRefName,files)

          # Verify title
          ACTUAL_TITLE=$(echo "$PR_DATA" | jq -r '.title')
          if [ "$ACTUAL_TITLE" != "$EXPECTED_TITLE" ]; then
            echo "::error::PR title mismatch. Expected: '$EXPECTED_TITLE', Got: '$ACTUAL_TITLE'"
            exit 1
          fi
          echo "✅ Title verified: $ACTUAL_TITLE"

          # Verify body contains test ID
          BODY=$(echo "$PR_DATA" | jq -r '.body')
          if ! echo "$BODY" | grep -q "$TEST_ID"; then
            echo "::error::PR body does not contain test ID: $TEST_ID"
            exit 1
          fi
          echo "✅ Body contains test ID"

          # Verify branch names
          HEAD_BRANCH=$(echo "$PR_DATA" | jq -r '.headRefName')
          BASE_BRANCH=$(echo "$PR_DATA" | jq -r '.baseRefName')
          EXPECTED_HEAD="test/create-pr-with-changes/$TEST_ID"
          if [ "$HEAD_BRANCH" != "$EXPECTED_HEAD" ]; then
            echo "::error::Head branch mismatch. Expected: '$EXPECTED_HEAD', Got: '$HEAD_BRANCH'"
            exit 1
          fi
          echo "✅ Head branch verified: $HEAD_BRANCH"
          echo "✅ Base branch: $BASE_BRANCH"

          # Verify file changes
          FILES=$(echo "$PR_DATA" | jq -r '.files[].path')
          if ! echo "$FILES" | grep -q "test-pr-output/test-file.txt"; then
            echo "::error::Expected file 'test-pr-output/test-file.txt' not found in PR"
            echo "Files in PR: $FILES"
            exit 1
          fi
          echo "✅ File changes verified"

          # Verify file content
          FILE_CONTENT=$(gh api "/repos/$TEST_REPO/contents/test-pr-output/test-file.txt?ref=$HEAD_BRANCH" --jq '.content' | base64 -d)
          if ! echo "$FILE_CONTENT" | grep -q "$TEST_ID"; then
            echo "::error::File content does not contain test ID"
            exit 1
          fi
          echo "✅ File content verified"

      # A second run for the same branch finds the open pull request through the owner-qualified
      # lookup and reports that one, instead of creating another or picking any same-named head.
      - name: Change Test File Again
        env:
          TEST_ID: ${{ env.TEST_ID }}
        run: echo "Second run for $TEST_ID" >> test-pr-output/test-file.txt

      - name: Run create-pull-request (existing pull request)
        id: create-pr-again
        uses: ./tmp/actions-code/actions/common/create-pull-request # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          app-id: ${{ secrets.ACTIONS_TEST_BOT_APP_ID }}
          private-key: ${{ secrets.ACTIONS_TEST_BOT_PRIVATE_KEY }}
          repository: ${{ env.TEST_REPO }}
          branch_name: test/create-pr-with-changes/${{ env.TEST_ID }}
          title: '[TEST-CREATE-PR] With Changes - ${{ env.TEST_ID }}'
          commit_message: 'test: second run of create-pull-request (${{ env.TEST_ID }})'
          file_pattern: 'test-pr-output/test-file.txt'

      - name: Verify The Existing Pull Request Is Reported
        shell: bash
        env:
          FIRST_NUMBER: ${{ steps.create-pr.outputs.pr_number }}
          SECOND_NUMBER: ${{ steps.create-pr-again.outputs.pr_number }}
          SECOND_URL: ${{ steps.create-pr-again.outputs.pr_url }}
        run: |
          set -euo pipefail
          [ "$SECOND_NUMBER" = "$FIRST_NUMBER" ] || { echo "::error::second run reported #$SECOND_NUMBER, expected #$FIRST_NUMBER"; exit 1; }
          [[ "$SECOND_URL" == */pull/"$FIRST_NUMBER" ]] || { echo "::error::second run reported URL '$SECOND_URL'"; exit 1; }
          echo "The second run reported the open pull request #$FIRST_NUMBER"

      # Guarded, not just `always()`: a run that opened no pull request — because it failed early, or
      # because skipping was the very thing under test — has no number to close, and closing "nothing"
      # would report a second, misleading failure on top of the real result.
      - name: Cleanup Test Pull Request
        if: always() && steps.create-pr.outputs.pr_number != ''
        uses: TimSchoenle/actions/actions/common/close-pull-request@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-close-pull-request-v2.0.4
        with:
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          pull_request_id: ${{ steps.create-pr.outputs.pr_number }}

      - name: Cleanup Test Branch
        if: always()
        uses: TimSchoenle/actions/actions/common/delete-branch@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-delete-branch-v2.0.4
        with:
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          branch_name: 'test/create-pr-with-changes/${{ env.TEST_ID }}'

