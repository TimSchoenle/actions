        run: |
          mkdir -p render-test/partials/tables
          cat <<'EOF' > render-test/README.hbs
          # {{ repo }}

          {{> tables/actions }}

          {{> footer }}
          EOF
          cat <<'EOF' > render-test/partials/tables/actions.hbs
          | Action | Description |
          | --- | --- |
          {{#each (sortBy actions "name")}}| `{{ name }}` | {{ mdCell description }} |
          {{/each}}
          EOF
          printf -- '---\nGenerated.\n' > render-test/partials/footer.hbs

      - name: Run render-template-and-commit
        id: run
        uses: ./tmp/actions-code/actions/common/render-template-and-commit # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          template: render-test/README.hbs
          output: render-test/out/README.md
          partials-dir: render-test/partials
          variables: '{"repo":"acme/actions","actions":[{"name":"read-yaml","description":"Read a|value"},{"name":"clippy","description":"Lint Rust"}]}'
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          branch: ${{ steps.branch.outputs.branch }}
          commit_message: 'docs: render happy path ${{ env.TEST_ID }}'

      - name: Verify Outputs
        env:
          CHANGED: ${{ steps.run.outputs.changed }}
          CHECKSUM: ${{ steps.run.outputs.checksum }}
          OUTPUT_PATH: ${{ steps.run.outputs.output-path }}
          COMMIT_SHA: ${{ steps.run.outputs.commit_hash }}
          COMMIT_URL: ${{ steps.run.outputs.commit_url }}
          CHANGES_DETECTED: ${{ steps.run.outputs.changes_detected }}
        run: |
          set -euo pipefail
          [ "$CHANGED" = "true" ] || { echo "::error::changed was '$CHANGED', expected true"; exit 1; }
          [ "$CHANGES_DETECTED" = "true" ] || { echo "::error::changes_detected was '$CHANGES_DETECTED'"; exit 1; }
          [ "$OUTPUT_PATH" = "render-test/out/README.md" ] || { echo "::error::output-path was '$OUTPUT_PATH'"; exit 1; }
          [ -n "$COMMIT_SHA" ] || { echo "::error::commit_hash is empty"; exit 1; }
          [ -n "$COMMIT_URL" ] || { echo "::error::commit_url is empty"; exit 1; }

          # The checksum must describe the bytes actually written, not the bytes intended.
          ACTUAL=$(sha256sum render-test/out/README.md | cut -d' ' -f1)
          [ "$CHECKSUM" = "$ACTUAL" ] || { echo "::error::checksum '$CHECKSUM' does not match the file's '$ACTUAL'"; exit 1; }
          echo "✅ All outputs correct"

      # Comparing the committed bytes rather than grepping them is what catches the failures that
      # matter for a generated file: a partial indented into a code block, a mangled table cell, a
      # lost trailing newline.
      - name: Verify Committed Bytes
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          TEST_REPO: ${{ env.TEST_REPO }}
          COMMIT_SHA: ${{ steps.run.outputs.commit_hash }}
        run: |
          set -euo pipefail
          gh api "/repos/$TEST_REPO/contents/render-test/out/README.md?ref=$COMMIT_SHA" \
            --jq '.content' | base64 -d > committed.md

          cat <<'EOF' > expected.md
          # acme/actions

          | Action | Description |
          | --- | --- |
          | `clippy` | Lint Rust |
          | `read-yaml` | Read a\|value |

          ---
          Generated.
          EOF

          if ! diff -u expected.md committed.md; then
            echo "::error::Committed content does not match the expected bytes."
            exit 1
          fi
          echo "✅ Committed content matches exactly"

      # The default file_pattern is the rendered path alone. An unrelated dirty file in the
      # workspace must not ride along in a documentation commit.
      - name: Verify Commit Contains Only The Rendered File
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          TEST_REPO: ${{ env.TEST_REPO }}
          COMMIT_SHA: ${{ steps.run.outputs.commit_hash }}
        run: |
          set -euo pipefail
          FILES=$(gh api "/repos/$TEST_REPO/commits/$COMMIT_SHA" --jq '.files[].filename' | sort)
          echo "Files in commit:"
          echo "$FILES"

          if [ "$FILES" != "render-test/out/README.md" ]; then
            echo "::error::Expected exactly the rendered file, got: $FILES"
            exit 1
          fi
          echo "✅ Only the rendered file was committed"

      # commit-changes commits through the GraphQL mutation so GitHub signs the commit. Composing it
      # must not lose that property — an unverified documentation commit fails branch protection.
      - name: Verify Commit Is Signed
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          TEST_REPO: ${{ env.TEST_REPO }}
          COMMIT_SHA: ${{ steps.run.outputs.commit_hash }}
        run: |
          set -euo pipefail
          VERIFICATION=$(gh api "/repos/$TEST_REPO/commits/$COMMIT_SHA" --jq '.commit.verification')
          VERIFIED=$(echo "$VERIFICATION" | jq -r '.verified')
          REASON=$(echo "$VERIFICATION" | jq -r '.reason')

          [ "$VERIFIED" = "true" ] || { echo "::error::Commit is not verified (reason: $REASON)"; exit 1; }
          [ "$REASON" = "valid" ] || { echo "::error::Expected reason 'valid', got '$REASON'"; exit 1; }
          echo "✅ Commit is signed by GitHub and marked as verified"

      - name: Cleanup Branch
        if: always()
        uses: TimSchoenle/actions/actions/common/delete-branch@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-delete-branch-v2.0.4
        with:
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          branch_name: ${{ steps.branch.outputs.branch }}

  # Rendering is deterministic, so a second run over unchanged inputs must leave the branch exactly
  # where it was. This is the property a scheduled regeneration depends on: without it every run
  # manufactures a commit.
  test-skips-commit-when-unchanged:
    environment:
      name: ci-e2e
      deployment: false
    name: 'Common Render Template And Commit: Test Skip: unchanged render makes no commit'
    if: ${{ contains(fromJSON(inputs.targets), 'common/render-template-and-commit') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TEST_OWNER: TimSchoenle
      TEST_REPO_NAME: actions-testing
      TEST_REPO: TimSchoenle/actions-testing
      TEST_ID: render-template-and-commit-test-${{ github.run_number }}-${{ github.run_attempt }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Setup E2E Test Environment
        id: setup
        uses: TimSchoenle/actions/actions/test/setup-e2e@daf766fd1ab9d48129210afc63b1a7353f6064fd # tag=actions-test-setup-e2e-v1.2.7
        with:
          app_id: ${{ secrets.ACTIONS_TEST_BOT_APP_ID }}
          private_key: ${{ secrets.ACTIONS_TEST_BOT_PRIVATE_KEY }}
          test_owner: ${{ env.TEST_OWNER }}
          test_repo: ${{ env.TEST_REPO }}
          test_repo_name: ${{ env.TEST_REPO_NAME }}
          current_repo_checkout_path: 'tmp/actions-code'

      - name: Create Test Branch
        id: branch
        uses: TimSchoenle/actions/actions/common/create-branch@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-create-branch-v2.0.4
        with:
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          branch_name: test/render-commit/unchanged/${{ env.TEST_ID }}
          reset_branch: 'true'

      - name: Create Template
        run: |
          mkdir -p render-test
          printf '{{#each (sort tags)}}- {{ this }}\n{{/each}}' > render-test/README.hbs

      - name: First Run
        id: first
        uses: ./tmp/actions-code/actions/common/render-template-and-commit # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          template: render-test/README.hbs
          output: render-test/out/README.md
          variables: '{"tags":["docs","ci","rust"]}'
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          branch: ${{ steps.branch.outputs.branch }}
          commit_message: 'docs: first render ${{ env.TEST_ID }}'

      - name: Second Run With The Same Inputs
        id: second
        uses: ./tmp/actions-code/actions/common/render-template-and-commit # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          template: render-test/README.hbs
          output: render-test/out/README.md
          variables: '{"tags":["docs","ci","rust"]}'
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          branch: ${{ steps.branch.outputs.branch }}
          commit_message: 'docs: second render ${{ env.TEST_ID }}'

      # The same set in a different order must render identically, or a reshuffled payload commits a
      # diff that is not a real change.
      - name: Third Run With The Variables Reordered
        id: third
        uses: ./tmp/actions-code/actions/common/render-template-and-commit # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          template: render-test/README.hbs
          output: render-test/out/README.md
          variables: '{"tags":["rust","docs","ci"]}'
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          branch: ${{ steps.branch.outputs.branch }}
          commit_message: 'docs: third render ${{ env.TEST_ID }}'

      - name: Verify Only The First Run Committed
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          TEST_REPO: ${{ env.TEST_REPO }}
          BRANCH_NAME: ${{ steps.branch.outputs.branch }}
          FIRST_SHA: ${{ steps.first.outputs.commit_hash }}
          FIRST_CHANGED: ${{ steps.first.outputs.changed }}
          SECOND_CHANGED: ${{ steps.second.outputs.changed }}
          SECOND_SHA: ${{ steps.second.outputs.commit_hash }}
          SECOND_DETECTED: ${{ steps.second.outputs.changes_detected }}
          THIRD_CHANGED: ${{ steps.third.outputs.changed }}
          THIRD_SHA: ${{ steps.third.outputs.commit_hash }}
          THIRD_DETECTED: ${{ steps.third.outputs.changes_detected }}
        run: |
          set -euo pipefail
          [ "$FIRST_CHANGED" = "true" ] || { echo "::error::first run reported changed=$FIRST_CHANGED"; exit 1; }
          [ -n "$FIRST_SHA" ] || { echo "::error::first run made no commit"; exit 1; }

          [ "$SECOND_CHANGED" = "false" ] || { echo "::error::re-rendering identical inputs reported changed=$SECOND_CHANGED"; exit 1; }
          [ "$THIRD_CHANGED" = "false" ] || { echo "::error::reordered inputs reported changed=$THIRD_CHANGED"; exit 1; }

          # A skipped commit step leaves its outputs empty; the action must still report a usable
          # boolean, and must not invent a commit SHA.
          [ "$SECOND_DETECTED" = "false" ] || { echo "::error::second run reported changes_detected='$SECOND_DETECTED', expected 'false'"; exit 1; }
          [ "$THIRD_DETECTED" = "false" ] || { echo "::error::third run reported changes_detected='$THIRD_DETECTED', expected 'false'"; exit 1; }
          [ -z "$SECOND_SHA" ] || { echo "::error::second run reported commit_hash '$SECOND_SHA'"; exit 1; }
          [ -z "$THIRD_SHA" ] || { echo "::error::third run reported commit_hash '$THIRD_SHA'"; exit 1; }

          # The branch itself is the evidence: still the first commit, and only one of ours on it.
          TIP=$(gh api "/repos/$TEST_REPO/commits/$BRANCH_NAME" --jq '.sha')
          [ "$TIP" = "$FIRST_SHA" ] || { echo "::error::branch tip is $TIP, expected $FIRST_SHA"; exit 1; }
          echo "✅ Unchanged renders left the branch untouched"

      - name: Cleanup Branch
        if: always()
        uses: TimSchoenle/actions/actions/common/delete-branch@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-delete-branch-v2.0.4
        with:
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          branch_name: ${{ steps.branch.outputs.branch }}

  # An explicit file_pattern replaces the default rather than extending it, and must reach files the
  # render never touched.
  test-file-pattern-override:
    environment:
      name: ci-e2e
      deployment: false
    name: 'Common Render Template And Commit: Test Pattern: explicit file_pattern'
    if: ${{ contains(fromJSON(inputs.targets), 'common/render-template-and-commit') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TEST_OWNER: TimSchoenle
      TEST_REPO_NAME: actions-testing
      TEST_REPO: TimSchoenle/actions-testing
      TEST_ID: render-template-and-commit-test-${{ github.run_number }}-${{ github.run_attempt }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Setup E2E Test Environment
        id: setup
        uses: TimSchoenle/actions/actions/test/setup-e2e@daf766fd1ab9d48129210afc63b1a7353f6064fd # tag=actions-test-setup-e2e-v1.2.7
        with:
          app_id: ${{ secrets.ACTIONS_TEST_BOT_APP_ID }}
          private_key: ${{ secrets.ACTIONS_TEST_BOT_PRIVATE_KEY }}
          test_owner: ${{ env.TEST_OWNER }}
          test_repo: ${{ env.TEST_REPO }}
          test_repo_name: ${{ env.TEST_REPO_NAME }}
          current_repo_checkout_path: 'tmp/actions-code'

      - name: Create Test Branch
        id: branch
        uses: TimSchoenle/actions/actions/common/create-branch@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-create-branch-v2.0.4
        with:
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          branch_name: test/render-commit/file-pattern/${{ env.TEST_ID }}
          reset_branch: 'true'

      - name: Create Template And A Sidecar File
        env:
          TEST_ID: ${{ env.TEST_ID }}
        run: |
          mkdir -p render-test/out
          printf '# {{ title }}\n' > render-test/README.hbs
          echo "sidecar $TEST_ID" > render-test/out/sidecar.txt
          echo "unrelated $TEST_ID" > render-test/unrelated.txt

      - name: Run render-template-and-commit
        id: run
        uses: ./tmp/actions-code/actions/common/render-template-and-commit # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          template: render-test/README.hbs
          output: render-test/out/README.md
          variables: '{"title":"Actions"}'
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          branch: ${{ steps.branch.outputs.branch }}
          commit_message: 'docs: render with pattern ${{ env.TEST_ID }}'
          file_pattern: 'render-test/out/**/*'

      - name: Verify The Pattern Decided What Was Committed
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          TEST_REPO: ${{ env.TEST_REPO }}
          COMMIT_SHA: ${{ steps.run.outputs.commit_hash }}
        run: |
          set -euo pipefail
          [ -n "$COMMIT_SHA" ] || { echo "::error::no commit was made"; exit 1; }

          FILES=$(gh api "/repos/$TEST_REPO/commits/$COMMIT_SHA" --jq '.files[].filename' | sort)
          echo "Files in commit:"
          echo "$FILES"

          EXPECTED=$(printf 'render-test/out/README.md\nrender-test/out/sidecar.txt\n' | sort)
          if [ "$FILES" != "$EXPECTED" ]; then
            echo "::error::Commit does not contain exactly the pattern's matches"
            diff <(echo "$EXPECTED") <(echo "$FILES") || true
            exit 1
          fi
          echo "✅ The explicit pattern decided the commit contents"

      - name: Cleanup Branch
        if: always()
        uses: TimSchoenle/actions/actions/common/delete-branch@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-delete-branch-v2.0.4
        with:
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          branch_name: ${{ steps.branch.outputs.branch }}

  # A render that fails must stop before the commit. Committing a half-rendered or missing file is
  # the one outcome worse than failing the workflow.
  test-render-failure-commits-nothing:
    environment:
      name: ci-e2e
      deployment: false
    name: 'Common Render Template And Commit: Test Failure: ${{ matrix.name }}'
    if: ${{ contains(fromJSON(inputs.targets), 'common/render-template-and-commit') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: undefined-reference
            template: '{{#each actions}}row{{/each}}'
            variables: '{"other":1}'

          - name: variables-are-not-json
            template: 'x'
            variables: 'title: Actions'

          - name: malformed-template
            template: '{{#each items}}unclosed'
            variables: '{"items":[]}'

    permissions:
      contents: read
    env:
      TEST_OWNER: TimSchoenle
      TEST_REPO_NAME: actions-testing
      TEST_REPO: TimSchoenle/actions-testing
      TEST_ID: render-template-and-commit-test-${{ github.run_number }}-${{ github.run_attempt }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Setup E2E Test Environment
        id: setup
        uses: TimSchoenle/actions/actions/test/setup-e2e@daf766fd1ab9d48129210afc63b1a7353f6064fd # tag=actions-test-setup-e2e-v1.2.7
        with:
          app_id: ${{ secrets.ACTIONS_TEST_BOT_APP_ID }}
          private_key: ${{ secrets.ACTIONS_TEST_BOT_PRIVATE_KEY }}
          test_owner: ${{ env.TEST_OWNER }}
          test_repo: ${{ env.TEST_REPO }}
          test_repo_name: ${{ env.TEST_REPO_NAME }}
          current_repo_checkout_path: 'tmp/actions-code'

      - name: Create Test Branch
        id: branch
        uses: TimSchoenle/actions/actions/common/create-branch@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-create-branch-v2.0.4
        with:
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          branch_name: test/render-commit/failure/${{ matrix.name }}/${{ env.TEST_ID }}
          reset_branch: 'true'

      - name: Record Branch Tip Before The Run
        id: before
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          TEST_REPO: ${{ env.TEST_REPO }}
          BRANCH_NAME: ${{ steps.branch.outputs.branch }}
        run: echo "sha=$(gh api "/repos/$TEST_REPO/commits/$BRANCH_NAME" --jq '.sha')" >> "$GITHUB_OUTPUT"

      - name: Create Template
        env:
          TEMPLATE: ${{ matrix.template }}
        run: |
          mkdir -p render-test
          printf '%s' "$TEMPLATE" > render-test/README.hbs

      - name: Run render-template-and-commit (expect failure)
        id: run
        continue-on-error: true
        uses: ./tmp/actions-code/actions/common/render-template-and-commit # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          template: render-test/README.hbs
          output: render-test/out/README.md
          variables: ${{ matrix.variables }}
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          branch: ${{ steps.branch.outputs.branch }}
          commit_message: 'docs: must not be committed ${{ env.TEST_ID }}'

      # The output path sits under a directory the checkout does not create, so its absence is
      # evidence the render wrote nothing rather than an artefact of the workspace.
      - name: Verify Nothing Was Written Or Committed
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          TEST_REPO: ${{ env.TEST_REPO }}
          BRANCH_NAME: ${{ steps.branch.outputs.branch }}
          OUTCOME: ${{ steps.run.outcome }}
          BEFORE_SHA: ${{ steps.before.outputs.sha }}
          COMMIT_SHA: ${{ steps.run.outputs.commit_hash }}
        run: |
          set -euo pipefail
          [ "$OUTCOME" = "failure" ] || { echo "::error::Expected the step to fail, got '$OUTCOME'"; exit 1; }
          [ -z "$COMMIT_SHA" ] || { echo "::error::A failed render reported commit_hash '$COMMIT_SHA'"; exit 1; }

          if [ -e render-test/out/README.md ]; then
            echo "::error::A failed render left an output file behind."
            cat render-test/out/README.md
            exit 1
          fi

          TIP=$(gh api "/repos/$TEST_REPO/commits/$BRANCH_NAME" --jq '.sha')
          [ "$TIP" = "$BEFORE_SHA" ] || { echo "::error::branch moved from $BEFORE_SHA to $TIP"; exit 1; }
          echo "✅ Failed before committing, leaving the branch untouched"

      - name: Cleanup Branch
        if: always()
        uses: TimSchoenle/actions/actions/common/delete-branch@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-delete-branch-v2.0.4
        with:
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          branch_name: ${{ steps.branch.outputs.branch }}

  e2e-common-setup-app-git-identity:
    name: 'Common Setup-app-git-identity: End-to-end'
    if: ${{ contains(fromJSON(inputs.targets), 'common/setup-app-git-identity') }}
    environment:
      name: ci-e2e
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the bundles the build job built from this commit; dist/ is not committed.
      - name: Install Built Actions
        uses: TimSchoenle/actions/actions/release/install-built-actions@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-release-install-built-actions-v1.1.0
        with:
          artifact-id: ${{ inputs.artifact-id }}
          expected-manifest-sha256: ${{ inputs.manifest-sha256 }}

      # setup-bun rather than setup-cached: the cached wrapper runs `bun install` on every job, cache
      # hit or not, and this job is the one that must have no route to a package registry at all.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.bun-version'

      # The harness runs a node24 bundle with the first node on PATH and refuses any other major,
      # and the image's default node is not 24. A major alone resolves from the runner's tool
      # cache, so this reaches no endpoint the allowlist above does not already carry.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Restored, never installed, and never saved. `fail-on-cache-miss` is what keeps that honest:
      # without it a miss would leave the suite to fail later on a missing import.
      - name: Restore Dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            actions/*/*/*/node_modules
            actions/*/*/node_modules
            packages/*/node_modules
          key: ${{ inputs.cache-key }}
          fail-on-cache-miss: true

      # The cases run `dist/index.js`, the bundle GitHub itself would run: the one the install step
      # above put there, which the harness checks against BUILT_ACTIONS_MANIFEST before it runs it.
      - name: Generate Token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ACTIONS_TEST_BOT_APP_ID }}
          private-key: ${{ secrets.ACTIONS_TEST_BOT_PRIVATE_KEY }}
          owner: TimSchoenle
          repositories: actions-testing
          permission-metadata: read

      - name: Run End-to-end Cases
        env:
          E2E_GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          # An installation token cannot call `GET /user`, so the suite resolves its own account by
          # app slug instead. Without this a case matching commit authors fails only in CI.
          E2E_APP_SLUG: ${{ steps.token.outputs.app-slug }}
