  download-direct:
    name: 'Common Download-release-asset: Download and verify (${{ matrix.os }})'
    if: ${{ contains(fromJSON(inputs.targets), 'common/download-release-asset') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read # to fetch code
    env:
      REPOSITORY: jdx/jactionlint
      TAG: v2.5.0
      CHECKSUMS: jactionlint_2.5.0_checksums.txt
      CHECKSUMS_DIGEST: 5cbf573f7d3828a6e679c35520f1bd00c512ec7bde31a281e40808ba68c8225c
      ARCHIVE: jactionlint_2.5.0_linux_amd64.tar.gz
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the bundles the build job built from this commit; dist/ is not committed.
      - name: Install Built Actions
        uses: TimSchoenle/actions/actions/release/install-built-actions@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-release-install-built-actions-v1.1.0
        with:
          artifact-id: ${{ inputs.artifact-id }}
          expected-manifest-sha256: ${{ inputs.manifest-sha256 }}

      - name: Run Test (Pinned SHA-256)
        id: pinned
        uses: ./actions/common/download-release-asset # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          repository: ${{ env.REPOSITORY }}
          tag: ${{ env.TAG }}
          asset: ${{ env.CHECKSUMS }}
          sha256: ${{ env.CHECKSUMS_DIGEST }}

      - name: Run Test (Checksums File)
        id: checksums
        uses: ./actions/common/download-release-asset # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          repository: ${{ env.REPOSITORY }}
          tag: ${{ env.TAG }}
          asset: ${{ env.ARCHIVE }}
          checksums-asset: ${{ env.CHECKSUMS }}
          checksums-sha256: ${{ env.CHECKSUMS_DIGEST }}

      - name: Assert Downloads
        shell: bash
        env:
          PINNED_PATH: ${{ steps.pinned.outputs.path }}
          ARCHIVE_PATH: ${{ steps.checksums.outputs.path }}
        run: |
          set -euo pipefail

          # Hashed from stdin: given a Windows path, sha256sum escapes its backslashes and starts the
          # line with a backslash, which the first field would then include.
          sha256() {
            if command -v sha256sum > /dev/null; then
              sha256sum < "$1" | cut -d ' ' -f 1
            else
              shasum -a 256 < "$1" | cut -d ' ' -f 1
            fi
          }

          for file in "$PINNED_PATH" "$ARCHIVE_PATH"; do
            case "$file" in
              "$RUNNER_TEMP"*) ;;
              *) echo "::error::path '$file' is not under RUNNER_TEMP '$RUNNER_TEMP'"; exit 1 ;;
            esac
            [ -f "$file" ] || { echo "::error::$file is missing"; exit 1; }
          done
          # The separator is \ on windows-latest and / elsewhere.
          case "$ARCHIVE_PATH" in
            */"$ARCHIVE" | *\\"$ARCHIVE") ;;
            *) echo "::error::$ARCHIVE_PATH is not named $ARCHIVE"; exit 1 ;;
          esac
          [ "$(sha256 "$PINNED_PATH")" = "$CHECKSUMS_DIGEST" ] || { echo "::error::$PINNED_PATH does not have the pinned SHA-256"; exit 1; }
          expected="$(awk -v name="$ARCHIVE" '$2 == name { print $1 }' "$PINNED_PATH")"
          [ "$(sha256 "$ARCHIVE_PATH")" = "$expected" ] || { echo "::error::$ARCHIVE_PATH does not match the checksums file"; exit 1; }

          echo "✅ Both downloads are under RUNNER_TEMP and match their pins"

  # github.com is pointed at 127.0.0.1 after checkout, so every release download fails and the action
  # has to go through the REST API asset endpoint.
  download-fallback:
    name: 'Common Download-release-asset: Download through the REST API when the release download fails (${{ matrix.os }})'
    if: ${{ contains(fromJSON(inputs.targets), 'common/download-release-asset') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read # to fetch code
    env:
