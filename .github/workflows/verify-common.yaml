    name: 'Common Generated-files-verdict: Round Trip: Verdict With Nothing Pending'
    needs: [verdict-generate-clean, verdict-pending]
    if: ${{ contains(fromJSON(inputs.targets), 'common/generated-files-verdict') && (always()) }}
