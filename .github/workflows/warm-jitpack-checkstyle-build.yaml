name: Warm JitPack Checkstyle Build

# JitPack builds a tag on first request and serves it from cache after that - failures are
# otherwise silent until a consumer happens to hit them. Resolving the two published artifacts'
# POMs right after a release tag is created is the same thing a real Gradle/Maven consumer's
# resolution does, so a broken build (or the "build.gradle.kts in a subfolder is publicly
# gitignored" class of mistake) is caught here instead of by whoever resolves it first.
#
# Every JitPack build covers the whole configs/checkstyle Gradle reactor regardless of which
# ruleset's tag triggered it (see configs/checkstyle/build.gradle.kts), so both artifacts are
# verified on either tag.

on:
  push:
    tags:
      - 'configs-checkstyle-application-v*'
      - 'configs-checkstyle-library-v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  warm-build:
    name: Warm JitPack Build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Resolve published artifacts from JitPack
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          BASE="https://jitpack.io/de/timscho/actions"

          for ARTIFACT in checkstyle-application checkstyle-library; do
            URL="${BASE}/${ARTIFACT}/${TAG}/${ARTIFACT}-${TAG}.pom"
            echo "Resolving ${URL} (JitPack builds on first request; this can take a few minutes)..."

            HTTP_CODE=$(curl -sS --max-time 900 -o response.txt -w '%{http_code}' "${URL}")

            if [ "${HTTP_CODE}" != "200" ]; then
              echo "::error::JitPack could not resolve ${ARTIFACT} at ${TAG} (HTTP ${HTTP_CODE})."
              echo "Build log: https://jitpack.io/com/github/TimSchoenle/actions/${TAG}/build.log"
              cat response.txt
              exit 1
            fi

            echo "${ARTIFACT} resolved at ${TAG}."
          done
