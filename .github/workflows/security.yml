name: Security

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch code
      security-events: write # to upload SARIF results
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # zizmor collects workflows only from `.github/workflows`, so each reusable workflow under
      # `workflows/` has to be named on a line of its own.
      - name: Find Reusable Workflows
        id: find-workflows
        run: |
          set -euo pipefail
          {
            echo 'workflow_files<<EOF'
            find workflows -type f \( -name '*.yaml' -o -name '*.yml' \) | LC_ALL=C sort
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Zizmor
        uses: TimSchoenle/actions/actions/security/zizmor@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-security-zizmor-v1.1.3
        with:
          inputs: |
            .
            ${{ steps.find-workflows.outputs.workflow_files }}

  action-lint:
    name: Action Lint
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # A pinned release, checked against a pinned SHA-256 before it is unpacked, instead of piping the
      # install script from actionlint's main branch into bash: that ran whatever the branch held at
      # the time, with no version and no integrity check. The version and checksum are updated together
      # by the github-release-attachments customManager in renovate.json, which reads both lines below.
      - name: Download actionlint
        id: get_actionlint
        env:
          # renovate: datasource=github-release-attachments depName=rhysd/actionlint
          ACTIONLINT_VERSION: 'v1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz"
          install_dir="${RUNNER_TEMP}/actionlint"
          mkdir -p "$install_dir"
          curl -fsSL --retry 3 -o "${install_dir}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${install_dir}/${archive}" | sha256sum --check --strict -
          tar -xzf "${install_dir}/${archive}" -C "$install_dir" actionlint
          echo "executable=${install_dir}/actionlint" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Check workflow files
        env:
          EXECUTABLE: ${{ steps.get_actionlint.outputs.executable }}
        run: |
          shopt -s globstar nullglob
          $EXECUTABLE -color -verbose \
            -config-file .github/actionlint.yaml \
            .github/workflows/*.{yml,yaml} \
            workflows/**/*.{yml,yaml}
        shell: bash
