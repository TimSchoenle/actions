name: Security

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['**']
  schedule:
    # Weekly, for advisories published since the last change. Off the hour, where GitHub's scheduling
    # backlog is deepest.
    - cron: '23 4 * * 1'
  workflow_dispatch:

# The event is part of the group, so a push to main does not cancel the scheduled run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # jactionlint replaces both zizmor and actionlint: it keeps every check of actionlint and has a rule
  # for every zizmor audit. The shared action installs a checksum-verified release, annotates the
  # findings, writes a summary, uploads the SARIF to code scanning under the category jactionlint and
  # fails on findings. It runs the pedantic profile, the counterpart of the zizmor pedantic persona;
  # .github/jactionlint.yaml turns off the rules this repository does not want and lists the accepted
  # findings. It runs online, so the checks that ask GitHub, Docker Hub and ghcr.io about the actions
  # and images in use (impostor commits, vulnerable action versions, moved tags, archived repositories)
  # gate every pull request; the weekly run catches advisories published since the last change. online
  # is `true` rather than `strict`, so a GitHub lookup that does not answer does not block a pull
  # request. strict-exit makes warning and info findings fail the job too. The job keeps the name
  # "Action Lint" because the branch ruleset requires that context (see scripts/lib/required-checks.ts).
  action-lint:
    name: Action Lint
    # Skipped on release-please pull requests, which only change changelogs, the manifest and generated
    # docs: Update Files still checks those. All three conditions are needed, since a skipped required
    # job reports success: the branch name alone is chosen by whoever opens the pull request.
    # Anyone with write access can still push to that branch; the required approval and
    # timed-auto-merge's commit author check are what cover that. 248313786 is
    # automatic-release-manager[bot].
    if: >-
      !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.id == 248313786)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to fetch code
      security-events: write # to upload SARIF results
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            ghcr.io:443
            auth.docker.io:443
            registry-1.docker.io:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run jactionlint
        uses: TimSchoenle/actions/actions/security/jactionlint@0701d3b35ad7e10e3159471c82f4743b67fdc01f # tag=actions-security-jactionlint-v1.1.3
        with:
          online: 'true'
          strict-exit: 'true'
