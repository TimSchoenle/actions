# GENERATED by scripts/generate-verify.ts. Do not edit by hand.
# Run 'bun run generate-verify' to rebuild it from the sources in .github/verify/; the drift check in
# Scripts CI fails while it is out of date. See docs/verify-pipeline.md.
#
# Called by .github/workflows/verify.yaml. Every job runs only when its target is in inputs.targets.
# Targets:
#   rust/auto-format (.github/verify/rust-auto-format.yaml)
#   rust/cargo-check (.github/verify/rust-cargo-check.yaml)
#   rust/config-contract (.github/verify/rust-config-contract.yaml)
#   rust/coverage-codecov (.github/verify/rust-coverage-codecov.yaml)
#   rust/test (.github/verify/rust-test.yaml)
name: Verify Rust

on:
  workflow_call:
    inputs:
      targets:
        description: JSON array of the targets this run verifies.
        type: string
        required: true
      cache-key:
        description: Key of the dependency cache the install job saved.
        type: string
        required: false
        default: ''
      artifact-id:
        description: ID of the artifact the build job uploaded; empty when nothing was built.
        type: string
        required: false
        default: ''
      manifest-sha256:
        description: SHA-256 of the build manifest inside that artifact.
        type: string
        required: false
        default: ''
    secrets:
      ACTIONS_TEST_BOT_APP_ID:
        required: false
      ACTIONS_TEST_BOT_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  test-auto-format-formats-and-commits:
    environment:
      name: ci-e2e
      deployment: false
    name: 'Rust Auto-format: Test Auto-format: ${{ matrix.name }}'
    if: ${{ contains(fromJSON(inputs.targets), 'rust/auto-format') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            source_directory: '.'
            crate_path: '.'

          - name: subdirectory
            source_directory: 'crates/demo'
            crate_path: 'crates/demo'

          # A toolchain file only in the crate, with a profile that leaves rustfmt out. The setup
          # step never sees it, so the action must add rustfmt to the toolchain cargo fmt selects.
          - name: subdirectory-toolchain
            source_directory: 'crates/demo'
            crate_path: 'crates/demo'
            toolchain_file: 'true'

    permissions:
      contents: read
    env:
      TEST_OWNER: TimSchoenle
      TEST_REPO_NAME: actions-testing
      TEST_REPO: TimSchoenle/actions-testing
      TEST_ID: rust-auto-format-test-${{ github.run_number }}-${{ github.run_attempt }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Setup E2E Test Environment
        id: setup
        uses: TimSchoenle/actions/actions/test/setup-e2e@daf766fd1ab9d48129210afc63b1a7353f6064fd # tag=actions-test-setup-e2e-v1.2.7
        with:
          app_id: ${{ secrets.ACTIONS_TEST_BOT_APP_ID }}
          private_key: ${{ secrets.ACTIONS_TEST_BOT_PRIVATE_KEY }}
          test_owner: ${{ env.TEST_OWNER }}
          test_repo: ${{ env.TEST_REPO }}
          test_repo_name: ${{ env.TEST_REPO_NAME }}
          current_repo_checkout_path: 'tmp/actions-code'

      # Replaces the committed bundles in tmp/actions-code with the ones the build job built.
      - name: Install Built Actions
        uses: TimSchoenle/actions/actions/release/install-built-actions@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-release-install-built-actions-v1.1.0
        with:
          artifact-id: ${{ inputs.artifact-id }}
          expected-manifest-sha256: ${{ inputs.manifest-sha256 }}
          path: tmp/actions-code

      - name: Create Test Branch
        id: branch
        uses: TimSchoenle/actions/actions/common/create-branch@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-create-branch-v2.0.4
        with:
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          branch_name: test/rust-auto-format/${{ matrix.name }}/${{ env.TEST_ID }}
          reset_branch: 'true'

      # The unformatted file outside the crate is never formatted, since cargo fmt only reaches the
      # crate's own modules. It proves the commit holds what the crate's formatting changed and no more.
      - name: Create Unformatted Crate
        shell: bash
        env:
          CRATE_PATH: ${{ matrix.crate_path }}
          TOOLCHAIN_FILE: ${{ matrix.toolchain_file || 'false' }}
        run: |
          set -euo pipefail

          mkdir -p "$CRATE_PATH/src" outside
          printf 'target/\n' > .gitignore

          cat > "$CRATE_PATH/Cargo.toml" << 'EOF'
          [package]
          name = "demo"
          version = "0.1.0"
          edition = "2021"
          EOF

          cat > "$CRATE_PATH/src/main.rs" << 'EOF'
          fn   main( ){let greeting="hello";
          println!( "{}",greeting ) ;}
          EOF

          cat > outside/untouched.rs << 'EOF'
          fn   untouched( ){}
          EOF

          if [ "$TOOLCHAIN_FILE" = "true" ]; then
            cat > "$CRATE_PATH/rust-toolchain.toml" << 'EOF'
          [toolchain]
          channel = "1.85.0"
          profile = "minimal"
          EOF
          fi

      - name: Commit Initial Unformatted Files
        uses: ./tmp/actions-code/actions/common/commit-changes # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          branch: ${{ steps.branch.outputs.branch }}
          commit_message: 'test: add unformatted Rust crate (${{ env.TEST_ID }})'
          file_pattern: '.'

      - name: Sync Local With Remote
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch --prune origin "+refs/heads/$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME"
          git reset --hard "origin/$BRANCH_NAME"

      # The action is the unprivileged half: it formats this checkout and uploads a patch. In a real
      # workflow commit-patch runs in a second job that holds the token and runs no repository code;
      # here the crate is the fixture this job wrote, so both halves share one job.
      - name: Run Auto-format Action
        id: auto_format
        uses: ./tmp/actions-code/actions/rust/auto-format # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          source_directory: ${{ matrix.source_directory }}
          artifact_name: rust-auto-format-${{ matrix.name }}-${{ github.run_attempt }}

      - name: Commit Patch
        id: commit_patch
        uses: ./tmp/actions-code/actions/common/commit-patch # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          token: ${{ steps.setup.outputs.token }}
          artifact_name: ${{ steps.auto_format.outputs.artifact_name }}
          allowed_paths: '**/*.rs'
          commit_message: 'style: auto-format rust code'
          repository: ${{ env.TEST_REPO }}
          branch: ${{ steps.branch.outputs.branch }}
          expected_head_sha: ${{ steps.auto_format.outputs.base_sha }}

      - name: Verify Formatting Changes Were Committed
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          TEST_REPO: ${{ env.TEST_REPO }}
          BRANCH_NAME: ${{ steps.branch.outputs.branch }}
          CRATE_PATH: ${{ matrix.crate_path }}
          CHANGES_DETECTED: ${{ steps.auto_format.outputs.changes_detected }}
          BASE_SHA: ${{ steps.auto_format.outputs.base_sha }}
          OUTCOME: ${{ steps.commit_patch.outputs.outcome }}
          COMMIT_SHA: ${{ steps.commit_patch.outputs.commit_sha }}
        run: |
          set -euo pipefail

          [ "$CHANGES_DETECTED" = "true" ] || { echo "::error::changes_detected is '$CHANGES_DETECTED' for an unformatted crate"; exit 1; }
          [ "$OUTCOME" = "committed" ] || { echo "::error::commit-patch outcome is '$OUTCOME', expected committed"; exit 1; }

          head="$(gh api "/repos/$TEST_REPO/commits/$BRANCH_NAME" --jq '.sha')"
          [ "$head" = "$COMMIT_SHA" ] || { echo "::error::branch head '$head' is not the reported commit '$COMMIT_SHA'"; exit 1; }

          parent="$(gh api "/repos/$TEST_REPO/commits/$head" --jq '.parents[0].sha')"
          [ "$parent" = "$BASE_SHA" ] || { echo "::error::commit parent '$parent' is not base_sha '$BASE_SHA'"; exit 1; }

          expected="src/main.rs"
          if [ "$CRATE_PATH" != "." ]; then
            expected="$CRATE_PATH/src/main.rs"
          fi
          files="$(gh api "/repos/$TEST_REPO/commits/$head" --jq '.files[].filename')"
          [ "$files" = "$expected" ] || { echo "::error::the commit changed '$files', expected only '$expected'"; exit 1; }

          content="$(gh api "/repos/$TEST_REPO/contents/$expected?ref=$head" --jq '.content' | base64 -d)"
          expected_content="$(printf 'fn main() {\n    let greeting = "hello";\n    println!("{}", greeting);\n}')"
          [ "$content" = "$expected_content" ] || { echo "::error::$expected is not formatted:"; echo "$content"; exit 1; }

          echo "The crate was formatted and committed as one verified commit on top of base_sha"

      - name: Cleanup Branch
        if: always()
        uses: TimSchoenle/actions/actions/common/delete-branch@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-delete-branch-v2.0.4
        with:
          token: ${{ steps.setup.outputs.token }}
          repository: ${{ env.TEST_REPO }}
          branch_name: ${{ steps.branch.outputs.branch }}

  rust-cargo-check-event-commit:
    name: "Rust Cargo-check: Verify Cargo-check (builds the event's commit)"
    if: ${{ contains(fromJSON(inputs.targets), 'rust/cargo-check') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # to fetch code
    env:
      FIXTURE: actions/rust/coverage-codecov/fixture
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Cargo-check
        uses: ./actions/rust/cargo-check # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          source_directory: ${{ env.FIXTURE }}
          check_arguments: '--all-targets --all-features'

      - name: Verify the action built the event's commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "${actual}" != "${EXPECTED_SHA}" ]]; then
            echo "::error::The action checked out ${actual}, not the event's commit ${EXPECTED_SHA}"
            exit 1
          fi

  e2e-rust-config-contract:
    name: 'Rust Config-contract: End-to-end'
    if: ${{ contains(fromJSON(inputs.targets), 'rust/config-contract') }}
    environment:
      name: ci-e2e
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the bundles the build job built from this commit; dist/ is not committed.
      - name: Install Built Actions
        uses: TimSchoenle/actions/actions/release/install-built-actions@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-release-install-built-actions-v1.1.0
        with:
          artifact-id: ${{ inputs.artifact-id }}
          expected-manifest-sha256: ${{ inputs.manifest-sha256 }}

      # setup-bun rather than setup-cached: the cached wrapper runs `bun install` on every job, cache
      # hit or not, and this job is the one that must have no route to a package registry at all.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.bun-version'

      # The harness runs a node24 bundle with the first node on PATH and refuses any other major,
      # and the image's default node is not 24. A major alone resolves from the runner's tool
      # cache, so this reaches no endpoint the allowlist above does not already carry.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Restored, never installed, and never saved. `fail-on-cache-miss` is what keeps that honest:
      # without it a miss would leave the suite to fail later on a missing import.
      - name: Restore Dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            actions/*/*/*/node_modules
            actions/*/*/node_modules
            packages/*/node_modules
          key: ${{ inputs.cache-key }}
          fail-on-cache-miss: true

      # The cases run `dist/index.js`, the bundle GitHub itself would run: the one the install step
      # above put there, which the harness checks against BUILT_ACTIONS_MANIFEST before it runs it.
      - name: Generate Token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ACTIONS_TEST_BOT_APP_ID }}
          private-key: ${{ secrets.ACTIONS_TEST_BOT_PRIVATE_KEY }}
          owner: TimSchoenle
          repositories: actions-testing
          permission-metadata: read

      - name: Run End-to-end Cases
        env:
          E2E_GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          # An installation token cannot call `GET /user`, so the suite resolves its own account by
          # app slug instead. Without this a case matching commit authors fails only in CI.
          E2E_APP_SLUG: ${{ steps.token.outputs.app-slug }}
          E2E_TEST_REPOSITORY: TimSchoenle/actions-testing
        run: bun run e2e actions/rust/config-contract

  rust-coverage-verify:
    name: 'Rust Coverage-codecov: Verify Coverage-codecov'
    if: ${{ contains(fromJSON(inputs.targets), 'rust/coverage-codecov') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # to fetch code
    env:
      FIXTURE: actions/rust/coverage-codecov/fixture
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test coverage-codecov
        id: coverage
        uses: ./actions/rust/coverage-codecov # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          source_directory: ${{ env.FIXTURE }}
          test_arguments: '--workspace --all-features'
          flags: verify
          use_oidc: 'false'
          dry_run: 'true'

      # Line numbers refer to `crates/arith/src/lib.rs`: 5-7 is `covered`, 10-12 is `uncovered`.
      - name: Verify the coverage report
        shell: bash
        env:
          COVERAGE_FILE: ${{ steps.coverage.outputs.coverage_file }}
        run: |
          set -euo pipefail
          if [[ ! -f "${COVERAGE_FILE}" ]]; then
            echo "::error::coverage_file '${COVERAGE_FILE}' does not exist"
            exit 1
          fi

          lines="$(jq -c '.coverage | to_entries[] | select(.key | endswith("crates/arith/src/lib.rs")) | .value' "${COVERAGE_FILE}")"
          if [[ -z "${lines}" ]]; then
            echo "::error::The report has no entry for crates/arith/src/lib.rs"
            jq . "${COVERAGE_FILE}"
            exit 1
          fi

          for line in 5 6 7; do
            hits="$(jq -r --arg l "${line}" '.[$l]' <<< "${lines}")"
            if [[ "${hits}" != '1/1' ]]; then
              echo "::error::Line ${line} should be covered (1/1), got '${hits}'"
              exit 1
            fi
          done

          for line in 10 11 12; do
            hits="$(jq -r --arg l "${line}" '.[$l]' <<< "${lines}")"
            if [[ "${hits}" != '0/1' ]]; then
              echo "::error::Line ${line} should be missed (0/1), got '${hits}'"
              exit 1
            fi
          done

      - name: Verify the test results
        shell: bash
        env:
          TEST_RESULTS_FILE: ${{ steps.coverage.outputs.test_results_file }}
        run: |
          set -euo pipefail
          if [[ ! -f "${TEST_RESULTS_FILE}" ]]; then
            echo "::error::test_results_file '${TEST_RESULTS_FILE}' does not exist"
            exit 1
          fi

          if ! grep -q '<testsuites name="nextest-run" tests="2" skipped="0" failures="0"' "${TEST_RESULTS_FILE}"; then
            echo "::error::Expected two passing tests in the JUnit report"
            cat "${TEST_RESULTS_FILE}"
            exit 1
          fi

  # A failing test must fail the action and still leave a JUnit report, because the test-results
  # upload exists for exactly that run.
  rust-coverage-verify-failing-tests:
    name: 'Rust Coverage-codecov: Verify Coverage-codecov (failing tests)'
    if: ${{ contains(fromJSON(inputs.targets), 'rust/coverage-codecov') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # to fetch code
    env:
      FIXTURE: actions/rust/coverage-codecov/fixture
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test coverage-codecov
        id: coverage
        continue-on-error: true
        uses: ./actions/rust/coverage-codecov # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        env:
          FIXTURE_FAIL: '1'
        with:
          source_directory: ${{ env.FIXTURE }}
          use_oidc: 'false'
          dry_run: 'true'

      - name: Verify the action failed and kept the test results
        shell: bash
        env:
          OUTCOME: ${{ steps.coverage.outcome }}
          TEST_RESULTS_FILE: ${{ runner.temp }}/rust-coverage-codecov/nextest/codecov/junit.xml
        run: |
          set -euo pipefail
          if [[ "${OUTCOME}" != 'failure' ]]; then
            echo "::error::Expected the action to fail on a failing test, got '${OUTCOME}'"
            exit 1
          fi

          if ! grep -q 'failures="1"' "${TEST_RESULTS_FILE}"; then
            echo "::error::Expected one failure in the JUnit report at ${TEST_RESULTS_FILE}"
            cat "${TEST_RESULTS_FILE}" || true
            exit 1
          fi

  rust-coverage-verify-rejects-inputs:
    name: 'Rust Coverage-codecov: Verify Coverage-codecov (rejects ${{ matrix.case }})'
    if: ${{ contains(fromJSON(inputs.targets), 'rust/coverage-codecov') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: reserved argument
            test_arguments: '--workspace --lcov'
            use_oidc: 'false'
          - case: reserved argument with value
            test_arguments: '--workspace --output-path=elsewhere.json'
            use_oidc: 'false'
          - case: non-boolean
            test_arguments: '--workspace'
            use_oidc: 'yes'
    permissions:
      contents: read # to fetch code
    env:
      FIXTURE: actions/rust/coverage-codecov/fixture
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test coverage-codecov
        id: coverage
        continue-on-error: true
        uses: ./actions/rust/coverage-codecov # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          source_directory: ${{ env.FIXTURE }}
          test_arguments: ${{ matrix.test_arguments }}
          use_oidc: ${{ matrix.use_oidc }}
          dry_run: 'true'

      # The report path is checked as well as the outcome: a failure from a later step would also
      # be 'failure', and only an absent report shows the input check stopped the run first.
      - name: Verify the action refused the input before running tests
        shell: bash
        env:
          OUTCOME: ${{ steps.coverage.outcome }}
          COVERAGE_FILE: ${{ runner.temp }}/rust-coverage-codecov/coverage.json
        run: |
          set -euo pipefail
          if [[ "${OUTCOME}" != 'failure' ]]; then
            echo "::error::Expected the action to refuse the input, got '${OUTCOME}'"
            exit 1
          fi

          if [[ -e "${COVERAGE_FILE}" ]]; then
            echo "::error::A coverage report exists, so the action ran tests before refusing"
            exit 1
          fi

  rust-test-event-commit:
    name: "Rust Test: Verify Test (builds the event's commit)"
    if: ${{ contains(fromJSON(inputs.targets), 'rust/test') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # to fetch code
    env:
      FIXTURE: actions/rust/coverage-codecov/fixture
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Test
        uses: ./actions/rust/test # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          source_directory: ${{ env.FIXTURE }}
          test_arguments: '--all-features --workspace'

      - name: Verify the action built the event's commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "${actual}" != "${EXPECTED_SHA}" ]]; then
            echo "::error::The action checked out ${actual}, not the event's commit ${EXPECTED_SHA}"
            exit 1
          fi
