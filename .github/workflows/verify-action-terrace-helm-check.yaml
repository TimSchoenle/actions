name: Verify Terrace Helm Check

on:
  push:
    branches:
      - main
    paths:
      - 'actions/terrace/helm-check/**'
      - '.github/testdata/terrace-helm/**'
      - '.github/workflows/verify-action-terrace-helm-check.yaml'
  pull_request:
    paths:
      - 'actions/terrace/helm-check/**'
      - '.github/testdata/terrace-helm/**'
      - '.github/workflows/verify-action-terrace-helm-check.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

# The fixture is a chart repository of its own inside this one, so the CLI is pointed at its
# terrace.yaml rather than finding one at the Git root, as it would in an adopting repository.
env:
  FIXTURE: .github/testdata/terrace-helm
  TERRACE_CONFIG: ${{ github.workspace }}/.github/testdata/terrace-helm/terrace.yaml

jobs:
  check-clean:
    name: 'Test: a current tree passes every gate'
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch code, and to list terrace-contract releases
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check
        id: check
        uses: ./actions/terrace/helm-check # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          working_directory: ${{ env.FIXTURE }}
          since: ''

      - name: Verify the version came from the fixture's pin
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          case "$VERSION" in 0.11.*) ;; *) echo "::error::$VERSION is not on the fixture's 0.11 line"; exit 1;; esac

  check-drift:
    name: 'Test: a stale value schema and an unknown chart fail the step'
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch code, and to list terrace-contract releases
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The first value projected from the contract gets the wrong type in its generated `@schema`
      # block: the drift `shapes --check` exists to catch, where the contract says one thing and the
      # chart's schema another.
      - name: Make a value schema stale
        run: |
          set -euo pipefail
          values="${FIXTURE}/charts/mp-stats-legacy-viewer/values.yaml"
          marker="$(grep -n '@config projection' "$values" | head -n 1 | cut -d: -f1)"
          test -n "$marker" || { echo "::error::no projected value to break"; exit 1; }
          line=$((marker + 1))
          grep -q 'type: string' <(sed -n "${line}p" "$values") || { echo "::error::line ${line} is not its type"; exit 1; }
          sed -i "${line}s/type: string/type: object/" "$values"
          git diff --stat

      - name: Check
        id: stale
        continue-on-error: true
        uses: ./actions/terrace/helm-check # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          working_directory: ${{ env.FIXTURE }}
          since: ''

      - name: Check a chart the tree does not hold
        id: unknown
        continue-on-error: true
        uses: ./actions/terrace/helm-check # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          working_directory: ${{ env.FIXTURE }}
          charts: no-such-chart

      - name: Verify both runs failed
        env:
          STALE: ${{ steps.stale.outcome }}
          UNKNOWN: ${{ steps.unknown.outcome }}
        run: |
          set -euo pipefail
          test "$STALE" = failure || { echo "::error::a stale schema passed the gates"; exit 1; }
          test "$UNKNOWN" = failure || { echo "::error::an unknown chart name passed"; exit 1; }

  # <<< generated: summary (run 'bun run generate-ci-required' to update)
  summary:
    name: 'CI Summary: Terrace Helm Check'
    if: ${{ always() }}
    needs:
      - check-clean
      - check-drift
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if any verify job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
  # >>> generated: summary
