name: Verify Common Create-branch

# The cases themselves live in `actions/common/create-branch/e2e/` and are ordinary vitest files.
# This workflow only supplies what they cannot get on a laptop: a token scoped to the scratch
# repository. Everything else — fixtures, assertions, teardown — is TypeScript, and runs the same way
# under `bun run e2e`.

on:
  push:
    branches:
      - main
      - 'feature/actions/common/create-branch'
    paths:
      - 'actions/common/create-branch/**'
      - 'packages/e2e/**'
      - '.github/workflows/verify-action-common-create-branch.yaml'
  pull_request:
    paths:
      - 'actions/common/create-branch/**'
      - 'packages/e2e/**'
      - '.github/workflows/verify-action-common-create-branch.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  TEST_OWNER: TimSchoenle
  TEST_REPO_NAME: actions-testing
  TEST_REPO: TimSchoenle/actions-testing

jobs:
  e2e:
    environment:
      name: ci-e2e
      deployment: false
    name: End-to-end
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The cases run `dist/index.js`, the bundle GitHub itself would run, so nothing is built here.
      # An empty bun-version makes setup-bun fall through to bun-version-file; setup-cached defaults
      # it to 'latest', which would win otherwise.
      - name: Setup Bun
        uses: TimSchoenle/actions/actions/bun/setup-cached@cbdcf6fd08b46059064bc9c91efa6b610a9ee7db # tag=actions-bun-setup-cached-v1.1.10
        with:
          bun-version: ''
          bun-version-file: '.bun-version'

      - name: Generate Token
        id: token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ secrets.ACTIONS_TEST_BOT_APP_ID }}
          private-key: ${{ secrets.ACTIONS_TEST_BOT_PRIVATE_KEY }}
          owner: ${{ env.TEST_OWNER }}
          repositories: ${{ env.TEST_REPO_NAME }}

      - name: Run End-to-end Cases
        env:
          E2E_GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          E2E_TEST_REPOSITORY: ${{ env.TEST_REPO }}
        run: bun run e2e actions/common/create-branch

  # <<< generated: summary (run 'bun run generate-ci-required' to update)
  summary:
    name: 'CI Summary: Common Create-branch'
    if: ${{ always() }}
    needs:
      - e2e
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if any verify job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
  # >>> generated: summary
