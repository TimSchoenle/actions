name: Auto Format Commit

# Commits what `Auto Format` generated on a pull request. A pull_request run executes the pull
# request's own copy of its workflow, so a job there holding the maintenance App's key hands it to
# anyone who can push a branch. This workflow_run job runs the default branch's copy, which a pull
# request cannot change, and only reads the patch the pull_request run uploaded: commit-patch refuses
# anything outside allowed_paths or made from another head, and nothing from the branch executes.

on:
  workflow_run:
    workflows: ['Auto Format']
    types: [completed]

# One queue per pull request branch, keyed on the head repository too. Runs wait rather than
# cancel: an older run completing late (a re-run, say) must not drop the run for the current
# head, and its own patch is skipped as branch_moved by commit-patch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}:${{ github.event.workflow_run.head_branch }}
  queue: max

permissions: {}

jobs:
  # Holds no secret and no environment. The pull_request run uploads the patch empty when nothing
  # changed and not at all when the job making it was skipped; in both cases there is nothing to
  # commit, so the commit job below is skipped without minting a token.
  find-patch:
    name: Find The Patch
    # A finished pull_request run, not a cancelled one: another job failing does not make the patch
    # wrong. From a branch of this repository, never the default branch.
    if: >-
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # to list and download the pull_request run's artifacts
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      # Validates the patch exactly as commit-patch will, against the head the pull_request run
      # checked out, and reports whether it holds anything to commit. Nothing in it is executed.
      - name: Find The Patch
        id: patch
        uses: TimSchoenle/actions/actions/common/find-patch@6a49261c7bbd756b4ceca9b1c168dfc7dc095e64 # tag=actions-common-find-patch-v1.1.2
        with:
          run_id: ${{ github.event.workflow_run.id }}
          artifact_name: auto-format
          expected_head_sha: ${{ github.event.workflow_run.head_sha }}

  # The formatter may rewrite any file a pull request could have changed itself, so the allowlist is
  # the whole tree. What it never covers is decided by commit-patch defaults: workflow files, since this
  # token has no workflows: write, binary content, file modes and anything below a symbolic link.
  commit:
    name: Commit Format
    needs: [find-patch]
    if: needs.find-patch.outputs.has_changes == 'true'
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # to download the patch from the pull_request run
      contents: read # to fetch the commit the patch applies to
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      # commit-patch reads only git objects, so the head is fetched without a checkout and none of
      # the pull request's files reach the runner.
      - name: Fetch The Pull Request Head
        uses: TimSchoenle/actions/actions/common/fetch-head@b37134ffa35b3ce98437447e3b4c76933eb65c04 # tag=actions-common-fetch-head-v1.1.1
        with:
          sha: ${{ github.event.workflow_run.head_sha }}

      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Commit Patch
        id: commit
        uses: TimSchoenle/actions/actions/common/commit-patch@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-commit-patch-v2.0.1
        with:
          token: ${{ steps.generate_token.outputs.token }}
          run_id: ${{ github.event.workflow_run.id }}
          branch: ${{ github.event.workflow_run.head_branch }}
          expected_head_sha: ${{ github.event.workflow_run.head_sha }}
          artifact_name: auto-format
          allowed_paths: '**'
          commit_message: 'style: auto-format code'

      - name: Comment on PR
        if: >-
          steps.commit.outputs.changes_committed == 'true' &&
          github.event.workflow_run.pull_requests[0].number
        uses: TimSchoenle/actions/actions/common/upsert-pr-comment@6a49261c7bbd756b4ceca9b1c168dfc7dc095e64 # tag=actions-common-upsert-pr-comment-v2.0.3
        with:
          token: ${{ steps.generate_token.outputs.token }}
          # Only this App's own comment is updated; a pasted marker cannot redirect the edit.
          author: '${{ steps.generate_token.outputs.app-slug }}[bot]'
          pr_url: ${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.workflow_run.pull_requests[0].number }}
          identifier: 'auto-format'
          body: 'Code has been auto-formatted to adhere to the style guide.'
