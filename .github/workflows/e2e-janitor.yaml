name: E2E Janitor

# Per-run teardown in the e2e suites cannot survive a cancelled run: the verify workflows set
# `cancel-in-progress: true`, so a superseded run is killed before its teardown executes and its
# `test/**` branches, tags, releases and pull requests are stranded in the scratch repository. This
# job is the unconditional backstop. Within the e2e namespace it judges purely by age, never by which
# run created a ref, so it is safe to run at any time and converges on the same state however often
# it runs. A ref the harness names reads its age from the creation time at the start of its run
# segment (`test/<suite>/<epoch>-<run>/...`), not from the commit it points at: a case may branch from
# an old commit, and judging that ref by its commit date would delete it while its run still uses it.
# Nothing outside that namespace is ever a candidate: a pull request someone opened against
# the scratch repository by hand, or one on a branch the harness did not create, is left alone.

on:
  schedule:
    # Off the hour to avoid the scheduling backlog GitHub builds up at :00.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      max-age-hours:
        description: 'Sweep test refs, open pull requests and open issues older than this many hours.'
        required: false
        default: '2'
        type: string
      dry-run:
        description: 'Report what would be swept without deleting or closing anything.'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  # Never cancel a sweep: a half-finished run is harmless, but cancelling one buys nothing and
  # re-creates exactly the orphan-on-cancellation problem this workflow exists to clean up.
  cancel-in-progress: false

permissions: {}

env:
  TEST_OWNER: TimSchoenle
  TEST_REPO_NAME: actions-testing
  TEST_REPO: TimSchoenle/actions-testing
  # Every branch the e2e suites create lives under this prefix; nothing else in the scratch
  # repository is ever a deletion candidate. Pull requests are matched on the same namespace, as a branch name
  # (`test/`) rather than a ref path.
  TEST_REF_PREFIX: heads/test/
  # Tags the e2e suites create (release/publish-build-commit, release/plan-release-please) live under
  # the same namespace, and so do the tag names of the releases they publish.
  TEST_TAG_PREFIX: tags/test/
  # `inputs` is empty on `schedule`, so the dispatch defaults have to be restated as fallbacks here.
  MAX_AGE_HOURS: ${{ inputs.max-age-hours || '2' }}
  DRY_RUN: ${{ inputs.dry-run || false }}

jobs:
  sweep:
    name: Sweep scratch repository
    environment:
      name: ci-e2e
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The scratch repository is reached exclusively through the app token minted below, so this job
    # needs nothing from the ambient `GITHUB_TOKEN`.
    permissions: {}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - name: Generate Token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ACTIONS_TEST_BOT_APP_ID }}
          private-key: ${{ secrets.ACTIONS_TEST_BOT_PRIVATE_KEY }}
          owner: ${{ env.TEST_OWNER }}
          repositories: ${{ env.TEST_REPO_NAME }}
          # Scoped to exactly what the sweeps do: close pull requests and issues, and read and delete
          # refs. Without a `permission-*` input the token would inherit the whole installation.
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Resolve Cutoff
        id: cutoff
        run: |
          set -euo pipefail

          # `max-age-hours` is free-form dispatch input that is about to be interpolated into a
          # `date` expression, so it is validated before it can become anything but a number.
          if [[ ! "$MAX_AGE_HOURS" =~ ^[0-9]+$ ]]; then
            echo "::error::max-age-hours must be a whole number of hours, got '${MAX_AGE_HOURS}'."
            exit 1
          fi

          # One instant in both forms: ISO-8601 for API timestamps, epoch seconds for ref names.
          epoch="$(date -u -d "${MAX_AGE_HOURS} hours ago" +%s)"
          cutoff="$(date -u -d "@${epoch}" +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "at=${cutoff}"
            echo "epoch=${epoch}"
          } >> "$GITHUB_OUTPUT"
          echo "Sweeping everything last touched before ${cutoff} (dry-run: ${DRY_RUN})."

      # Pull requests are closed before their branches are deleted so the closure is recorded as a
      # deliberate one rather than as the side effect of a vanished head ref.
      - name: Close Stale Pull Requests
        id: pulls
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          CUTOFF: ${{ steps.cutoff.outputs.at }}
          # The e2e suites open every pull request with a token minted for this same app, so its bot
          # account is the author of all of them.
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          set -euo pipefail

          # An empty slug would reduce the author predicate to `[bot]`, which matches nothing: the
          # sweep would report a clean repository while leaving every orphan in place.
          if [[ -z "$APP_SLUG" ]]; then
            echo "::error::The token step reported no app slug; cannot identify e2e pull requests."
            exit 1
          fi
          export E2E_AUTHOR="${APP_SLUG}[bot]"
          export E2E_HEAD_PREFIX="${TEST_REF_PREFIX#heads/}"

          # The scratch repository also receives pull requests that are not e2e fixtures (repository
          # configuration, for instance), so age alone must never be enough. A pull request is test
          # residue only when the harness provably opened it: authored by the e2e app's bot account,
          # from a branch of the scratch repository itself (not a fork), under the test namespace.
          # Both identity predicates are required, so neither a human pushing a `test/` branch nor the
          # bot opening anything outside the namespace makes a pull request a candidate. Orphans of
          # crashed or cancelled runs satisfy all of them, since they come from the same harness.
          # Timestamps are compared as strings: both sides are UTC ISO-8601 in the same fixed-width
          # format, where lexical and chronological order coincide.
          # Listed into a variable rather than straight into `mapfile`: a process substitution hides
          # its exit code, so a failing `gh api` would read as "nothing is stale" and pass green.
          # `$ENV.*` is jq syntax, not a shell expansion, so the filter must stay single-quoted.
          # shellcheck disable=SC2016
          listing="$(
            gh api --paginate "repos/${TEST_REPO}/pulls?state=open&per_page=100" \
              --jq '.[]
                | select(
                    .user.type == "Bot"
                    and .user.login == $ENV.E2E_AUTHOR
                    and .head.repo.full_name == $ENV.TEST_REPO
                    and (.head.ref | startswith($ENV.E2E_HEAD_PREFIX))
                    and .updated_at < $ENV.CUTOFF
                  )
                | [.number, .head.ref]
                | @tsv'
          )"
          mapfile -t stale < <(printf '%s' "$listing")

          closed=0
          failed=0

          for candidate in "${stale[@]}"; do
            IFS=$'\t' read -r number head <<< "$candidate"

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "Would close pull request #${number} (${head})."
              closed=$((closed + 1))
              continue
            fi

            if gh api -X PATCH "repos/${TEST_REPO}/pulls/${number}" -f state=closed --silent; then
              echo "Closed pull request #${number} (${head})."
              closed=$((closed + 1))
              continue
            fi

            # A teardown that raced us to the same pull request leaves it closed, which is the state
            # this sweep wanted; anything else is a real fault and must not pass silently.
            state="$(gh api "repos/${TEST_REPO}/pulls/${number}" --jq '.state' 2>/dev/null || true)"
            if [[ "$state" == "closed" ]]; then
              closed=$((closed + 1))
            else
              echo "::warning::Could not close pull request #${number} (state: ${state:-unknown})."
              failed=$((failed + 1))
            fi
          done

          {
            echo "stale=${#stale[@]}"
            echo "closed=${closed}"
          } >> "$GITHUB_OUTPUT"

          if [[ "$failed" -gt 0 ]]; then
            echo "::error::${failed} stale pull request(s) could not be closed."
            exit 1
          fi

      # The e2e suites open issues too (common/upsert-issue). Teardown closes them, so an open one past
      # the cutoff is the residue of a run that never reached its teardown. Runs even when an earlier
      # sweep failed: the sweeps are independent, and a backstop that skips half its work because of
      # an unrelated fault is not a backstop.
      - name: Close Stale Issues
        id: issues
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          CUTOFF: ${{ steps.cutoff.outputs.at }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          set -euo pipefail

          if [[ -z "$APP_SLUG" ]]; then
            echo "::error::The token step reported no app slug; cannot identify e2e issues."
            exit 1
          fi
          export E2E_AUTHOR="${APP_SLUG}[bot]"

          # The issues endpoint lists pull requests as well; those belong to the pull-request sweep, so
          # an entry that carries `pull_request` is dropped. Only issues the e2e app's bot account
          # opened are candidates, so an issue a person filed in the scratch repository is never closed.
          # shellcheck disable=SC2016
          listing="$(
            gh api --paginate -X GET "repos/${TEST_REPO}/issues" \
              -f state=open -f creator="${E2E_AUTHOR}" -f per_page=100 \
              --jq '.[]
                | select(
                    .pull_request == null
                    and .user.type == "Bot"
                    and .user.login == $ENV.E2E_AUTHOR
                    and .updated_at < $ENV.CUTOFF
                  )
                | .number'
          )"
          mapfile -t stale < <(printf '%s' "$listing")

          closed=0
          failed=0

          for number in "${stale[@]}"; do
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "Would close issue #${number}."
              closed=$((closed + 1))
              continue
            fi

            if gh api -X PATCH "repos/${TEST_REPO}/issues/${number}" \
              -f state=closed -f state_reason=not_planned --silent; then
              echo "Closed issue #${number}."
              closed=$((closed + 1))
              continue
            fi

            state="$(gh api "repos/${TEST_REPO}/issues/${number}" --jq '.state' 2>/dev/null || true)"
            if [[ "$state" == "closed" ]]; then
              closed=$((closed + 1))
            else
              echo "::warning::Could not close issue #${number} (state: ${state:-unknown})."
              failed=$((failed + 1))
            fi
          done

          {
            echo "stale=${#stale[@]}"
            echo "closed=${closed}"
          } >> "$GITHUB_OUTPUT"

          if [[ "$failed" -gt 0 ]]; then
            echo "::error::${failed} stale issue(s) could not be closed."
            exit 1
          fi

      - name: Delete Stale Test Branches
        id: branches
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          CUTOFF: ${{ steps.cutoff.outputs.at }}
          CUTOFF_EPOCH: ${{ steps.cutoff.outputs.epoch }}
        run: |
          set -euo pipefail

          # `matching-refs` is prefix-scoped server-side, so `main` and every ref outside the test
          # namespace are excluded before a single candidate reaches this script.
          # Listed into a variable first, for the same reason as in the pull-request sweep: a process
          # substitution would swallow a failing `gh api` and report an empty scratch repository.
          listing="$(
            gh api --paginate "repos/${TEST_REPO}/git/matching-refs/${TEST_REF_PREFIX}" \
              --jq '.[] | [.ref, .object.sha] | @tsv'
          )"
          mapfile -t candidates < <(printf '%s' "$listing")

          stale=0
          deleted=0
          failed=0

          for candidate in "${candidates[@]}"; do
            IFS=$'\t' read -r ref sha <<< "$candidate"

            # Second, independent guard on the prefix: a typo in TEST_REF_PREFIX could widen the
            # server-side filter, and the cost of that mistake is an unrecoverable ref deletion.
            if [[ "$ref" != "refs/${TEST_REF_PREFIX}"?* ]]; then
              echo "::warning::Refusing to touch ref outside the test namespace: ${ref}"
              continue
            fi

            # A harness-named ref carries its creation time, which is the right clock and costs no API
            # call. A branch named before that convention, or by a workflow job rather than the
            # harness, falls back to the date of the commit it points at.
            if [[ "$ref" =~ ^refs/heads/test/[^/]+/([0-9]{10})- ]]; then
              created="${BASH_REMATCH[1]}"
              age="created $(date -u -d "@${created}" +%Y-%m-%dT%H:%M:%SZ)"
              if (( created >= CUTOFF_EPOCH )); then
                continue
              fi
            else
              committed="$(gh api "repos/${TEST_REPO}/commits/${sha}" --jq '.commit.committer.date' 2>/dev/null || true)"
              if [[ -z "$committed" ]]; then
                echo "::warning::Could not read the commit date of ${ref}; leaving it in place."
                failed=$((failed + 1))
                continue
              fi
              age="last commit ${committed}"
              if ! [[ "$committed" < "$CUTOFF" ]]; then
                continue
              fi
            fi
            stale=$((stale + 1))

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "Would delete ${ref} (${age})."
              deleted=$((deleted + 1))
              continue
            fi

            if gh api -X DELETE "repos/${TEST_REPO}/git/refs/${ref#refs/}" --silent; then
              echo "Deleted ${ref} (${age})."
              deleted=$((deleted + 1))
              continue
            fi

            # Same reasoning as for pull requests: a ref that is already gone is the desired end
            # state, so only a ref that survived the delete counts as a failure.
            if gh api "repos/${TEST_REPO}/git/ref/${ref#refs/}" --silent >/dev/null 2>&1; then
              echo "::warning::Could not delete ${ref}."
              failed=$((failed + 1))
            else
              deleted=$((deleted + 1))
            fi
          done

          {
            echo "stale=${stale}"
            echo "deleted=${deleted}"
          } >> "$GITHUB_OUTPUT"

          if [[ "$failed" -gt 0 ]]; then
            echo "::error::${failed} stale test branch(es) could not be deleted."
            exit 1
          fi

      # Releases before tags: deleting a release leaves its tag for the next step, while deleting a tag
      # first would leave the release behind on a missing tag. Matched on the tag name alone, so a
      # release on any tag outside the test namespace is never a candidate.
      - name: Delete Stale Test Releases
        id: releases
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          CUTOFF: ${{ steps.cutoff.outputs.at }}
        run: |
          set -euo pipefail

          export E2E_TAG_NAME_PREFIX="${TEST_TAG_PREFIX#tags/}"
          # shellcheck disable=SC2016
          listing="$(
            gh api --paginate "repos/${TEST_REPO}/releases?per_page=100" \
              --jq '.[]
                | select((.tag_name | startswith($ENV.E2E_TAG_NAME_PREFIX)) and .created_at < $ENV.CUTOFF)
                | [.id, .tag_name]
                | @tsv'
          )"
          mapfile -t stale < <(printf '%s' "$listing")

          deleted=0
          failed=0

          for candidate in "${stale[@]}"; do
            IFS=$'\t' read -r id tag <<< "$candidate"

            if [[ "$tag" != "${E2E_TAG_NAME_PREFIX}"?* ]]; then
              echo "::warning::Refusing to touch a release outside the test namespace: ${tag}"
              continue
            fi

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "Would delete release ${id} (${tag})."
              deleted=$((deleted + 1))
              continue
            fi

            if gh api -X DELETE "repos/${TEST_REPO}/releases/${id}" --silent; then
              echo "Deleted release ${id} (${tag})."
              deleted=$((deleted + 1))
            elif gh api "repos/${TEST_REPO}/releases/${id}" --silent >/dev/null 2>&1; then
              echo "::warning::Could not delete release ${id} (${tag})."
              failed=$((failed + 1))
            else
              deleted=$((deleted + 1))
            fi
          done

          {
            echo "stale=${#stale[@]}"
            echo "deleted=${deleted}"
          } >> "$GITHUB_OUTPUT"

          if [[ "$failed" -gt 0 ]]; then
            echo "::error::${failed} stale test release(s) could not be deleted."
            exit 1
          fi

      # Judged as the branch sweep judges branches: by the creation time in the name, otherwise by the
      # date of the commit the tag points at.
      - name: Delete Stale Test Tags
        id: tags
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          CUTOFF: ${{ steps.cutoff.outputs.at }}
          CUTOFF_EPOCH: ${{ steps.cutoff.outputs.epoch }}
        run: |
          set -euo pipefail

          listing="$(
            gh api --paginate "repos/${TEST_REPO}/git/matching-refs/${TEST_TAG_PREFIX}" \
              --jq '.[] | [.ref, .object.sha, .object.type] | @tsv'
          )"
          mapfile -t candidates < <(printf '%s' "$listing")

          stale=0
          deleted=0
          failed=0

          for candidate in "${candidates[@]}"; do
            IFS=$'\t' read -r ref sha type <<< "$candidate"

            if [[ "$ref" != "refs/${TEST_TAG_PREFIX}"?* ]]; then
              echo "::warning::Refusing to touch ref outside the test namespace: ${ref}"
              continue
            fi

            if [[ "$ref" =~ ^refs/tags/test/[^/]+/([0-9]{10})- ]]; then
              created="${BASH_REMATCH[1]}"
              age="created $(date -u -d "@${created}" +%Y-%m-%dT%H:%M:%SZ)"
              if (( created >= CUTOFF_EPOCH )); then
                continue
              fi
            else
              if [[ "$type" == "tag" ]]; then
                sha="$(gh api "repos/${TEST_REPO}/git/tags/${sha}" --jq '.object.sha' 2>/dev/null || true)"
              fi
              committed="$(gh api "repos/${TEST_REPO}/commits/${sha}" --jq '.commit.committer.date' 2>/dev/null || true)"
              if [[ -z "$committed" ]]; then
                echo "::warning::Could not read the commit date of ${ref}; leaving it in place."
                failed=$((failed + 1))
                continue
              fi
              age="commit ${committed}"
              if ! [[ "$committed" < "$CUTOFF" ]]; then
                continue
              fi
            fi
            stale=$((stale + 1))

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "Would delete ${ref} (${age})."
              deleted=$((deleted + 1))
              continue
            fi

            if gh api -X DELETE "repos/${TEST_REPO}/git/refs/${ref#refs/}" --silent; then
              echo "Deleted ${ref} (${age})."
              deleted=$((deleted + 1))
            elif gh api "repos/${TEST_REPO}/git/ref/${ref#refs/}" --silent >/dev/null 2>&1; then
              echo "::warning::Could not delete ${ref}."
              failed=$((failed + 1))
            else
              deleted=$((deleted + 1))
            fi
          done

          {
            echo "stale=${stale}"
            echo "deleted=${deleted}"
          } >> "$GITHUB_OUTPUT"

          if [[ "$failed" -gt 0 ]]; then
            echo "::error::${failed} stale test tag(s) could not be deleted."
            exit 1
          fi

      - name: Report Sweep
        if: ${{ !cancelled() }}
        env:
          CUTOFF: ${{ steps.cutoff.outputs.at }}
          PULLS_STALE: ${{ steps.pulls.outputs.stale }}
          PULLS_CLOSED: ${{ steps.pulls.outputs.closed }}
          ISSUES_STALE: ${{ steps.issues.outputs.stale }}
          ISSUES_CLOSED: ${{ steps.issues.outputs.closed }}
          BRANCHES_STALE: ${{ steps.branches.outputs.stale }}
          BRANCHES_DELETED: ${{ steps.branches.outputs.deleted }}
          RELEASES_STALE: ${{ steps.releases.outputs.stale }}
          RELEASES_DELETED: ${{ steps.releases.outputs.deleted }}
          TAGS_STALE: ${{ steps.tags.outputs.stale }}
          TAGS_DELETED: ${{ steps.tags.outputs.deleted }}
        run: |
          set -euo pipefail

          # Outputs are unset when their step failed before publishing them, so every value carries a
          # fallback rather than letting the report itself fail under `set -u`.
          if [[ "$DRY_RUN" == "true" ]]; then
            verb='would be swept'
          else
            verb='swept'
          fi

          {
            echo "## E2E janitor"
            echo
            echo "Scratch repository: \`${TEST_REPO}\`"
            echo
            echo "Cutoff: everything last touched before \`${CUTOFF:-unresolved}\` (${MAX_AGE_HOURS}h) ${verb}."
            echo
            echo '| Resource | Stale | Closed / deleted |'
            echo '| --- | ---: | ---: |'
            echo "| Open e2e pull requests | ${PULLS_STALE:-0} | ${PULLS_CLOSED:-0} |"
            echo "| Open e2e issues | ${ISSUES_STALE:-0} | ${ISSUES_CLOSED:-0} |"
            echo "| Refs under \`${TEST_REF_PREFIX}\` | ${BRANCHES_STALE:-0} | ${BRANCHES_DELETED:-0} |"
            echo "| Releases on tags under \`${TEST_TAG_PREFIX#tags/}\` | ${RELEASES_STALE:-0} | ${RELEASES_DELETED:-0} |"
            echo "| Refs under \`${TEST_TAG_PREFIX}\` | ${TAGS_STALE:-0} | ${TAGS_DELETED:-0} |"
          } >> "$GITHUB_STEP_SUMMARY"
