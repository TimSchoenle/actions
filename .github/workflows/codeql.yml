name: 'CodeQL'

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['**']
  schedule:
    - cron: '0 0 * * 1' # Run at 00:00 UTC every Monday

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read # Required for CodeQL to read action configurations
      contents: read # Required to fetch code
      security-events: write # Required to upload SARIF results to GitHub Security tab

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # build-mode: manual, because autobuild only looks for a build file at the repo root and the
      # Gradle root for the only Java in this repo lives at configs/checkstyle/ instead - the
      # explicit build steps below are the fix, not a workaround. compat-check now has a real
      # sourceSet (see configs/checkstyle/compat-check/build.gradle.kts) so this actually invokes
      # javac, with Lombok annotation processing, giving CodeQL full type resolution instead of
      # falling back to source-only extraction.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          config-file: ./.github/codeql/codeql-config.yml
          build-mode: manual

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Make gradlew executable
        working-directory: configs/checkstyle
        shell: bash
        run: chmod +x ./gradlew

      - name: Build Java code
        working-directory: configs/checkstyle
        shell: bash
        run: ./gradlew :checkstyle-application:compileJava :checkstyle-library:compileJava :compat-check:compileJava --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
