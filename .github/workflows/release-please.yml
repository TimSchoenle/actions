name: release-please

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release Please
    environment:
      name: release
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    permissions:
      contents: write # to create release commits and tags
      pull-requests: write # to manage release PRs
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      # release-please labels its pull request through the issues API, so `issues` is needed on top
      # of the two permissions this job grants its own token.
      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.generate_token.outputs.token }}

  # The release pull request pins every README to tag names, because its tags do not exist until it
  # merges. Once release-please has created them, the docs generator resolves those pins to the
  # release commit, and without this job the first `Update Files` run on every open pull request would
  # commit that same diff to its branch. Regenerating once here and committing to main means a branch
  # that merges main afterwards has nothing left to regenerate.
  #
  # Split like update-files.yml and update-files-commit.yml: this job runs the repository's scripts
  # with a read-only token and no secrets, and only uploads a patch; commit-docs holds the release
  # bot's key and runs nothing from the repository.
  generate-docs:
    name: Generate Docs
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
    permissions:
      contents: read # to fetch code and tags
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.sha }}

      - name: Setup Bun
        uses: TimSchoenle/actions/actions/bun/setup-cached@9d5cb31939ace7a3d3d7f452052724337c65f153 # tag=actions-bun-setup-cached-v2.0.0
        with:
          cache-mode: none

      # release-please has created every tag through the API before it reports releases_created, but
      # git can trail the API briefly. A tag git cannot see would leave its README pinned to the tag
      # name, so this re-fetches until all of them are present and fails, naming them, if they are not.
      - name: Wait For Release Tags
        env:
          RELEASED_PATHS: ${{ needs.release-please.outputs.paths_released }}
        run: bun run wait-release-tags

      - name: Generate Docs
        run: bun run generate-docs

      - name: Create Patch
        id: patch
        uses: TimSchoenle/actions/actions/common/create-patch@dc5b395636dc1954383f11af4062a08814e9b15a # tag=actions-common-create-patch-v1.1.1
        with:
          artifact_name: release-docs
          paths: 'README.md SECURITY.md actions/*/*/README.md actions/*/*/examples/*.yaml actions/*/*/examples/*.yml'

  # Commits straight to main, so the release bot must be on the bypass list of the Main ruleset. The
  # commit is made on top of the commit this run was triggered for: if main has moved since,
  # commit-patch skips it as branch_moved, and pull requests pick the docs up through Update Files as
  # they did before.
  commit-docs:
    name: Commit Docs
    needs: generate-docs
    if: needs.generate-docs.outputs.has_changes == 'true'
    environment:
      name: release
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to fetch the commit the patch applies to
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      # commit-patch reads only git objects, so the release commit is fetched without a checkout.
      - name: Fetch The Release Commit
        uses: TimSchoenle/actions/actions/common/fetch-head@3f47ad15da6762f9e07c5e6c70df81f37ddf2454 # tag=actions-common-fetch-head-v1.1.0
        with:
          sha: ${{ github.sha }}

      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      # `docs` is a hidden changelog section, so the release-please run this commit starts opens no
      # release pull request.
      - name: Commit Patch
        uses: TimSchoenle/actions/actions/common/commit-patch@7b20a67f0b18a6e64c30e5f47c92636729f6ad41 # tag=actions-common-commit-patch-v1.3.0
        with:
          token: ${{ steps.generate_token.outputs.token }}
          branch: ${{ github.ref_name }}
          expected_head_sha: ${{ github.sha }}
          artifact_name: release-docs
          allowed_paths: 'README.md SECURITY.md actions/*/*/README.md actions/*/*/examples/*.yaml actions/*/*/examples/*.yml'
          commit_message: 'docs: auto-update documentation'
