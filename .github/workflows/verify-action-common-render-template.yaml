name: Verify Action Common Render Template

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'actions/common/render-template/**'
      - '.github/workflows/verify-action-common-render-template.yaml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each case renders one template with one variables payload and asserts the exact bytes on disk.
  # Comparing whole files rather than grepping is what catches the failures that matter for a
  # generated README: a stray blank line, a partial indented into a code block, a mangled table cell.
  render:
    name: Render (${{ matrix.name }})
    permissions:
      contents: read # to fetch code
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'Interpolation'
            template: |
              # {{ repo }}

              Version {{ version }}.
            variables: '{"repo":"acme/actions","version":"1.4.0"}'
            expected: |
              # acme/actions

              Version 1.4.0.

          - name: 'Nested Paths'
            template: '{{ repo.owner }}/{{ repo.name }}@{{ repo.meta.branch }}'
            variables: '{"repo":{"owner":"acme","name":"actions","meta":{"branch":"main"}}}'
            expected: 'acme/actions@main'

          - name: 'Markdown Table From Each'
            template: |
              | Action | Description |
              | --- | --- |
              {{#each actions}}| `{{ name }}` | {{ description }} |
              {{/each}}
            variables: '{"actions":[{"name":"read-yaml","description":"Read a value"},{"name":"clippy","description":"Lint Rust"}]}'
            expected: |
              | Action | Description |
              | --- | --- |
              | `read-yaml` | Read a value |
              | `clippy` | Lint Rust |

          - name: 'Sorted Table Is Order-Independent'
            template: |
              {{#each (sortBy actions "name")}}{{ name }}
              {{/each}}
            variables: '{"actions":[{"name":"zebra"},{"name":"alpha"},{"name":"middle"}]}'
            expected: |
              alpha
              middle
              zebra

          - name: 'Conditionals'
            template: |
              {{#if hasWorkflows}}has workflows{{else}}no workflows{{/if}}
              {{#if hasActions}}has actions{{else}}no actions{{/if}}
            variables: '{"hasWorkflows":true,"hasActions":false}'
            expected: |
              has workflows
              no actions

          - name: 'Each Data Variables'
            template: '{{#each tags}}{{ @index }}:{{ this }}{{#unless @last}}, {{/unless}}{{/each}}'
            variables: '{"tags":["ci","docs","rust"]}'
            expected: '0:ci, 1:docs, 2:rust'

          - name: 'Table Cell Escaping'
            # A pipe would split the cell and a newline would end the row. Both are exactly what an
            # action description scraped out of an action.yaml contains.
            template: '| {{ mdCell description }} |'
            variables: '{"description":"Read a|b\nacross lines"}'
            expected: '| Read a\|b<br>across lines |'

          - name: 'No HTML Escaping By Default'
            template: '{{ snippet }}'
            variables: '{"snippet":"<!-- ACTIONS_TABLE --> & \"quotes\" & ''apostrophes''"}'
            expected: '<!-- ACTIONS_TABLE --> & "quotes" & ''apostrophes'''

          - name: 'Unicode Survives Intact'
            template: '{{ text }}'
            variables: '{"text":"✅ Grüße — 日本語 — 🚀"}'
            expected: '✅ Grüße — 日本語 — 🚀'

          - name: 'Helpers'
            template: |
              {{ upper name }} {{ lower name }} {{ count tags }} {{ join (sort tags) "|" }}
              {{ default missingValue "fallback" }} {{ replace slug "-" "_" }}
            variables: '{"name":"Actions","tags":["c","a","b"],"missingValue":"","slug":"render-template-action"}'
            expected: |
              ACTIONS actions 3 a|b|c
              fallback render_template_action

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set Up Template
        env:
          TEMPLATE: ${{ matrix.template }}
        run: printf '%s' "$TEMPLATE" > README.hbs

      - name: Run Test (${{ matrix.name }})
        id: render
        uses: ./actions/common/render-template
        with:
          template: README.hbs
          output: README.md
          variables: ${{ matrix.variables }}

      - name: Assert Rendered Bytes
        env:
          EXPECTED: ${{ matrix.expected }}
        run: |
          # A byte-exact comparison, not a grep: a stray blank line or a lost trailing newline is a
          # real defect in a generated file and is invisible to a pattern match.
          printf '%s' "$EXPECTED" > expected.md

          if ! diff -u expected.md README.md; then
            echo "::error::Rendered output does not match the expected bytes."
            exit 1
          fi
          echo "✅ Rendered output matches exactly"

      - name: Assert The Render Reported Itself Correctly
        env:
          CHANGED: ${{ steps.render.outputs.changed }}
          CHECKSUM: ${{ steps.render.outputs.checksum }}
        run: |
          [ "$CHANGED" = "true" ] || { echo "::error::changed was '$CHANGED', expected true"; exit 1; }

          ACTUAL=$(sha256sum README.md | cut -d' ' -f1)
          [ "$CHECKSUM" = "$ACTUAL" ] || { echo "::error::checksum '$CHECKSUM' does not match the file's '$ACTUAL'"; exit 1; }
          echo "✅ Outputs correct"

  # Partials are the feature that makes a real README template maintainable, and the one with the
  # most ways to go subtly wrong: name derivation from nested paths, and Handlebars' default
  # re-indentation of a partial's body to its call site.
  partials:
    name: Partials
    permissions:
      contents: read # to fetch code
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set Up Template And Partials
        run: |
          mkdir -p partials/tables
          cat <<'EOF' > README.hbs
          # {{ repo }}

          {{> tables/actions }}

          {{> footer }}
          EOF
          cat <<'EOF' > partials/tables/actions.hbs
          | Action | Description |
          | --- | --- |
          {{#each (sortBy actions "name")}}| `{{ name }}` | {{ mdCell description }} |
          {{/each}}
          EOF
          printf -- '---\nGenerated from README.hbs.\n' > partials/footer.hbs

      - name: Render
        id: render
        uses: ./actions/common/render-template
        with:
          template: README.hbs
          output: docs/generated/README.md
          partials-dir: partials
          variables: '{"repo":"acme/actions","actions":[{"name":"read-yaml","description":"Read a|value"},{"name":"clippy","description":"Lint Rust"}]}'

      - name: Assert Rendered Output
        run: |
          # The nested partial is addressed by its path, and neither partial is re-indented to the
          # column its call sits at.
          cat <<'EOF' > expected.md
          # acme/actions

          | Action | Description |
          | --- | --- |
          | `clippy` | Lint Rust |
          | `read-yaml` | Read a\|value |

          ---
          Generated from README.hbs.
          EOF

          if ! diff -u expected.md docs/generated/README.md; then
            echo "::error::Rendered output does not match the expected bytes."
            exit 1
          fi
          echo "✅ Rendered output matches exactly"

      - name: Assert Outputs
        env:
          CHANGED: ${{ steps.render.outputs.changed }}
          CHECKSUM: ${{ steps.render.outputs.checksum }}
          OUTPUT_PATH: ${{ steps.render.outputs.output-path }}
        run: |
          [ "$CHANGED" = "true" ] || { echo "::error::changed was '$CHANGED', expected true"; exit 1; }
          [ "$OUTPUT_PATH" = "docs/generated/README.md" ] || { echo "::error::output-path was '$OUTPUT_PATH'"; exit 1; }

          # The checksum must describe the bytes actually on disk.
          ACTUAL=$(sha256sum docs/generated/README.md | cut -d' ' -f1)
          [ "$CHECKSUM" = "$ACTUAL" ] || { echo "::error::checksum '$CHECKSUM' does not match the file's '$ACTUAL'"; exit 1; }
          echo "✅ Outputs correct"

  # The property the drift check depends on: unchanged inputs must produce byte-identical output, so
  # a scheduled regeneration does not manufacture an empty commit every run.
  idempotency:
    name: Idempotency
    permissions:
      contents: read # to fetch code
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set Up Template
        run: printf '{{#each (sort tags)}}- {{ this }}\n{{/each}}' > README.hbs

      - name: First Render
        id: first
        uses: ./actions/common/render-template
        with:
          template: README.hbs
          output: README.md
          variables: '{"tags":["docs","ci","rust"]}'

      - name: Record Modification Time
        id: before
        run: echo "mtime=$(stat -c %Y.%n README.md)" >> "$GITHUB_OUTPUT"

      - name: Second Render With The Same Inputs
        id: second
        uses: ./actions/common/render-template
        with:
          template: README.hbs
          output: README.md
          variables: '{"tags":["docs","ci","rust"]}'

      - name: Third Render With The Keys Reordered
        id: third
        uses: ./actions/common/render-template
        with:
          template: README.hbs
          output: README.md
          # The same set in a different order must render identically, or a reshuffled payload
          # produces a diff that is not a real change.
          variables: '{"tags":["rust","docs","ci"]}'

      - name: Assert Stability
        env:
          FIRST_CHANGED: ${{ steps.first.outputs.changed }}
          SECOND_CHANGED: ${{ steps.second.outputs.changed }}
          THIRD_CHANGED: ${{ steps.third.outputs.changed }}
          FIRST_CHECKSUM: ${{ steps.first.outputs.checksum }}
          THIRD_CHECKSUM: ${{ steps.third.outputs.checksum }}
          BEFORE_MTIME: ${{ steps.before.outputs.mtime }}
        run: |
          [ "$FIRST_CHANGED" = "true" ] || { echo "::error::first render should have reported changed=true"; exit 1; }
          [ "$SECOND_CHANGED" = "false" ] || { echo "::error::re-rendering identical inputs reported changed=$SECOND_CHANGED"; exit 1; }
          [ "$THIRD_CHANGED" = "false" ] || { echo "::error::reordered inputs reported changed=$THIRD_CHANGED"; exit 1; }
          [ "$FIRST_CHECKSUM" = "$THIRD_CHECKSUM" ] || { echo "::error::checksum changed across identical renders"; exit 1; }

          # An unchanged file must not be rewritten, or anything keyed on its mtime is defeated.
          AFTER_MTIME="$(stat -c %Y.%n README.md)"
          [ "$AFTER_MTIME" = "$BEFORE_MTIME" ] || { echo "::error::unchanged file was rewritten ($BEFORE_MTIME -> $AFTER_MTIME)"; exit 1; }

          diff -u <(printf -- '- ci\n- docs\n- rust\n') README.md
          echo "✅ Rendering is stable and idempotent"

  # The mode that makes this usable as a CI gate: verify a committed generated file is current,
  # without writing anything.
  check-mode:
    name: Check Mode
    permissions:
      contents: read # to fetch code
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set Up Template And A Current Output
        run: |
          printf '# {{ title }}\n' > README.hbs
          printf '# Actions\n' > README.md

      - name: Check A Current File
        id: current
        uses: ./actions/common/render-template
        with:
          template: README.hbs
          output: README.md
          variables: '{"title":"Actions"}'
          check: true

      - name: Make The Output Stale
        run: printf '# Actions\nhand-edited line\n' > README.md

      - name: Check A Stale File
        id: stale
        continue-on-error: true
        uses: ./actions/common/render-template
        with:
          template: README.hbs
          output: README.md
          variables: '{"title":"Actions"}'
          check: true

      - name: Check A Missing File
        id: missing
        continue-on-error: true
        uses: ./actions/common/render-template
        with:
          template: README.hbs
          output: absent/README.md
          variables: '{"title":"Actions"}'
          check: true

      - name: Assert Check Behaviour
        env:
          CURRENT_CHANGED: ${{ steps.current.outputs.changed }}
          STALE_OUTCOME: ${{ steps.stale.outcome }}
          MISSING_OUTCOME: ${{ steps.missing.outcome }}
        run: |
          [ "$CURRENT_CHANGED" = "false" ] || { echo "::error::a current file reported changed=$CURRENT_CHANGED"; exit 1; }
          [ "$STALE_OUTCOME" = "failure" ] || { echo "::error::a stale file did not fail the step"; exit 1; }
          [ "$MISSING_OUTCOME" = "failure" ] || { echo "::error::a missing file did not fail the step"; exit 1; }

          # Check mode must never write: the stale content has to survive untouched, and the missing
          # file must not have been created.
          diff -u <(printf '# Actions\nhand-edited line\n') README.md
          [ ! -e absent/README.md ] || { echo "::error::check mode created the output file"; exit 1; }
          echo "✅ Check mode verifies without writing"

  # Every way a caller can get it wrong has to fail the step loudly rather than emit a plausible but
  # wrong file — silence here is what would let broken documentation get committed.
  failures:
    name: Failure (${{ matrix.name }})
    permissions:
      contents: read # to fetch code
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'Undefined Block Argument'
            # Handlebars' own strict mode does not cover this; it would render an empty table.
            template: '{{#each actions}}row{{/each}}'
            variables: '{"other":1}'

          - name: 'Undefined Interpolation'
            template: '{{ missing }}'
            variables: '{}'

          - name: 'Undefined Helper Argument'
            template: '{{ join tags }}'
            variables: '{}'

          - name: 'Variables Are Not JSON'
            template: 'x'
            variables: |
              title: Actions

          - name: 'Variables Are Not An Object'
            template: 'x'
            variables: '["a","b"]'

          - name: 'Prototype-Reaching Key'
            template: 'x'
            variables: '{"__proto__":{"polluted":true}}'

          - name: 'Malformed Template'
            template: '{{#each items}}unclosed'
            variables: '{"items":[]}'

          - name: 'Missing Template File'
            template: ''
            variables: '{}'
            missing_template: true

          - name: 'Missing Partials Directory'
            template: 'x'
            variables: '{}'
            partials_dir: 'no/such/directory'

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set Up Template
        env:
          TEMPLATE: ${{ matrix.template }}
          MISSING_TEMPLATE: ${{ matrix.missing_template || 'false' }}
        run: |
          if [ "$MISSING_TEMPLATE" != "true" ]; then
            printf '%s' "$TEMPLATE" > README.hbs
          fi

      - name: Run Test (${{ matrix.name }})
        id: render
        continue-on-error: true
        uses: ./actions/common/render-template
        with:
          template: README.hbs
          output: README.md
          variables: ${{ matrix.variables }}
          partials-dir: ${{ matrix.partials_dir || '' }}

      - name: Assert The Step Failed Without Writing
        env:
          OUTCOME: ${{ steps.render.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::Expected the step to fail, but it succeeded."
            [ -f README.md ] && cat README.md
            exit 1
          fi

          if [ -e README.md ]; then
            echo "::error::A failed render left an output file behind."
            cat README.md
            exit 1
          fi
          echo "✅ Failed as expected, leaving no output behind"

  # Prototype pollution through the variables map is the one way a template could reach beyond the
  # data it was given, so it is asserted on the real runner rather than only in unit tests.
  hardening:
    name: Hardening
    permissions:
      contents: read # to fetch code
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set Up A Template That Probes The Prototype
        run: printf '[{{ constructor }}][{{ constructor.constructor }}][{{ toString }}][{{ repo.constructor.name }}]' > README.hbs

      - name: Render With Strict Mode Off So The Lookups Are Attempted
        uses: ./actions/common/render-template
        with:
          template: README.hbs
          output: README.md
          variables: '{"repo":{"name":"actions"}}'
          strict: false

      - name: Assert Nothing Resolved
        run: |
          diff -u <(printf '[][][][]') README.md
          echo "✅ No prototype member was reachable from a template"

  # <<< generated: summary (run 'bun run generate-ci-required' to update)
  summary:
    name: 'CI Summary: Action Common Render Template'
    if: ${{ always() }}
    needs:
      - render
      - partials
      - idempotency
      - check-mode
      - failures
      - hardening
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if any verify job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
  # >>> generated: summary
