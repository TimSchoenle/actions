name: Scripts CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint-and-test:
    name: Lint & Test
    permissions:
      contents: read # to fetch code
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The bundle check below compares committed bytes against a fresh build, so the Bun that builds
      # here must be the Bun that built what was committed. An empty bun-version makes setup-bun fall
      # through to bun-version-file; setup-cached defaults it to 'latest', which would win otherwise.
      - name: Setup Bun
        uses: TimSchoenle/actions/actions/bun/setup-cached@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-bun-setup-cached-v1.1.11
        with:
          bun-version: ''
          bun-version-file: '.bun-version'

      - name: Format Check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      # Must run before the typecheck, which regenerates the sources in place: this step is what
      # proves the committed sources still match their action.yaml.
      - name: Check Generated Action Sources
        run: bun run check-action-sources

      # GitHub runs the committed bundle at runs.main, not these sources. Without this step a pull
      # request that changes an action but does not rebuild its bundle passes every other check while
      # shipping code that matches no source tree.
      - name: Check Action Bundles
        run: bun run check-action-dist

      # The verify-action-* workflows for actions with e2e cases are generated. A hand-edited one
      # would be silently overwritten on the next run of the generator, taking its edit with it.
      - name: Check Generated E2E Workflows
        run: bun run check-e2e-workflows

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  # Coverage is measured and uploaded in two jobs, so the OIDC token Codecov authenticates with never
  # shares a job with pull request code. `coverage-tests` runs the suite, which is code the pull request
  # controls, with nothing more than a read-only token, and hands the two report files over as an
  # artifact. `coverage` holds `id-token: write`, executes no repository code, and only uploads those
  # files. Both are kept apart from `lint-and-test`, so a Codecov outage fails the upload alone and the
  # required `Lint & Test` check never holds `id-token: write`. `.github/codecov.yml` decides what the
  # Codecov statuses check.
  coverage-tests:
    name: Coverage Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: TimSchoenle/actions/actions/bun/setup-cached@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-bun-setup-cached-v1.1.11
        with:
          bun-version: ''
          bun-version-file: '.bun-version'
          cache-mode: none

      # Writes coverage/lcov.info and coverage/junit.xml, the two files the coverage job uploads.
      # Vitest writes lcov.info only when the suite passes, junit.xml either way.
      - name: Test
        run: bun run test

      # Runs after a failed test step too: the failing cases are what Test Analytics records.
      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: |
            coverage/lcov.info
            coverage/junit.xml
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: Coverage
    needs: coverage-tests
    # Runs when the tests failed too, so the failing cases still reach Test Analytics.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # Required to checkout the code
      id-token: write # Required to authenticate the Codecov upload with OIDC
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # The Codecov CLI lists the repository's files to map report paths onto them, so the tree has
      # to be present. It is only read: no step below runs anything from it, and the uploads pass
      # `plugins: noop`, which stops the CLI from running gcov, xcode or coverage.py over it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-reports
          path: coverage

      - name: Upload coverage to Codecov
        if: ${{ needs.coverage-tests.result == 'success' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          disable_search: true
          disable_telem: true
          plugins: noop
          flags: typescript
          use_oidc: true
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          files: coverage/junit.xml
          disable_search: true
          disable_telem: true
          plugins: noop
          flags: typescript
          use_oidc: true
          fail_ci_if_error: true

      # Keeps the Coverage check red whenever the suite failed, as it was when one job did both.
      - name: Fail if the tests failed
        if: ${{ needs.coverage-tests.result != 'success' }}
        env:
          TESTS_RESULT: ${{ needs.coverage-tests.result }}
        run: |
          set -euo pipefail
          echo "::error::Coverage Tests finished as '${TESTS_RESULT}', so no coverage was uploaded."
          exit 1
