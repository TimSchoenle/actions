name: Verify Checkstyle Configs

# Not routed through actions/java-gradle/setup-base-environment: that composite action's own
# `chmod +x ./gradlew` step always runs against GITHUB_WORKSPACE root, but this build's gradlew
# lives at configs/checkstyle/gradlew (a nested Gradle root, not the repo root), so it is set up
# inline here instead.

on:
  push:
    branches:
      - main
    paths:
      - 'configs/checkstyle/**'
      - 'jitpack.yml'
      - '.github/workflows/verify-checkstyle-configs.yaml'
  pull_request:
    paths:
      - 'configs/checkstyle/**'
      - 'jitpack.yml'
      - '.github/workflows/verify-checkstyle-configs.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify:
    name: Verify Checkstyle Configs
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Make gradlew executable
        working-directory: configs/checkstyle
        shell: bash
        run: chmod +x ./gradlew

      # Builds the two publishable modules (proves the classpath: resource rewrite still produces
      # a valid jar) and runs every Checkstyle compatibility + Lombok-suppression check registered
      # in compat-check/build.gradle.kts, against the Checkstyle version pinned in
      # gradle/libs.versions.toml (which Renovate's built-in Gradle version-catalog support keeps
      # current, so this job re-validates on every bump).
      - name: Build and verify
        working-directory: configs/checkstyle
        shell: bash
        run: ./gradlew :checkstyle-application:build :checkstyle-library:build :compat-check:verifyCheckstyleCompat --no-daemon

      - name: Upload Checkstyle reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checkstyle-compat-reports
          path: configs/checkstyle/compat-check/build/reports/checkstyle/
          retention-days: 14
