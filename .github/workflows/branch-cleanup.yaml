name: Cleanup Branch Caches After Deletion
on:
  delete:
  # Caches saved by pull_request runs live under refs/pull/<number>/merge, not under the head
  # branch, so the delete event never reaches them.
  pull_request:
    types: [closed]

# Keyed on the deleted ref or the pull request, not `github.ref`: on a `delete` event `github.ref`
# is the default branch, so a shared group would let a burst of deletions cancel each other's
# pending runs and leave caches behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.event.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  cleanup-caches:
    name: Cleanup Caches
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write # to list and delete the caches of the deleted branch
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      # `branch` is left empty on purpose: the action then reads the deleted branch from the
      # `delete` payload, and refuses every other event and the default branch.
      - name: Cleanup Caches
        uses: TimSchoenle/actions/actions/maintenance/wipe-cache@e75e9ab1e1e9fa573051a901347e39ba23a45710 # tag=actions-maintenance-wipe-cache-v3.1.0
        with:
          token: ${{ github.token }}

  cleanup-pull-request-caches:
    name: Cleanup Pull Request Caches
    # A fork pull request's `GITHUB_TOKEN` is read-only, so it could not delete anything; those
    # caches are left to eviction.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write # to list and delete the caches of the pull request's merge ref
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - name: Cleanup Caches
        uses: TimSchoenle/actions/actions/maintenance/wipe-cache@e75e9ab1e1e9fa573051a901347e39ba23a45710 # tag=actions-maintenance-wipe-cache-v3.1.0
        with:
          token: ${{ github.token }}
          branch: refs/pull/${{ github.event.number }}/merge
