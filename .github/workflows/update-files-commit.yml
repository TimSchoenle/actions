name: Update Files Commit

# Commits what `Update Files` generated on a pull request or a dispatch. At most one of the two
# patches is non-empty: each stage there runs only when the one before changed nothing, and a
# commit starts a run on the new head, which redoes the later stages against it.
#
# A pull_request run executes the pull
# request's own copy of its workflow, so a job there holding the maintenance App's key hands it to
# anyone who can push a branch. This workflow_run job runs the default branch's copy, which a pull
# request cannot change, and only reads the patch the pull_request run uploaded: commit-patch refuses
# anything outside allowed_paths or made from another head, and nothing from the branch executes.

on:
  workflow_run:
    workflows: ['Update Files']
    types: [completed]

# One queue per pull request branch, keyed on the head repository too. Runs wait rather than
# cancel: an older run completing late (a re-run, say) must not drop the run for the current
# head, and its own patch is skipped as branch_moved by commit-patch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}:${{ github.event.workflow_run.head_branch }}
  queue: max

permissions: {}

jobs:
  # Holds no secret and no environment. The pull_request run uploads the patch empty when nothing
  # changed and not at all when the job making it was skipped; in both cases there is nothing to
  # commit, so the commit job below is skipped without minting a token.
  find-update-generated-workflows-patch:
    name: Find The Generated Workflows Patch
    # A finished pull_request or dispatched run, not a cancelled one: another job failing does not make
    # the patch wrong. From a branch of this repository, never the default branch.
    if: >-
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') &&
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # to list and download the pull_request run's artifacts
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      # Validates the patch exactly as commit-patch will, against the head the pull_request run
      # checked out, and reports whether it holds anything to commit. Nothing in it is executed.
      - name: Find The Patch
        id: patch
        uses: TimSchoenle/actions/actions/common/find-patch@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-find-patch-v1.1.3
        with:
          run_id: ${{ github.event.workflow_run.id }}
          artifact_name: update-files-workflows
          expected_head_sha: ${{ github.event.workflow_run.head_sha }}

  # The one job in this repository whose token carries workflows: write, because these files live
  # under .github/workflows/. allow_workflow_changes is what lets commit-patch accept them at all, and
  # allowed_paths narrows that to the generated files: a patch touching any other workflow fails here
  # rather than being committed with the privilege.
  update-generated-workflows:
    name: Commit Generated Workflows
    needs: [find-update-generated-workflows-patch]
    if: needs.find-update-generated-workflows-patch.outputs.has_changes == 'true'
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # to download the patch from the pull_request run
      contents: read # to fetch the commit the patch applies to
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            registry.npmjs.org:443
            *.blob.core.windows.net:443

      # commit-patch reads only git objects, so the head is fetched without a checkout and none of
      # the pull request's files reach the runner.
      - name: Fetch The Pull Request Head
        uses: TimSchoenle/actions/actions/common/fetch-head@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-fetch-head-v2.0.1
        with:
          sha: ${{ github.event.workflow_run.head_sha }}

      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          # GitHub rejects a commit that touches .github/workflows/ without this, with a message about
          # the `workflow` scope rather than about permissions.
          permission-workflows: write

      - name: Commit Patch
        id: commit
        uses: TimSchoenle/actions/actions/common/commit-patch@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-commit-patch-v2.0.1
        with:
          token: ${{ steps.generate_token.outputs.token }}
          run_id: ${{ github.event.workflow_run.id }}
          branch: ${{ github.event.workflow_run.head_branch }}
          expected_head_sha: ${{ github.event.workflow_run.head_sha }}
          artifact_name: update-files-workflows
          allowed_paths: '.github/workflows/verify*.yaml .github/verify/plan.json .github/workflows/ci-required.yaml .github/codecov.yml'
          allow_workflow_changes: 'true'
          commit_message: 'ci: auto-update generated workflows'

      - name: Comment on PR
        if: >-
          steps.commit.outputs.changes_committed == 'true' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.pull_requests[0].number
        uses: TimSchoenle/actions/actions/common/upsert-pr-comment@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-upsert-pr-comment-v2.0.4
        with:
          token: ${{ steps.generate_token.outputs.token }}
          # Only this App's own comment is updated; a pasted marker cannot redirect the edit.
          author: '${{ steps.generate_token.outputs.app-slug }}[bot]'
          pr_url: ${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.workflow_run.pull_requests[0].number }}
          identifier: 'update-generated-workflows'
          body: 'The generated Verify workflows, `.github/verify/plan.json`, `ci-required.yaml` and the Codecov components in `.github/codecov.yml` have been rebuilt.'

  # Holds no secret and no environment. The pull_request run uploads the patch empty when nothing
  # changed and not at all when the job making it was skipped; in both cases there is nothing to
  # commit, so the commit job below is skipped without minting a token.
  find-update-readme-patch:
    name: Find The Docs Patch
    # A finished pull_request or dispatched run, not a cancelled one: another job failing does not make
    # the patch wrong. From a branch of this repository, never the default branch.
    if: >-
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') &&
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # to list and download the pull_request run's artifacts
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      # Validates the patch exactly as commit-patch will, against the head the pull_request run
      # checked out, and reports whether it holds anything to commit. Nothing in it is executed.
      - name: Find The Patch
        id: patch
        uses: TimSchoenle/actions/actions/common/find-patch@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-find-patch-v1.1.3
        with:
          run_id: ${{ github.event.workflow_run.id }}
          artifact_name: update-files-docs
          expected_head_sha: ${{ github.event.workflow_run.head_sha }}

  update-readme:
    name: Commit Docs
    needs: [find-update-readme-patch]
    if: needs.find-update-readme-patch.outputs.has_changes == 'true'
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # to download the patch from the pull_request run
      contents: read # to fetch the commit the patch applies to
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      # commit-patch reads only git objects, so the head is fetched without a checkout and none of
      # the pull request's files reach the runner.
      - name: Fetch The Pull Request Head
        uses: TimSchoenle/actions/actions/common/fetch-head@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-fetch-head-v2.0.1
        with:
          sha: ${{ github.event.workflow_run.head_sha }}

      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Commit Patch
        id: commit
        uses: TimSchoenle/actions/actions/common/commit-patch@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-commit-patch-v2.0.1
        with:
          token: ${{ steps.generate_token.outputs.token }}
          run_id: ${{ github.event.workflow_run.id }}
          branch: ${{ github.event.workflow_run.head_branch }}
          expected_head_sha: ${{ github.event.workflow_run.head_sha }}
          artifact_name: update-files-docs
          allowed_paths: 'README.md SECURITY.md actions/*/*/README.md actions/*/*/examples/*.yaml actions/*/*/examples/*.yml'
          commit_message: 'docs: auto-update documentation'

      - name: Comment on PR
        if: >-
          steps.commit.outputs.changes_committed == 'true' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.pull_requests[0].number
        uses: TimSchoenle/actions/actions/common/upsert-pr-comment@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-upsert-pr-comment-v2.0.4
        with:
          token: ${{ steps.generate_token.outputs.token }}
          # Only this App's own comment is updated; a pasted marker cannot redirect the edit.
          author: '${{ steps.generate_token.outputs.app-slug }}[bot]'
          pr_url: ${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.workflow_run.pull_requests[0].number }}
          identifier: 'update-readme'
          body: '`README.md` and `SECURITY.md` have been auto-updated with the latest details.'
