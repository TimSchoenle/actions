# GENERATED — do not edit by hand. Run `bun run generate-e2e-workflows` to rebuild this file
# from the actions that have an `e2e/` directory. The drift test in CI fails if it is out of date.
#
# The cases live in `actions/common/commit-patch/e2e/` and are ordinary vitest files. This
# workflow supplies only what they cannot get on a laptop: a token scoped to the scratch repository.
name: Verify Common Commit-patch

on:
  push:
    branches:
      - main
      - 'feature/common/commit-patch'
    paths:
      - '.bun-version'
      - '.github/workflows/verify-action-common-commit-patch.yaml'
      - 'actions/common/commit-patch/**'
      - 'actions/common/create-patch/**'
      - 'bun.lock'
      - 'packages/action-graph/**'
      - 'packages/e2e/**'
      - 'packages/ts-util/**'
      - 'scripts/build-action.ts'
      - '!actions/common/commit-patch/CHANGELOG.md'
      - '!actions/common/commit-patch/README.md'
      - '!actions/common/create-patch/CHANGELOG.md'
      - '!actions/common/create-patch/README.md'
  pull_request:
    paths:
      - '.bun-version'
      - '.github/workflows/verify-action-common-commit-patch.yaml'
      - 'actions/common/commit-patch/**'
      - 'actions/common/create-patch/**'
      - 'bun.lock'
      - 'packages/action-graph/**'
      - 'packages/e2e/**'
      - 'packages/ts-util/**'
      - 'scripts/build-action.ts'
      - '!actions/common/commit-patch/CHANGELOG.md'
      - '!actions/common/commit-patch/README.md'
      - '!actions/common/create-patch/CHANGELOG.md'
      - '!actions/common/create-patch/README.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to fetch code
    outputs:
      cache-key: ${{ steps.key.outputs.value }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            registry.npmjs.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute Cache Key
        id: key
        env:
          CACHE_KEY: e2e-workspace-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        run: echo "value=$CACHE_KEY" >> "$GITHUB_OUTPUT"

      - name: Cache Workspace Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            actions/*/*/node_modules
          key: ${{ steps.key.outputs.value }}

      # An empty bun-version makes setup-bun fall through to bun-version-file; setup-cached defaults
      # it to 'latest', which would win otherwise. It reinstalls on every run whatever the cache did,
      # which is what validates the restored tree against the lockfile before the next job trusts it.
      - name: Setup Bun And Install
        uses: TimSchoenle/actions/actions/bun/setup-cached@9d5cb31939ace7a3d3d7f452052724337c65f153 # tag=actions-bun-setup-cached-v2.0.0
        with:
          bun-version: ''
          bun-version-file: '.bun-version'

  build:
    name: Build Actions
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to fetch code
    outputs:
      artifact-id: ${{ steps.build.outputs.artifact-id }}
      manifest-sha256: ${{ steps.build.outputs.manifest-sha256 }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.bun-version'

      - name: Restore Dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            actions/*/*/node_modules
          key: ${{ needs.install.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Build Actions
        id: build
        uses: ./actions/release/build-actions # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          build-dirs: |
            actions/common/commit-patch/helper
            actions/common/create-patch/helper
          build-command: bun run build
          artifact-name: built-actions-${{ github.run_attempt }}
          toolchain: bun ${{ steps.bun.outputs.bun-version }}

  e2e:
    needs: [install, build]
    environment:
      name: ci-e2e
      deployment: false
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Replaces the committed bundles with the ones the build job built from this commit.
      - name: Install Built Actions
        uses: ./actions/release/install-built-actions # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          artifact-id: ${{ needs.build.outputs.artifact-id }}
          expected-manifest-sha256: ${{ needs.build.outputs.manifest-sha256 }}

      # setup-bun rather than setup-cached: the cached wrapper runs `bun install` on every job, cache
      # hit or not, and this job is the one that must have no route to a package registry at all.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.bun-version'

      # The harness runs a node24 bundle with the first node on PATH and refuses any other major,
      # and the image's default node is not 24. A major alone resolves from the runner's tool
      # cache, so this reaches no endpoint the allowlist above does not already carry.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Restored, never installed, and never saved. `fail-on-cache-miss` is what keeps that honest:
      # without it a miss would leave the suite to fail later on a missing import, several confusing
      # minutes further on.
      - name: Restore Dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            actions/*/*/node_modules
          key: ${{ needs.install.outputs.cache-key }}
          fail-on-cache-miss: true

      # The cases run `dist/index.js`, the bundle GitHub itself would run: the one the install step
      # above put there, which the harness checks against BUILT_ACTIONS_MANIFEST before it runs it.
      - name: Generate Token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ACTIONS_TEST_BOT_APP_ID }}
          private-key: ${{ secrets.ACTIONS_TEST_BOT_PRIVATE_KEY }}
          owner: TimSchoenle
          repositories: actions-testing
          permission-contents: write

      - name: Run End-to-end Cases
        env:
          E2E_GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          # An installation token cannot call `GET /user`, so the suite resolves its own account by
          # app slug instead. Without this a case matching commit authors fails only in CI.
          E2E_APP_SLUG: ${{ steps.token.outputs.app-slug }}
          E2E_TEST_REPOSITORY: TimSchoenle/actions-testing
        run: bun run e2e actions/common/commit-patch

  verify-composite:
    needs: build
    name: Round Trip Through The Runner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read # to download the patch by run ID through the REST API
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Replaces the committed bundles with the ones the build job built from this commit.
      - name: Install Built Actions
        uses: ./actions/release/install-built-actions # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          artifact-id: ${{ needs.build.outputs.artifact-id }}
          expected-manifest-sha256: ${{ needs.build.outputs.manifest-sha256 }}

      - name: Create Empty Patch
        id: empty
        uses: ./actions/common/create-patch # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          artifact_name: commit-patch-e2e-empty-${{ github.run_attempt }}
          paths: README.md

      - name: Change The Tree
        run: |
          set -euo pipefail
          printf '\nappended by the round trip\n' >> README.md
          printf 'untracked\n' > round-trip.txt

      - name: Create Patch
        id: changed
        uses: ./actions/common/create-patch # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          artifact_name: commit-patch-e2e-changed-${{ github.run_attempt }}

      - name: Assert Create Patch Outputs
        env:
          EMPTY_HAS_CHANGES: ${{ steps.empty.outputs.has_changes }}
          EMPTY_BASE: ${{ steps.empty.outputs.base_sha }}
          CHANGED_HAS_CHANGES: ${{ steps.changed.outputs.has_changes }}
          CHANGED_BASE: ${{ steps.changed.outputs.base_sha }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"

          [ "$EMPTY_HAS_CHANGES" = "false" ] || { echo "::error::has_changes '$EMPTY_HAS_CHANGES' for an unchanged path"; exit 1; }
          [ "$CHANGED_HAS_CHANGES" = "true" ] || { echo "::error::has_changes '$CHANGED_HAS_CHANGES' after a change"; exit 1; }
          [ "$EMPTY_BASE" = "$head" ] || { echo "::error::base_sha '$EMPTY_BASE' is not HEAD '$head'"; exit 1; }
          [ "$CHANGED_BASE" = "$head" ] || { echo "::error::base_sha '$CHANGED_BASE' is not HEAD '$head'"; exit 1; }

          echo "Both patches were computed against HEAD, and only the second has changes"

      - name: Commit Empty Patch
        id: commit-empty
        uses: ./actions/common/commit-patch # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          token: placeholder-never-sent
          artifact_name: ${{ steps.empty.outputs.artifact_name }}
          allowed_paths: README.md
          commit_message: 'test: never committed'
          branch: round-trip-never-written
          expected_head_sha: ${{ steps.empty.outputs.base_sha }}

      # The same empty patch again, through the run_id download step. This run's own ID stands in for the
      # pull_request run a workflow_run job names; the step lists the run's artifacts over the REST API
      # either way.
      - name: Commit Empty Patch By Run ID
        id: commit-empty-by-run
        uses: ./actions/common/commit-patch # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          token: placeholder-never-sent
          run_id: ${{ github.run_id }}
          artifact_name: ${{ steps.empty.outputs.artifact_name }}
          allowed_paths: README.md
          commit_message: 'test: never committed'
          branch: round-trip-never-written
          expected_head_sha: ${{ steps.empty.outputs.base_sha }}

      # The same artifact name under a run that does not hold it. Were run_id ignored, the download would
      # fall back to this run, find the artifact and succeed; failing here shows the run ID is what selects
      # the run.
      - name: Commit Empty Patch From Another Run
        id: commit-other-run
        continue-on-error: true
        uses: ./actions/common/commit-patch # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          token: placeholder-never-sent
          run_id: '1'
          artifact_name: ${{ steps.empty.outputs.artifact_name }}
          allowed_paths: README.md
          commit_message: 'test: never committed'
          branch: round-trip-never-written
          expected_head_sha: ${{ steps.empty.outputs.base_sha }}

      - name: Commit Refused Patch
        id: commit-refused
        continue-on-error: true
        uses: ./actions/common/commit-patch # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          token: placeholder-never-sent
          artifact_name: ${{ steps.changed.outputs.artifact_name }}
          allowed_paths: README.md
          commit_message: 'test: never committed'
          branch: round-trip-never-written
          expected_head_sha: ${{ steps.changed.outputs.base_sha }}

      - name: Assert Commit Patch Outcomes
        env:
          EMPTY_OUTCOME: ${{ steps.commit-empty.outputs.outcome }}
          EMPTY_COMMITTED: ${{ steps.commit-empty.outputs.changes_committed }}
          BY_RUN_OUTCOME: ${{ steps.commit-empty-by-run.outputs.outcome }}
          OTHER_RUN_OUTCOME: ${{ steps.commit-other-run.outcome }}
          REFUSED_OUTCOME: ${{ steps.commit-refused.outcome }}
        run: |
          set -euo pipefail

          [ "$EMPTY_OUTCOME" = "no_changes" ] || { echo "::error::outcome '$EMPTY_OUTCOME' for an empty patch"; exit 1; }
          [ "$EMPTY_COMMITTED" = "false" ] || { echo "::error::changes_committed '$EMPTY_COMMITTED' for an empty patch"; exit 1; }
          [ "$BY_RUN_OUTCOME" = "no_changes" ] || { echo "::error::outcome '$BY_RUN_OUTCOME' for the empty patch downloaded by run ID"; exit 1; }
          [ "$OTHER_RUN_OUTCOME" = "failure" ] || { echo "::error::a download from a run without the artifact did not fail ($OTHER_RUN_OUTCOME), so run_id did not select the run"; exit 1; }
          [ "$REFUSED_OUTCOME" = "failure" ] || { echo "::error::a patch adding round-trip.txt outside allowed_paths was not refused ($REFUSED_OUTCOME)"; exit 1; }

          echo "The empty patch ended as no_changes from both download steps, run_id selected the run, and the out-of-policy patch failed, all before any commit API call"

  # <<< generated: summary (run 'bun run generate-ci-required' to update)
  summary:
    name: 'CI Summary: Common Commit-patch'
    if: ${{ always() }}
    needs:
      - install
      - build
      - e2e
      - verify-composite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if any verify job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
  # >>> generated: summary
