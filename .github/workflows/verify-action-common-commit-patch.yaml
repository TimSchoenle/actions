# GENERATED — do not edit by hand. Run `bun run generate-e2e-workflows` to rebuild this file
# from the actions that have an `e2e/` directory. The drift test in CI fails if it is out of date.
#
# The cases live in `actions/common/commit-patch/e2e/` and are ordinary vitest files. This
# workflow supplies only what they cannot get on a laptop: a token scoped to the scratch repository.
name: Verify Common Commit-patch

on:
  push:
    branches:
      - main
      - 'feature/common/commit-patch'
    paths:
      - 'actions/common/commit-patch/**'
      - '!actions/common/commit-patch/CHANGELOG.md'
      - 'packages/e2e/**'
      - '.github/workflows/verify-action-common-commit-patch.yaml'
  pull_request:
    paths:
      - 'actions/common/commit-patch/**'
      - '!actions/common/commit-patch/CHANGELOG.md'
      - 'packages/e2e/**'
      - '.github/workflows/verify-action-common-commit-patch.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch code
    outputs:
      cache-key: ${{ steps.key.outputs.value }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            registry.npmjs.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute Cache Key
        id: key
        env:
          CACHE_KEY: e2e-workspace-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        run: echo "value=$CACHE_KEY" >> "$GITHUB_OUTPUT"

      - name: Cache Workspace Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            actions/*/*/node_modules
          key: ${{ steps.key.outputs.value }}

      # An empty bun-version makes setup-bun fall through to bun-version-file; setup-cached defaults
      # it to 'latest', which would win otherwise. It reinstalls on every run whatever the cache did,
      # which is what validates the restored tree against the lockfile before the next job trusts it.
      - name: Setup Bun And Install
        uses: TimSchoenle/actions/actions/bun/setup-cached@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-bun-setup-cached-v1.1.11
        with:
          bun-version: ''
          bun-version-file: '.bun-version'

  e2e:
    needs: install
    environment:
      name: ci-e2e
      deployment: false
    name: End-to-end
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-bun rather than setup-cached: the cached wrapper runs `bun install` on every job, cache
      # hit or not, and this job is the one that must have no route to a package registry at all.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.bun-version'

      # Restored, never installed, and never saved. `fail-on-cache-miss` is what keeps that honest:
      # without it a miss would leave the suite to fail later on a missing import, several confusing
      # minutes further on.
      - name: Restore Dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            actions/*/*/node_modules
          key: ${{ needs.install.outputs.cache-key }}
          fail-on-cache-miss: true

      # The cases run `dist/index.js`, the bundle GitHub itself would run, so nothing is built here.
      - name: Generate Token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ACTIONS_TEST_BOT_APP_ID }}
          private-key: ${{ secrets.ACTIONS_TEST_BOT_PRIVATE_KEY }}
          owner: TimSchoenle
          repositories: actions-testing
          permission-contents: write

      - name: Run End-to-end Cases
        env:
          E2E_GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          # An installation token cannot call `GET /user`, so the suite resolves its own account by
          # app slug instead. Without this a case matching commit authors fails only in CI.
          E2E_APP_SLUG: ${{ steps.token.outputs.app-slug }}
          E2E_TEST_REPOSITORY: TimSchoenle/actions-testing
        run: bun run e2e actions/common/commit-patch

  verify-composite:
    name: Round Trip Through The Runner
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create Empty Patch
        id: empty
        uses: ./actions/common/create-patch # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          artifact_name: commit-patch-e2e-empty-${{ github.run_attempt }}
          paths: README.md

      - name: Change The Tree
        run: |
          set -euo pipefail
          printf '\nappended by the round trip\n' >> README.md
          printf 'untracked\n' > round-trip.txt

      - name: Create Patch
        id: changed
        uses: ./actions/common/create-patch # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          artifact_name: commit-patch-e2e-changed-${{ github.run_attempt }}

      - name: Assert Create Patch Outputs
        env:
          EMPTY_HAS_CHANGES: ${{ steps.empty.outputs.has_changes }}
          EMPTY_BASE: ${{ steps.empty.outputs.base_sha }}
          CHANGED_HAS_CHANGES: ${{ steps.changed.outputs.has_changes }}
          CHANGED_BASE: ${{ steps.changed.outputs.base_sha }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"

          [ "$EMPTY_HAS_CHANGES" = "false" ] || { echo "::error::has_changes '$EMPTY_HAS_CHANGES' for an unchanged path"; exit 1; }
          [ "$CHANGED_HAS_CHANGES" = "true" ] || { echo "::error::has_changes '$CHANGED_HAS_CHANGES' after a change"; exit 1; }
          [ "$EMPTY_BASE" = "$head" ] || { echo "::error::base_sha '$EMPTY_BASE' is not HEAD '$head'"; exit 1; }
          [ "$CHANGED_BASE" = "$head" ] || { echo "::error::base_sha '$CHANGED_BASE' is not HEAD '$head'"; exit 1; }

          echo "Both patches were computed against HEAD, and only the second has changes"

      - name: Commit Empty Patch
        id: commit-empty
        uses: ./actions/common/commit-patch # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          token: placeholder-never-sent
          artifact_name: ${{ steps.empty.outputs.artifact_name }}
          allowed_paths: README.md
          commit_message: 'test: never committed'
          branch: round-trip-never-written
          expected_head_sha: ${{ steps.empty.outputs.base_sha }}

      - name: Commit Refused Patch
        id: commit-refused
        continue-on-error: true
        uses: ./actions/common/commit-patch # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          token: placeholder-never-sent
          artifact_name: ${{ steps.changed.outputs.artifact_name }}
          allowed_paths: README.md
          commit_message: 'test: never committed'
          branch: round-trip-never-written
          expected_head_sha: ${{ steps.changed.outputs.base_sha }}

      - name: Assert Commit Patch Outcomes
        env:
          EMPTY_OUTCOME: ${{ steps.commit-empty.outputs.outcome }}
          EMPTY_COMMITTED: ${{ steps.commit-empty.outputs.changes_committed }}
          REFUSED_OUTCOME: ${{ steps.commit-refused.outcome }}
        run: |
          set -euo pipefail

          [ "$EMPTY_OUTCOME" = "no_changes" ] || { echo "::error::outcome '$EMPTY_OUTCOME' for an empty patch"; exit 1; }
          [ "$EMPTY_COMMITTED" = "false" ] || { echo "::error::changes_committed '$EMPTY_COMMITTED' for an empty patch"; exit 1; }
          [ "$REFUSED_OUTCOME" = "failure" ] || { echo "::error::a patch adding round-trip.txt outside allowed_paths was not refused ($REFUSED_OUTCOME)"; exit 1; }

          echo "The empty patch ended as no_changes and the out-of-policy one failed, both before any API call"

  # <<< generated: summary (run 'bun run generate-ci-required' to update)
  summary:
    name: 'CI Summary: Common Commit-patch'
    if: ${{ always() }}
    needs:
      - install
      - e2e
      - verify-composite
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if any verify job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
  # >>> generated: summary
