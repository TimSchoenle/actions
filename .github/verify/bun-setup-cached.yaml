target: bun/setup-cached
title: Bun Setup Cached
extra-inputs:
  - '.github/testdata/bun-setup-cached'
rules:
  pull-request-branches: [main]
  # Only pushes to main ran this workflow before it moved into Verify.
  push-branches: []
jobs:
  prime-cache:
    name: Prime Cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to fetch code
    outputs:
      seed: ${{ steps.generate.outputs.seed }}
    env:
      TEST_DIR: test-project
      DEP_DIR: unique-dep
      TEST_PKG: unique-dep
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The lockfile below must be written by the Bun the action installs, so both read the same file.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Generate Project
        id: generate
        run: |
          set -euo pipefail

          mkdir "$TEST_DIR"
          mkdir "$DEP_DIR"
          SEED=$RANDOM
          echo "seed=$SEED" >> "$GITHUB_OUTPUT"

          # Create unique dependency package
          echo "{\"name\": \"$TEST_PKG\", \"version\": \"1.0.0-$SEED\"}" > "$DEP_DIR/package.json"

          # Create main package using file dependency
          echo "{\"name\": \"$TEST_DIR\", \"dependencies\": {\"$TEST_PKG\": \"file:../$DEP_DIR\"}}" > "$TEST_DIR/package.json"

      - name: Install Dependencies (Generate Lockfile)
        working-directory: ${{ env.TEST_DIR }}
        run: bun install

      # This workflow runs on pull_request, where `auto` only reads, so the save has to be asked for.
      - name: Run Setup Cached (Expect Miss)
        id: setup
        uses: ./actions/bun/setup-cached # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          working-directory: ${{ env.TEST_DIR }}
          cache-key-prefix: 'verify-${{ steps.generate.outputs.seed }}-'
          cache-mode: read-write

      - name: Verify Cache Miss
        if: steps.setup.outputs.cache-hit != 'false'
        run: |
          set -euo pipefail

          echo "::error::Expected cache miss on first run, got hit"
          exit 1

      # The test project has no .bun-version of its own, so the version must come from the repository root.
      - name: Verify Outputs
        env:
          CACHE_KEY: ${{ steps.setup.outputs.cache-key }}
          CACHE_MODE: ${{ steps.setup.outputs.cache-mode }}
        run: |
          set -euo pipefail

          echo "Cache Key: $CACHE_KEY"
          if [ -z "$CACHE_KEY" ]; then
            echo "::error::Cache key output is empty"
            exit 1
          fi
          if [ "$CACHE_MODE" != 'read-write' ]; then
            echo "::error::Expected cache mode read-write, got '$CACHE_MODE'"
            exit 1
          fi
          expected=$(tr -d '[:space:]' < .bun-version)
          actual=$(bun --version)
          if [ "$actual" != "$expected" ]; then
            echo "::error::Expected Bun $expected from .bun-version, got $actual"
            exit 1
          fi

  verify-cache:
    name: Verify Cache Hit
    needs: prime-cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to fetch code
    env:
      TEST_DIR: test-project
      DEP_DIR: unique-dep
      TEST_PKG: unique-dep
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Re-Generate Project
        env:
          SEED: ${{ needs.prime-cache.outputs.seed }}
        run: |
          set -euo pipefail

          mkdir "$TEST_DIR"
          mkdir "$DEP_DIR"

          # Re-create unique dependency package
          echo "{\"name\": \"$TEST_PKG\", \"version\": \"1.0.0-$SEED\"}" > "$DEP_DIR/package.json"

          # Re-create main package
          echo "{\"name\": \"$TEST_DIR\", \"dependencies\": {\"$TEST_PKG\": \"file:../$DEP_DIR\"}}" > "$TEST_DIR/package.json"

      - name: Generate Lockfile & Clean
        working-directory: ${{ env.TEST_DIR }}
        run: |
          set -euo pipefail

          bun install
          rm -rf node_modules

      - name: Run Setup Cached (Expect Hit)
        id: setup
        uses: ./actions/bun/setup-cached # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          working-directory: ${{ env.TEST_DIR }}
          cache-key-prefix: 'verify-${{ needs.prime-cache.outputs.seed }}-'
          cache-mode: read-only

      - name: Verify Cache Hit
        if: steps.setup.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail

          echo "::error::Expected cache hit on second run, got miss"
          exit 1

      - name: Verify Outputs
        env:
          CACHE_KEY: ${{ steps.setup.outputs.cache-key }}
          CACHE_MODE: ${{ steps.setup.outputs.cache-mode }}
        run: |
          set -euo pipefail

          echo "Cache Key: $CACHE_KEY"
          if [ "$CACHE_MODE" != 'read-only' ]; then
            echo "::error::Expected cache mode read-only, got '$CACHE_MODE'"
            exit 1
          fi

      - name: Verify Dependencies
        working-directory: ${{ env.TEST_DIR }}
        run: |
          set -euo pipefail

          test -d "node_modules" || (echo "::error::node_modules not restored" && exit 1)
          # Check if the unique dependency is present (it might be symlinked or copied depending on bun)
          test -d "node_modules/$TEST_PKG" || (echo "::error::dependency $TEST_PKG not found" && exit 1)
          echo "Cache restored successfully"

  # setup-bun keeps its own cache of the Bun executable and reuses a Bun already on PATH, so this job
  # has no Setup Bun step of its own: the action under test is the first to install Bun. prime-cache's
  # Setup Bun step has saved the executable of the pinned version by the time this job starts, so the
  # read-write leg is the control that proves a hit is visible here.
  verify-bun-cache:
    name: Verify Bun Executable Cache (${{ matrix.cache-mode }})
    needs: prime-cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to fetch code
    strategy:
      fail-fast: false
      matrix:
        include:
          - cache-mode: read-write
            expected-bun-cache-hit: 'true'
          - cache-mode: read-only
            expected-bun-cache-hit: 'false'
          - cache-mode: none
            expected-bun-cache-hit: 'false'
    steps:
      # The Bun download and the Actions cache. The fixture's one dependency is a local directory, so
      # no registry is reached.
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # A committed project with a lockfile, so the job needs no Bun before the action runs. Its one
      # dependency is a local directory, so the node_modules entry the read-write leg saves is tiny.
      - name: Run Setup Cached
        id: setup
        uses: ./actions/bun/setup-cached # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          working-directory: .github/testdata/bun-setup-cached
          bun-version-file: .bun-version
          cache-mode: ${{ matrix.cache-mode }}
          cache-key-prefix: 'verify-bun-cache-${{ needs.prime-cache.outputs.seed }}-'

      - name: Verify Bun Executable Cache
        env:
          BUN_CACHE_HIT: ${{ steps.setup.outputs.bun-cache-hit }}
          EXPECTED: ${{ matrix.expected-bun-cache-hit }}
          CACHE_MODE: ${{ steps.setup.outputs.cache-mode }}
        run: |
          set -euo pipefail

          if [ "$BUN_CACHE_HIT" != "$EXPECTED" ]; then
            echo "::error::Expected bun-cache-hit '$EXPECTED' with cache-mode $CACHE_MODE, got '$BUN_CACHE_HIT'"
            exit 1
          fi

  verify-modes:
    name: Verify Cache Modes And Version Resolution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to fetch code
    env:
      TEST_DIR: test-project
      DEP_DIR: unique-dep
      TEST_PKG: unique-dep
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Generate Project
        id: generate
        run: |
          set -euo pipefail

          mkdir "$TEST_DIR"
          mkdir "$DEP_DIR"
          SEED=$RANDOM
          echo "seed=$SEED" >> "$GITHUB_OUTPUT"
          echo "bun-version=$(tr -d '[:space:]' < .bun-version)" >> "$GITHUB_OUTPUT"
          echo "{\"name\": \"$TEST_PKG\", \"version\": \"1.0.0-$SEED\"}" > "$DEP_DIR/package.json"
          echo "{\"name\": \"$TEST_DIR\", \"dependencies\": {\"$TEST_PKG\": \"file:../$DEP_DIR\"}}" > "$TEST_DIR/package.json"

      - name: Install Dependencies (Generate Lockfile)
        working-directory: ${{ env.TEST_DIR }}
        run: |
          set -euo pipefail

          bun install
          rm -rf node_modules

      # An explicit bun-version must still be honoured now that the default reads a version file.
      - name: Run Setup Cached (None, Explicit Version)
        id: none
        uses: ./actions/bun/setup-cached # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          working-directory: ${{ env.TEST_DIR }}
          cache-key-prefix: 'verify-modes-${{ steps.generate.outputs.seed }}-'
          cache-mode: none
          bun-version: ${{ steps.generate.outputs.bun-version }}

      - name: Verify None
        env:
          CACHE_HIT: ${{ steps.none.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.none.outputs.cache-key }}
          CACHE_MODE: ${{ steps.none.outputs.cache-mode }}
        run: |
          set -euo pipefail

          if [ "$CACHE_HIT" != 'false' ] || [ "$CACHE_MODE" != 'none' ] || [ -z "$CACHE_KEY" ]; then
            echo "::error::Expected cache-hit false, cache-mode none and a cache key, got '$CACHE_HIT', '$CACHE_MODE', '$CACHE_KEY'"
            exit 1
          fi
          test -d "$TEST_DIR/node_modules/$TEST_PKG" || (echo "::error::dependency $TEST_PKG not installed" && exit 1)

      - name: Run Setup Cached (Auto)
        id: auto
        uses: ./actions/bun/setup-cached # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          working-directory: ${{ env.TEST_DIR }}
          cache-key-prefix: 'verify-modes-${{ steps.generate.outputs.seed }}-'

      - name: Verify Auto
        env:
          CACHE_MODE: ${{ steps.auto.outputs.cache-mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            push | schedule | workflow_dispatch | merge_group) expected=read-write ;;
            *) expected=read-only ;;
          esac
          if [ "$CACHE_MODE" != "$expected" ]; then
            echo "::error::Expected cache mode $expected on $EVENT_NAME, got '$CACHE_MODE'"
            exit 1
          fi

      - name: Run Setup Cached (Invalid Cache Mode)
        id: invalid-mode
        continue-on-error: true
        uses: ./actions/bun/setup-cached # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          working-directory: ${{ env.TEST_DIR }}
          cache-mode: write

      - name: Run Setup Cached (Missing Version File)
        id: missing-version
        continue-on-error: true
        uses: ./actions/bun/setup-cached # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          working-directory: ${{ env.TEST_DIR }}
          cache-mode: none
          bun-version-file: does-not-exist/.bun-version

      - name: Verify Rejections
        env:
          INVALID_MODE: ${{ steps.invalid-mode.outcome }}
          MISSING_VERSION: ${{ steps.missing-version.outcome }}
        run: |
          set -euo pipefail

          if [ "$INVALID_MODE" != 'failure' ]; then
            echo "::error::Expected an unknown cache-mode to fail the step, got '$INVALID_MODE'"
            exit 1
          fi
          if [ "$MISSING_VERSION" != 'failure' ]; then
            echo "::error::Expected a missing bun-version-file to fail the step, got '$MISSING_VERSION'"
            exit 1
          fi
