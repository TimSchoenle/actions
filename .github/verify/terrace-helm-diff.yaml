target: terrace/helm-diff
title: Terrace Helm Diff
extra-inputs:
  - '.github/testdata/terrace-helm'
rules:
  # Only pushes to main ran this workflow before it moved into Verify.
  push-branches: []
jobs:
  diff:
    name: 'Test: a removed key is reported, and an unchanged tree is not'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to fetch code, and to list terrace-contract releases
    env:
      FIXTURE: .github/testdata/terrace-helm
      TERRACE_CONFIG: ${{ github.workspace }}/.github/testdata/terrace-helm/terrace.yaml
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A local commit that drops the contract's last key: the change an image release makes when it
      # stops reading a setting, and the one the report must call major.
      - name: Commit a contract that lost a key
        id: change
        run: |
          set -euo pipefail
          contract="${FIXTURE}/charts/mp-stats-legacy-viewer/contracts/viewer.json"
          key="$(python3 -I - "$contract" <<'PY'
          import json, sys
          path = sys.argv[1]
          with open(path, encoding="utf-8") as handle:
              document = json.load(handle)
          dropped = document["contract"]["schema"]["keys"].pop()
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(document, handle, indent=2)
              handle.write("\n")
          print(dropped["path"])
          PY
          )"
          git -c user.name=ci -c user.email=ci@example.invalid -c commit.gpgsign=false \
            commit --quiet --all --message "test: drop a contract key"
          echo "key=${key}" >> "$GITHUB_OUTPUT"

      - name: Diff against the commit before
        id: changed
        uses: ./actions/terrace/helm-diff # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          working_directory: ${{ env.FIXTURE }}
          since: HEAD~1

      - name: Diff against itself
        id: unchanged
        uses: ./actions/terrace/helm-diff # zizmor: ignore[self-repository] -- actionlint rejects the $/ syntax as an action without a ref.
        with:
          working_directory: ${{ env.FIXTURE }}
          since: HEAD

      - name: Verify both reports
        env:
          CHANGED: ${{ steps.changed.outputs.changed }}
          REPORT: ${{ steps.changed.outputs.report }}
          KEY: ${{ steps.change.outputs.key }}
          UNCHANGED: ${{ steps.unchanged.outputs.changed }}
        run: |
          set -euo pipefail
          test -n "$KEY" || { echo "::error::the setup step names no removed key"; exit 1; }
          test "$CHANGED" = true || { echo "::error::a removed key was not reported as a change"; exit 1; }
          grep -F "$KEY" "$REPORT" | grep -q major || { echo "::error::the removed key is not reported as major"; exit 1; }
          grep -q 'impact: major' "$REPORT" || { echo "::error::the chart's impact is not major"; exit 1; }
          test "$UNCHANGED" = false || { echo "::error::an unchanged tree was reported as changed"; exit 1; }
