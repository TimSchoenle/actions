# yaml-language-server: $schema=https://raw.githubusercontent.com/TimSchoenle/terrace-config/main/spec/helm/v1/repo.schema.json
#
# The chart repository the terrace/helm-* actions are verified against: what a repository adopting
# them carries, and nothing more. Read through TERRACE_CONFIG, because this file is not at the root
# of the Git repository the way an adopter's is.
version: 1
cli: '0.9'
helm:
  charts: charts
  firstParty:
    - timschoenle/*
  signer: https://github.com/TimSchoenle/[^/]+/.github/workflows/release-please.yaml@refs/heads/(main|master)
