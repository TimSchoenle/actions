# yaml-language-server: $schema=https://raw.githubusercontent.com/jdx/jactionlint/v2.5.0/schema/jactionlint-config.json
#
# Read by the "Action Lint" job in .github/workflows/security.yml, which runs the shared
# actions/security/jactionlint action, and by a local `jactionlint` run. The action passes
# --profile=pedantic itself; the key below gives a local run the same profile.
#
# The pedantic profile is the counterpart of the zizmor pedantic persona this repository ran before,
# so no zizmor audit is lost. The rules turned off below are style and policy rules of jactionlint
# that zizmor never had.
profile: pedantic

rules:
  # The runner's implicit shell is `bash -e {0}`. An explicit `shell: bash` would add pipefail;
  # instead the pipeline-without-pipefail rule flags each pipeline that needs it, so the key is not
  # required on every step.
  require-shell: off
  # `if: steps.x.outputs.y == 'true'` is valid syntax, and the repository writes conditions both ways.
  require-expression-wrapping: off
  # The workflows deliberately track ubuntu-latest, so image moves arrive without a commit per job.
  mutable-runner-label: off
  # zizmor no longer runs, so a `# zizmor: ignore[...]` comment that suppresses nothing is stale.
  unused-ignore:
    zizmor: true

ignores:
  # These jobs run the copy of this repository that the remote test/setup-e2e action checks out into
  # tmp/actions-code. jactionlint cannot see a checkout inside a remote composite action.
  - rule: local-action-checkout
    uses: ./tmp/actions-code/*
    reason: checked out by TimSchoenle/actions/actions/test/setup-e2e
  # The fixture project has no lockfile until this step creates one; that is what the test needs.
  - rule: unlocked-install
    file: .github/workflows/verify-action-bun-setup-cached.yaml
    step: Install Dependencies (Generate Lockfile)
    reason: generates the fixture's lockfile on purpose
  - rule: unlocked-install
    file: .github/workflows/verify-action-bun-setup-cached.yaml
    step: Generate Lockfile & Clean
    reason: generates the fixture's lockfile on purpose
  # commit-changes has never had an `empty` input, so create-pull-request's empty_commit input is a
  # known no-op. Accepted until commit-changes gains the input. An ignore cannot name the input, so
  # this covers every input of the step: recheck it whenever commit-changes is bumped.
  - rule: unknown-action-input
    file: actions/common/create-pull-request/action.yaml
    step: Commit Changes
    reason: known no-op, empty_commit does nothing until commit-changes supports empty commits
  # The point of this workflow: it runs the default branch's copy, which a pull request cannot
  # change, holds the App key there, and treats the pull_request run's patch as untrusted
  # (commit-patch's allowed_paths, expected_head_sha and same-repository guard).
  - rule: dangerous-triggers
    file: .github/workflows/update-files-commit.yml
    reason: workflow_run commit job; the artifact is validated by commit-patch, nothing from it runs
  # The point of this workflow: it runs the default branch's copy, which a pull request cannot
  # change, holds the App key there, and treats the pull_request run's patch as untrusted
  # (commit-patch's allowed_paths, expected_head_sha and same-repository guard).
  - rule: dangerous-triggers
    file: .github/workflows/auto-format-commit.yml
    reason: workflow_run commit job; the artifact is validated by commit-patch, nothing from it runs
